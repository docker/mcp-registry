name: Validate Google Search Console Registry Entry

on:
  push:
    branches: ["codex/add-mcp-gsc-remote"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: go run ./cmd/validate --name mcp-gsc
      - run: go run ./cmd/build --tools mcp-gsc
      - run: go run ./cmd/catalog mcp-gsc
