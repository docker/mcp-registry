name: Update DREDGE + Quasimoto MCP Version Pins

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: update-quasimoto-pins
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-quasimoto:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull latest Quasimoto MCP image
        run: |
          docker pull ghcr.io/queenfi703/quasimoto-mcp:latest

      - name: Get latest image digest
        id: digest
        run: |
          DIGEST=$(docker image inspect ghcr.io/queenfi703/quasimoto-mcp:latest \
            --format='{{index .RepoDigests 0}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update docker-compose.yml
        run: |
          sed -i \
            "s|ghcr.io/queenfi703/quasimoto-mcp@.*|${{ steps.digest.outputs.digest }}|g" \
            docker-compose.yml

      - name: Start DREDGE services
        run: |
          docker compose up -d

      - name: Wait for Orion Gateway
        run: |
          sleep 20

      - name: Verify DREDGE health endpoint
        run: |
          curl --fail http://localhost:3001/health

      - name: Verify MCP endpoint
        run: |
          curl --fail http://localhost:3002/mcp

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git checkout -B automation/update-quasimoto-pin
          git add docker-compose.yml
          git commit -m "chore: update Quasimoto MCP image pin"

      - name: Push branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push --force origin automation/update-quasimoto-pin

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: update Quasimoto MCP image" \
            --body "Automated update of the Quasimoto MCP container digest after successful DREDGE health checks." \
            --base main \
            --head automation/update-quasimoto-pin || true
