name: Validate GodPrompt Docker Registry Entry

on:
  push:
    branches: ["feat/add-god-prompt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Validate registry metadata
        run: go run ./cmd/validate --name god-prompt

      - name: Build image and discover tools
        run: go run ./cmd/build --tools god-prompt

      - name: Generate catalog
        run: go run ./cmd/catalog god-prompt
