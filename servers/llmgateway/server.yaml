name: llmgateway
type: remote
meta:
  category: ai
  tags:
    - ai
    - llm
    - image-generation
    - usage-analytics
    - remote
about:
  title: LLM Gateway
  description: Chat with any supported LLM, generate images, list models with pricing, and check your LLM Gateway usage and costs.
  icon: https://www.google.com/s2/favicons?domain=llmgateway.io&sz=64
remote:
  transport_type: streamable-http
  url: https://api.llmgateway.io/mcp
  headers:
    Authorization: "Bearer ${LLMGATEWAY_API_KEY}"
config:
  secrets:
    - name: llmgateway.api_key
      env: LLMGATEWAY_API_KEY
      example: <YOUR_API_KEY>
