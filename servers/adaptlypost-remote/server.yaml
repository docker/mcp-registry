name: adaptlypost-remote
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - social-media
    - scheduling
    - remote
about:
  title: AdaptlyPost
  description: Draft, schedule and publish posts on 14 social networks, upload media, read post analytics, and answer comments, mentions and DMs
  icon: https://www.google.com/s2/favicons?domain=adaptlypost.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.adaptlypost.com/mcp
oauth:
  - provider: adaptlypost-remote
    secret: adaptlypost-remote.personal_access_token
    env: ADAPTLYPOST_REMOTE_PERSONAL_ACCESS_TOKEN
