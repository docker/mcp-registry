name: ankr-agent-rpc
type: remote
dynamic:
  tools: true
meta:
  category: blockchain
  tags:
    - blockchain
    - rpc
    - web3
    - remote
about:
  title: Ankr Agent RPC
  description: Read-only blockchain data for AI agents across every chain Ankr serves. Decoded transactions, event logs, blocks, balances, tokens, NFTs and Sui objects, compressed for the context window. Nothing can sign or broadcast.
  icon: https://www.google.com/s2/favicons?domain=ankr.com&sz=128
remote:
  transport_type: streamable-http
  url: https://mcp.ankr.com/rpc
  headers:
    Authorization: "Bearer ${ANKR_API_KEY}"
config:
  description: Configure your Ankr API key
  secrets:
    - name: ankr-agent-rpc.api_key
      env: ANKR_API_KEY
      example: <YOUR_ANKR_API_KEY>
