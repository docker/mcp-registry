name: taskbullet
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - human-in-the-loop
    - virtual-assistant
    - phone-calls
    - remote
about:
  title: TaskBullet
  description: Humans that work for your AI agents. Delegate phone calls, 2FA or captcha-gated logins, physical errands and subjective QA to a real virtual assistant, place outbound phone calls, and track results and transcripts.
  icon: https://taskbullet.com/icons/icon-512x512.png
remote:
  transport_type: streamable-http
  url: https://taskbullet.com/api/agent-mcp
  headers:
    x-api-key: "${TASKBULLET_API_KEY}"
config:
  description: Provide your TaskBullet API key (tb_live_...) from https://taskbullet.com/dashboard/settings/api-keys
  secrets:
    - name: taskbullet.api_key
      env: TASKBULLET_API_KEY
      example: tb_live_<YOUR_API_KEY>
