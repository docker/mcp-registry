name: automata
type: remote
meta:
  category: communication
  tags:
    - communication
    - whatsapp
    - telegram
    - email
    - database
    - remote
about:
  title: Automata
  description: Scoped, revocable access to your WhatsApp, Telegram, IMAP email and PostgreSQL. Read, search and summarise chats and mail, query databases; sending and writes only when granted.
  icon: https://www.google.com/s2/favicons?domain=getautomata.app&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.getautomata.app/mcp
  headers:
    Authorization: "Bearer ${AUTOMATA_TOKEN}"
config:
  secrets:
    - name: automata.token
      env: AUTOMATA_TOKEN
      example: wamcp_...
