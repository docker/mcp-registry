name: api-market-gateway
type: remote
dynamic:
  tools: true
meta:
  category: developer-tools
  tags:
    - api
    - automation
    - remote
about:
  title: API.market Gateway
  description: Discover and call 580+ APIs through a hosted OAuth gateway with operation schemas, usage checks, and subscription management. API-specific free tiers and paid plans vary.
  icon: https://raw.githubusercontent.com/Noveum/api-market-agent-integrations/main/plugins/api-market/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://api.market/api/mcp/gateway
oauth:
  - provider: api-market-gateway
    secret: api-market-gateway.personal_access_token
    env: API_MARKET_GATEWAY_PERSONAL_ACCESS_TOKEN
