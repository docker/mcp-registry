name: zooq
type: remote
dynamic:
  tools: true
meta:
  category: data-integration
  tags:
    - linkedin
    - data-extraction
    - sales
    - recruiting
    - remote
about:
  title: ZOOQ
  description: Live LinkedIn data for AI agents - 44 tools covering profiles, companies, jobs, posts, people search, job-change signals, and email finding. Runs on ZOOQ's own infrastructure, so your agent never connects to or risks your personal LinkedIn account. Free tier includes 300 credits with no card required.
  icon: https://www.google.com/s2/favicons?domain=zooq.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://zooq.dev/api/mcp
  headers:
    X-API-Key: "${ZOOQ_API_KEY}"
config:
  secrets:
    - name: zooq.api_key
      env: ZOOQ_API_KEY
      example: <YOUR_ZOOQ_API_KEY>
