name: webclaw
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - web-scraping
    - search
    - crawling
    - extraction
    - remote
about:
  title: Webclaw
  description: Scrape, search, crawl and extract structured data from web pages
  icon: https://www.google.com/s2/favicons?domain=webclaw.io&sz=64
remote:
  transport_type: streamable-http
  url: https://api.webclaw.io/mcp
oauth:
  - provider: webclaw
    secret: webclaw.personal_access_token
    env: WEBCLAW_PERSONAL_ACCESS_TOKEN
