name: nomac
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - macos
    - ios
    - xcode
    - remote
about:
  title: NoMac
  description: A real cloud Mac with Xcode for your agent, billed by the minute. Start a macOS VM, build and test iOS apps in the Simulator, take screenshots and recordings, move files, ship to TestFlight, then stop the Mac.
  icon: https://www.google.com/s2/favicons?domain=nomac.app&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.nomac.app/mcp
oauth:
  - provider: nomac
    secret: nomac.personal_access_token
    env: NOMAC_PERSONAL_ACCESS_TOKEN
