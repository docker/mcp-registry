name: yungle
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - file-sharing
    - file-transfer
    - remote
about:
  title: Yungle
  description: Send large files as links from an EU-hosted, always-encrypted transfer service, list transfers and read download receipts
  icon: https://www.google.com/s2/favicons?domain=yungle.co&sz=64
remote:
  transport_type: streamable-http
  url: https://yungle.co/mcp
oauth:
  - provider: yungle
    secret: yungle.personal_access_token
    env: YUNGLE_PERSONAL_ACCESS_TOKEN
