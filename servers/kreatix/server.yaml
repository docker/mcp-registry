name: kreatix
type: remote
meta:
  category: communication
  tags:
    - social-media
    - scheduling
    - marketing
    - remote
about:
  title: Kreatix
  description: Schedule and publish posts to Instagram, TikTok, YouTube, Facebook, X, LinkedIn and Pinterest, and read views and follower stats.
  icon: https://raw.githubusercontent.com/abrahimceylan/kreatix-mcp/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://api.kreatix.cc/mcp
  headers:
    Authorization: "Bearer ${KREATIX_API_KEY}"
config:
  secrets:
    - name: kreatix.api_key
      env: KREATIX_API_KEY
      example: <YOUR_KX_LIVE_KEY>
