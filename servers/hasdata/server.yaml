name: hasdata
type: remote
meta:
  category: automation
  tags:
    - automation
    - web-scraping
    - data-extraction
    - serp
    - remote
about:
  title: HasData
  description: Web scraping and structured web data over MCP. Google, Bing and DuckDuckGo SERP, Maps, Trends and Flights, plus Amazon, Zillow, Redfin, Airbnb, Booking.com, Yelp, Indeed, Glassdoor, Instagram, TikTok, YouTube, and any public URL. Returns parsed JSON, no scraping stack to run.
  icon: https://www.google.com/s2/favicons?domain=hasdata.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.hasdata.com/api/mcp
  headers:
    x-api-key: "${HASDATA_API_KEY}"
config:
  secrets:
    - name: hasdata.api_key
      env: HASDATA_API_KEY
      example: <YOUR_HASDATA_API_KEY>
