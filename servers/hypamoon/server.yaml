name: hypamoon
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - hosting
    - websites
    - database
    - payments
    - email
    - remote
about:
  title: Hypamoon
  description: The cloud your AI builds in. Publish sites and apps with a database and sign-in, take payments, send email from your own domain, and connect the software your business already uses.
  icon: https://hypamoon.com/icon-192.png
remote:
  transport_type: streamable-http
  url: https://api.hypamoon.com/api/v1/mcp
oauth:
  - provider: hypamoon
    secret: hypamoon.personal_access_token
    env: HYPAMOON_PERSONAL_ACCESS_TOKEN
