name: euroscrape
image: mcp/euroscrape
type: server
meta:
  category: search
  tags:
    - web scraping
    - data extraction
    - travel
    - open data
    - apify
about:
  title: EuroScrape
  description: Twenty European data tools for AI agents - flight, hotel and electricity prices, second-hand marketplaces, company data and leads, EU and French open data. Each tool runs an Apify Actor on your own Apify account and is paid per result, with a spending cap on every call.
  icon: https://avatars.githubusercontent.com/u/336609788?s=200&v=4
source:
  project: https://github.com/EuroScrape/euroscrape-mcp
  commit: f7370506f3a37388d4eb9a8455f9f1ea1d3b2267
config:
  description: Configure the connection to Apify
  secrets:
    - name: euroscrape.apify_token
      env: APIFY_TOKEN
      example: YOUR_APIFY_TOKEN
      description: Create a free Apify account and copy your API token from [Apify Console](https://console.apify.com/settings/integrations)
  env:
    - name: EUROSCRAPE_MAX_USD_PER_CALL
      example: "0.5"
      value: "{{euroscrape.max_usd_per_call}}"
  parameters:
    type: object
    properties:
      max_usd_per_call:
        type: string
        description: Spending cap of one tool call, in USD. Default 0.5.
