name: howtoromania
type: remote
meta:
  category: finance
  tags:
    - finance
    - romania
    - company-data
    - kyb
    - e-invoicing
    - legal
    - remote
about:
  title: HowToRomania
  description: "Romanian official data for agents: company lookup (ANAF/ONRC), financials, representatives, KYB risk report, court cases, e-Factura validate/generate/parse/PDF and legislation. 1 credit = €0.005, 100 free credits."
  icon: https://howtoromania.io/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.howtoromania.io/mcp
  headers:
    Authorization: "Bearer ${HOWTOROMANIA_API_KEY}"
config:
  description: "Paste your HowToRomania API key (100 free credits at https://howtoromania.io; demo key htr_demo, 20 calls/day)."
  secrets:
    - name: howtoromania.api_key
      env: HOWTOROMANIA_API_KEY
      example: htr_demo
