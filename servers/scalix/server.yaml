name: scalix
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - cloud
    - database
    - serverless
    - remote
about:
  title: Scalix Cloud
  description: Operate the Scalix Cloud platform from an agent with 53 tools - provision Postgres databases with copy-on-write branching, deploy services and functions in isolated microVMs, manage persistent Linux computers, storage, auth, DNS and AI inference, and read logs, metrics and billing.
  icon: https://raw.githubusercontent.com/scalixworld/scalix-cloud-mcp/main/assets/scalix-logo-400.png
remote:
  transport_type: streamable-http
  url: https://api.scalix.world/v1/mcp
  headers:
    Authorization: "Bearer ${SCALIX_API_KEY}"
config:
  secrets:
    - name: scalix.api_key
      env: SCALIX_API_KEY
      example: <YOUR_SCALIX_API_KEY>
