name: asin
type: remote
meta:
  category: analytics
  tags:
    - e-commerce
    - amazon
    - price-tracking
    - remote
about:
  title: Asin
  description: "Track Amazon products and prices across 11 marketplaces: search Amazon, keep a scheduled watchlist, read price history and offers."
  icon: https://avatars.githubusercontent.com/u/352316305?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://www.asin.dev/api/mcp
  headers:
    Authorization: "Bearer ${ASIN_API_KEY}"
config:
  description: Configure your Asin API key
  secrets:
    - name: asin.api_key
      env: ASIN_API_KEY
      example: <YOUR_API_KEY>
