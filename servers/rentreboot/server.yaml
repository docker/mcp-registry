name: rentreboot
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - real-estate
    - rental-housing
    - rent-data
    - remote
about:
  title: RentReboot
  description: Public renter guides and NYC neighborhood rent data, plus scoped OAuth tools for apartment alerts, saved searches, and Housing Lottery status.
  icon: https://www.google.com/s2/favicons?domain=rentreboot.com&sz=64
remote:
  transport_type: streamable-http
  url: https://rentreboot.com/api/mcp
oauth:
  - provider: rentreboot
    secret: rentreboot.personal_access_token
    env: RENTREBOOT_PERSONAL_ACCESS_TOKEN
