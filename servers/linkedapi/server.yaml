name: linkedapi
image: mcp/linkedapi
type: server
meta:
  category: business
  tags:
    - linkedin
    - business
    - messaging
    - networking
about:
  title: Linked API
  description: Manage LinkedIn messages, connections, posts, and profile data through Linked API. Requires a Linked API subscription and a connected LinkedIn account.
  icon: https://github.com/Linked-API.png?size=200
source:
  project: https://github.com/Linked-API/linkedapi-mcp
  commit: 84c24f8b82160777306654b3093571ab9c2d5781
run:
  command:
    - node
    - dist/index.js
config:
  description: Copy both tokens from your Linked API dashboard at https://app.linkedapi.io after connecting your LinkedIn account.
  secrets:
    - name: linkedapi.api_token
      env: LINKED_API_TOKEN
      example: YOUR_LINKED_API_TOKEN
      description: Linked API access token. See https://linkedapi.io/mcp/installation.
    - name: linkedapi.identification_token
      env: IDENTIFICATION_TOKEN
      example: YOUR_IDENTIFICATION_TOKEN
      description: Identification token for the connected LinkedIn account. See https://linkedapi.io/mcp/installation.
