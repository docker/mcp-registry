name: askwatch-gsc
type: remote
meta:
  category: search
  tags:
    - search
    - seo
    - analytics
    - google
    - remote
about:
  title: AskWatch Google Search Console
  description: Ask Google Search Console in plain language. Read-only access to search analytics, index status and sitemaps, with no Google Cloud project to set up.
  icon: https://www.google.com/s2/favicons?domain=askwatch.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.askwatch.ai/gsc
  headers:
    Authorization: "Bearer ${ASKWATCH_GSC_KEY}"
config:
  secrets:
    - name: askwatch-gsc.api_key
      env: ASKWATCH_GSC_KEY
      example: <YOUR_ASKWATCH_KEY>
