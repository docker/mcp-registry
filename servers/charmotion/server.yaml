name: charmotion
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - design
    - animation
    - rive
    - ai
    - remote
about:
  title: Charmotion
  description: Design characters and logos with AI and turn them into interactive Rive animations (state machine plus Web, React and SwiftUI code) and MP4, GIF and transparent video
  icon: https://www.google.com/s2/favicons?domain=charmotion.app&sz=64
remote:
  transport_type: streamable-http
  url: https://charmotion.app/mcp
oauth:
  - provider: charmotion
    secret: charmotion.personal_access_token
    env: CHARMOTION_PERSONAL_ACCESS_TOKEN
