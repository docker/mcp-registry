name: iam360
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - fitness
    - nutrition
    - workouts
    - wearables
    - remote
about:
  title: IAM360
  description: Connect agents to your wearable data, nutrition, workouts, challenges, and journal. Read your fitness records and create, update, or delete supported entries with your authorization.
  icon: https://app.iam360.ai/brand/iam360-agent-icon.png
source:
  project: https://github.com/iam360-ai/iam360-mcp-connector
remote:
  transport_type: streamable-http
  url: https://app.iam360.ai/api/mcp
oauth:
  - provider: iam360
    secret: iam360.personal_access_token
    env: IAM360_PERSONAL_ACCESS_TOKEN
