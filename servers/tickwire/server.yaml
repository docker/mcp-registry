name: tickwire
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - metatrader
    - mt5
    - mt4
    - trading
    - remote
about:
  title: Tickwire for MetaTrader 4 and 5
  description: Read and trade MetaTrader 4 and 5 accounts. Positions, quotes, candles, history, and idempotent, audited orders.
  icon: https://tickwire.io/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.tickwire.io/mcp
oauth:
  - provider: tickwire
    secret: tickwire.personal_access_token
    env: TICKWIRE_PERSONAL_ACCESS_TOKEN
