about:
  title: Quant Data
  description: Measured market statistics for trading agents — day-type probabilities, Weis volume-wave events with pre-registered win rates, options max pain from open interest alone, and estimated dealer gamma (GEX). Every number traces to a published measurement, failures included; nothing is a buy/sell recommendation. No API key needed to try (10 calls/day keyless).
