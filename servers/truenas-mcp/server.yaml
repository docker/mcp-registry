config:
  description: Configure the connection to your TrueNAS SCALE instance
  secrets:
    - name: truenas-mcp.api_key
      env: TRUENAS_API_KEY
      example: 1-abc123def456
    - name: truenas-mcp.url
      env: TRUENAS_URL
      example: https://truenas.local
