name: adanos
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - stocks
    - sentiment
    - remote
about:
  title: Adanos
  description: Buzz and sentiment of stocks and ETFs on Reddit, X, News and Polymarket, with trending tickers, ticker comparisons and market-wide sentiment
  icon: https://raw.githubusercontent.com/adanos-software/adanos-mcp/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://adanos.com/mcp
oauth:
  - provider: adanos
    secret: adanos.personal_access_token
    env: ADANOS_PERSONAL_ACCESS_TOKEN
