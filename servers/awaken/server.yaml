name: awaken
type: remote
meta:
  category: finance
  tags:
    - finance
    - crypto
    - tax
    - accounting
    - remote
about:
  title: Awaken Tax
  description: Review crypto transactions, cost basis, gains, income and tax reports in your Awaken Tax account.
  icon: https://awaken.tax/512.png
remote:
  transport_type: streamable-http
  url: https://mcp.awaken.tax/mcp
  headers:
    Authorization: "Bearer ${AWAKEN_API_KEY}"
config:
  secrets:
    - name: awaken.api_key
      env: AWAKEN_API_KEY
      example: <portfolioId>:<apiKey>
