name: crustdata
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - data
    - sales
    - recruiting
    - remote
about:
  title: Crustdata
  description: >-
    Real-time B2B data for agents: search and enrich 1B+ people and 200M+
    company profiles, find work emails and phones, and track hiring and job
    changes, with zero local install and OAuth sign-in.
  icon: https://raw.githubusercontent.com/mhimed-crustdata/crustdata-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://install.crustdata.com/mcp
oauth:
  - provider: crustdata
    secret: crustdata.personal_access_token
    env: CRUSTDATA_PERSONAL_ACCESS_TOKEN
