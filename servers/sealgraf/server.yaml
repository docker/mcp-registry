name: sealgraf
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - payments
    - approvals
    - spending-limits
    - receipts
    - remote
about:
  title: Sealgraf
  description: Sealgraf is the approval layer for AI agent spending. Before an agent buys, Sealgraf checks the purchase against the spending limits the owner set, asks the owner to approve anything above the ask line, and seals a tamper-evident receipt that anyone can verify. Sealgraf never moves money — it records the decision and the evidence.
  icon: https://www.google.com/s2/favicons?domain=sealgraf.com&sz=64
remote:
  transport_type: streamable-http
  url: https://sealgraf.com/mcp
oauth:
  - provider: sealgraf
secrets:
  - name: sealgraf.personal_access_token
    env: SEALGRAF_PERSONAL_ACCESS_TOKEN
