name: imagera-remote
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - image-generation
    - video-generation
    - text-to-speech
    - remote
about:
  title: Imagera
  description: Generate and edit images, video, voice and music with many AI models, with a cost estimate before each run
  icon: https://www.google.com/s2/favicons?domain=imagera.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.imagera.ai/mcp
oauth:
  - provider: imagera-remote
    secret: imagera-remote.personal_access_token
    env: IMAGERA_REMOTE_PERSONAL_ACCESS_TOKEN
