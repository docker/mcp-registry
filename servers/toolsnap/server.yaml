about:
  title: ToolSnap
  description: |-
    Deterministic, context-efficient microtools for AI agents. Extraction is pure parsing (no LLM in the loop), so output is exact and reproducible.

    47 tools, 36 of them free with no account or API key: fetch_extract (URL to clean text, median 98.1% fewer tokens than raw HTML), fetch_html, html_to_markdown, fetch_metadata, PDF text, CSV/JSON queries, sitemaps, RSS/Atom feeds, link checking and utilities. tools/list shows a curated core of 17; the rest is one free tool_catalog call away.

    11 paid tools with real per-call cost (screenshots, JS rendering, keyword research, background removal, media generation) settle per call in USDC on Base via x402, from a prepaid balance, or with card credits.
  icon: https://www.google.com/s2/favicons?domain=toolsnap.app&sz=128
remote:
  transport_type: streamable-http
  url: https://mcp.toolsnap.app/mcp
