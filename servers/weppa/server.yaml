name: weppa
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - hosting
    - cloud
    - deployment
    - remote
about:
  title: Weppa
  description: AI-native managed hosting. Your agent creates, deploys, backs up and fixes your apps (Odoo, n8n, Chatwoot, sites or your own app) within your Weppa account.
  icon: https://www.google.com/s2/favicons?domain=weppa.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.weppa.co/mcp
oauth:
  - provider: weppa
    secret: weppa.personal_access_token
    env: WEPPA_PERSONAL_ACCESS_TOKEN
