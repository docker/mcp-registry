name: socialcrawl
type: remote
meta:
  category: search
  tags:
    - search
    - social-media
    - web-scraping
    - data
    - remote
about:
  title: SocialCrawl
  description: Live social and web data for AI agents. Structured, real-time data from 65 social, commerce, review, jobs, finance, and web sources through 575 endpoints, one API key, and one consistent schema.
  icon: https://www.socialcrawl.dev/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.socialcrawl.dev/mcp
  headers:
    Authorization: "Bearer ${SOCIALCRAWL_API_KEY}"
config:
  description: SocialCrawl API key (sc_…). 100 free credits on signup at https://www.socialcrawl.dev/dashboard. Discovery tools work without a key.
  secrets:
    - name: socialcrawl.api_key
      env: SOCIALCRAWL_API_KEY
      example: <YOUR_API_KEY>
