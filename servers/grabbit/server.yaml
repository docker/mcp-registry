name: grabbit
type: remote
dynamic:
  tools: true
meta:
  category: tools
  tags:
    - browser-automation
    - screenshots
    - remote
    - mcp
about:
  title: Grabbit
  description: Grabbit gives AI agents eyes on the web. Send a public URL, get a pixel-perfect hosted image.
  icon: https://raw.githubusercontent.com/BrainGridAI/grabbit-mcp/main/assets/grabbit-mark.png
remote:
  transport_type: streamable-http
  url: https://mcp.grabbit.live
oauth:
  - provider: grabbit
    secret: grabbit.personal_access_token
    env: GRABBIT_PERSONAL_ACCESS_TOKEN
