name: quanticdata
type: remote

# 25 tools are discovered dynamically at runtime from the live endpoint.
dynamic:
  tools: true

meta:
  category: automation
  tags:
    - automation
    - web-scraping
    - data-extraction
    - search
    - data-collection
    - remote

about:
  title: QuanticData
  description: >-
    Web scraping, search, and data-collection tools. Extract structured data from
    the web, run SERP and site collectors, and build datasets through a single
    hosted MCP endpoint.
  icon: https://raw.githubusercontent.com/quantumproxies/quanticdata-mcp-server/main/icon.png

remote:
  transport_type: streamable-http
  url: https://api.quanticdata.io/mcp
  headers:
    Authorization: "Bearer ${QUANTICDATA_API_KEY}"

config:
  description: Configure your QuanticData API key (create one at https://app.quanticdata.io/api-keys).
  secrets:
    - name: quanticdata.api_key
      env: QUANTICDATA_API_KEY
      example: qd_live_YOUR_KEY
