name: peoplesearch
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - people-search
    - email
    - b2b-data
    - linkedin
    - remote
about:
  title: PeopleSearch.im
  description: Search people and companies in plain English, find and verify work emails, and look up LinkedIn profiles and companies. Searching is free; lookups spend credits and are refunded when nothing is found.
  icon: https://peoplesearch.im/brand/icon.png
remote:
  transport_type: streamable-http
  url: https://peoplesearch.im/api/mcp
oauth:
  - provider: peoplesearch
    secret: peoplesearch.personal_access_token
    env: PEOPLESEARCH_PERSONAL_ACCESS_TOKEN
