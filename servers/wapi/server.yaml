name: wapi
type: remote
meta:
  category: communication
  tags:
    - whatsapp
    - attribution
    - analytics
    - marketing
    - remote
about:
  title: wapi.kz
  description: WhatsApp with ad attribution — which ad, link or website brought each chat and whether it sold — plus sending and reading WhatsApp messages for AI agents.
  icon: https://www.google.com/s2/favicons?domain=wapi.kz&sz=64
remote:
  transport_type: streamable-http
  url: https://wapi.kz/api/mcp
  headers:
    Authorization: "Bearer ${WAPI_API_KEY}"
config:
  secrets:
    - name: wapi.api_key
      env: WAPI_API_KEY
      example: <YOUR_API_KEY>
