name: forthroute
type: remote
dynamic:
  tools: true
meta:
  category: ecommerce
  tags:
    - ecommerce
    - shopify
    - returns
    - remote
about:
  title: ForthRoute Returns
  description: Search, review, approve and decline Shopify returns in ForthRoute, a free returns app. Every tool needs a merchant OAuth sign-in.
  icon: https://forthroute.io/static/images/favicons/forthroute-favicon-180.png
remote:
  transport_type: streamable-http
  url: https://app.forthroute.io/mcp
oauth:
  - provider: forthroute
    secret: forthroute.personal_access_token
    env: FORTHROUTE_PERSONAL_ACCESS_TOKEN
