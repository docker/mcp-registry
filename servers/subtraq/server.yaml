name: subtraq
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - marketing
    - url-shortener
    - remote
about:
  title: Subtraq
  description: Create short links, track clicks and attribute sales from your AI agent, with 8 tools backed by the Subtraq API.
  icon: https://subtraq.co/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://subtraq.co/api/mcp
  headers:
    Authorization: "Bearer ${SUBTRAQ_API_KEY}"
config:
  secrets:
    - name: subtraq.api_key
      env: SUBTRAQ_API_KEY
      example: <YOUR_API_KEY>
