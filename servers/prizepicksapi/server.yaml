name: prizepicksapi
type: remote
meta:
  category: data-analytics
  tags:
    - sports
    - player-props
    - fantasy
    - remote
about:
  title: PrizePicks API
  description: "PrizePicks player-prop lines with goblin and demon tiers labeled, recorded line changes, graded results, player game logs and team stats for model training and live scoring. Read-only; not affiliated with PrizePicks."
  icon: https://prizepicksapi.com/icon.svg
remote:
  transport_type: streamable-http
  url: https://prizepicksapi.com/api/mcp
  headers:
    Authorization: "Bearer ${PRIZEPICKS_API_KEY}"
config:
  secrets:
    - name: prizepicksapi.api_key
      env: PRIZEPICKS_API_KEY
      example: <YOUR_API_KEY>
