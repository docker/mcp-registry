name: docker
type: poci
meta:
  category: devops
  tags:
    - docker
about:
  title: Docker
  description: Use the Docker CLI.
  icon: https://www.docker.com/app/uploads/external/logos/docker-favicon.png
tools:
  - name: docker
    description: use the docker cli
    parameters:
      type: object
      properties:
        args:
          type: array
          description: Arguments to pass to the Docker command
          items:
            type: string
      required:
        - args
    container:
      image: docker:cli
      command:
        - "{{args|into}}"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
