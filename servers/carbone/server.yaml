name: carbone
image: mcp/carbone
type: server
meta:
  category: productivity
  tags:
    - productivity
    - document-generation
    - document-conversion
    - pdf
    - docx
    - templates
    - reporting
about:
  title: Carbone
  description: >-
    Official Carbone server: generate PDF, Word (DOCX), Excel (XLSX) and
    PowerPoint (PPTX) documents from templates and JSON data, and convert
    DOCX, HTML or Markdown to PDF. Automate invoices, contracts and reports,
    and manage versioned templates, on Carbone Cloud or on-premise.
  icon: https://raw.githubusercontent.com/carboneio/carbone/refs/heads/master/doc/carbone_icon_large.svg
source:
  project: https://github.com/carboneio/carbone-mcp
  branch: master
  commit: bc6033cd00d64e94236329083309434ff2c2045d
run:
  volumes:
    - "{{carbone.paths|volume|into}}"
config:
  description: Connect to Carbone Cloud with an API key from https://account.carbone.io, or to your own on-premise Carbone server
  secrets:
    - name: carbone.api_key
      env: CARBONE_API_KEY
      example: <CARBONE_API_KEY>
  env:
    - name: MCP_TRANSPORT
      example: stdio
      value: stdio
    - name: CARBONE_BASE_URL
      example: https://api.carbone.io
      value: "{{carbone.carbone_base_url}}"
  parameters:
    type: object
    properties:
      carbone_base_url:
        type: string
        description: Carbone API base URL. Keep https://api.carbone.io for Carbone Cloud, or set the URL of your on-premise Carbone server (if it has no authentication, any API key value works).
        default: https://api.carbone.io
      paths:
        type: array
        items:
          type: string
        description: Optional. Local folders Carbone can read templates and files from, and save generated documents to (e.g. /Users/me/Documents/invoices). On macOS and Linux, use the same paths as on your machine. Leave empty to work with URLs, base64 and download links only.
