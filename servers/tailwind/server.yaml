name: tailwind
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - marketing
    - social-media
    - pinterest
    - scheduling
    - remote
about:
  title: Tailwind
  description: Create, schedule, and analyze Pinterest Pins for the Pinterest accounts connected to your Tailwind account
  icon: https://www.google.com/s2/favicons?domain=tailwindapp.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.tailwind.ai
oauth:
  - provider: tailwind
    secret: tailwind.personal_access_token
    env: TAILWIND_PERSONAL_ACCESS_TOKEN
