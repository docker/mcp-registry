about:
  title: Hourbun
  description: Track time with timers and time entries, and read projects, expenses and uninvoiced time in Hourbun, a time tracking and invoicing app for freelancers and small teams
  icon: https://www.google.com/s2/favicons?domain=hourbun.com&sz=64
