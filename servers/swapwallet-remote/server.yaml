name: swapwallet-remote
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - crypto
    - wallet
    - remote
about:
  title: SwapWallet
  description: Read SwapWallet crypto balances, P&L and transaction history, and request swaps, transfers and withdrawals that run only after the user approves them in Telegram.
  icon: https://www.google.com/s2/favicons?domain=swapwallet.app&sz=64
remote:
  transport_type: streamable-http
  url: https://swapwallet.app/mcp
oauth:
  - provider: swapwallet-remote
    secret: swapwallet-remote.personal_access_token
    env: SWAPWALLET_REMOTE_PERSONAL_ACCESS_TOKEN
