name: netnest-fundamentals
type: remote
meta:
  category: finance
  tags:
    - finance
    - sec-filings
    - remote
about:
  title: NetNest Design Fundamentals
  description: Fundamentals and filing events for companies that file with the SEC, each value linked to its source filing.
  icon: https://api.netnestdesign.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.netnestdesign.com/mcp
  headers:
    Authorization: "Bearer ${NETNEST_FUNDAMENTALS_API_KEY}"
config:
  secrets:
    - name: netnest-fundamentals.api_key
      env: NETNEST_FUNDAMENTALS_API_KEY
      example: <YOUR_API_KEY>
