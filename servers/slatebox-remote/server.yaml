name: slatebox-remote
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - collaboration
    - diagramming
    - mind-map
    - project-management
    - remote
about:
  title: Slatebox
  description: Create and edit mind maps, flowcharts, project plans and presentations on a shared team canvas, and read slates back as Mermaid
  icon: https://www.google.com/s2/favicons?domain=slatebox.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.slatebox.com/mcp
oauth:
  - provider: slatebox-remote
    secret: slatebox-remote.personal_access_token
    env: SLATEBOX_REMOTE_PERSONAL_ACCESS_TOKEN
