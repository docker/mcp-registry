name: slatebox-remote
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - collaboration
    - diagramming
    - mind-map
    - whiteboard
    - mermaid
    - project-management
    - remote
about:
  title: Slatebox
  description: Free, open-source visual intelligence for your team and agents. Draw and edit diagrams, flowcharts, mind maps, whiteboards, retro boards, Gantt plans and presentations on one live canvas, and turn Mermaid into editable slates
  icon: https://www.google.com/s2/favicons?domain=slatebox.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.slatebox.com/mcp
oauth:
  - provider: slatebox-remote
    secret: slatebox-remote.personal_access_token
    env: SLATEBOX_REMOTE_PERSONAL_ACCESS_TOKEN
