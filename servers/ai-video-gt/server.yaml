name: ai-video-gt
type: remote
meta:
  category: media
  tags:
    - media
    - video
    - image-generation
    - ai
    - remote
about:
  title: AI Video GT
  description: Generate AI videos with sound and AI images with your AI Video GT credits, see exact model prices and find free in-browser video tools. Model, price and tool lookups work without a real key; generating uses your AI Video GT Developer API key.
  icon: https://aivideogt.com/brand/logo-square-512.png
remote:
  transport_type: streamable-http
  url: https://aivideogt.com/mcp
  headers:
    Authorization: "Bearer ${AI_VIDEO_GT_API_KEY}"
config:
  secrets:
    - name: ai-video-gt.api_key
      env: AI_VIDEO_GT_API_KEY
      example: <YOUR_API_KEY>
