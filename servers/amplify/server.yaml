name: amplify
type: remote
dynamic:
  tools: true
meta:
  category: games
  tags:
    - games
    - game-development
    - web-apps
    - app-builder
    - remote
about:
  title: Amplify
  description: Build, edit and preview browser games and web apps in your Amplify account from your AI agent. Building spends your own credits after a two-step confirmation, and publishing waits for your approval in the app.
  icon: https://amplify.is/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://app.amplify.is/mcp
oauth:
  - provider: amplify
    secret: amplify.personal_access_token
    env: AMPLIFY_PERSONAL_ACCESS_TOKEN
