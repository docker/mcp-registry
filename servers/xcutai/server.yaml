name: xcutai
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - social-media
    - marketing
    - content
    - remote
about:
  title: XCut AI
  description: Find viral posts, outliers, hooks and ads on Instagram, TikTok, YouTube and Facebook, then write them in your brand's voice.
  icon: https://raw.githubusercontent.com/XCut-AI/xcutai-plugins/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.xcut.ai/mcp
oauth:
  - provider: xcutai
    secret: xcutai.personal_access_token
    env: XCUTAI_PERSONAL_ACCESS_TOKEN
