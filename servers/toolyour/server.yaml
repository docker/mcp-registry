name: toolyour
type: remote
meta:
  category: tools
  tags:
    - tools
    - seo
    - security
    - productivity
    - remote
about:
  title: ToolYour
  description: Remote MCP for AI agents — plan, run playbook/solve, verify until pass for SEO, security, and ship-gate jobs. Same API key and credits as ToolYour REST.
  icon: https://www.google.com/s2/favicons?domain=toolyour.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.toolyour.com/mcp/http
  headers:
    X-Api-Key: "${TOOLYOUR_API_KEY}"
config:
  secrets:
    - name: toolyour.api_key
      env: TOOLYOUR_API_KEY
      example: <YOUR_API_KEY>
