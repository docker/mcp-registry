name: animation-machine
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - animation
    - remote
about:
  title: Animation Machine
  description: Render AI-written HTML animations (GSAP, CSS, Lottie, Three.js) to MP4 or GIF, and finish videos with music, voiceover, captions and title cards, in 16:9, 9:16 and 1:1
  icon: https://animation-machine.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://animation-machine.com/mcp
oauth:
  - provider: animation-machine
    secret: animation-machine.personal_access_token
    env: ANIMATION_MACHINE_PERSONAL_ACCESS_TOKEN
