name: stuntdouble
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - testing
    - qa
    - ux-testing
    - user-research
    - browser-automation
    - remote
about:
  title: Stunt Double
  description: AI user personas test your product, prototypes and previews in a real browser and return screenshot evidence
  icon: https://www.google.com/s2/favicons?domain=stuntdouble.io&sz=64
remote:
  transport_type: streamable-http
  url: https://app.stuntdouble.io/api/mcp
oauth:
  - provider: stuntdouble
    secret: stuntdouble.personal_access_token
    env: STUNTDOUBLE_PERSONAL_ACCESS_TOKEN
