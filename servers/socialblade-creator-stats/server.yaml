name: socialblade-creator-stats
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - creators
    - social-media
    - youtube
    - tiktok
    - remote
about:
  title: SocialBlade Creator Stats
  description: "Creator growth for YouTube, TikTok, Instagram and Twitch: SocialBlade grade, ranks, 15-day history and 7/30/90-day gains, up to 10 creators per call."
  icon: https://www.google.com/s2/favicons?domain=mcpize.com&sz=64
remote:
  transport_type: streamable-http
  url: https://socialblade-creator-stats.mcpize.run/mcp
  headers:
    Authorization: "Bearer ${MCPIZE_API_KEY}"
config:
  secrets:
    - name: socialblade-creator-stats.mcpize_api_key
      env: MCPIZE_API_KEY
      example: <YOUR_MCPIZE_API_KEY>
