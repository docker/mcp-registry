name: aeo-search
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - seo
    - analytics
    - search-console
    - remote
about:
  title: AEO Search
  description: Read-only access to your Google Search Console, GA4 and Bing Webmaster data for SEO analysis, with 20 tools for queries, pages, CTR gaps, traffic drops and index health
  icon: https://aeo.advancelabs.dev/icon-512.png
source:
  project: https://github.com/Advance-Labs/aeo-toolkit
remote:
  transport_type: streamable-http
  url: https://aeo.advancelabs.dev/api/mcp/search/mcp
oauth:
  - provider: aeo-search
    secret: aeo-search.personal_access_token
    env: AEO_SEARCH_PERSONAL_ACCESS_TOKEN
