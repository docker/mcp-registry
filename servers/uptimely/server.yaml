name: uptimely
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - uptime
    - incidents
    - status-pages
    - remote
about:
  title: Uptimely
  description: Manage uptime monitors, incidents and status pages, and read check results, in Uptimely.
  icon: https://www.google.com/s2/favicons?domain=getuptimely.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.getuptimely.com/api/mcp
oauth:
  - provider: uptimely
    secret: uptimely.personal_access_token
    env: UPTIMELY_PERSONAL_ACCESS_TOKEN
