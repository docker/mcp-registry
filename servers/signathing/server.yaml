name: signathing
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - e-signature
    - documents
    - contracts
    - remote
about:
  title: Signathing
  description: Send PDFs for e-signature, check who has signed, send reminders, and pull an evidence record anyone can verify
  icon: https://signathing.com/brand/signathing-icon.svg
remote:
  transport_type: streamable-http
  url: https://signathing.com/api/mcp
oauth:
  - provider: signathing
    secret: signathing.personal_access_token
    env: SIGNATHING_PERSONAL_ACCESS_TOKEN
