name: listar
type: remote
dynamic:
  tools: true
meta:
  category: crm
  tags:
    - crm
    - sales
    - prospecting
    - b2b
    - enrichment
    - remote
about:
  title: Listar
  description: Find the decision makers of a company and the professional phone and email of a person, from official business registers (INPI, SIRENE) and B2B data sources. Full coverage of France, partial elsewhere.
  icon: https://www.google.com/s2/favicons?domain=listar.fr&sz=64
remote:
  transport_type: streamable-http
  url: https://api.listar.fr/mcp
oauth:
  - provider: listar
    secret: listar.personal_access_token
    env: LISTAR_PERSONAL_ACCESS_TOKEN
