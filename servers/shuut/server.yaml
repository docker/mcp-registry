name: shuut
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - image-generation
    - video-generation
    - media
    - remote
about:
  title: Shuut
  description: Create and edit images, videos, voice, music and captions with GPT Image, Nano Banana, Seedream, Seedance, Kling and Veo, billed to your shuut credits
  icon: https://shuut.ai/icons/icon-192.png
remote:
  transport_type: streamable-http
  url: https://shuut.ai/mcp
oauth:
  - provider: shuut
    secret: shuut.personal_access_token
    env: SHUUT_PERSONAL_ACCESS_TOKEN
