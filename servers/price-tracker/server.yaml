name: price-tracker
image: mcp/price-tracker
type: server
meta:
  category: ecommerce
  tags:
    - ecommerce
    - price-monitoring
    - shopping
    - scraping
    - alerts
about:
  title: Price Tracker
  description: Reads the current price from a shop product page on demand, keeps a watch list of pages, records a price history point on every check and reports which watched items dropped below their target price. Extraction reads JSON-LD, microdata and common price markup. History is stored as plain JSON files inside the container volume.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/75e358fce74fef68c20051209af64f51c917e798/assets/price-tracker-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: 75e358fce74fef68c20051209af64f51c917e798
  dockerfile: servers/price-tracker/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: price-tracker.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
