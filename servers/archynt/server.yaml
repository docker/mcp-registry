name: "archynt"
type: "remote"
dynamic:
  tools: true
meta:
  category: "monitoring"
  tags:
    - "monitoring"
    - "observability"
    - "docker"
    - "kubernetes"
    - "logs"
    - "architecture"
    - "remote"
about:
  title: "Archynt"
  description: "Production context for AI coding agents, joined to the code's architecture graph: service health, what a deploy changed, the blast radius of a code change against live traffic, error groups, logs, metrics and lifecycle events from Kubernetes or Docker, plus design problems and architectural boundaries. 23 read-only tools; investigate only on paid plans. Sign in with OAuth by adding the URL to your client; an MCP key (amcp_…) created under Dashboard → API keys is the alternative."
  icon: "https://archynt.com/brand/archynt-logo.png"
remote:
  transport_type: "streamable-http"
  url: "https://archynt.com/mcp"
oauth:
  - provider: "archynt"
    secret: "archynt.personal_access_token"
    env: "ARCHYNT_PERSONAL_ACCESS_TOKEN"
