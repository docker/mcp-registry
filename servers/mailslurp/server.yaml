name: mailslurp
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - email
    - sms
    - testing
    - remote
about:
  title: MailSlurp
  description: Test signup emails and SMS verification codes, preview emails on real devices, and check inbox placement using scoped MailSlurp access.
  icon: https://www.mailslurp.com/assets/branding/mailslurp-logo-icon-white-background.png
remote:
  transport_type: streamable-http
  url: https://api.mailslurp.com/mcp
oauth:
  - provider: mailslurp
    secret: mailslurp.personal_access_token
    env: MAILSLURP_PERSONAL_ACCESS_TOKEN
