name: screenbrowser
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - video
    - screen-recording
    - tutorials
    - documentation
    - remote
about:
  title: Screen Browser
  description: Record narrated demo and tutorial videos of your web app from a plain-language guide. A real browser signs in to your deployed app, follows the guide, and returns an MP4 with voiceover, captions and on-screen effects.
  icon: https://screenbrowser.com/assets/img/icon-512-cursor-loop.png
remote:
  transport_type: streamable-http
  url: https://mcp.screenbrowser.com
oauth:
  - provider: screenbrowser
    secret: screenbrowser.personal_access_token
    env: SCREENBROWSER_PERSONAL_ACCESS_TOKEN
