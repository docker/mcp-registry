name: thedeployer
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - deployment
    - cloud
    - aws
    - remote
about:
  title: The Deployer
  description: >-
    Deploy and run apps in your own AWS, Google Cloud, Azure or DigitalOcean
    account from your AI agent: check a repository, launch it with a priced
    plan you approve, follow and fix failed deployments, read logs, and manage
    domains, scaling and databases. Signs in with OAuth; no key to paste.
  icon: https://thedploy.com/assets/brand/icon-192.png
remote:
  transport_type: streamable-http
  url: https://app.thedploy.com/mcp
oauth:
  - provider: thedeployer
    secret: thedeployer.personal_access_token
    env: THEDEPLOYER_PERSONAL_ACCESS_TOKEN
