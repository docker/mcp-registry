name: nops-clara
type: remote
dynamic:
  tools: true
meta:
  category: cost-management
  tags:
    - finops
    - cloud-cost
    - aws
    - cost-management
    - remote
about:
  title: Clara FinOps
  description: FinOps assistant for AWS, GCP and Azure. Query cost and usage, Reserved Instance and Savings Plan performance, budgets, reports, cost allocation and anomalies from your nOps account
  icon: https://raw.githubusercontent.com/nops-io/clara-mcp/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.nops.io
oauth:
  - provider: nops-clara
    secret: nops-clara.personal_access_token
    env: NOPS_CLARA_PERSONAL_ACCESS_TOKEN
