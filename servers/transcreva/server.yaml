name: transcreva
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - transcription
    - speech-to-text
    - portuguese
    - remote
about:
  title: Transcreva
  description: Brazilian Portuguese audio and video transcription with speaker diarization and SRT/VTT/DOCX export
  icon: https://transcreva.net/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://transcreva.net/mcp
oauth:
  - provider: transcreva
    secret: transcreva.personal_access_token
    env: TRANSCREVA_PERSONAL_ACCESS_TOKEN
