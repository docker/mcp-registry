name: scrapewise
type: remote
meta:
  category: search
  tags:
    - web-scraping
    - price-monitoring
    - product-data
    - e-commerce
    - remote
about:
  title: Scrapewise
  description: Clean, matched, AI-ready product data from any website. Read product and price data from any shop or Amazon, search Google and Amazon, fetch web pages and read saved rows from your account.
  icon: https://www.google.com/s2/favicons?domain=scrapewise.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.scrapewise.ai/mcp
  headers:
    Authorization: "Bearer ${SCRAPEWISE_API_KEY}"
config:
  secrets:
    - name: scrapewise.api_key
      env: SCRAPEWISE_API_KEY
      example: <YOUR_SCRAPEWISE_API_KEY>
