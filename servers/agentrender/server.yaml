name: agentrender
type: remote
dynamic:
  tools: true
meta:
  category: tools
  tags:
    - screenshot
    - pdf
    - web-scraping
    - remote
about:
  title: AgentRender
  description: Turn any URL into a screenshot, a PDF, or a structured extract (title, main text, links) without running a browser. Free API key, no card, at agentrenderapi.com.
  icon: https://raw.githubusercontent.com/corbinvachal48/agentrender-mcp/main/assets/logo-192.png
remote:
  transport_type: streamable-http
  url: https://api.agentrenderapi.com/mcp
  headers:
    Authorization: "Bearer ${AGENTRENDER_API_KEY}"
config:
  description: Get a free API key instantly (150 renders/month, no card) at https://agentrenderapi.com/#waitlist
  secrets:
    - name: agentrender.api_key
      env: AGENTRENDER_API_KEY
      example: akr_your_key
