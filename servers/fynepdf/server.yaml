name: fynepdf
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - pdf
    - documents
    - remote
about:
  title: FynePDF
  description: Compress, merge, split, convert, OCR, redact, sign and create PDFs, and ask questions about them
  icon: https://www.google.com/s2/favicons?domain=fynepdf.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.fynepdf.com/mcp
oauth:
  - provider: fynepdf
    secret: fynepdf.personal_access_token
    env: FYNEPDF_PERSONAL_ACCESS_TOKEN
