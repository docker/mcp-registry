name: llamalogger
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - error-tracking
    - debugging
    - dotnet
    - remote
about:
  title: Llama Logger
  description: Exception tracking for .NET. Search, read and triage the errors your apps report, with stack traces, error history, attachments and ignore rules
  icon: https://www.llamalogger.com/assets/img/mcp/llamalogger-icon-256.png
remote:
  transport_type: streamable-http
  url: https://mcp.llamalogger.com/api/mcp
oauth:
  - provider: llamalogger
    secret: llamalogger.personal_access_token
    env: LLAMALOGGER_PERSONAL_ACCESS_TOKEN
