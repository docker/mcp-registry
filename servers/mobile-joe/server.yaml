name: mobile-joe
type: remote
dynamic:
  tools: true
meta:
  category: development
  tags:
    - development
    - mobile
    - ios
    - android
    - faq
    - feature-requests
    - localization
    - remote
about:
  title: Mobile Joe
  description: Manage your mobile app's FAQs, translations, feature plans and in-app alerts from your AI agent.
  icon: https://app.mobilejoe.dev/icon.png
remote:
  transport_type: streamable-http
  url: https://app.mobilejoe.dev/mcp
oauth:
  - provider: mobile-joe
    secret: mobile-joe.personal_access_token
    env: MOBILE_JOE_PERSONAL_ACCESS_TOKEN
