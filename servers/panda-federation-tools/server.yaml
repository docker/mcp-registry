name: panda-federation-tools
image: mcp/panda-federation-tools
type: server
meta:
  category: search
  tags:
    - search
    - research
    - citations
    - lead-generation
    - open-data
    - apify
about:
  title: Panda Federation Tools
  description: 18 pay-per-result research and public-data tools on Apify. Check citations for fake or retracted papers, search OpenAlex and PubMed, find grants and federal contracts, build B2B lead lists from official open data, and audit email-domain security and AI-search SEO. Every call is schema-validated and has a spending cap.
  icon: https://avatars.githubusercontent.com/pandadad0214?s=200
source:
  project: https://github.com/pandadad0214/panda-federation-tools
  commit: 15b412734b7ca37fd5f5e149e28ab74c4b5a76fd
config:
  description: Connect your Apify account (the free plan includes monthly credit)
  secrets:
    - name: panda-federation-tools.apify_token
      env: APIFY_TOKEN
      example: <YOUR_APIFY_API_TOKEN>
  env:
    - name: PANDA_MAX_CHARGE_USD
      example: "0.50"
      value: '{{panda-federation-tools.max_charge_usd}}'
  parameters:
    type: object
    properties:
      max_charge_usd:
        type: string
        description: Default spending cap per tool call in USD (0.01 to 25). Defaults to 0.50.
        default: "0.50"
