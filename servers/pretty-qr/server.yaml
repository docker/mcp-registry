name: pretty-qr
type: remote
meta:
  category: tools
  tags:
    - tools
    - design
    - qr
    - remote
about:
  title: Pretty QR
  description: Create designed QR codes with custom colours, logos, frames, and shapes, and open them in the Pretty QR editor.
  icon: https://pretty-qr.com/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://pretty-qr.com/api/mcp
  headers:
    Authorization: "Bearer ${PRETTY_QR_API_KEY}"
config:
  secrets:
    - name: pretty-qr.api_key
      env: PRETTY_QR_API_KEY
      example: <YOUR_API_KEY>

