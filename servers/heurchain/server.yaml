name: heurchain
type: remote
meta:
  category: ai
  tags:
    - ai
    - memory
    - agents
    - remote
about:
  title: HeurChain
  description: Persistent memory for AI agents. Store facts, decisions and session summaries, and recall them with hybrid keyword and vector search, shared across Claude Code, Codex and other MCP clients.
  icon: https://www.google.com/s2/favicons?domain=heurchain.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.heurchain.com/mcp/sse
  headers:
    X-HeurChain-API-Key: "${HEURCHAIN_API_KEY}"
    X-HeurChain-Tenant: "${HEURCHAIN_TENANT}"
config:
  description: Use the API key and tenant ID from your HeurChain dashboard.
  secrets:
    - name: heurchain.api_key
      env: HEURCHAIN_API_KEY
      example: <YOUR_API_KEY>
    - name: heurchain.tenant
      env: HEURCHAIN_TENANT
      example: <YOUR_TENANT_ID>
