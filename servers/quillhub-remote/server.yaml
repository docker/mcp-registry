name: quillhub-remote
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - meetings
    - transcription
    - knowledge
    - remote
about:
  title: QuillHub
  description: Search meeting transcripts, read who said what, pull decisions and action items, and transcribe files and links
  icon: https://www.google.com/s2/favicons?domain=quillhub.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.quillhub.ai/mcp
oauth:
  - provider: quillhub-remote
    secret: quillhub-remote.personal_access_token
    env: QUILLHUB_REMOTE_PERSONAL_ACCESS_TOKEN
