name: justfill
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - pdf
    - forms
    - document-automation
    - remote
about:
  title: JustFill
  description: Detect, visually preview, and fill existing AcroForm, flat, or scanned PDF forms and save reusable templates
  icon: https://raw.githubusercontent.com/mrmaciej1/justfill-mcp/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://justfill.app/api/mcp
oauth:
  - provider: justfill
    secret: justfill.personal_access_token
    env: JUSTFILL_PERSONAL_ACCESS_TOKEN
