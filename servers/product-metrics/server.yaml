name: product-metrics
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - ecommerce
    - analytics
    - remote
about:
  title: Product Metrics
  description: Connect stores and ad channels, check tracking, set up profit bidding, and manage product segmentation and campaign planning across Google Ads, Meta and ChatGPT Ads.
  icon: https://raw.githubusercontent.com/product-metrics/skills/main/plugins/product-metrics/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://www.productmetrics.io/mcp
oauth:
  - provider: product-metrics
    secret: product-metrics.personal_access_token
    env: PRODUCT_METRICS_PERSONAL_ACCESS_TOKEN
