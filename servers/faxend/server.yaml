name: faxend
type: remote
meta:
  category: communication
  tags:
    - communication
    - fax
    - documents
    - remote
about:
  title: Faxend
  description: Send real faxes from AI assistants. Send a PDF to any fax number with an optional cover page, follow delivery status and check the pages left on your Faxend plan.
  icon: https://faxend.com/favicon-192x192.png
remote:
  transport_type: streamable-http
  url: https://faxend.com/mcp
  headers:
    Authorization: "Bearer ${FAXEND_API_KEY}"
config:
  secrets:
    - name: faxend.api_key
      env: FAXEND_API_KEY
      example: <YOUR_FAXEND_API_KEY>
