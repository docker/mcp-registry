name: posteverywhere
image: mcp/posteverywhere
type: server
meta:
  category: productivity
  tags:
    - social-media
    - productivity
    - marketing
about:
  title: PostEverywhere
  description: Social media scheduler. Write, schedule and publish posts to Instagram, TikTok, YouTube, LinkedIn, Facebook, X, Threads, Pinterest, Bluesky, Telegram, Discord and WordPress from one place. Tools cover post creation and scheduling, a content calendar and posting queue, video cross-posting, media upload, AI captions and images, campaigns, analytics, account health and webhooks. https://posteverywhere.ai
  icon: https://raw.githubusercontent.com/posteverywhere/mcp/main/assets/logo-400.png
source:
  project: https://github.com/posteverywhere/mcp
  commit: 42ddc75f161332b485060b876b81e4ba4b6fbe78
config:
  description: Requires a PostEverywhere API key (create one at app.posteverywhere.ai under Developers)
  secrets:
    - name: posteverywhere.api_key
      env: POSTEVERYWHERE_API_KEY
      example: pe_live_xxxxxxxxxxxxxxxxxxxxxxxx
run:
  allowHosts:
    - app.posteverywhere.ai:443
