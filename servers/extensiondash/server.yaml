name: extensiondash
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - browser-extensions
    - chrome-web-store
    - firefox-add-ons
    - remote
about:
  title: ExtensionDash
  description: Search Chrome and Firefox extension catalogs and inspect listings; signed-in users can track store rankings, keywords and competitors
  icon: https://extensiondash.com/icon.png
remote:
  transport_type: streamable-http
  url: https://extensiondash.com/mcp
oauth:
  - provider: extensiondash
    secret: extensiondash.personal_access_token
    env: EXTENSIONDASH_PERSONAL_ACCESS_TOKEN
