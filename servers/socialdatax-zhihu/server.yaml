name: socialdatax-zhihu
type: remote
dynamic:
  tools: true
meta:
  category: social-media
  tags:
    - social-media
    - research
    - remote
about:
  title: SocialDataX Zhihu
  description: Search Zhihu answers, articles and videos, read comments, and get creator data. Requires a SocialDataX API Key and sufficient credits for business tool calls.
  icon: https://avatars.githubusercontent.com/DevinChen2014?s=128
remote:
  transport_type: streamable-http
  url: https://mcp.socialdatax.com/zhihu/mcp
  headers:
    Authorization: "Bearer ${SOCIALDATAX_API_KEY}"
config:
  description: Get your SocialDataX API Key at https://socialdatax.com/ai?from=docker
  secrets:
    - name: socialdatax-zhihu.api_key
      env: SOCIALDATAX_API_KEY
      example: <SOCIALDATAX_API_KEY>
      description: Your SocialDataX API Key. Obtain it at https://socialdatax.com/ai?from=docker
      required: true
