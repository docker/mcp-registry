name: runlater
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - scheduling
    - cron
    - webhooks
    - remote
about:
  title: RunLater
  description: Schedule HTTP requests from an agent, once at an exact time or on cron, with retries and run logs.
  icon: https://runlater.app/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://runlater.app/api/mcp
oauth:
  - provider: runlater
    secret: runlater.personal_access_token
    env: RUNLATER_PERSONAL_ACCESS_TOKEN
