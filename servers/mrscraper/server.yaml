name: mrscraper
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - search
    - data
    - remote
about:
  title: MrScraper
  description: Retrieve public web pages as HTML, Markdown, or screenshots, search the web with parsed results, and check MrScraper plan and token usage. Hosted server with OAuth sign-in; requests run on your MrScraper plan.
  icon: https://www.google.com/s2/favicons?domain=mrscraper.com&sz=128
remote:
  transport_type: streamable-http
  url: https://mcp.mrscraper.com/mcp
oauth:
  - provider: mrscraper
    secret: mrscraper.personal_access_token
    env: MRSCRAPER_PERSONAL_ACCESS_TOKEN
