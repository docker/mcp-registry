name: mrscraper
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - search
    - data
    - remote
about:
  title: MrScraper
  description: Retrieve public web pages as HTML, Markdown, or screenshots, search the web for ranked results, and check MrScraper plan and token usage. Hosted server with OAuth sign-in; requests run on your MrScraper plan.
  icon: https://avatars.githubusercontent.com/u/193854681?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.mrscraper.com/mcp
oauth:
  - provider: mrscraper
    secret: mrscraper.personal_access_token
    env: MRSCRAPER_PERSONAL_ACCESS_TOKEN
