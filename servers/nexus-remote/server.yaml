name: nexus-remote
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - health
    - fitness
    - nutrition
    - remote
about:
  title: Nexus
  description: Calorie, workout and body-weight log. Log meals by text, photo or voice, and plan and log workouts.
  icon: https://nexus.kushalsm.com/assets/nexus-logo-v2-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.nexus.kushalsm.com/mcp
oauth:
  - provider: nexus-remote
    secret: nexus-remote.personal_access_token
    env: NEXUS_REMOTE_PERSONAL_ACCESS_TOKEN
