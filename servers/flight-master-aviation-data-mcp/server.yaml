name: flight-master-aviation-data-mcp
type: remote

dynamic:
  tools: true

meta:
  category: travel
  tags:
    - aviation
    - flight-data
    - flight-status
    - weather
    - delay-risk
    - trajectory
    - remote

about:
  title: Flight Master Aviation Data MCP
  description: Official aviation data MCP by Flight Master DAST (航班管家 DAST) for flight status, weather, delay risk and trajectories.
  icon: https://dast.133.cn/favicon.ico

remote:
  transport_type: streamable-http
  url: https://fly.huoli.com/mcp/dast_mcp
  headers:
    Authorization: "Bearer $DAST_API_KEY"

secrets:
  - name: flight-master-aviation-data-mcp.api_key
    env: DAST_API_KEY
    example: <YOUR_DAST_API_KEY>
