name: kontragentpro
image: mcp/kontragentpro
type: server
meta:
  category: finance
  tags:
    - kontragentpro
    - finance
    - company-data
    - russia
about:
  title: KontragentPro
  description: "Russian company data by tax ID (INN) from official open state registries: registry details, multi-year financial statements, bankruptcy records, state inspections and trademarks. Works without an API key; a free key raises the rate limits."
  icon: https://avatars.githubusercontent.com/u/290342221?s=200&v=4
source:
  project: https://github.com/kontragentpro/kontragentpro-mcp
  commit: 90ad961e25ca1c31788eb05fd55af7e8d377afac
run:
  allowHosts:
    - kontragentpro.ru:443
config:
  description: The server works anonymously on the free tier; an API key raises the rate limits.
  secrets:
    - name: kontragentpro.api_key
      env: KONTRAGENTPRO_API_KEY
      example: your-kontragentpro-api-key
      description: Optional. Get a free key at https://kontragentpro.ru/developers
      required: false
