about:
  title: HCRB (Code402)
  description: Deterministic checks for payment and business identifiers (IBAN, LEI, SWIFT/BIC, Belgian VAT, Indian GSTIN and IFSC), supplier onboarding packs, exact EVM-address screening against a published snapshot, and read-only Base on-chain facts. Every result states its scope and carries a signed, offline-verifiable receipt. Structural checks only; no registry lookup, ownership or fraud clearance. Five free calls a day on the IBAN, LEI, VAT and SWIFT/BIC checks with no signup, and receipt verification is always free. Other calls are paid per request with x402 (gasless EIP-3009 USDC on Base, from $0.005 a call; the live 402 quote governs).
