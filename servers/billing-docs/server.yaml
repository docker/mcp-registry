about:
  title: Billing Docs
  description: "Writes credit notes and purchase orders on the same engine as your invoices, entirely on your machine. A credit note is issued against a real invoice held by the sibling invoice server: the whole thing, a gross amount, or named lines with quantities, and it will not give back more money than the invoice charged or more of a line than was billed. Crediting part of a mixed-VAT invoice splits the credit across the rates the invoice actually used, in proportion to each rate's share of the total, because charging one blended rate is wrong on the VAT line by far more than rounding: ten percent of a EUR 1,000.00 line at 23% plus a EUR 500.00 line at 8% is EUR 27.00 of VAT split correctly against EUR 33.10 blended, a 22.6 percent error on a number that goes on a VAT return. Purchase orders carry line items, VAT, currency and an expected delivery date, and can be received in full or in part, so an order tracks open, partially received and received. Both documents come out as an A4 PDF or as plain text to paste into an email, and both take the business name, address, VAT id and default currency from the one shared profile the invoice server already holds. No account, no API key, no network call: everything lives under the local data directory and licence keys are verified offline."
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/882b07dbfdd1b787b0aafe5fedf4cebf4abab70f/assets/billing-docs-logo.png
source:
