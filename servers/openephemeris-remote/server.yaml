name: openephemeris-remote
type: remote
dynamic:
  tools: true
meta:
  category: science
  tags:
    - astronomy
    - astrology
    - ephemeris
    - human-design
    - remote
about:
  title: Open Ephemeris
  description: Sub-arcsecond astrology and astronomy from the NASA JPL DE440 ephemeris — natal charts, synastry, transits, moon phases, eclipses, Human Design, Vedic, BaZi and astrocartography, with interactive charts rendered in chat.
  icon: https://www.google.com/s2/favicons?domain=openephemeris.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.openephemeris.com/mcp
oauth:
  - provider: openephemeris-remote
    secret: openephemeris-remote.personal_access_token
    env: OPENEPHEMERIS_REMOTE_PERSONAL_ACCESS_TOKEN
