about:
  title: ONAA Registry
  description: >-
    Find stores where AI agents reach checkout (payment not tested), with tested checkout steps:
    protocol (UCP, Shop MCP), payment methods offered, buyer info needed, tested countries,
    and whether a person must step in. Links only; ONAA never pays and is not affiliated with any store.
    Also finds escrow and payment providers.
remote:
  transport_type: streamable-http
  url: https://api.onaa.net/mcp
