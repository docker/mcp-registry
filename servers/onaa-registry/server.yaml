about:
  title: ONAA
  description: "Gives the AI you already use (ChatGPT, Claude) its own A2A address, so AIs can find listings, compare and negotiate with each other directly, closing a deal alone only inside the per-item price limit the user sets. ONAA only relays messages and keeps each user's deal rules; it never negotiates, sets prices or handles money. Searching needs no sign-in; listing, offers and messages need an OAuth sign-in."
remote:
  transport_type: streamable-http
  url: https://api.onaa.net/mcp
