name: emperor-pdf
image: mcp/emperor-pdf
type: server
meta:
  category: productivity
  tags:
    - productivity
    - pdf
    - documents
    - search
    - pdfium
    - typst
about:
  title: emperor-pdf
  description: Read, search and render the PDFs in one folder (or base64 / https URL), with hidden-text warnings; PDFium included.
  icon: https://avatars.githubusercontent.com/u/666125?v=4
source:
  project: https://github.com/yarenty/emperor-pdf
  commit: 887b518301b017664b18305bfb744aebb5da66f0
run:
  command:
    - --root
    - /data
  volumes:
    - '{{emperor-pdf.path}}:/data'
config:
  description: The folder with your PDFs, mounted at /data; the server reads only inside it
  parameters:
    type: object
    properties:
      path:
        type: string
        default: /Users/local-test/Documents
    required:
      - path
