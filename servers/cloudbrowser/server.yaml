name: cloudbrowser
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - browser
    - automation
    - web-scraping
    - cloud-browser
    - remote
about:
  title: CloudBrowser
  description: Give AI agents a real cloud Chrome browser to navigate, read pages, click, type and take screenshots
  icon: https://www.google.com/s2/favicons?domain=cloudbrowser.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.cloudbrowser.ai
oauth:
  - provider: cloudbrowser
    secret: cloudbrowser.personal_access_token
    env: CLOUDBROWSER_PERSONAL_ACCESS_TOKEN
