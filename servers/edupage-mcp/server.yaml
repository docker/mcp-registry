name: edupage-mcp
image: ghcr.io/oliverhruby/edupage-mcp
type: server
meta:
  category: productivity
  tags:
    - education
    - school
    - slovakia
    - central-europe
about:
  title: EduPage
  description: Access your EduPage school portal - timetable, grades, homework, meals and more.
  icon: https://avatars.githubusercontent.com/u/6117436?s=200&v=4
source:
  project: https://github.com/oliverhruby/edupage-mcp
  commit: 914f42dce6e00141878c0ed6c45cb7dce39425c4
config:
  description: Set your EduPage account login and the school subdomain to connect to (e.g. myschool for myschool.edupage.org); list several subdomains comma-separated for multiple schools.
  secrets:
    - name: edupage-mcp.username
      env: EDUPAGE_USERNAME
      example: your-edupage-username
    - name: edupage-mcp.password
      env: EDUPAGE_PASSWORD
      example: your-edupage-password
    - name: edupage-mcp.subdomains
      env: EDUPAGE_SUBDOMAINS
      example: myschool
