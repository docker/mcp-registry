name: appgoat
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - app-store
    - google-play
    - aso
    - marketing
    - remote
about:
  title: AppGoat
  description: App Store and Google Play data for AI agents. Look up apps, reviews and review insights, keyword research and rank tracking, top charts, competitors and developers across ~5M apps.
  icon: https://appgoat.ai/favicon.svg
remote:
  transport_type: streamable-http
  url: https://api.appgoat.ai/mcp
  headers:
    x-api-key: "${APPGOAT_API_KEY}"
config:
  secrets:
    - name: appgoat.api_key
      env: APPGOAT_API_KEY
      example: <YOUR_API_KEY>
