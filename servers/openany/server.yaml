name: openany
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - models
    - apis
    - remote
about:
  title: OpenAny
  description: The B2A (business to agent) marketplace. One MCP endpoint for 3,200+ APIs and 168+ AI models. Browse free; pay per call.
  icon: https://openany.si/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.openany.si
  headers:
    Authorization: "Bearer ${OPENANY_API_KEY}"
config:
  secrets:
    - name: openany.api_key
      env: OPENANY_API_KEY
      example: <YOUR_API_KEY>
