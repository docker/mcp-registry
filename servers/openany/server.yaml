name: openany
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - models
    - apis
    - remote
about:
  title: OpenAny
  description: One API key for 168+ models and 3,200+ APIs via a remote MCP server, pay per call, no monthly fee
  icon: https://openany.si/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.openany.si/mcp-lite
  headers:
    Authorization: "Bearer ${OPENANY_API_KEY}"
config:
  secrets:
    - name: openany.api_key
      env: OPENANY_API_KEY
      example: <YOUR_API_KEY>
