name: datosia
type: remote
meta:
  category: data
  tags:
    - data
    - open-data
    - government
    - central-america
    - remote
about:
  title: DatosIA
  description: Official public data for Central America and the Dominican Republic, down to the municipality — census, prices, procurement, trade, labour, crime, laws and news, with sources.
  icon: https://datosia.net/icon-datosia-512.png
remote:
  transport_type: streamable-http
  url: https://datosia.net/mcp
  headers:
    x-api-key: "${DATOSIA_API_KEY}"
config:
  secrets:
    - name: datosia.api_key
      env: DATOSIA_API_KEY
      example: <YOUR_API_KEY>
