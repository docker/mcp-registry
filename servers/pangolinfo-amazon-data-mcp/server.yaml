name: pangolinfo-amazon-data-mcp
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - data
    - amazon
    - remote
about:
  title: Pangolinfo Amazon Data
  description: |-
    Real-time Amazon data for AI agents: product details, keyword search, reviews, best sellers, new releases, offers and more across 13 marketplaces. 19 tools, free 60 credits a month, no credit card.
  icon: https://www.google.com/s2/favicons?domain=pangolinfo.com&sz=128
remote:
  transport_type: streamable-http
  url: https://mcp.pangolinfo.com/mcp
  headers:
    Authorization: "Bearer ${PANGOLINFO_API_KEY}"
config:
  description: Configure your Pangolinfo API access
  secrets:
    - name: pangolinfo-amazon-data-mcp.api_key
      env: PANGOLINFO_API_KEY
      example: <PANGOLINFO_API_KEY>
