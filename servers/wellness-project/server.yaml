name: wellness-project
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - health
    - fitness
    - wellness
    - quantified-self
    - wearables
    - remote
about:
  title: Wellness Project
  description: Hosted MCP server for your own health data (Apple Health, Fitbit, Oura, Health Connect). 63 tools to log, query and chart workouts, meals, sleep, runs and more. Free during early access.
  icon: https://wellnessproject.ai/images/brand/mark-dark.png
remote:
  transport_type: streamable-http
  url: https://wellnessproject.ai/api/mcp
oauth:
  - provider: wellness-project
    secret: wellness-project.personal_access_token
    env: WELLNESS_PROJECT_PERSONAL_ACCESS_TOKEN
