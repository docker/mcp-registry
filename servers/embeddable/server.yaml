name: embeddable
type: remote
dynamic:
  tools: true
meta:
  category: web
  tags:
    - website
    - widgets
    - landing-pages
    - no-code
    - remote
about:
  title: Embeddable
  description: Build website widgets and landing pages with an AI builder. Create or edit forms, calculators, quizzes, pricing tables, popups and more from a description, preview the draft, publish it and get the embed code.
  icon: https://www.google.com/s2/favicons?domain=embeddable.co&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.embeddable.co/mcp
oauth:
  - provider: embeddable
    secret: embeddable.personal_access_token
    env: EMBEDDABLE_PERSONAL_ACCESS_TOKEN
