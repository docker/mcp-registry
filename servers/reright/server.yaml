name: reright
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - writing
    - communication
    - remote
about:
  title: Reright
  description: Rewrites the emails, messages, commits and PR text your agent writes so they sound like you but with every fact kept.
  icon: https://www.google.com/s2/favicons?domain=reright.it&sz=64
remote:
  transport_type: streamable-http
  url: https://app.reright.it/mcp
oauth:
  - provider: reright
    secret: reright.personal_access_token
    env: RERIGHT_PERSONAL_ACCESS_TOKEN
