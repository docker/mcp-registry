name: forthroute-returns
type: remote
dynamic:
  tools: true
meta:
  category: ecommerce
  tags:
    - ecommerce
    - shopify
    - returns
    - remote
about:
  title: ForthRoute Returns
  description: Search, review, approve and decline Shopify returns from your AI agent. ForthRoute is a returns and return-label app for Shopify merchants, with UK and EU carriers via Shippo.
  icon: https://forthroute.io/static/images/favicons/forthroute-favicon-180.png
remote:
  transport_type: streamable-http
  url: https://app.forthroute.io/mcp
oauth:
  - provider: forthroute-returns
    secret: forthroute-returns.personal_access_token
    env: FORTHROUTE_RETURNS_PERSONAL_ACCESS_TOKEN
