name: syfert-legal-research
type: remote
dynamic:
  tools: true
meta:
  category: legal
  tags:
    - legal
    - research
    - case-law
    - citations
    - remote
about:
  title: Syfert Legal Research
  description: |-
    The verification layer for legal AI output. Check every citation, confirm whether a case is still good law, trace a quoted passage back to its true source, and audit a whole brief in one pass.

    Backed by 10.7M U.S. court opinions (all 50 states plus federal), Syfertize treatment flags that name the case that overruled or questioned yours, and statutes and court rules for all 50 states plus DC, USC, CFR and the federal rules.

    13 read-only tools. Free tokens at https://syfert.com/mcp/.
  icon: https://syfert.com/mcp/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.syfert.com/mcp
  headers:
    Authorization: "Bearer ${SYFERT_API_TOKEN}"
config:
  description: Configure your free Syfert API token
  secrets:
    - name: syfert.api_token
      env: SYFERT_API_TOKEN
      example: <YOUR_API_TOKEN>
