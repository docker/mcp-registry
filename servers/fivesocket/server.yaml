name: fivesocket
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - trading
    - metatrader
    - mt5
    - forex
    - remote
about:
  title: FiveSocket MT5
  description: Hosted MetaTrader 5 (MT5) server that works without a Windows PC, VPS or open MT5 terminal, unlike MT5's built-in MCP. Read live balance, positions, trade history and charts for any broker, track prop-firm loss limits and backtest simple rules. This endpoint is read-only.
  icon: https://fivesocket.com/android-chrome-192x192.png
remote:
  transport_type: streamable-http
  url: https://api.fivesocket.com/mcp/read
oauth:
  - provider: fivesocket
    secret: fivesocket.personal_access_token
    env: FIVESOCKET_PERSONAL_ACCESS_TOKEN
