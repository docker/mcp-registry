name: appforshare-remote
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - mobile
    - ios
    - android
    - app-distribution
    - beta-testing
    - remote
about:
  title: AppForShare
  description: Share iOS and Android test builds with install links, testers, channels and store readiness checks.
  icon: https://www.google.com/s2/favicons?domain=appforshare.io&sz=64
remote:
  transport_type: streamable-http
  url: https://appforshare.io/api/mcp
oauth:
  - provider: appforshare-remote
    secret: appforshare-remote.personal_access_token
    env: APPFORSHARE_REMOTE_PERSONAL_ACCESS_TOKEN
