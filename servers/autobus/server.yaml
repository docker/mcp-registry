about:
  title: autobus — signed attestations for agents
  description: Independent, keyless witness tools for AI agents, $0.01 per call via x402 (USDC on Base). Pin an MCP server's tool surface and detect drift; witness what a URL served and whether it changed; read a page as text bound to signed evidence; verify a Base transaction's finality; check whether a named AI agent may fetch or train on a URL; witness a JWKS or web bot auth key directory and its rotation. Every answer is an Ed25519-signed attestation verifiable against a public key. No account; tools/list is free and carries each tool's price.
  icon: https://witness.holoweave.org/favicon.svg
remote:
  transport_type: streamable-http
  url: https://witness.holoweave.org/mcp
