name: letkite
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - remote-access
    - terminal
    - files
    - remote
about:
  title: LetKite
  description: "Reach your machines from any AI client: files, terminal and scheduled jobs, behind approvals and an audit log"
  icon: https://letkite.com/assets/img/logo-256.png
remote:
  transport_type: streamable-http
  url: https://mcp.letkite.com/mcp
oauth:
  - provider: letkite
    secret: letkite.personal_access_token
    env: LETKITE_PERSONAL_ACCESS_TOKEN
