name: orbit-sentinel
type: remote
meta:
  category: search
  tags:
    - search
    - regulatory-data
    - satellite
    - space
    - fcc
    - remote
about:
  title: Orbit Sentinel
  description: Search 950K+ space regulatory filings from the FCC, ITU, UNOOSA, and FAA-AST. Semantic search, entity dossiers, spectrum-band holdings, launch licenses, and filing trends.
  icon: https://avatars.githubusercontent.com/u/301902482?v=4
remote:
  transport_type: streamable-http
  url: https://orbit-sentinel.viventine.com/mcp
  headers:
    Authorization: "Bearer ${ORBIT_SENTINEL_API_KEY}"
config:
  description: Provide your Orbit Sentinel API key. Beta access at https://console.viventine.com.
  secrets:
    - name: orbit-sentinel.api_key
      env: ORBIT_SENTINEL_API_KEY
      example: <YOUR_API_KEY>
