name: dm-by-auzzura
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - collaboration
    - context
    - remote
    - oauth
about:
  title: DM by AuzzurA
  description: DM is shared context for human + AI teams. Before a task, a connected agent asks DM for the approved Rules, Skills and Decisions that apply. After the task, the agent submits what it learned as a proposal, and a person decides what becomes shared.
  icon: https://auzzura.com/logo.png
remote:
  transport_type: streamable-http
  url: https://api.dm.auzzura.com/mcp
oauth:
  - provider: dm-by-auzzura
    secret: dm-by-auzzura.personal_access_token
    env: DM_BY_AUZZURA_PERSONAL_ACCESS_TOKEN
