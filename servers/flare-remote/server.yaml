name: flare-remote
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - error-tracking
    - logging
    - laravel
    - php
    - remote
about:
  title: Flare
  description: Error tracking, performance monitoring and logs for Laravel and PHP applications
  icon: https://www.google.com/s2/favicons?domain=flareapp.io&sz=64
remote:
  transport_type: streamable-http
  url: https://flareapp.io/mcp
oauth:
  - provider: flare-remote
    secret: flare-remote.personal_access_token
    env: FLARE_REMOTE_PERSONAL_ACCESS_TOKEN
