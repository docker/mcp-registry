name: freero
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - whiteboard
    - kanban
    - diagrams
    - remote
about:
  title: Freero
  description: Collaborative whiteboard your assistant can read and add to (notes, clusters, kanban cards, diagrams), or propose changes people accept
  icon: https://freero.app/icons/icon-512.png
remote:
  transport_type: streamable-http
  url: https://freero.app/mcp
oauth:
  - provider: freero
    secret: freero.personal_access_token
    env: FREERO_PERSONAL_ACCESS_TOKEN
