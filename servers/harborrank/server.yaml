name: harborrank
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - seo
    - keyword-research
    - serp
    - backlinks
    - rank-tracking
    - site-audit
    - google-search-console
    - google-analytics
    - remote
about:
  title: HarborRank
  description: >-
    SEO research for AI agents: keyword metrics, live Google SERPs, competitor
    ranking keywords, backlinks, rank-tracker reads, crawl-based site audits,
    read-only Google Search Console performance and URL inspection, and
    read-only Google Analytics 4: conversions per landing page, AI-assistant
    referral traffic and channel reports.
  icon: https://harborrank.com/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://app.harborrank.com/mcp
oauth:
  - provider: harborrank
    secret: harborrank.personal_access_token
    env: HARBORRANK_PERSONAL_ACCESS_TOKEN
