about:
  title: HarborRank
  description: >-
    SEO research for AI agents: keyword metrics, live Google SERPs with People
    Also Ask and AI Overviews, Google Maps results and local rank grids,
    competitor ranking keywords, backlinks, rank tracking with competitor
    positions, crawl-based site audits with audit comparison, real-user Core
    Web Vitals, AI answer visibility for a brand, and read-only Google Search
    Console and Google Analytics 4.
  icon: https://harborrank.com/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://app.harborrank.com/mcp
oauth:
  - provider: harborrank
    secret: harborrank.personal_access_token
    env: HARBORRANK_PERSONAL_ACCESS_TOKEN
