name: quotes
image: mcp/quotes
type: server
meta:
  category: finance
  tags:
    - finance
    - quotes
    - estimates
    - invoicing
    - vat
    - freelance
about:
  title: Quotes
  description: "Turns a priced line-item list into a numbered quote: VAT per line or the business default, a validity date computed in the shared profile's own timezone, a plain-text version ready to paste into an email and, on Pro, an A4 PDF in the same layout as the invoice. Prices go in as integer minor units, so a price can never be entered ten times too small by a missed decimal. When the client accepts, quote_accept turns the quote into a real invoice in the mcp-invoice server's own store, under the same client list and number series, with the stored line totals copied across rather than recomputed, so a VAT rate change between quote and acceptance never moves the price the client agreed to. Everything is a plain JSON file inside the container volume; nothing is uploaded anywhere."
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/e89ac6fd0c74e62c573d5214bbebfc6f680c42e2/assets/invoice-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: e89ac6fd0c74e62c573d5214bbebfc6f680c42e2
  dockerfile: servers/quotes/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: quotes.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
