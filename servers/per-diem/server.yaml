about:
  title: Per Diem
  description: "Works out the statutory daily travel allowance for a business trip on the rate tables the tax authorities actually publish, and keeps the trips you priced, entirely on your machine. You give it where you went, when you left and when you got back, and which meals somebody else paid for; it gives back the amount per day and the total in the scheme's own currency, with the partial-day fraction and every meal deduction shown next to the number that produced it. Three schemes ship with it: the Polish delegation regulation (the domestic diet, the lodging lump sum and 34 countries of the annex), the HMRC benchmark scale rates for travel inside the UK, and the US GSA CONUS standard M&IE and lodging cap. The tables are bundled files rather than a live feed, so the same trip priced twice gives the same answer, and every rate carries the authority, the instrument, the source URL and the date it took effect. Start and end are instants, not wall clocks, so a trip across a clock change is 23 or 25 hours rather than 24, and each scheme's own day model is named in the answer: Poland and the UK count 24-hour periods from departure, the US counts calendar days in the destination zone at 75 percent of M&IE on the first and last. A value that could not be stated with confidence from the public regulation text was left out rather than guessed, and a destination that is not in a table is refused by name instead of priced from a neighbouring row. Currencies are never added together, because there is no exchange rate in this server to be silently wrong. Trips can be saved, listed, totalled per scheme and per month, and exported as ready-made expense_add arguments for the sibling expense-tracker server. No account, no API key, no network call: everything lives under the local data directory and licence keys are verified offline."
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/c03d4f031308ec063f00e7088051722d0b58e94f/assets/per-diem-logo.png
