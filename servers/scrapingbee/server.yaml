name: scrapingbee
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - data-extraction
    - search
    - remote
about:
  title: ScrapingBee
  description: |-
    Fetch any web page as clean text, markdown, HTML or a screenshot — including JavaScript-rendered pages and sites behind CAPTCHAs or anti-bot blocking — and pull structured data out of it with plain-English extraction rules. Dedicated tools return JSON for Google search, Amazon and Walmart products and search, YouTube search, metadata and subtitles, and ChatGPT and Gemini prompts.

    Requires a ScrapingBee API key (free trial credits on sign-up).
  icon: https://www.scrapingbee.com/images/favico.png
remote:
  transport_type: streamable-http
  url: https://mcp.scrapingbee.com/mcp
  headers:
    Authorization: "Bearer ${SCRAPINGBEE_API_KEY}"
config:
  description: Configure your ScrapingBee API access
  secrets:
    - name: scrapingbee.api_key
      env: SCRAPINGBEE_API_KEY
      example: <YOUR_API_KEY>
