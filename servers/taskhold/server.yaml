name: taskhold
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - project-management
    - task-management
    - remote
about:
  title: Taskhold
  description: For developers who hand work to Claude Code, Cursor or Codex, Taskhold is a hosted task list that you and your agents share. Agents plan each task in steps, report live progress and block with a question when they need you.
  icon: https://taskhold.com/icons/icon-512.png
remote:
  transport_type: streamable-http
  url: https://taskhold.com/api/mcp
oauth:
  - provider: taskhold
    secret: taskhold.personal_access_token
    env: TASKHOLD_PERSONAL_ACCESS_TOKEN
