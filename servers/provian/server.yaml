name: provian
type: remote
meta:
  category: payments
  tags:
    - agent-wallet
    - provenance
    - base
    - x402
    - remote
about:
  title: Provian
  description: Self-custodial agent wallet on Base and a verifiable record of the agent's work (Provenance Envelopes).
  icon: https://provian.ai/logos/provian-256.png
remote:
  transport_type: streamable-http
  url: https://api.provian.ai/mcp
  headers:
    X-API-Key: "${PROVIAN_API_CREDENTIAL}"
config:
  description: Optional. Your agent's Provian API credential (api_key:api_secret), returned once by wallet_create. Public reads and wallet creation need none.
  secrets:
    - name: provian.api_credential
      env: PROVIAN_API_CREDENTIAL
      example: pvn_live_<key>:pvns_<secret>
      required: false
