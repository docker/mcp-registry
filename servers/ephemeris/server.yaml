name: ephemeris
type: remote
meta:
  category: analytics
  tags:
    - forecasting
    - time-series
    - analytics
    - prediction
    - remote
about:
  title: Ephemeris
  description: Probabilistic time-series forecasts (demand, traffic, load, prices, metrics) from Chronos-2, TimesFM 2.5, Toto 2, TiRex-2 and IBM Granite models, singly or as an accuracy-weighted ensemble
  icon: https://raw.githubusercontent.com/TensorLink-AI/ephemeris-mcp/main/assets/logo-256.png
remote:
  transport_type: streamable-http
  url: https://ephemeris.cascade.industries/api/mcp
  headers:
    Authorization: "Bearer ${EPHEMERIS_API_KEY}"
config:
  secrets:
    - name: ephemeris.api_key
      env: EPHEMERIS_API_KEY
      example: pc_live_<YOUR_API_KEY>
