name: benchfleet
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - android
    - mobile
    - testing
    - cloud-phones
    - remote
about:
  title: BenchFleet Cloud Phones
  description: Start an Android phone in the cloud and let your AI assistant see, tap and type on it.
  icon: https://benchfleet.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://benchfleet.com/api/mcp
oauth:
  - provider: benchfleet
    secret: benchfleet.personal_access_token
    env: BENCHFLEET_PERSONAL_ACCESS_TOKEN
