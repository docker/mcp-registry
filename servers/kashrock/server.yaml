about:
  title: KashRock
  description: Esports data for agents — DFS/sportsbook player props, live scores, and player stats across CS2, Valorant, League of Legends, Dota 2, Call of Duty, Rainbow Six, Mobile Legends, and Apex Legends. Get a free Sandbox API key at kashrock.com/pricing.
  icon: https://www.kashrock.com/icon.png
source:
  project: https://github.com/kashrockapi/kashrock-mcp
  branch: main
  commit: 084f271f9526825169e499be68fd6df9294972d8
config:
  description: Set your KashRock API key. The server also ships a `login` tool for interactive Google sign-in, but that opens a browser — set the key directly for a containerized deployment.
  secrets:
    - name: kashrock.api_key
      env: KASHROCK_API_KEY
      example: kr_xxxxxxxxxxxxxxxxxxxx
