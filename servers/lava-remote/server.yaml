name: lava-remote
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - stocks
    - a-share
    - news-flow
    - remote
about:
  title: Lava
  description: Remote MCP/REST for read-only A-share stock and concept-board news-flow heat monitoring for quant tools and AI Agents.
  icon: https://www.google.com/s2/favicons?domain=lava.ai-dolphin.com&sz=64
remote:
  transport_type: streamable-http
  url: https://lava.ai-dolphin.com/subscribe/v1/mcp
  headers:
    Authorization: "Bearer ${LAVA_REMOTE_API_KEY}"
config:
  secrets:
    - name: lava-remote.api_key
      env: LAVA_REMOTE_API_KEY
      example: <YOUR_API_KEY>
