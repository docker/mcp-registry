name: nova-slidegen-agent
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - slides
    - image-generation
    - remote
about:
  title: "Slidegen Agent by Nova (CIVAI)"
  description: "I do everything related to image and slide asset generation"
  icon: https://nova.civai.co/catalog-icons/SlidesIcon.svg
remote:
  transport_type: streamable-http
  url: https://nova.civai.co/mcp/agents/slidegen-agent
  headers:
    Authorization: "Bearer ${NOVA_SLIDEGEN_AGENT_API_KEY}"
config:
  description: Create a programmatic Nova API key at https://nova.civai.co/api-keys
  secrets:
    - name: nova-slidegen-agent.api_key
      env: NOVA_SLIDEGEN_AGENT_API_KEY
      example: <YOUR_NOVA_API_KEY>
