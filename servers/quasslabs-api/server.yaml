name: quasslabs-api
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - code-quality
    - linting
    - security
    - remote
about:
  title: QuassLabs API
  description: Deterministic checks for coding agents. Lint regexes, MCP tool definitions, commit messages, PR descriptions, tickets and user stories; diff OpenAPI specs; check dependencies and supply-chain risk; grade readability; analyze logs. Every response is structured JSON. Pay-per-call credits with a monthly free allowance, and failed calls are never billed.
  icon: https://quasslabs.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.quasslabs.com/mcp
  headers:
    Authorization: "Bearer ${QUASSLABS_API_KEY}"
config:
  description: Configure your QuassLabs API key
  secrets:
    - name: quasslabs-api.api_key
      env: QUASSLABS_API_KEY
      example: <YOUR_QLK_API_KEY>
