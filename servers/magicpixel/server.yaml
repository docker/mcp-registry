name: magicpixel
type: remote
dynamic:
  tools: true
meta:
  category: games
  tags:
    - design
    - game-development
    - pixel-art
    - image-generation
    - remote
about:
  title: MagicPixel
  description: Create and edit game-ready pixel art sprites from your agent
  icon: https://www.google.com/s2/favicons?domain=magicpixel.art&sz=64
remote:
  transport_type: streamable-http
  url: https://magicpixel.art/mcp
oauth:
  - provider: magicpixel
    secret: magicpixel.personal_access_token
    env: MAGICPIXEL_PERSONAL_ACCESS_TOKEN
