name: clipbeat
type: remote
meta:
  category: media
  tags:
    - media
    - video
    - music
    - remote
about:
  title: Clipbeat
  description: Turn a song into a music video. Start a $5 preview or a full video, then check status, pricing and credit balance.
  icon: https://www.google.com/s2/favicons?domain=clipbeat.app&sz=64
remote:
  transport_type: streamable-http
  url: https://api.clipbeat.app/mcp
  headers:
    Authorization: "Bearer ${CLIPBEAT_API_KEY}"
config:
  secrets:
    - name: clipbeat.api_key
      env: CLIPBEAT_API_KEY
      example: <YOUR_API_KEY>
