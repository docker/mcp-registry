name: cardboard
type: remote
dynamic:
  tools: true
meta:
  category: video
  tags:
    - video
    - video-editing
    - remote
about:
  title: Cardboard
  description: "Edit videos in chat: cut, caption, add titles, music and voiceover, then preview and export."
  icon: https://www.cardboard.ai/images/favicon-circle.png
remote:
  transport_type: streamable-http
  url: https://mcp.cardboard.ai/mcp
oauth:
  - provider: cardboard
    secret: cardboard.personal_access_token
    env: CARDBOARD_PERSONAL_ACCESS_TOKEN
