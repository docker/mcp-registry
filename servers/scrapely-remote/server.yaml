name: scrapely-remote
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - scraping
    - crawling
    - data-extraction
    - remote
about:
  title: Scrape.ly
  description: Search 500+ ready-made web scrapers, run them in the cloud and read structured results from datasets and logs.
  icon: https://scrape.ly/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.scrape.ly
oauth:
  - provider: scrapely-remote
    secret: scrapely-remote.personal_access_token
    env: SCRAPELY_REMOTE_PERSONAL_ACCESS_TOKEN
