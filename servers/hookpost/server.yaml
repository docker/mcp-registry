name: hookpost
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - social-media
    - scheduling
    - marketing
    - remote
about:
  title: Hookpost
  description: Draft and schedule social media posts on the channels connected in your Hookpost workspace, after checking each network's rules.
  icon: https://www.google.com/s2/favicons?domain=hookpost.hookstep.in&sz=64
remote:
  transport_type: streamable-http
  url: https://hookpost.hookstep.in/api/mcp
  headers:
    Authorization: "Bearer ${HOOKPOST_API_KEY}"
config:
  secrets:
    - name: hookpost.api_key
      env: HOOKPOST_API_KEY
      example: <YOUR_API_KEY>
