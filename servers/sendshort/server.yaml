name: sendshort
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - social-media
    - remote
about:
  title: SendShort
  description: Turn long videos into captioned shorts and music videos, then schedule posts to TikTok and YouTube
  icon: https://www.google.com/s2/favicons?domain=sendshort.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://app.sendshort.ai/api/mcp
oauth:
  - provider: sendshort
    secret: sendshort.personal_access_token
    env: SENDSHORT_PERSONAL_ACCESS_TOKEN
