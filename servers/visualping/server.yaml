name: visualping
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - website-monitoring
    - change-detection
    - alerts
    - remote
about:
  title: Visualping
  description: Remote MCP server from Visualping, the website change monitoring service. Agents can create, edit, run, pause and delete monitors, list monitors, read recently detected changes, and read full monitor settings such as AI alerting, notifications, schedule, page actions and crawl config. OAuth sign-in with your Visualping account, and actions follow your Visualping role in each workspace. Public beta.
  icon: https://www.google.com/s2/favicons?domain=visualping.io&sz=64
remote:
  transport_type: streamable-http
  url: https://visualping.io/mcp
oauth:
  - provider: visualping
    secret: visualping.personal_access_token
    env: VISUALPING_PERSONAL_ACCESS_TOKEN
