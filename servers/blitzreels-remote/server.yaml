name: blitzreels-remote
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - video-editing
    - content-creation
    - remote
about:
  title: BlitzReels
  description: AI video tool to clip long videos into captioned shorts, edit timelines, generate images and videos, and export
  icon: https://www.google.com/s2/favicons?domain=blitzreels.com&sz=64
remote:
  transport_type: streamable-http
  url: https://www.blitzreels.com/api/mcp
oauth:
  - provider: blitzreels-remote
    secret: blitzreels-remote.personal_access_token
    env: BLITZREELS_REMOTE_PERSONAL_ACCESS_TOKEN
