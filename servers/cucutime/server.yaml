name: cucutime
type: remote
meta:
  category: media
  tags:
    - music
    - kids
    - education
    - remote
about:
  title: Cucutime
  description: Personalized kids-song tools for agents. Draft a song for a child's first name and a theme, get Cucutime's name page and free-sample link, and search Cucutime's own kids songs and educational videos (es, pt, en), with no key and no AI. With a free developer key, for adult-facing apps only, create a 30-second song that sings the name and check whether a text is appropriate for young children.
  icon: https://cucutime.org/icon-512.png
remote:
  transport_type: streamable-http
  url: https://cucutime.org/mcp
  headers:
    Authorization: "Bearer ${CUCUTIME_API_KEY}"
config:
  description: Optionally provide your free Cucutime developer key (https://cucutime.org/developers) for the AI tools create_personalized_song and moderate_kids_text, which are for adult-facing apps only. The keyless tools generate_song_idea, get_song_for_name and search_catalog work without one.
  secrets:
    - name: cucutime.api_key
      env: CUCUTIME_API_KEY
      example: <YOUR_KEY>
      required: false
