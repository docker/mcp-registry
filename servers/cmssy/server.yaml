name: cmssy
image: mcp/cmssy
type: server
meta:
  category: ecommerce
  tags:
    - cms
    - headless-cms
    - ecommerce
about:
  title: Cmssy
  description: Hosted headless CMS with native commerce. Manage pages, records, media, forms, products, orders, refunds and discounts in a Cmssy workspace; refunds and deletes wait for confirmation.
  icon: https://avatars.githubusercontent.com/u/253926117?v=4
source:
  project: https://github.com/cmssy-io/cmssy-mcp
  commit: a14018dbef5db179efa6ce37062235ea00eb73c6
config:
  description: Connect to a Cmssy workspace with an API token and a workspace ID
  secrets:
    - name: cmssy.api_token
      env: CMSSY_API_TOKEN
      example: <CMSSY_API_TOKEN>
  env:
    - name: CMSSY_WORKSPACE_ID
      example: 507f1f77bcf86cd799439011
      value: "{{cmssy.workspace_id}}"
  parameters:
    type: object
    properties:
      workspace_id:
        type: string
    required:
      - workspace_id
