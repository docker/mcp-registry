name: vid2context
image: mcp/vid2context
type: server
longLived: true
meta:
  category: media
  tags:
    - media
    - youtube
    - transcript
    - speech-to-text
    - video
    - podcast
about:
  title: Vid2context
  description: Turn videos into context for AI agents. Transcripts with timestamps, metadata and chapters from YouTube, X posts, podcasts, Vimeo and the 1,000+ sites yt-dlp supports, plus outlines, transcript search, Q&A and cited briefs. Captions first, then free-first speech-to-text. Works with no API keys; optional keys unlock faster speech-to-text and LLM features.
  icon: https://raw.githubusercontent.com/nirholas/vid2context/main/packages/discovery/assets/logo.png
source:
  project: https://github.com/nirholas/vid2context
  commit: d2da6623cbcaf3dac359aecd98ff0c648b51a63a
config:
  description: All keys are optional. Without them vid2context uses captions and keyless providers.
  secrets:
    - name: vid2context.groq_api_key
      env: GROQ_API_KEY
      example: gsk_your-groq-key
    - name: vid2context.gemini_api_key
      env: GEMINI_API_KEY
      example: your-gemini-key
    - name: vid2context.openai_api_key
      env: OPENAI_API_KEY
      example: sk-your-openai-key
