name: vid2context
image: mcp/vid2context
type: server
meta:
  category: media
  tags:
    - media
    - youtube
    - transcript
    - speech-to-text
    - video
about:
  title: Vid2context
  description: Turn any video into context for AI agents. YouTube and media-file transcripts with timestamps, metadata, chapters, search and cited briefs. Captions first, then free-first speech-to-text. Works with no API keys; optional keys unlock faster speech-to-text and LLM features.
  icon: https://raw.githubusercontent.com/nirholas/vid2context/main/packages/discovery/assets/logo.png
source:
  project: https://github.com/nirholas/vid2context
  commit: 4a581f0140b90c2aa5e5bcebf39399af53f2d096
config:
  description: All keys are optional. Without them vid2context uses captions and keyless providers.
  secrets:
    - name: vid2context.groq_api_key
      env: GROQ_API_KEY
      example: gsk_your-groq-key
    - name: vid2context.gemini_api_key
      env: GEMINI_API_KEY
      example: your-gemini-key
    - name: vid2context.openai_api_key
      env: OPENAI_API_KEY
      example: sk-your-openai-key
