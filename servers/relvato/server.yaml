name: relvato
type: remote
meta:
  category: monitoring
  tags:
    - monitoring
    - website-monitoring
    - uptime
    - wordpress
    - woocommerce
    - remote
about:
  title: Relvato
  description: Website monitoring in a real browser. Set up and run monitors for sign-ups, logins, checkout, page speed, search visibility and security; read health, uptime, Core Web Vitals and each run's findings; and on WordPress apply the fix a run proposes, with automatic undo
  icon: https://www.relvato.com/logo-512.png
remote:
  transport_type: streamable-http
  url: https://app.relvato.com/api/mcp
  headers:
    Authorization: "Bearer ${RELVATO_API_KEY}"
config:
  secrets:
    - name: relvato.api_key
      env: RELVATO_API_KEY
      example: rlv_<YOUR_API_KEY>
