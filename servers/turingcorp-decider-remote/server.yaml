name: turingcorp-decider-remote
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - decision
    - judgment
    - reasoning
    - remote
about:
  title: TuringCorp Decider
  description: A decision model for calls that do not have a right answer. Send a neutral task and two defensible options; it returns the better one, a calibrated confidence, and the reason.
  icon: https://raw.githubusercontent.com/TuringCorp-net/MCP/main/assets/decider-400x400.png
remote:
  transport_type: streamable-http
  url: https://mcp.turingcorp.net/mcp
  headers:
    Authorization: "Bearer ${TURINGCORP_AGENT_PASS}"
config:
  secrets:
    - name: turingcorp-decider-remote.agent_pass
      env: TURINGCORP_AGENT_PASS
      example: <YOUR_AGENT_PASS>
