name: releasepad
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - changelog
    - release-notes
    - remote
about:
  title: ReleasePad
  description: Draft, edit, schedule and publish release notes and changelogs from your AI assistant, manage categories and images, and read view analytics
  icon: https://www.releasepad.io/assets/images/logo.png
remote:
  transport_type: streamable-http
  url: https://pro.releasepad.io/mcp
oauth:
  - provider: releasepad
    secret: releasepad.personal_access_token
    env: RELEASEPAD_PERSONAL_ACCESS_TOKEN
