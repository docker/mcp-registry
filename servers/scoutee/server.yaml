name: scoutee
type: remote
meta:
  category: search
  tags:
    - public-procurement
    - tenders
    - rfp
    - search
    - government
    - sales
    - remote
about:
  title: Scoutee
  description: Search 200,000+ public tenders (RFPs, government contracts) collected daily from 87 official sources in 32 countries across Europe and North America.
  icon: https://www.google.com/s2/favicons?domain=scoutee.org&sz=64
remote:
  transport_type: streamable-http
  url: https://scoutee.org/api/mcp
  headers:
    X-API-Key: "${SCOUTEE_API_KEY}"
config:
  secrets:
    - name: scoutee.api_key
      env: SCOUTEE_API_KEY
      example: sct_YOUR_API_KEY
