name: xainvault
type: remote
meta:
  category: security
  tags:
    - security
    - ai-governance
    - skills
    - remote
about:
  title: Xainvault
  description: Govern AI skills before they reach your agents. Xainvault scans each skill package (secrets, prompt injection, unsafe execution), applies company policy and human approval, and serves only approved, versioned releases over MCP.
  icon: https://xainvault.com/icon.svg
remote:
  transport_type: streamable-http
  url: https://xainvault.com/mcp
  headers:
    X-API-Key: "${XAINVAULT_API_KEY}"
config:
  description: Create an access key in your Xainvault vault and paste the full xv_key_ value.
  secrets:
    - name: xainvault.api_key
      env: XAINVAULT_API_KEY
      example: xv_key_...
