about:
  title: Cash Book
  description: "Derives one double-entry ledger, entirely on your machine, out of six books other servers own: the invoice ledger, the credit notes and purchase orders, the deposits, the expense ledger, the bank import and the fixed asset register. For a period in one currency it posts a debit and a credit for every movement in them. Revenue and VAT output come off the invoices, receivables and the payments that clear them, deposits held as the liability they actually are, expenses by category with the VAT taken out of the gross rather than added on top of it, fixed assets as they enter service, and depreciation charged by month. The bank import posts nothing at all, and that is the decision the whole ledger rests on. A bank line and a payment record are not two transactions, they are one transaction seen twice, so cash is posted from the documents, which are the only rows that carry a second leg, and each bank row is then matched to a posted cash movement of the same amount, the same direction and a date within three days, written onto the line as evidence rather than as a posting. That is not a small distinction: on one worked month, four of five bank rows are money a document already posted, 1,375,300 of 1,380,300 minor units of cash movement, and posting the import as well moves the cash balance from -10,543.00 to -21,111.00 while the trial balance still comes to zero, because every duplicated receipt arrives with its own contra. What fails to match is the output that matters, because a bank debit with no expense behind it is a payment nobody entered. Nothing is ever balanced with a plug: an entry whose own legs do not add up is posted exactly as its source document states it and the difference is raised by name, with the entry, the source server and the source document behind every unit of it, because a trial balance can only find a broken document if it is allowed to come out non-zero. A bank row that could match two postings is matched to neither and both candidates are named, since picking the first would be a coin toss written into a ledger. A purchase order is a memo and is never posted, because an order is a commitment rather than a transaction. A deposit applied to an invoice moves the liability and never cash, because the money arrived earlier. Currencies are never added together, since there is no exchange rate here to be silently wrong. The ledger opens at nothing and reports the period's own movement, because an opening figure nobody can walk back to a document is the first invented number in a set of books. A sibling store that is missing is read as absent and a sibling store that failed to parse is never read as empty, which matters because a ledger short one whole store still balances perfectly: both legs of every missing entry are missing. Every line carries the server, the document id and the date it came from, no tool takes a file path, and the bytes and modification times of all six sibling stores are unchanged across every tool. No account, no API key, no network call: everything lives under the local data directory and licence keys are verified offline."
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/d980af53a3b19063d8af2e78226fc1215d6535a0/assets/cash-book-logo.png
