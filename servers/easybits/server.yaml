name: easybits
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - sandbox
    - microvm
    - hosting
    - databases
    - agents
    - remote
about:
  title: EasyBits
  description: >-
    Persistent Linux microVMs for AI agents: root access, real internet, sub-second resume
    from snapshot, and a public URL. The box survives the call instead of being destroyed,
    so it can become a deployed app. Also files on a CDN, SQL databases, web search and
    extraction, documents and video — from one endpoint.
  icon: https://www.easybits.cloud/logo-purple.svg
remote:
  transport_type: streamable-http
  url: https://www.easybits.cloud/api/mcp
  headers:
    Authorization: "Bearer ${EASYBITS_API_KEY}"
config:
  secrets:
    - name: easybits.api_key
      env: EASYBITS_API_KEY
      example: <YOUR_API_KEY>
source:
  project: https://github.com/blissito/easybits
