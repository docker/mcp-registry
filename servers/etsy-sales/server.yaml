about:
  title: Etsy Sales
  description: Etsy shop sales velocity and Etsy search results (listings, prices, ranks, shop stats). Runs the Apify Actors publicrecords/etsy-shop-velocity and publicrecords/etsy-search-scraper through Apify's hosted MCP gateway.
  icon: https://www.google.com/s2/favicons?domain=apify.com&sz=64
source:
  project: https://github.com/GeminiGeorge22/etsy-sales-mcp
  branch: main
  commit: 0d02523e1f094b0ace0c337d2f09ffc29cacc1ed
config:
  description: Tools are listed without credentials. Running a tool starts an Apify Actor run on your own Apify account, so it needs your Apify API token.
  secrets:
    - name: etsy-sales.apify_token
      env: APIFY_TOKEN
      example: <YOUR_APIFY_TOKEN>
