name: cuehq
type: remote
meta:
  category: search
  tags:
    - search
    - social-media
    - marketing
    - reddit
    - remote
about:
  title: CueHQ
  description: Live Reddit, X, YouTube and TikTok threads asking for what you sell, ranked, with reply drafts in your voice. CueHQ never posts.
  icon: https://www.cuehq.social/cuehq-icon-512.png
remote:
  transport_type: streamable-http
  url: https://www.cuehq.social/mcp
  headers:
    Authorization: "Bearer ${CUEHQ_API_KEY}"
config:
  description: A CueHQ API key, made in CueHQ under Settings, Agents. The free plan includes 14 cues.
  secrets:
    - name: cuehq.api_key
      env: CUEHQ_API_KEY
      example: <YOUR_API_KEY>
