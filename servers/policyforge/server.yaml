name: policyforge
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - legal
    - compliance
    - privacy-policy
    - terms-of-service
    - remote
about:
  title: PolicyForge
  description: Generate, audit and maintain legal policies from your codebase. Covers privacy policies (GDPR and CCPA), terms of service, cookie policies, EULAs, DPAs and HIPAA BAAs, with free compliance audits and drift checks
  icon: https://www.google.com/s2/favicons?domain=policyforge.co&sz=64
remote:
  transport_type: streamable-http
  url: https://policyforge.co/api/mcp
oauth:
  - provider: policyforge
    secret: policyforge.api_key
    env: POLICYFORGE_API_KEY
