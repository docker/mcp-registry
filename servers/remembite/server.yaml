name: remembite
type: remote
dynamic:
  tools: true
meta:
  category: health
  tags:
    - health
    - nutrition
    - remote
about:
  title: Remembite
  description: A free food log that your AI assistant writes to. The assistant works out grams, calories and macros, and Remembite saves the meal. If an item's numbers do not add up, nothing is saved and the assistant asks you first. No ads. Hosted remote MCP server with OAuth sign-in, nothing to run locally.
  icon: https://remembite.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://remembite.com/mcp
oauth:
  - provider: remembite
    secret: remembite.personal_access_token
    env: REMEMBITE_PERSONAL_ACCESS_TOKEN
