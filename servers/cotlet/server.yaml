name: cotlet
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - automation
    - remote
about:
  title: Cotlet
  description: Unofficial MCP tools for apps with no public API, such as Skool, Substack, Milanote and Partiful, signed in as you
  icon: https://cotlet.dev/icon-512.png
remote:
  transport_type: streamable-http
  url: https://cotlet.dev/mcp/v1/connect
oauth:
  - provider: cotlet
    secret: cotlet.personal_access_token
    env: COTLET_PERSONAL_ACCESS_TOKEN
