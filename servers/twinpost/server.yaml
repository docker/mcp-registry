name: twinpost
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - social-media
    - crosspost
    - marketing
    - remote
about:
  title: Twinpost
  description: Crosspost from chat. Check your X mirrors, preview and draft posts for each network, and publish or retry only when you confirm
  icon: https://twinpo.st/icon-512.png
remote:
  transport_type: streamable-http
  url: https://twinpo.st/mcp
oauth:
  - provider: twinpost
    secret: twinpost.personal_access_token
    env: TWINPOST_PERSONAL_ACCESS_TOKEN
source:
  project: https://github.com/MelMayssonOwen/twinpost-mcp
