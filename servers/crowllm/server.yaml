name: crowllm
image: mcp/crowllm
type: server
meta:
  category: ai
  tags:
    - crowllm
    - ai
    - gateway
    - llm
about:
  title: CrowLLM
  description: OpenAI-compatible AI gateway. One API key for models from several labs; browses the live catalog with per-token prices and chats through the gateway (with a zero-rated :free shelf).
  icon: https://raw.githubusercontent.com/crowwdev/crowllm-mcp/main/assets/logo-400.png
source:
  project: https://github.com/crowwdev/crowllm-mcp
  branch: main
  commit: b80125cc808bd9e07175befbeab0bd384b3ce43b
config:
  description: Configure the CrowLLM API key (needed for the chat tool; optional for catalog and pricing)
  env:
    - name: CROWLLM_API_KEY
      example: your_crowllm_api_key
    - name: CROWLLM_BASE_URL
      example: https://crowllm.com
      value: "https://crowllm.com"
