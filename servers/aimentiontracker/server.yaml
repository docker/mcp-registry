about:
    title: AIMentionTracker
    description: Measures how often ChatGPT, Claude, Gemini, Perplexity and Google's AI surfaces name and cite a brand when buyers ask for recommendations, and returns the stored answers and cited sources behind every number. Six read-only tools cover per-engine visibility, the answer corpus, cited domains, competitor comparison and findings. Rates carry their denominator and are returned as null below the sample floor rather than as zero, engines are reported separately rather than averaged, and the tool descriptions state both rules so an agent does not have to infer them. Requires an API key from app.aimentiontracker.ai; the key is read-only and cannot change billing, team members or what is tracked.
    icon: https://aimentiontracker.ai/brand/icon-512.png
remote:
    transport_type: streamable-http
    url: https://mcp.aimentiontracker.ai/mcp
