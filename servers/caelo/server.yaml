about:
  title: Caelo
  description: Free, local security scanner for apps built with AI coding tools (Lovable, Bolt, Cursor, v0, Replit). Finds exposed API keys, Supabase service-role keys, secrets leaked to the browser bundle, open Firebase rules, missing Supabase row-level security, and committed .env files. Reads files only, runs nothing, redacts every secret it reports.
