name: themesdev-ui
type: remote
meta:
  category: tools
  tags:
    - ui
    - shadcn
    - tailwind
    - developer-tools
    - remote
about:
  title: themes.dev UI
  description: Search and install shadcn/ui page blocks, components and page templates for React, Astro and plain HTML. Free items need no key.
  icon: https://www.themes.dev/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://www.themes.dev/mcp
  headers:
    Authorization: "Bearer ${THEMESDEV_TOKEN}"
config:
  description: Optionally provide a UI Pro API key to install UI Pro items. The server works without one for the free items.
  secrets:
    - name: themesdev-ui.api_key
      env: THEMESDEV_TOKEN
      example: <YOUR_UI_PRO_API_KEY>
      required: false
