name: makepartsnow
type: remote
meta:
  category: productivity
  tags:
    - manufacturing
    - 3d-printing
    - cnc
    - ecommerce
    - remote
about:
  title: Make Parts Now
  description: Instant quotes and ordering for custom 3D printed and CNC machined parts (SLS nylon, FDM, 6061 aluminum, C360 brass), made in-house and shipped within the US.
  icon: https://makepartsnow.com/brand-icon.png
remote:
  transport_type: streamable-http
  url: https://makepartsnow.com/mcp
  headers:
    Authorization: "Bearer ${MAKEPARTSNOW_API_KEY}"
config:
  description: An agent API key (mpn_agent_...). Create one with POST https://makepartsnow.com/api/agent/v1/accounts; see https://makepartsnow.com/developers
  secrets:
    - name: makepartsnow.api_key
      env: MAKEPARTSNOW_API_KEY
      example: mpn_agent_...
