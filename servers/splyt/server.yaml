name: splyt
type: remote
dynamic:
  tools: true
meta:
  category: health
  tags:
    - health
    - fitness
    - workouts
    - remote
about:
  title: Splyt
  description: Read your Splyt workout history, personal records, exercise progress, training plan, habits and daily health data (read-only)
  icon: https://splyt.fit/favicon.png
remote:
  transport_type: streamable-http
  url: https://splyt.fit/mcp
oauth:
  - provider: splyt
    secret: splyt.personal_access_token
    env: SPLYT_PERSONAL_ACCESS_TOKEN
