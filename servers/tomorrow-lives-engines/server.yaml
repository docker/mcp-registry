name: tomorrow-lives-engines
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - design
    - video
    - audio
    - game-development
    - remote
about:
  title: Tomorrow Lives Engines
  description: "Reproducible, IP-clean assets for agents: seven engines, from print designs to voice and video."
  icon: https://tomorrowlives.com/engines/logo.png
remote:
  transport_type: streamable-http
  url: https://tomorrowlives.com/api/agents/mcp
  headers:
    Authorization: "Bearer ${TOMORROW_LIVES_ENGINES_API_KEY}"
config:
  description: "An engine API key (tleng_...). A key comes from POST https://tomorrowlives.com/api/agents/signup."
  secrets:
    - name: tomorrow-lives-engines.api_key
      env: TOMORROW_LIVES_ENGINES_API_KEY
      example: <YOUR_API_KEY>
