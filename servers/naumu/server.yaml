name: naumu
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - knowledge-management
    - collaboration
    - remote
about:
  title: Naumu
  description: Share one knowledge graph between your team and its AI agents - search spaces, ask grounded questions, post in threads, write notes, and delegate work to the built-in agent
  icon: https://cdn.naumu.ai/brand/icon-256.png
remote:
  transport_type: streamable-http
  url: https://naumu.ai/api/mcp
oauth:
  - provider: naumu
    secret: naumu.personal_access_token
    env: NAUMU_PERSONAL_ACCESS_TOKEN
