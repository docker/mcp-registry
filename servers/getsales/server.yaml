name: getsales
type: remote
meta:
  category: crm
  tags:
    - sales
    - outreach
    - sales-engagement
    - enrichment
    - remote
about:
  title: "GetSales: Outreach MCP Server"
  description: "Drive a GetSales workspace from an AI agent: tables of people and companies, enrichment, workflows, the inbox, tasks and signals. The tools the server marks dangerous preview before they run."
  icon: https://www.google.com/s2/favicons?domain=getsales.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp2.getsales.io/mcp/public
  headers:
    Authorization: "Bearer ${GETSALES_API_KEY}"
config:
  secrets:
    - name: getsales.api_key
      env: GETSALES_API_KEY
      example: <YOUR_API_KEY>
