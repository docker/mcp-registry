name: coldrig
type: remote
meta:
  category: communication
  tags:
    - communication
    - email
    - marketing
    - outreach
    - remote
about:
  title: Coldrig
  description: Cold-email infrastructure that an AI agent operates end to end — buy domains, provision mailboxes, run warmup, launch sequences, and handle replies with deliverability monitoring.
  icon: https://www.google.com/s2/favicons?domain=coldrig.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://agent-cold-email-api.yaakovscher.workers.dev/mcp
  headers:
    Authorization: "Bearer ${COLDRIG_API_TOKEN}"
config:
  secrets:
    - name: coldrig.api_token
      env: COLDRIG_API_TOKEN
      example: <YOUR_API_TOKEN>
