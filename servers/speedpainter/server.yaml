name: speedpainter
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - explainer-video
    - whiteboard-animation
    - text-to-video
    - remote
about:
  title: SpeedPainter Explainer Video
  description: Turn text, notes, or documents into narrated hand-drawn whiteboard explainer videos with subtitles
  icon: https://www.speedpainter.org/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://api.speedpainter.org/mcp
oauth:
  - provider: speedpainter
    secret: speedpainter.personal_access_token
    env: SPEEDPAINTER_PERSONAL_ACCESS_TOKEN
