name: knowdrive
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - remote
    - knowledge-base
    - search
about:
  title: KnowDrive
  description: Search your private docs, images, audio and video with cited, provenance-backed results
  icon: https://www.google.com/s2/favicons?domain=knowdrive.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://knowdrive.ai/api/v1/mcp
oauth:
  - provider: knowdrive
    secret: knowdrive.personal_access_token
    env: KNOWDRIVE_PERSONAL_ACCESS_TOKEN
