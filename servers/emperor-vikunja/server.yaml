name: emperor-vikunja
image: mcp/emperor-vikunja
type: server
meta:
  category: productivity
  tags:
    - vikunja
    - tasks
    - todo
    - project-management
    - productivity
about:
  title: Vikunja
  description: List, read, create and update tasks, comment on them and list projects in a Vikunja instance. Task text reaches the model framed as messages for the user; a --read-only mode serves only the read tools.
  icon: https://avatars.githubusercontent.com/u/666125?v=4
source:
  project: https://github.com/yarenty/emperor-vikunja
  commit: 0f8dd423204c883095e1972081275c2b63b76b40
config:
  description: Configure the connection to your Vikunja instance
  secrets:
    - name: emperor-vikunja.token
      env: VIKUNJA_TOKEN
      example: <your Vikunja API token>
      description: Create one in Vikunja under Settings > API Tokens
  env:
    - name: VIKUNJA_URL
      example: https://vikunja.example.com
      value: "{{emperor-vikunja.url}}"
  parameters:
    type: object
    properties:
      url:
        type: string
    required:
      - url
