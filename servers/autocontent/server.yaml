name: autocontent
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - content-generation
    - video
    - podcast
    - remote
about:
  title: AutoContent
  description: Turn documents, URLs and text into videos, podcasts, slide decks, infographics, articles and quizzes
  icon: https://www.google.com/s2/favicons?domain=autocontentapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.autocontentapi.com/v1
oauth:
  - provider: autocontent
    secret: autocontent.personal_access_token
    env: AUTOCONTENT_PERSONAL_ACCESS_TOKEN
