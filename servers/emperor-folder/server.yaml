name: emperor-folder
image: mcp/emperor-folder
type: server
meta:
  category: devops
  tags:
    - filesystem
    - files
    - search
    - sandbox
    - devops
about:
  title: emperor-folder
  description: List, read, search and stat files inside one folder, never outside it. Every operation goes through a capability directory handle, so absolute paths, `..` and symlinks that leave the folder are refused. Read-only.
  icon: https://avatars.githubusercontent.com/u/666125?s=200&v=4
source:
  project: https://github.com/yarenty/emperor-folder
  commit: e9f7e360c30f0c00988ac02825381061a91acfd3
run:
  command:
    - --root
    - /data
  volumes:
    - "{{emperor-folder.path}}:/data"
  disableNetwork: true
config:
  description: The MCP server is confined to this folder (mounted at /data)
  parameters:
    type: object
    properties:
      path:
        type: string
        title: Folder
        description: Host folder the server may read; nothing outside it is reachable.
        default: /Users/local-test
    required:
      - path
