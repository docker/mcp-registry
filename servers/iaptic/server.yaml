name: iaptic
image: mcp/iaptic
type: server
meta:
  category: devops
  tags:
    - iaptic
    - devops
about:
  title: Iaptic
  icon: https://avatars.githubusercontent.com/u/72789805?s=200&v=4
source:
  project: https://github.com/iaptic/mcp-server-iaptic
  commit: 36b027fde8412c9eaa3e4ad9dcdfd1104dbfb9ae
config:
  description: Configure the connection to iaptic
  secrets:
    - name: iaptic.api_key
      env: IAPTIC_API_KEY
      example: your-api-key-here
  env:
    - name: IAPTIC_APP_NAME
      example: your-app-name-here
      value: "{{iaptic.app_name}}"
  parameters:
    type: object
    properties:
      app_name:
        type: string
    required:
      - app_name
