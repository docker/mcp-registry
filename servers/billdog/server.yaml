name: billdog
type: remote
dynamic:
  tools: true
meta:
  category: payments
  tags:
    - payments
    - subscriptions
    - paywalls
    - analytics
    - remote
about:
  title: BillDog
  description: Set up paywalls, subscriptions, entitlements, A/B tests, feature flags and analytics for mobile and web apps from your AI agent.
  icon: https://raw.githubusercontent.com/billdogai/billdog-mcp/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://api.billdog.io/mcp
oauth:
  - provider: billdog
    secret: billdog.personal_access_token
    env: BILLDOG_PERSONAL_ACCESS_TOKEN
