name: socialdatax-hongguo
type: remote
dynamic:
  tools: true
meta:
  category: social-media
  tags:
    - social-media
    - research
    - remote
about:
  title: SocialDataX Hongguo
  description: Hongguo short drama search, series and episodes, reviews, video comments/replies and episode download links. Requires a SocialDataX API Key and sufficient credits for business tool calls.
  icon: https://avatars.githubusercontent.com/DevinChen2014?s=128
remote:
  transport_type: streamable-http
  url: https://mcp.socialdatax.com/hongguo/mcp
  headers:
    Authorization: "Bearer ${SOCIALDATAX_API_KEY}"
config:
  description: Get your SocialDataX API Key at https://socialdatax.com/ai?from=docker
  secrets:
    - name: socialdatax-hongguo.api_key
      env: SOCIALDATAX_API_KEY
      example: <SOCIALDATAX_API_KEY>
      description: Your SocialDataX API Key. Obtain it at https://socialdatax.com/ai?from=docker
      required: true
