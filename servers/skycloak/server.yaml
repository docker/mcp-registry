name: skycloak
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - identity
    - keycloak
    - iam
    - remote
about:
  title: Skycloak
  description: Managed Keycloak from any MCP client. Operate clusters, realms, applications, SSO, users, domains, branding, and audit events.
  icon: https://skycloak.io/wp-content/themes/skycloak/assets/images/logos/skycloak-mark-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.skycloak.io
  headers:
    Authorization: "Bearer ${SKYCLOAK_API_KEY}"
config:
  secrets:
    - name: skycloak.api_key
      env: SKYCLOAK_API_KEY
      example: <YOUR_SKYCLOAK_API_KEY>
