name: great-arrow
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - memory
    - knowledge-management
    - agents
    - remote
about:
  title: GreatArrow.ai
  description: Shared memory and workspace for your AI agents. Search and save project memories, decisions, tasks and meetings across Claude, Codex, Cursor and every other MCP client, so each agent picks up where the last one left off.
  icon: https://www.greatarrow.ai/icon-192.png
remote:
  transport_type: streamable-http
  url: https://www.greatarrow.ai/api/mcp
  headers:
    X-MCP-Client: docker-mcp-toolkit
oauth:
  - provider: great-arrow
    secret: great-arrow.personal_access_token
    env: GREAT_ARROW_PERSONAL_ACCESS_TOKEN
