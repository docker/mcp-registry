name: samgovapi
type: remote
meta:
  category: data-analytics
  tags:
    - government
    - sam-gov
    - contracting
    - remote
about:
  title: SAM.gov Contracting API
  description: "U.S. federal contracting data from samgovapi.io: SAM.gov entity registrations (UEI, CAGE, status and expiry), contract opportunities, exclusions, USAspending awards, NAICS and PSC codes, each linked to its source. Independent; not affiliated with GSA."
  icon: https://samgovapi.io/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://samgovapi.io/api/mcp
  headers:
    Authorization: "Bearer ${SAMGOV_API_KEY}"
config:
  secrets:
    - name: samgovapi.api_key
      env: SAMGOV_API_KEY
      example: <YOUR_API_KEY>
