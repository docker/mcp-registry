name: nocthost
type: remote
meta:
  category: devops
  tags:
    - devops
    - cloud
    - infrastructure
    - vps
    - remote
about:
  title: NoctHost
  description: Deploy and manage hourly-billed cloud servers on Vultr, DigitalOcean, Hetzner and Linode from one account, with price quotes, plan recommendations and spending caps
  icon: https://www.google.com/s2/favicons?domain=nocthost.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.nocthost.com/mcp
  headers:
    Authorization: "Bearer ${NOCTHOST_API_KEY}"
config:
  secrets:
    - name: nocthost.api_key
      env: NOCTHOST_API_KEY
      example: <YOUR_API_KEY>
