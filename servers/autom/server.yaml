name: autom
type: remote
meta:
  category: search
  tags:
    - search
    - serp
    - remote
about:
  title: Autom
  description: "Google, Bing, Brave, Yahoo and DuckDuckGo results as structured JSON: web, news, maps, images, videos, shopping, jobs and autocomplete, with country and language targeting."
  icon: https://avatars.githubusercontent.com/u/147107517?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.autom.dev/
  headers:
    x-api-key: "${AUTOM_API_KEY}"
config:
  description: Configure your Autom API key
  secrets:
    - name: autom.api_key
      env: AUTOM_API_KEY
      example: <YOUR_API_KEY>
