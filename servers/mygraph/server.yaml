name: mygraph
image: mcp/mygraph
type: server
meta:
  category: ai
  tags:
    - memory
    - knowledge-graph
    - ai
    - rust
about:
  title: MyGraph
  description: Knowledge graph memory for agents where every fact cites its evidence. Agents record what they learn from a source as entities and links, then search by name or meaning, explain how things connect, count and group, and trace any claim back to its source. The graphs are kept in a Docker volume.
  icon: https://avatars.githubusercontent.com/u/73609?v=4
source:
  project: https://github.com/dieron/mygraph
  commit: aec460f7618e33927dd3dd3c828d8ea474a0ee9e
run:
  command:
    - mcp
    - --data-dir
    - /data
  volumes:
    - mygraph-data:/data
