name: past-dev
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - memory
    - agents
    - context
    - remote
about:
  title: past.dev
  description: Memory for AI agents. Send timestamped text, ask what is true now, and get the current facts back with their dated sources and what each one replaced.
  icon: https://www.google.com/s2/favicons?domain=past.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://app.past.dev/mcp
oauth:
  - provider: past-dev
    secret: past-dev.personal_access_token
    env: PAST_DEV_PERSONAL_ACCESS_TOKEN
