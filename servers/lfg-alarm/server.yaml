name: lfg-alarm
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - alarms
    - notifications
    - remote
about:
  title: LFG Alarm
  description: Set real alarms that ring on your phone, and on your friends' phones, from your AI. Wake-up times, events, a social media post, a price move, a public trade, or a webhook.
  icon: https://raw.githubusercontent.com/lfg-gm/lfg-alarm-mcp/main/logo-400x400.png
remote:
  transport_type: streamable-http
  url: https://mcp.lfg.gm
oauth:
  - provider: lfg-alarm
    secret: lfg-alarm.personal_access_token
    env: LFG_ALARM_PERSONAL_ACCESS_TOKEN
