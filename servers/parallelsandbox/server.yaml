name: parallelsandbox
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - sandbox
    - testing
    - remote
about:
  title: ParallelSandbox
  description: Remote Linux computers for AI agents. Build, run and test a repository with Docker, browsers and phones, sketch screens and architecture before building, and hand a working version to a person to try.
  icon: https://www.google.com/s2/favicons?domain=parallelsandbox.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.parallelsandbox.com/mcp
oauth:
  - provider: parallelsandbox
    secret: parallelsandbox.personal_access_token
    env: PARALLELSANDBOX_PERSONAL_ACCESS_TOKEN
