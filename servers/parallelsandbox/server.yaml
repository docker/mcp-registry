name: parallelsandbox
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - sandbox
    - testing
    - remote
about:
  title: ParallelSandbox
  description: "ParallelSandbox lines up the test builds your AI is developing in a row: you open one and use it, talk and circle what's wrong, and the AI makes the next version. That's how you iterate fast on your user experience."
  icon: https://www.google.com/s2/favicons?domain=parallelsandbox.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.parallelsandbox.com/mcp
oauth:
  - provider: parallelsandbox
    secret: parallelsandbox.personal_access_token
    env: PARALLELSANDBOX_PERSONAL_ACCESS_TOKEN
