name: sinatra
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - coding-agent
    - github
    - pull-requests
    - remote
about:
  title: Sinatra.dev
  description: Hand coding tasks to a hosted agent that works in its own sandbox on your GitHub repository and opens draft pull requests for your team to review
  icon: https://avatars.githubusercontent.com/u/279358453?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://api.sinatra.dev/v1/mcp
oauth:
  - provider: sinatra
    secret: sinatra.personal_access_token
    env: SINATRA_PERSONAL_ACCESS_TOKEN
