name: nova-research-agent
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - research
    - reports
    - deep-research
    - remote
about:
  title: "Research Agent by Nova (CIVAI)"
  description: "I do everything related to research and reports"
  icon: https://nova.civai.co/catalog-icons/FireIcon.svg
remote:
  transport_type: streamable-http
  url: https://nova.civai.co/mcp/agents/research-agent
  headers:
    Authorization: "Bearer ${NOVA_RESEARCH_AGENT_API_KEY}"
config:
  description: Create a programmatic Nova API key at https://nova.civai.co/api-keys
  secrets:
    - name: nova-research-agent.api_key
      env: NOVA_RESEARCH_AGENT_API_KEY
      example: <YOUR_NOVA_API_KEY>
