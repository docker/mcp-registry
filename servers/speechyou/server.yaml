name: speechyou
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - notes
    - transcription
    - remote
about:
  title: Speechyou
  description: Search and read voice notes, meeting transcripts, summaries and tags with read-only OAuth access.
  icon: https://www.google.com/s2/favicons?domain=speechyou.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.speechyou.com/api/mcp/mcp
oauth:
  - provider: speechyou
    secret: speechyou.personal_access_token
    env: SPEECHYOU_PERSONAL_ACCESS_TOKEN
