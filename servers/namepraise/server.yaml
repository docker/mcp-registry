name: namepraise
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - domains
    - branding
    - domain-evaluation
    - remote
about:
  title: Namepraise
  description: Evaluate domain-name quality with a 0-100 brand score across structure, phonetics, brandability and market fit, plus live RDAP availability and registered-since dates
  icon: https://namepraise.com/icon.svg
remote:
  transport_type: streamable-http
  url: https://namepraise.com/mcp
oauth:
  - provider: namepraise
    secret: namepraise.personal_access_token
    env: NAMEPRAISE_PERSONAL_ACCESS_TOKEN
