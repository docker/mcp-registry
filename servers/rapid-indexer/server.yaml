name: rapid-indexer
type: remote
meta:
  category: search
  tags:
    - seo
    - search
    - indexing
    - remote
about:
  title: Rapid Indexer
  description: Send new URLs and backlinks to Googlebot and check Google index status.
  icon: https://rapid-indexer.com/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.rapid-indexer.com/mcp
  headers:
    Authorization: "Bearer ${RAPID_INDEXER_API_KEY}"
config:
  secrets:
    - name: rapid-indexer.api_key
      env: RAPID_INDEXER_API_KEY
      example: <YOUR_API_KEY>
