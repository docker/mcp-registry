name: thirds-ai
type: remote
meta:
  category: ai
  tags:
    - ai
    - pdf
    - images
    - templates
    - api
    - remote
about:
  title: thirds.ai
  description: Create branded images and PDFs for your campaigns and clients. Automate each new version through our API or your AI tools.
  icon: https://mj.ms/static/listing-pack/logo-mark.png
remote:
  transport_type: streamable-http
  url: https://thirds.ai/mcp
  headers:
    Authorization: "Bearer ${THIRDS_API_KEY}"
config:
  description: Create an API key in thirds.ai, then paste it here.
  secrets:
    - name: thirds-ai.api_key
      env: THIRDS_API_KEY
      example: <YOUR_API_KEY>
