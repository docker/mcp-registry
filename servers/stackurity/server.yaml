name: stackurity
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - vulnerability-management
    - sbom
    - devops
    - remote
about:
  title: Stackurity
  description: >-
    Ask your AI assistant what software runs across your servers, deployed
    applications, repositories and container images, which components have
    known vulnerabilities or are end of life, and which upgrades fix them.
    Sign in to Stackurity Cloud with OAuth.
  icon: https://stackurity.ai/img/favicon-64.png
remote:
  transport_type: streamable-http
  url: https://app.stackurity.dev/mcp
oauth:
  - provider: stackurity
    secret: stackurity.personal_access_token
    env: STACKURITY_PERSONAL_ACCESS_TOKEN
