name: apiiro
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - appsec
    - devsecops
    - remote
about:
  title: Apiiro
  description: Find and fix code security risks, exposed secrets and vulnerable dependencies with your organization's Apiiro context
  icon: https://raw.githubusercontent.com/apiiro/marketplace/main/claude/.claude-plugin/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.apiiro.com/mcp
oauth:
  - provider: apiiro
    secret: apiiro.personal_access_token
    env: APIIRO_PERSONAL_ACCESS_TOKEN
