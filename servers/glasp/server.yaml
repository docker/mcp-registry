name: glasp
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - notes
    - highlights
    - remote
about:
  title: Glasp
  description: Search your Glasp highlights and notes from the web and Kindle, and see passages that other Glasp readers highlighted publicly.
  icon: https://www.google.com/s2/favicons?domain=glasp.co&sz=64
remote:
  transport_type: streamable-http
  url: https://glasp.co/api/mcp
oauth:
  - provider: glasp
    secret: glasp.personal_access_token
    env: GLASP_PERSONAL_ACCESS_TOKEN
