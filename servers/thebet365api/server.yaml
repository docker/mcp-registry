name: thebet365api
type: remote
meta:
  category: data-analytics
  tags:
    - sports
    - odds
    - soccer
    - remote
about:
  title: Bet365 Odds API (Unofficial)
  description: "Unofficial bet365 prices as JSON from thebet365api.com: US moneyline, spread and total for the major leagues, plus European soccer match result, double chance, goal line and goalscorer markets, each with the time it was observed. Not affiliated with bet365."
  icon: https://thebet365api.com/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://thebet365api.com/api/mcp
  headers:
    Authorization: "Bearer ${BET365_API_KEY}"
config:
  secrets:
    - name: thebet365api.api_key
      env: BET365_API_KEY
      example: <YOUR_API_KEY>
