name: arm-mcp
image: armlimited/arm-mcp:3.0.0
type: server
meta:
  category: developer-tools
  tags:
    - arm
    - migration
    - docker
    - architecture
    - development
about:
  title: Arm
  description: Provides AI assistants with specialized tools for Arm architecture development, migration, and optimization. Includes knowledge base search, code migration analysis, container architecture inspection, and assembly performance analysis.
  icon: https://avatars.githubusercontent.com/u/184160443?s=200&v=4
source:
  project: https://github.com/arm/mcp
  commit: 9262ba1f4f2445cb420019f578a48ae58865c116
  dockerfile: mcp-local/Dockerfile
run:
  volumes:
    - "{{arm-mcp.workspace_path}}:/workspace"
config:
  description: Add the local directory you want the Arm MCP server to access at /workspace.
  parameters:
    type: object
    properties:
      workspace_path:
        type: string
        default: /Users/local-test
    required:
      - workspace_path
