name: mnogoreels-remote
type: remote
meta:
  category: video
  tags:
    - video
    - shorts
    - reels
    - clips
    - captions
    - transcription
    - remote
about:
  title: MnogoReels
  description: Turn long videos into captioned vertical shorts, transcripts and articles.
  icon: https://mnogo-reels.ru/logo-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.mnogo-reels.ru/mcp
  headers:
    Authorization: 'Bearer ${MNOGOREELS_API_KEY}'
config:
  description: Configure your MnogoReels API key
  secrets:
    - name: mnogoreels.api_key
      env: MNOGOREELS_API_KEY
      example: mrfrt_usr_...
