name: xcrop
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - social-media
    - x
    - twitter
    - remote
about:
  title: XCROP
  description: Read public X (Twitter) data and verify follows, reposts, replies and quotes. 14 read-only tools.
  icon: https://xcrop.io/mcp-icon-256.png
remote:
  transport_type: streamable-http
  url: https://xcrop.io/api/mcp
  headers:
    X-API-Key: "${XCROP_API_KEY}"
config:
  secrets:
    - name: xcrop.api_key
      env: XCROP_API_KEY
      example: <YOUR_XCROP_API_KEY>
