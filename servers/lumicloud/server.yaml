name: lumicloud
type: remote
meta:
  category: devops
  tags:
    - sandbox
    - code-execution
    - devops
    - remote
about:
  title: LumiCloud
  description: Linux sandboxes for AI agents. Run commands and Python or JavaScript, read and write files, open ports, pause and resume.
  icon: https://www.google.com/s2/favicons?domain=lumicloud.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.lumicloud.dev/mcp
  headers:
    Authorization: "Bearer ${LUMICLOUD_API_KEY}"
config:
  secrets:
    - name: lumicloud.api_key
      env: LUMICLOUD_API_KEY
      example: <YOUR_API_KEY>
