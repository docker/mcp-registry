name: beliefstate
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - investor-research
    - data
    - remote
about:
  title: BeliefState
  description: Retrieve cited investor theses, investment risks, catalysts, research changes and publication-based outcomes with source dates and coverage limits.
  icon: https://www.google.com/s2/favicons?domain=beliefstate.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://beliefstate.ai/mcp
oauth:
  - provider: beliefstate
    secret: beliefstate.personal_access_token
    env: BELIEFSTATE_PERSONAL_ACCESS_TOKEN
