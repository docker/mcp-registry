name: scrapingant
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - data-extraction
    - markdown
    - remote
about:
  title: ScrapingAnt
  description: |-
    Fetch any web page as HTML, Markdown or plain text through ScrapingAnt's web scraping API. Pages are rendered in a headless Chrome browser (optional) and sent through rotating datacenter or residential proxies, with an optional proxy country.

    Tools: get_web_page_html, get_web_page_markdown and get_web_page_text. Each takes url plus optional browser, proxy_type and proxy_country.
  icon: https://www.google.com/s2/favicons?domain=scrapingant.com&sz=128
remote:
  transport_type: streamable-http
  url: https://api.scrapingant.com/mcp
  headers:
    x-api-key: "${SCRAPINGANT_API_KEY}"
config:
  description: Your ScrapingAnt API key from the dashboard at https://app.scrapingant.com
  secrets:
    - name: scrapingant.api_key
      env: SCRAPINGANT_API_KEY
      example: <YOUR_API_KEY>
