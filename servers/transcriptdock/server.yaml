name: transcriptdock
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - transcription
    - video
    - subtitles
    - remote
about:
  title: Transcript Dock
  description: Get timed transcripts and JSON, SRT, VTT and TXT exports from YouTube, TikTok, uploads and direct media links. Instagram Reels use AI transcription on paid plans in beta.
  icon: https://www.transcriptdock.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://www.transcriptdock.com/mcp
oauth:
  - provider: transcriptdock
    secret: transcriptdock.personal_access_token
    env: TRANSCRIPTDOCK_PERSONAL_ACCESS_TOKEN
