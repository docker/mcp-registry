name: secuveri
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - identity-verification
    - kyc
    - compliance
    - remote
about:
  title: Secuveri
  description: Identity and age verification from Switzerland. Create verification links, read outcomes and signed results, build and publish verification workflows, manage block and allow lists and run AML screenings.
  icon: https://secuveri.com/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.secuveri.com/mcp
oauth:
  - provider: secuveri
    secret: secuveri.personal_access_token
    env: SECUVERI_PERSONAL_ACCESS_TOKEN
