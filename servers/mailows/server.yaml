name: mailows
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - email
    - communication
    - productivity
    - remote
about:
  title: Mailows
  description: Email hosting for people and AI agents. Give each agent its own inbox and list, read and send mail (with attachments) through scoped, revocable OAuth grants.
  icon: https://avatars.githubusercontent.com/u/320262133?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.mailows.com/mcp
oauth:
  - provider: mailows
    secret: mailows.personal_access_token
    env: MAILOWS_PERSONAL_ACCESS_TOKEN
