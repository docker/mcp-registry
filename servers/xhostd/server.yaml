name: xhostd
type: remote
dynamic:
    tools: true
meta:
    category: developer-tools
    tags:
        - developer-tools
        - remote
about:
    title: xhostd
    description: |-
        xhostd is an all-in-one cloud platform that lets AI coding agents deploy, test, and manage websites, applications, APIs, and backend services directly from tools like Claude Code, Cursor, and Codex.

        Through its MCP server, agents can create and deploy applications, provision PostgreSQL databases, configure authentication, manage environment variables and custom domains, and monitor deployments without requiring users to manually configure cloud infrastructure.

        xhostd supports isolated Preview, Staging, and Production environments, enabling agents to safely test changes before releasing them. Built-in deployment management, backups, and rollback capabilities help protect applications and data as they evolve.

        Designed for developers and AI-assisted development workflows, xhostd simplifies the entire application lifecycle—from initial deployment to ongoing operations—through natural-language interactions with AI coding agents.
    icon: https://xhostd.com/apple-touch-icon.png
remote:
    transport_type: streamable-http
    url: https://mcp.xhostd.com/mcp/
oauth:
    - provider: xhostd
      secret: xhostd.personal_access_token
      env: XHOSTD_PERSONAL_ACCESS_TOKEN
