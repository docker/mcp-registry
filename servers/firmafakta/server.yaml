name: firmafakta
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - business-data
    - sweden
    - remote
about:
  title: Firmafakta
  description: Swedish company data from SCB, Bolagsverket and PRV. Segment companies by industry, place and size, fetch company lists and look up any company by organisation number.
  icon: https://firmafakta.se/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.firmafakta.se
oauth:
  - provider: firmafakta
    secret: firmafakta.personal_access_token
    env: FIRMAFAKTA_PERSONAL_ACCESS_TOKEN
