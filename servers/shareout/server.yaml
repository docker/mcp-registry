name: shareout
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - publishing
    - collaboration
    - remote
about:
  title: Shareout
  description: Publish HTML reports, proposals, and interactive pages, collect feedback, and publish revisions at the same link. Requires a Shareout account.
  icon: https://shareout.io/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://shareout.io/mcp
oauth:
  - provider: shareout
    secret: shareout.personal_access_token
    env: SHAREOUT_PERSONAL_ACCESS_TOKEN
