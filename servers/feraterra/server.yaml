name: feraterra
image: mcp/feraterra
type: server
meta:
  category: finance
  tags:
    - feraterra
    - finance
    - crypto
    - trading
    - exchange
about:
  title: FeraTerra Arena Exchange
  description: Headless 24-tool gateway for FeraTerra Arena Exchange spot, perpetuals, order previews, flash arbitrage, risk guardrails, and L2 custody.
  icon: https://avatars.githubusercontent.com/u/361408431?s=200&v=4
source:
  project: https://github.com/FeraTerra/feraterra-sdk
  commit: 85fdb874fc162abbf56891815c5764a410e0193a
config:
  description: Configure optional FeraTerra Arena Exchange network preset, base URL, and trading API credentials.
  secrets:
    - name: feraterra.api_key
      env: ARENA_API_KEY
      example: ak_example_key
      description: Optional Arena Exchange HMAC API key ID for authenticated trading tools.
    - name: feraterra.api_secret
      env: ARENA_API_SECRET
      example: as_example_secret
      description: Optional Arena Exchange HMAC API secret for authenticated trading tools.
  env:
    - name: ARENA_NETWORK
      example: testnet
      value: "{{feraterra.arena_network}}"
    - name: ARENA_URL
      example: https://testnet.feraterra.app
      value: "{{feraterra.arena_url}}"
  parameters:
    type: object
    properties:
      arena_network:
        type: string
        description: Arena network preset (testnet or local).
        default: testnet
      arena_url:
        type: string
        description: Optional explicit Arena Exchange HTTP base URL override.
