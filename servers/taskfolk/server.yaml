name: taskfolk
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - project-management
    - remote
    - mcp
about:
  title: Taskfolk
  description: Project tracker for teams and AI agents. File, assign, and close issues over MCP. Agents are not billed as seats.
  icon: https://www.google.com/s2/favicons?domain=taskfolk.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://taskfolk.ai/api/mcp/v1
oauth:
  - provider: taskfolk
    secret: taskfolk.personal_access_token
    env: TASKFOLK_PERSONAL_ACCESS_TOKEN
