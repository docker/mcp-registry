name: foxnose
type: remote
meta:
  category: search
  tags:
    - search
    - rag
    - knowledge-base
    - vector-search
    - remote
about:
  title: FoxNose Knowledge
  description: Hybrid search, schema introspection and record read/write over your FoxNose collections, with auto-embeddings on write.
  icon: https://foxnose.net/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.foxnose.net/_mcp
  headers:
    Authorization: "Bearer ${FOXNOSE_API_TOKEN}"
config:
  description: Create a Flux API key in the FoxNose dashboard and issue a bearer token bound to it. Use a key scoped to a single Flux API. Permissions follow the key, so a read-only key exposes only the read tools.
  secrets:
    - name: foxnose.api_token
      env: FOXNOSE_API_TOKEN
      example: <FOXNOSE_API_TOKEN>
