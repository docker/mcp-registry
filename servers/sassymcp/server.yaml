name: sassymcp
image: mcp/sassymcp
type: server
longLived: true
meta:
  category: devops
  tags:
    - sassymcp
    - devops
    - filesystem
    - terminal
    - github
    - automation
    - productivity
about:
  title: Sassy Desktop
  description: Files, shell, GitHub, memory, and web tools in one container. Host desktop, phone, and Windows tools need the native app.
  icon: https://www.google.com/s2/favicons?domain=sassyconsultingllc.com&sz=64
source:
  project: https://github.com/sassyconsultingllc/SassyMCP
  commit: ca1060821d07319e82cd44ffba413602af75e6e9
run:
  volumes:
    - "{{sassymcp.paths|volume|into}}"
config:
  description: Mount the directories this server may read and write, and optionally add a GitHub token.
  secrets:
    - name: sassymcp.personal_access_token
      env: GITHUB_PERSONAL_ACCESS_TOKEN
      example: <GITHUB_PERSONAL_ACCESS_TOKEN>
      required: false
  parameters:
    type: object
    properties:
      paths:
        type: array
        items:
          type: string
        title: Allowed Filesystem Paths
        description: Directories mounted into the container for file and shell tools
        default:
          - /Users/username/Desktop
          - /Users/username/Documents
    required:
      - paths
