name: business-open-data-crypto
type: remote
dynamic:
  tools: true
meta:
  category: data-analytics
  tags:
    - data-analytics
    - open-data
    - crypto
    - finance
    - startups
    - remote
about:
  title: Business Open Data and Crypto
  description: "19 read-only tools for public business data: government open-data catalogues, crypto prices and Fear and Greed, Bitcoin chain stats, Bank of Canada FX rates and new startups."
  icon: https://www.google.com/s2/favicons?domain=mcpize.com&sz=64
remote:
  transport_type: streamable-http
  url: https://business-open-data-crypto.mcpize.run/mcp
  headers:
    Authorization: "Bearer ${MCPIZE_API_KEY}"
config:
  secrets:
    - name: business-open-data-crypto.mcpize_api_key
      env: MCPIZE_API_KEY
      example: <YOUR_MCPIZE_API_KEY>
