name: oxylabs-web-api
type: remote
meta:
  category: search
  tags:
    - search
    - web-scraping
    - data-extraction
    - remote
about:
  title: Oxylabs Web API
  description: Search the live web, look up companies and read any page as Markdown or JSON through the Oxylabs Web API, with dedicated scrapers for sites such as Google, Amazon and YouTube.
  icon: https://avatars.githubusercontent.com/u/43960873?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.oxylabs.io/web-api-mcp
  headers:
    Authorization: "Bearer ${OXYLABS_WEB_API_KEY}"
config:
  secrets:
    - name: oxylabs-web-api.api_key
      env: OXYLABS_WEB_API_KEY
      example: <YOUR_API_KEY>
