name: rus-sh
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - url-shortener
    - qr-code
    - analytics
    - remote
about:
  title: Rus.sh
  description: Make, find, pause and track short links and QR codes from your AI assistant. Every change can be undone; nothing is ever permanently deleted.
  icon: https://rus.sh/images/brand/mcp-icon-512.png
remote:
  transport_type: streamable-http
  url: https://rus.sh/mcp
oauth:
  - provider: rus-sh
    secret: rus-sh.personal_access_token
    env: RUS_SH_PERSONAL_ACCESS_TOKEN
