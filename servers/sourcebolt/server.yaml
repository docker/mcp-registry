name: sourcebolt
image: ghcr.io/candidloom-hub/sourcebolt:0.3.2
type: server
meta:
  category: productivity
  tags:
    - notebooklm
    - productivity
    - research
about:
  title: sourcebolt (NotebookLM, unofficial)
  description: Unofficial MCP server for Google NotebookLM - notebooks, sources, answers with citations, research and notes.
  icon: https://github.com/candidloom-hub/sourcebolt/releases/download/v0.3.1/sourcebolt-icon-400x400.png
source:
  project: https://github.com/candidloom-hub/sourcebolt
  commit: 38901ec6f02bdfa32287f635ad8dc9b431551fdf
run:
  allowHosts:
    - notebook.google.com:443
    - notebooklm.google.com:443
config:
  description: Sign in with your Google session cookies for NotebookLM. Export them from a browser where you are signed in to notebook.google.com (Cookie header form, one line). sourcebolt keeps them in memory only and never saves them.
  secrets:
    - name: sourcebolt.notebooklm_cookies
      env: NOTEBOOKLM_COOKIES
      example: "SID=...; __Secure-1PSIDTS=...; OSID=..."
      description: Your NotebookLM session cookies, as a Cookie header (needs SID, __Secure-1PSIDTS, and OSID or APISID plus SAPISID). Treat it like a password.
  env:
    - name: NOTEBOOKLM_BROWSER_FALLBACK
      example: "0"
      value: "0"
