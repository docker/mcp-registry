name: blackforge
image: mcp/blackforge
type: server
meta:
  category: finance
  tags:
    - finance
    - crypto
    - market-data
    - order-book
    - trading
about:
  title: BlackForge
  description: "BlackForge measures the order books of the major crypto exchanges in real time: depth, liquidity added and pulled, order ladders and what actually traded. 150+ metrics for 14,000+ pairs, in a dashboard or over REST, MCP and a CLI."
  icon: https://avatars.githubusercontent.com/u/304977841?s=400&v=4
source:
  project: https://github.com/blackforge-so/mcp
  commit: 65c83cf7d136bd9c0d171ba64990c71f64d9658b
config:
  description: Paste a BlackForge API key from app.blackforge.so/api. The blackforge_catalog tool works without one.
  secrets:
    - name: blackforge.api_key
      env: BLACKFORGE_API_KEY
      example: bf_live_your_key
