name: shortimize
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - social-media
    - tiktok
    - instagram
    - youtube
    - remote
about:
  title: Shortimize
  description: Track TikTok, Instagram Reels and YouTube Shorts accounts and videos, with views, growth and analytics
  icon: https://www.google.com/s2/favicons?domain=shortimize.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.shortimize.com/mcp
  headers:
    Authorization: "Bearer ${SHORTIMIZE_API_KEY}"
config:
  secrets:
    - name: shortimize.api_key
      env: SHORTIMIZE_API_KEY
      example: <YOUR_API_KEY>
