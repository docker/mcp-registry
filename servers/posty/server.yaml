name: posty
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - social-media
    - scheduling
    - remote
about:
  title: "Posty: Social Media Scheduler"
  description: Write, schedule and publish posts to 20 social platforms, including Facebook, Instagram, X, LinkedIn, TikTok, YouTube, Threads, Bluesky and Pinterest, with a content calendar and full-quality photo and video uploads. Needs a Posty account (free trial at posty.hu).
  icon: https://raw.githubusercontent.com/norbertlevente/posty-agent/main/plugins/posty-mcp/.claude-plugin/icon.png
remote:
  transport_type: streamable-http
  url: https://api.posty.hu/mcp-oauth
oauth:
  - provider: posty
    secret: posty.personal_access_token
    env: POSTY_PERSONAL_ACCESS_TOKEN
