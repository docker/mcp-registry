name: canhelpto
type: remote
meta:
  category: communication
  tags:
    - customer-support
    - helpdesk
    - ticketing
    - remote
about:
  title: canhelpto
  description: Work a customer support inbox from your agent. List, read and answer tickets, including the connector context (account, client, failed tool calls) that MCP servers attach.
  icon: https://www.google.com/s2/favicons?domain=canhelpto.com&sz=64
remote:
  transport_type: streamable-http
  url: https://canhelpto.com/api/mcp
  headers:
    Authorization: "Bearer ${CANHELPTO_SERVICE_KEY}"
config:
  secrets:
    - name: canhelpto.service_key
      env: CANHELPTO_SERVICE_KEY
      example: <YOUR_WORKSPACE_SERVICE_KEY>
