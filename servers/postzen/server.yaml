name: postzen
type: remote
meta:
  category: productivity
  tags:
    - social-media
    - marketing
    - scheduling
    - content
    - remote
about:
  title: PostZen
  description: Schedule and publish social media posts, manage comments and DMs, and track analytics across ten social platforms
  icon: https://www.google.com/s2/favicons?domain=postzen.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.postzen.dev/mcp
  headers:
    Authorization: "Bearer ${POSTZEN_API_KEY}"
config:
  secrets:
    - name: postzen.api_key
      env: POSTZEN_API_KEY
      example: pzn_live_****
