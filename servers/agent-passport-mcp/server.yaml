name: agent-passport-mcp
image: mcp/agent-passport-mcp
type: server
meta:
  category: security
  tags:
    - identity
    - attestation
    - post-quantum
    - verifiable-credentials
    - blockchain
about:
  title: Agent Passport
  description: Issue and independently verify AI-agent passports and signed AI-decision receipts using ML-DSA-65 (NIST FIPS 204). Verification is offline and needs no trust in the issuer.
  icon: https://avatars.githubusercontent.com/u/65939191?v=4
source:
  project: https://github.com/johnInarti/agent-passport-mcp
  commit: f71e519a8336ce51698a54b974670adad1b8f2eb
config:
  description: Optional. Defaults point at the public FractalAI endpoints; override only to pin a different node or a specific receipt-signing key.
  env:
    - name: FRACTALAI_BASE_URL
      example: https://fractalai.net.co
    - name: FRACTALAI_RPC_URL
      example: https://api.fractalai.net.co
    - name: FRACTALAI_PINNED_RECEIPT_KEY
      example: <base64 ML-DSA-65 public key>
    - name: AGENT_PASSPORT_AUTODEMO
      example: "0"
