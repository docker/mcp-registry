name: riverscript
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - transcription
    - transcripts
    - meetings
    - speech-to-text
    - remote
about:
  title: RiverScript
  description: Bring your RiverScript transcripts of meetings, calls and interviews to any AI agent.
  icon: https://riverscript.com/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://riverscript.com/api/mcp/v2
oauth:
  - provider: riverscript
    secret: riverscript.personal_access_token
    env: RIVERSCRIPT_PERSONAL_ACCESS_TOKEN
