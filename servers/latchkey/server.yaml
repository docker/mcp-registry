name: latchkey
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - latchkey
    - devops
    - ci-cd
    - github-actions
    - remote
about:
  title: Latchkey
  description: >-
    Connect AI agents to Latchkey's hosted MCP server to triage failing GitHub
    Actions jobs, pull failure bundles and logs, check run status, and see what
    self-heal repaired, in natural language.
  icon: https://avatars.githubusercontent.com/u/238924717?v=4
remote:
  transport_type: streamable-http
  url: https://latchkey.dev/mcp
oauth:
  - provider: latchkey
    secret: latchkey.personal_access_token
    env: LATCHKEY_PERSONAL_ACCESS_TOKEN
