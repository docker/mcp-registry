name: jotter
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - productivity
    - notes
    - remote
about:
  title: Jotter
  description: Save notes and conversation context from one AI assistant and load them into another
  icon: https://www.google.com/s2/favicons?domain=jotter.fyi&sz=64
remote:
  transport_type: streamable-http
  url: https://jotter.fyi/mcp
oauth:
  - provider: jotter
    secret: jotter.personal_access_token
    env: JOTTER_PERSONAL_ACCESS_TOKEN
