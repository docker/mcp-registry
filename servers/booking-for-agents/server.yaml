name: booking-for-agents
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - scheduling
    - calendar
    - remote
about:
  title: Booking for Agents
  description: Booking pages that an agent sets up for the person it works for. Clients book in their own time zone; the agent hears about every booking.
  icon: https://www.google.com/s2/favicons?domain=picktimeapp.com&sz=64
remote:
  transport_type: streamable-http
  url: https://ai.picktimeapp.com/mcp
  headers:
    Authorization: "Bearer ${BOOKING_FOR_AGENTS_API_KEY}"
config:
  secrets:
    - name: booking-for-agents.api_key
      env: BOOKING_FOR_AGENTS_API_KEY
      example: <YOUR_API_KEY>
