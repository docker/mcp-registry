name: greatwait
type: remote
dynamic:
  tools: true
meta:
  category: automation
  tags:
    - scheduling
    - webhooks
    - automation
    - remote
about:
  title: GreatWait
  description: Schedule one-off and recurring HTTPS callbacks with delivery history and retries through GreatWait.
  icon: https://greatwait.dev/brand/favicon-32.png
remote:
  transport_type: streamable-http
  url: https://api.greatwait.dev/mcp
oauth:
  - provider: greatwait
    secret: greatwait.personal_access_token
    env: GREATWAIT_PERSONAL_ACCESS_TOKEN
