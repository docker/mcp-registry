name: avatarsay
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - avatar
    - video
    - tts
    - rpg
    - remote
about:
  title: AvatarSay
  description: "Generate fictional character portraits, tabletop RPG NPC sheets (SillyTavern V2 and Foundry VTT JSON), fast MP3 voice lines, and lip-synced talking MP4 videos from text."
  icon: https://www.google.com/s2/favicons?domain=avatarsay.com&sz=64
remote:
  transport_type: streamable-http
  url: https://avatarsay.com/mcp
  headers:
    Authorization: "Bearer ${AVATARSAY_API_KEY}"
config:
  description: Configure your AvatarSay API key (public tools list_voices_and_styles and roll_rpg_npc also work without a key)
  secrets:
    - name: avatarsay.api_key
      env: AVATARSAY_API_KEY
      example: avs_YOUR_API_KEY
