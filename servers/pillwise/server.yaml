name: pillwise
type: remote
meta:
  category: search
  tags:
    - health
    - medication
    - ndc
    - rxnorm
    - remote
about:
  title: Pillwise
  description: US medication lookup for health apps. Search medications, get form and strength options, resolve NDC and RxCUI codes, and check recalls and shortages.
  icon: https://pillwise.dev/favicon.svg
remote:
  transport_type: streamable-http
  url: https://api.pillwise.dev/mcp
  headers:
    Authorization: "Bearer ${PILLWISE_API_KEY}"
config:
  secrets:
    - name: pillwise.api_key
      env: PILLWISE_API_KEY
      example: <YOUR_API_KEY>
