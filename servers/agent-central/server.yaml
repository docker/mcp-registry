name: agent-central
type: remote
meta:
  category: ecommerce
  tags:
    - ecommerce
    - amazon
    - advertising
    - remote
about:
  title: Agent Central
  description: "Connect AI agents to your Amazon Seller Central and Amazon Ads account: campaigns, search terms, inventory, orders, catalog, finance, and fulfillment."
  icon: https://www.google.com/s2/favicons?domain=agentcentral.to&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.agentcentral.to/mcp
  headers:
    Authorization: "Bearer ${AGENT_CENTRAL_API_KEY}"
config:
  secrets:
    - name: agent-central.api_key
      env: AGENT_CENTRAL_API_KEY
      example: ac_live_<YOUR_API_KEY>
