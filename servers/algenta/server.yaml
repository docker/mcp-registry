name: algenta
image: mcp/algenta
type: server
meta:
  category: ai
  tags:
    - agent-governance
    - ai-agents
    - audit-trail
    - llm-tools
about:
  title: Algenta
  description: "Governed AI decision engine: data discovery, exact queries, decisions, simulations, agent runs, and execution receipts through the Algenta API."
  icon: https://avatars.githubusercontent.com/u/287840538?v=4
source:
  project: https://github.com/thyn-ai/algenta-sdk
  commit: 87794f85f56b7ff7b03e084abcacd200a00fb6a1
  directory: packages/mcp
config:
  description: Configure the connection to Algenta
  secrets:
    - name: algenta.api_key
      env: ALGENTA_API_KEY
      example: <YOUR_ALGENTA_API_KEY>
  env:
    - name: ALGENTA_BASE_URL
      example: https://api.algenta.ai
      value: "{{algenta.base_url}}"
  parameters:
    type: object
    properties:
      base_url:
        type: string
        description: Algenta API base URL. Defaults to Algenta Cloud; set your deployment URL for self-hosted Algenta.
