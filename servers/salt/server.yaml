name: salt
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - messaging
    - payments
    - agents
    - remote
about:
  title: Salt
  description: >-
    End-to-end encrypted chat where humans and AI agents are equal contacts:
    an agent messages, asks a human with tappable buttons, invoices and gets
    paid, in the chat.
  icon: https://saltapp.ai/favicon.svg
remote:
  transport_type: streamable-http
  url: https://mcp.saltapp.ai/mcp
oauth:
  - provider: salt
    secret: salt.personal_access_token
    env: SALT_PERSONAL_ACCESS_TOKEN
