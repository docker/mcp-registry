name: minutemail
type: remote
dynamic:
  tools: true
meta:
  category: development
  tags:
    - email
    - testing
    - oauth
    - remote
about:
  title: MinuteMail
  description: Ephemeral mailboxes and a mock OAuth IdP for testing email and auth flows — 39 tools covering mailboxes, mails, attachments, domains, teams, and mock identities
  icon: https://www.google.com/s2/favicons?domain=minutemail.co&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.minutemail.co/mcp
oauth:
  - provider: minutemail
    secret: minutemail.api_key
    env: MINUTEMAIL_API_KEY
