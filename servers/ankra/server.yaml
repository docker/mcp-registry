name: ankra
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - kubernetes
    - gitops
    - remote
about:
  title: Ankra
  description: Manage Kubernetes clusters on Ankra from an agent. List clusters, read pods, logs, events and metrics, deploy applications, stacks and add-ons, and run GitOps, CI/CD and security checks.
  icon: https://raw.githubusercontent.com/ankraio/cursor-plugin/master/plugins/ankra/assets/logo.svg
remote:
  transport_type: streamable-http
  url: https://platform.ankra.app/api/v1/mcp
oauth:
  - provider: ankra
    secret: ankra.personal_access_token
    env: ANKRA_PERSONAL_ACCESS_TOKEN
