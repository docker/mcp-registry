name: neverapply
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - jobs
    - career
    - remote
about:
  title: NeverApply
  description: "AI job-search agent: search and match jobs, tailor resumes, answer screening questions, and apply to jobs with approval."
  icon: https://neverapply.co/web-app-manifest-512x512.png
remote:
  transport_type: streamable-http
  url: https://neverapply.co/mcp
oauth:
  - provider: neverapply
    secret: neverapply.personal_access_token
    env: NEVERAPPLY_PERSONAL_ACCESS_TOKEN
