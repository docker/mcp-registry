name: limitguard
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - compliance
    - sanctions
    - kyb
    - remote
about:
  title: Limitguard
  description: Check a Dutch or Belgian company, a sales lead or a wallet before you deal with it, against the official registers, VAT and sanctions lists, with the source and date of every answer
  icon: https://limitguard.ai/icon-192.png
remote:
  transport_type: streamable-http
  url: https://api.limitguard.ai/mcp-oauth
oauth:
  - provider: limitguard
    secret: limitguard.personal_access_token
    env: LIMITGUARD_PERSONAL_ACCESS_TOKEN
