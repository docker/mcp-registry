name: file2host
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - file-sharing
    - storage
    - remote
about:
  title: File2Host
  description: Upload files and get a share link anyone can open. Organize folders, add passwords, collect files.
  icon: https://f2h.io/img/app/agent-icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.f2h.io/mcp
oauth:
  - provider: file2host
    secret: file2host.personal_access_token
    env: FILE2HOST_PERSONAL_ACCESS_TOKEN
