name: worthbase-remote
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - personal-finance
    - net-worth
    - portfolio-tracker
    - remote
about:
  title: Worthbase
  description: Your household's net worth - shares, crypto, property, retirement accounts, cash and loans priced daily, with exact gains, returns and goals, and previewed, undoable imports
  icon: https://www.google.com/s2/favicons?domain=worthbase.app&sz=64
remote:
  transport_type: streamable-http
  url: https://worthbase.app/mcp
oauth:
  - provider: worthbase-remote
    secret: worthbase-remote.personal_access_token
    env: WORTHBASE_REMOTE_PERSONAL_ACCESS_TOKEN
