name: datacircle
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - data
    - sales
    - b2b-data
    - linkedin
    - remote
about:
  title: Datacircle
  description: >-
    LinkedIn profiles and B2B data at the provider's own price, no markup,
    paid from your Datacircle balance. Fetch a person's profile from its
    LinkedIn URL, check the balance, and download the free 10M+ U.S. B2B
    leads dataset (and the co-op files, once unlocked).
  icon: https://datacircle.dev/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://api.datacircle.dev/mcp
oauth:
  - provider: datacircle
    secret: datacircle.personal_access_token
    env: DATACIRCLE_PERSONAL_ACCESS_TOKEN
