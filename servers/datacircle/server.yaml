name: datacircle
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - data
    - sales
    - b2b-data
    - linkedin
    - remote
about:
  title: Datacircle
  description: >-
    Datacircle is a data co-op. Query your favorite B2B data APIs through us.
    Same request, same price, no markup. Every morning, you get the flat file
    of your data plus everyone else's.
  icon: https://datacircle.dev/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://api.datacircle.dev/mcp
oauth:
  - provider: datacircle
    secret: datacircle.personal_access_token
    env: DATACIRCLE_PERSONAL_ACCESS_TOKEN
