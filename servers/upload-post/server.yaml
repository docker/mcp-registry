name: upload-post
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - social-media
    - publishing
    - scheduling
    - content-automation
    - analytics
    - remote
about:
  title: Upload-Post
  description: Publish, schedule and analyze social media posts across TikTok, Instagram, YouTube, LinkedIn, Facebook, X, Threads, Pinterest, Reddit, Bluesky, Google Business, Discord and Telegram from one API
  icon: https://www.upload-post.com/uploadpost-80.jpeg
remote:
  transport_type: streamable-http
  url: https://mcp.upload-post.com/mcp
  headers:
    Authorization: "ApiKey ${UPLOAD_POST_API_KEY}"
config:
  secrets:
    - name: upload-post.api_key
      env: UPLOAD_POST_API_KEY
      example: <YOUR_API_KEY>
source:
  project: https://github.com/Upload-Post/upload-post-mcp
