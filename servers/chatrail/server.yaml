name: chatrail
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - whatsapp
    - messaging
    - webhooks
    - remote
about:
  title: ChatRail
  description: Check WhatsApp connection health, trace failed messages, manage scheduled sends and replay webhooks in a ChatRail workspace
  icon: https://www.google.com/s2/favicons?domain=chatrail.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://www.chatrail.dev/v1/mcp
oauth:
  - provider: chatrail
    secret: chatrail.personal_access_token
    env: CHATRAIL_PERSONAL_ACCESS_TOKEN
