name: complydoc
image: mcp/complydoc
type: server
meta:
  category: productivity
  tags:
    - documents
    - privacy
    - pii
    - security
    - pdf
    - docx
about:
  title: complydoc
  description: Open documents with personal details masked and hidden instructions taken out, on your machine.
  icon: https://raw.githubusercontent.com/complydoc/complydoc/main/mcpb/icon.png
source:
  project: https://github.com/complydoc/complydoc
  commit: 244850a8a69e8c3fe5effe90b815b86f17fc441e
run:
  command:
    - mcp
    - --folder
    - /documents
  volumes:
    - '{{complydoc.documents}}:/documents:ro'
  disableNetwork: true
config:
  description: The folder with the documents the assistant may open, shared read-only.
  parameters:
    type: object
    properties:
      documents:
        type: string
        description: Folder with the documents
        default: /Users/local-test
    required:
      - documents
