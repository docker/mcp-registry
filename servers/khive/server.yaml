name: khive
type: remote
meta:
  category: ai
  tags:
    - ai
    - memory
    - knowledge-graph
    - remote
about:
  title: Khive
  description: Hosted memory, knowledge graph and task tracking for AI agents. Everything your agents store stays in your own khive workspace.
  icon: https://www.google.com/s2/favicons?domain=khive.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://khive.ai/v1/mcp
  headers:
    Authorization: "ApiKey ${KHIVE_API_KEY}"
config:
  secrets:
    - name: khive.api_key
      env: KHIVE_API_KEY
      example: <YOUR_API_KEY>
