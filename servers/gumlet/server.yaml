name: gumlet
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - live-streaming
    - remote
about:
  title: Gumlet
  description: Manage video, live streams, analytics, and workspaces.
  icon: https://www.google.com/s2/favicons?domain=gumlet.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.gumlet.com/mcp/v1
  headers:
    GUMLET_API_KEY: "${GUMLET_API_KEY}"
config:
  secrets:
    - name: gumlet.api_key
      env: GUMLET_API_KEY
      example: <YOUR_API_KEY>
      required: true
      description: Gumlet API key from the dashboard under Developer, API keys.
