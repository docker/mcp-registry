about:
  title: Zip
  description: "Creates, inspects and extracts zip archives locally, with no network call of any kind. Packing takes a file list or a whole directory tree with glob patterns and stores relative names only, so an archive written here can never be a traversal archive. Reading parses the central directory itself and decides every guard from the headers before anything is inflated: absolute paths, .., symlinks, encrypted entries, duplicate names, unsupported compression methods, per-entry compression ratio and total declared size, so a 500 MB bomb that is 497.8 KB on disk is refused without creating the output directory. Every entry written out is proved against the CRC-32 in its header, because a bounded inflate buffer truncates a lying header silently and reports success. One text entry can be read inline without unpacking anything, and a month of invoices, quotes and exports written by the sibling servers can be bundled into one file. Zip passwords are refused rather than ignored. Every archive created is recorded in a plain JSON register inside the container volume; nothing is uploaded anywhere."
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/4378f31fea67b36090d989dcc3e57225db1fd4e8/assets/zip-logo.png
