name: testingbot
image: mcp/testingbot
type: server
meta:
  category: devops
  tags:
    - testing
    - browser-automation
    - mobile
    - devops
    - secrets
about:
  title: TestingBot
  description: Official TestingBot MCP server. Run and manage Selenium, Appium, Maestro, Espresso and XCUITest tests on real browsers and devices, drive a remote browser or device from the agent, take cross-browser screenshots, start live sessions, and manage builds, app uploads and tunnels.
  icon: https://avatars.githubusercontent.com/u/945169?s=200&v=4
source:
  project: https://github.com/testingbot/mcp-server
  commit: adebfc6bd7d5e678321580e4bbf7dbcbf567ad75
config:
  description: TestingBot API key and secret, from https://testingbot.com/members/user/security
  secrets:
    - name: testingbot.key
      env: TESTINGBOT_KEY
      example: YOUR_TESTINGBOT_KEY
    - name: testingbot.secret
      env: TESTINGBOT_SECRET
      example: YOUR_TESTINGBOT_SECRET
