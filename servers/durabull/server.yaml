name: durabull
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - bullmq
    - redis
    - queues
    - background-jobs
    - devops
    - remote
about:
  title: Durabull
  description: Monitor and operate BullMQ queues on Redis. Find and inspect jobs, read logs and stack traces, check throughput, workers, schedules and Redis health, triage alerts, and retry failed jobs or pause queues on request.
  icon: https://durabull.io/favicon-96x96.png
remote:
  transport_type: streamable-http
  url: https://app.durabull.io/mcp
oauth:
  - provider: durabull
    secret: durabull.personal_access_token
    env: DURABULL_PERSONAL_ACCESS_TOKEN
