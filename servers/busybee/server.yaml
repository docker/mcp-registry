name: busybee
type: remote
dynamic:
  tools: true
meta:
  category: social-media
  tags:
    - social-media
    - marketing
    - data
    - analytics
    - remote
about:
  title: BusyBee
  description: Public social media data for AI agents across TikTok, Instagram, YouTube, X (Twitter), Douyin and Xiaohongshu — creator search, post search, comments, comment insights and trending boards through ten uniform tools. Pay per call.
  icon: https://lucydomi.com/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://lucydomi.com/mcp
  headers:
    Authorization: "Bearer ${BUSYBEE_API_KEY}"
config:
  description: Provide your BusyBee API key. Free keys are available after signup, and a no-signup demo is available for a first look at the data.
  secrets:
    - name: busybee.api_key
      env: BUSYBEE_API_KEY
      example: <YOUR_API_KEY>
