name: xmemo
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - memory
    - agent
    - remote
about:
  title: XMemo
  description: Shared, governed long-term memory for AI agents across tools and sessions.
  icon: https://www.google.com/s2/favicons?domain=xmemo.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://xmemo.dev/mcp
  headers:
    Authorization: "Bearer ${XMEMO_KEY}"
config:
  description: Requires an XMemo API key. Generate one from your account at https://xmemo.dev.
  secrets:
    - name: xmemo.api_key
      env: XMEMO_KEY
      example: <YOUR_API_KEY>
