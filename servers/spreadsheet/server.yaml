name: spreadsheet
image: mcp/spreadsheet
type: server
meta:
  category: productivity
  tags:
    - spreadsheet
    - xlsx
    - csv
    - data
    - conversion
about:
  title: Spreadsheet
  description: Opens xlsx and csv files, lists sheets, previews rows, describes columns with types and null counts, filters and sorts with expressions, writes cells and new sheets, and converts between xlsx, csv and json. Parsing is pure JavaScript with no native dependencies and no upload step; files stay on the mounted volume.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/5478b42fa9c8432cd34ff61ae559723f909e112b/assets/spreadsheet-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: 5478b42fa9c8432cd34ff61ae559723f909e112b
  dockerfile: servers/spreadsheet/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: spreadsheet.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
