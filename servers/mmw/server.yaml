name: mmw
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - memory
    - persistent-memory
    - ai-agents
    - cross-model
    - remote
about:
  title: MMW Managed Memory Workspace
  description: Shared memory for AI agents over MCP. Facts keep their source and date, newer versions supersede old ones, and contradicting facts are flagged.
  icon: https://mmwhub.tech/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.mmwhub.tech/mcp
  headers:
    Authorization: "Bearer ${MMW_API_KEY}"
config:
  description: Create an API key in your MMW account at https://app.mmwhub.tech.
  secrets:
    - name: mmw.api_key
      env: MMW_API_KEY
      example: mmw_<YOUR_API_KEY>
