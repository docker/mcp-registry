name: fetchrouter
type: remote
meta:
  category: web-scraping
  tags:
    - web-scraping
    - web
    - fetch
    - remote
about:
  title: Fetch Router
  description: Fetch a public URL and get its content only if it really loaded. Every page is checked for HTTP errors, block and challenge pages (Cloudflare, DataDome, PerimeterX, Akamai, Imperva, Kasada…), empty JavaScript shells and text you expect to see. If a check fails it falls back to a headless browser. Failed fetches are free. Includes a free per-domain reliability lookup.
  icon: https://fetchrouter.dev/assets/icon-512.png
remote:
  transport_type: streamable-http
  url: https://fetchrouter.dev/mcp
  headers:
    Authorization: "Bearer ${FETCHROUTER_API_KEY}"
source:
  project: https://github.com/JonnoGit/fetchrouter-mcp
config:
  description: "Your Fetch Router API key, sent as an Authorization: Bearer header. A free key includes 500 credits; 1 credit ($0.001) per static page, 2 per browser page, failed fetches are free."
  secrets:
    - name: fetchrouter.api_key
      env: FETCHROUTER_API_KEY
      example: <YOUR_API_KEY>
