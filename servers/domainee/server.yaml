name: domainee
type: remote
meta:
  category: devops
  tags:
    - domains
    - dns
    - ssl
    - devops
    - remote
about:
  title: Domainee
  description: Custom domains API for SaaS. Connect, verify, and manage your customers' domains, SSL, and DNS, plus diagnostic tools for DNS, SSL, and WHOIS lookups.
  icon: https://www.google.com/s2/favicons?domain=domainee.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.domainee.dev/mcp
  headers:
    Authorization: "Bearer ${DOMAINEE_API_KEY}"
config:
  description: A Domainee API key, created at https://domainee.dev/developers. It gives access to the same workspace, scopes, and rate limits as the REST API.
  secrets:
    - name: domainee.api_key
      env: DOMAINEE_API_KEY
      example: sk_live_<YOUR_API_KEY>
