name: unbrowse
type: remote
dynamic:
  tools: true
meta:
  category: tools
  tags:
    - tools
    - web
    - browser
    - scraping
    - remote
about:
  title: Unbrowse
  description: Turn websites into APIs for agents. Read any page as clean markdown, run tasks on sites through learned first-party APIs without a browser, and fall back to a cloud browser with saved logins when nothing matches
  icon: https://www.google.com/s2/favicons?domain=unbrowse.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://unbrowse.ai/mcp
oauth:
  - provider: unbrowse
    secret: unbrowse.personal_access_token
    env: UNBROWSE_PERSONAL_ACCESS_TOKEN
