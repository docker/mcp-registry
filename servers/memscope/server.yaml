name: memscope
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - memory
    - knowledge-management
    - ai-agents
    - remote
about:
  title: MemScope
  description: Governed shared memory for a team's AI agents. Agents save and recall memories; a deterministic policy set by people decides who can read each one, with no admin bypass and an audit log
  icon: https://memscope.ai/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.memscope.ai/mcp
oauth:
  - provider: memscope
    secret: memscope.personal_access_token
    env: MEMSCOPE_PERSONAL_ACCESS_TOKEN
