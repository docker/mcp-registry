name: timeuno
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - time-tracking
    - timesheets
    - remote
about:
  title: TimeUno
  description: Read your automatically tracked time, timeline and projects, and pause tracking or add a note from your AI assistant
  icon: https://raw.githubusercontent.com/KCuppens/timeuno-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://app.timeuno.io/mcp
oauth:
  - provider: timeuno
    secret: timeuno.personal_access_token
    env: TIMEUNO_PERSONAL_ACCESS_TOKEN
