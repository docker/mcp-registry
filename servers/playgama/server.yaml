name: playgama
type: remote
dynamic:
  tools: true
meta:
  category: games
  tags:
    - games
    - game-development
    - html5-games
    - game-publishing
    - remote
about:
  title: Playgama
  description: |
    Publish in seconds, get the audience, start monetization, get all analytics - without leaving your agent.
    Create an HTML5 game and fill in its form, upload builds and covers, edit the in-app catalog and
    leaderboards, get a QA Tool link, and publish a playable sandbox link. 22 tools, 11 of them read-only;
    submitting to moderation, deleting and payouts stay manual. Once the game is live, Playgama DSP can
    bring the first players (beta), Playgama Ad switches on rewarded, interstitial and banner formats after
    the session threshold (access by request), and playtime, retention and revenue reports are in the
    developer dashboard.
  icon: https://static.playgama.com/p-static/static/image/favicon-512.forced.0e230cda.png
remote:
  transport_type: streamable-http
  url: https://developer.playgama.com/api/mcp
oauth:
  - provider: playgama
    secret: playgama.personal_access_token
    env: PLAYGAMA_PERSONAL_ACCESS_TOKEN
