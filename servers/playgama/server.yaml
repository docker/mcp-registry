name: playgama
type: remote
dynamic:
  tools: true
meta:
  category: games
  tags:
    - games
    - game-development
    - html5-games
    - game-publishing
    - remote
about:
  title: Playgama
  description: Publish and manage HTML5 games on Playgama. Create the game and fill in its form, upload builds and covers, edit the in-app catalog and leaderboards, and publish a playable sandbox link
  icon: https://static.playgama.com/p-static/static/image/favicon-512.forced.0e230cda.png
remote:
  transport_type: streamable-http
  url: https://developer.playgama.com/api/mcp
oauth:
  - provider: playgama
    secret: playgama.personal_access_token
    env: PLAYGAMA_PERSONAL_ACCESS_TOKEN
