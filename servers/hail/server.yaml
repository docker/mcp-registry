name: hail
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - phone-numbers
    - registration
    - email
    - sms
    - voice
    - remote
about:
  title: Hail
  description: Get phone numbers in 120 countries through Hail. Handle number registration, US A2P 10DLC, calls, texts, and email over MCP.
  icon: https://hail.so/assets/monogram-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.hail.so
oauth:
  - provider: hail
    secret: hail.personal_access_token
    env: HAIL_PERSONAL_ACCESS_TOKEN
