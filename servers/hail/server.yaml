name: hail
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - email
    - sms
    - voice
    - remote
about:
  title: Hail
  description: Give AI assistants a phone number and an email inbox. Make calls, send texts and email, and read replies.
