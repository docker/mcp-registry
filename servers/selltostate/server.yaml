name: selltostate
type: remote
meta:
  category: search
  tags:
    - search
    - government
    - procurement
    - tenders
    - sales
    - remote
about:
  title: Sell to State
  description: Government tenders, contract awards, buyers and suppliers from official procurement sources in 60+ countries
  icon: https://www.google.com/s2/favicons?domain=selltostate.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.selltostate.com/api/mcp
  headers:
    x-api-key: "${SELLTOSTATE_API_KEY}"
config:
  secrets:
    - name: selltostate.api_key
      env: SELLTOSTATE_API_KEY
      example: <YOUR_API_KEY>
