name: revyl
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - agents
    - infrastructure
    - browser
    - mobile
    - macos
    - remote
about:
  title: Revyl
  description: Verification infrastructure for cloud agents. Gives coding agents cloud web browsers, iOS simulators, Android emulators, and macOS computers to build, run, and verify what they ship, with Atlas as the shared behavioral record.
  icon: https://revyl.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://backend.revyl.ai/api/v1/mcp
oauth:
  - provider: revyl
    secret: revyl.personal_access_token
    env: REVYL_PERSONAL_ACCESS_TOKEN
