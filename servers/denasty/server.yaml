name: denasty
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - memory
    - developer-tools
    - remote
about:
  title: DeNasty Memory
  description: One shared project memory for your AI coding tools. Recall decisions and conventions at the start of work, save new ones, and get a project brief for CLAUDE.md or AGENTS.md. Hosted service by Denha Nexus s.r.o.; secrets are removed before storage (pattern based, not perfect).
  icon: https://denasty.me/icon-512.png
remote:
  transport_type: streamable-http
  url: https://denasty.me/v1/mcp
  headers:
    Authorization: "Bearer ${DENASTY_TOKEN}"
config:
  description: Create a personal access token (starts with dn_pat_) after signing in at https://denasty.me/connect.
  secrets:
    - name: denasty.token
      env: DENASTY_TOKEN
      example: dn_pat_YOUR_TOKEN
