name: yorkerapi-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - cricket
    - sports-data
    - remote
about:
  title: YorkerAPI
  description: "Cricket ball by ball in every format, men's and women's, joined to sportsbook match-winner prices."
  icon: https://www.google.com/s2/favicons?domain=yorkerapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.yorkerapi.com/mcp
oauth:
  - provider: yorkerapi-remote
    secret: yorkerapi-remote.personal_access_token
    env: YORKERAPI_REMOTE_PERSONAL_ACCESS_TOKEN
