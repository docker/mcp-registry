name: speedyindex
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - seo
    - indexing
    - rank-tracker
    - remote
about:
  title: SpeedyIndex
  description: Check whether URLs are indexed in Google, Bing and Yandex, submit URLs for indexing, check backlinks on donor pages and track Google rankings with SpeedyIndex
  icon: https://www.google.com/s2/favicons?domain=speedyindex.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.speedyindex.com/mcp
oauth:
  - provider: speedyindex
    secret: speedyindex.personal_access_token
    env: SPEEDYINDEX_PERSONAL_ACCESS_TOKEN
