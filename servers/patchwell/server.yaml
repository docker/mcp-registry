name: patchwell
type: remote
meta:
  category: productivity
  tags:
    - research
    - transcription
    - data-cleaning
    - remote
about:
  title: Patchwell
  description: Cited web research, transcription with word timestamps and speaker labels, and CSV or Excel cleaning with a log of every change. Pay per call from prepaid credit; a free key with $1 of credit takes one email.
  icon: https://patchwell.io/icon.svg
remote:
  transport_type: streamable-http
  url: https://patchwell.io/mcp/
  headers:
    Authorization: "Bearer ${PATCHWELL_API_KEY}"
config:
  description: Your Patchwell API key (starts with pw_live_). Get a free one at https://patchwell.io/quickstart
  secrets:
    - name: patchwell.api_key
      env: PATCHWELL_API_KEY
      example: <YOUR_API_KEY>
