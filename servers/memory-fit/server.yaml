name: memory-fit
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - fitness
    - training
    - sleep
    - remote
about:
  title: Memory.fit
  description: Connects your watch and health apps to the AI you already use. Your AI reads your training, sleep, recovery and fuel, and writes your plan back to the app and your watch.
  icon: https://raw.githubusercontent.com/Fun-Management-SRL/memory-fit-mcp/HEAD/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://api.memory.fit/mcp
oauth:
  - provider: memory-fit
    secret: memory-fit.personal_access_token
    env: MEMORY_FIT_PERSONAL_ACCESS_TOKEN
