name: vivideo
type: remote
meta:
  category: video
  tags:
    - video
    - ai-video
    - text-to-video
    - image-to-video
    - avatar
    - remote
about:
  title: Vivideo
  description: AI video generation with 30+ models (Veo 3.1, Kling 3.0, Seedance 2.5, Wan 3.0, Grok Imagine 1.5) and auto-made avatar videos with voiceover. Agents can also create an account and pay via a Stripe link (start_signup), then generate.
  icon: https://www.google.com/s2/favicons?domain=vivideo.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://api.vivideo.ai/mcp
  headers:
    Authorization: "Bearer ${VIVIDEO_API_KEY}"
config:
  secrets:
    - name: vivideo.api_key
      env: VIVIDEO_API_KEY
      example: vv_live_...
