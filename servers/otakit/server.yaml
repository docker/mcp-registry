name: otakit
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - mobile
    - capacitor
    - ota-updates
    - remote
about:
  title: OtaKit
  description: Ship over-the-air updates for Capacitor apps. Inspect apps, bundles and releases, publish a release to an exact channel after you approve it, control staged rollouts, read rollout health, and revert.
  icon: https://www.otakit.app/icon.png
remote:
  transport_type: streamable-http
  url: https://console.otakit.app/mcp
oauth:
  - provider: otakit
    secret: otakit.personal_access_token
    env: OTAKIT_PERSONAL_ACCESS_TOKEN
