name: flashloop
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - image-generation
    - text-to-speech
    - remote
about:
  title: Flashloop
  description: "Hosted MCP server for Flashloop: generate AI videos, images, voiceovers and music from Claude, ChatGPT, Cursor and any MCP client with your Flashloop account."
  icon: https://raw.githubusercontent.com/La-Viral-Studio/flashloop-mcp-server/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.flashloop.ai/mcp
oauth:
  - provider: flashloop
    secret: flashloop.personal_access_token
    env: FLASHLOOP_PERSONAL_ACCESS_TOKEN
