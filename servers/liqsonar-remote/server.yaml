name: liqsonar-remote
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - crypto
    - trading
    - market-data
    - remote
about:
  title: LiqSonar
  description: Live crypto futures market data - order-flow signals, detected pumps and dumps, estimated liquidation levels, order book walls and a manipulation-or-organic verdict
