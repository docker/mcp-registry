name: sphior-code
image: mcp/sphior-code
type: server
meta:
  category: security
  tags:
    - security
    - sast
    - secrets
    - code-analysis
about:
  title: SPHIOR CODE
  description: Deterministic security scanning for your code. Finds hard-coded secrets, insecure patterns mapped to CWE and taint flows in 14 languages, and returns fix guidance for each finding. Runs locally with no account; the folder you choose is mounted read-only.
  icon: https://raw.githubusercontent.com/Toraastrta/sphior-code/main/plugin/.claude-plugin/icon.png
source:
  project: https://github.com/Toraastrta/sphior-code
  commit: d6639c00fc874d43dce806433d88a407efc9b08b
  directory: packages/code-mcp
run:
  volumes:
    - "{{sphior-code.workspace}}:/workspace:ro"
config:
  description: Choose the folder to scan. It is mounted read-only, and source code never leaves your machine.
  parameters:
    type: object
    properties:
      workspace:
        type: string
        description: Path to the project folder to scan (e.g. /Users/you/projects/my-app).
    required:
      - workspace
