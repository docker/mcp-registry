name: thedrive
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - file-management
    - documents
    - storage
    - remote
about:
  title: The Drive AI
  description: Find, read and reorganize files across Google Drive, OneDrive, SharePoint and Dropbox, with every change previewed and undoable
  icon: https://thedrive.ai/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.thedrive.ai/mcp
oauth:
  - provider: thedrive
    secret: thedrive.personal_access_token
    env: THEDRIVE_PERSONAL_ACCESS_TOKEN
