name: chime-scheduler
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - linkedin
    - social-media
    - scheduler
    - content-calendar
    - remote
about:
  title: Chime Scheduler
  description: LinkedIn post scheduler. Write, schedule and publish LinkedIn posts from your AI chat, with images, video and a first comment, and edit or cancel posts before they go out.
  icon: https://raw.githubusercontent.com/wednesday-solutions/chime-scheduler/main/logo.png
remote:
  transport_type: streamable-http
  url: https://schedule.getchime.co/mcp
oauth:
  - provider: chime-scheduler
    secret: chime-scheduler.personal_access_token
    env: CHIME_SCHEDULER_PERSONAL_ACCESS_TOKEN
