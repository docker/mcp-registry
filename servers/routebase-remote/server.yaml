name: routebase-remote
type: remote
dynamic:
  tools: true
meta:
  category: developer-tools
  tags:
    - api
    - openapi
    - testing
    - documentation
    - remote
about:
  title: Routebase
  description: Design, mock, test, document and monitor your APIs from one living OpenAPI spec
  icon: https://routebase.dev/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.routebase.dev
  headers:
    X-API-Key: "${ROUTEBASE_API_KEY}"
config:
  secrets:
    - name: routebase-remote.api_key
      env: ROUTEBASE_API_KEY
      example: rb_<YOUR_API_KEY>
