name: repomap
image: mcp/repomap
type: server
meta:
  category: devops
  tags:
    - code
    - code-search
    - code-graph
    - devops
    - developer-tools
about:
  title: Repomap
  description: A map of your codebase for AI agents. Code graph, hybrid symbol and BM25 search, call paths between symbols, and change impact (blast radius, including the current git diff), parsed locally with tree-sitter for 14 languages. No API key.
  icon: https://avatars.githubusercontent.com/u/206448049?s=200&v=4
source:
  project: https://github.com/SylphxAI/repomap
  commit: 9c6fa08275a81138fdd2b329f93c08bc09829855
run:
  volumes:
    - "{{repomap.path}}:/workspace:ro"
  disableNetwork: true
config:
  description: The repository (directory) repomap maps. It is mounted read-only at /workspace.
  parameters:
    type: object
    properties:
      path:
        type: string
        default: /Users/local-test/my-repo
    required:
      - path
