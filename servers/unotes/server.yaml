name: unotes
type: remote
dynamic:
  tools: true
meta:
  category: knowledge
  tags:
    - study
    - university
    - notes
    - remote
about:
  title: UNotes
  description: Search a library of university course materials (past exams, assignments, lab reports, lecture notes) and your uNotes flashcards and quizzes.
  icon: https://raw.githubusercontent.com/DevinoSolutions/mcp-servers/main/unotes/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://unotes.net/api/mcp
oauth:
  - provider: unotes
    secret: unotes.personal_access_token
    env: UNOTES_PERSONAL_ACCESS_TOKEN
