name: schemagate
image: mcp/schemagate
type: server
meta:
  category: database
  tags:
    - database
    - text-to-sql
    - sql
    - postgres
    - mysql
about:
  title: Schemagate
  description: "Saves tokens on text-to-SQL. Instead of sending the model the whole schema, schemagate hands it only the tables a question needs (about 91% fewer schema tokens on 50+ table databases) and only the ones the caller may read. #1 on the BIRD Mini-Dev text-to-SQL leaderboard (SQLite, PostgreSQL, MySQL) and 74.34 on BIRD's hidden test set; listed in LangChain's retriever integrations. Read-only, works with PostgreSQL, MySQL, SQLite, SQL Server and Oracle."
  icon: https://raw.githubusercontent.com/ashishsinha1602/schemagate/60d759386ae422ef24db08b133dba1a74bffe5cc/docs/media/icon.png
source:
  project: https://github.com/ashishsinha1602/schemagate
  commit: 60d759386ae422ef24db08b133dba1a74bffe5cc
run:
  command:
    - mcp
  env:
    SCHEMAGATE_MCP_TRANSPORT: stdio
config:
  description: Configure the database schemagate reads. Enter demo to try it on the bundled sample schema.
  secrets:
    - name: schemagate.database_url
      env: SCHEMAGATE_DATABASE_URL
      example: postgresql+psycopg://readonly_user:password@host.docker.internal:5432/app
      description: SQLAlchemy URL of the database (use a read-only user; host.docker.internal reaches a database on your machine), or demo for the bundled sample schema
