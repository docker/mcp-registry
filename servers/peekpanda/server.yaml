name: peekpanda
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - marketing
    - app-store
    - competitor-research
    - remote
about:
  title: PeekPanda
  description: Competitor intelligence for iOS apps - the Meta ads an app pays for, the US App Store keywords it ranks for, and its viral organic posts, each with the date it was seen
  icon: https://www.google.com/s2/favicons?domain=peekpanda.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.peekpanda.com/mcp
oauth:
  - provider: peekpanda
    secret: peekpanda.personal_access_token
    env: PEEKPANDA_PERSONAL_ACCESS_TOKEN
