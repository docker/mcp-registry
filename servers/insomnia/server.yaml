name: insomnia
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - sast
    - dast
    - pentesting
    - appsec
    - osint
    - cve
    - devsecops
    - remote
about:
  title: Insomnia Security
  description: All-in-one offensive cybersecurity, SAST/taint analysis, live secret validation, SCA/SBOM, OSINT, 21,100+ 1-Day CVE verification, Web DAST, and 29-protocol network enumeration MCP server (160 tools).
  icon: https://insom.ai/static/img/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.insom.ai/mcp
  headers:
    Authorization: Bearer ${INSOMNIA_API_KEY}
config:
  description: Configure your Insomnia API Key (claim 50 free credits at https://mcp.insom.ai/portal).
  secrets:
    - name: insomnia.api_key
      env: INSOMNIA_API_KEY
      example: insom_free_your_key_here
