name: apimodels
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - image-generation
    - video-generation
    - text-to-speech
    - remote
about:
  title: apimodels
  description: Generate and edit images, create videos, synthesize speech and chat with 150+ models (GPT Image, Nano Banana, Seedance, Veo, Kling, Claude, GPT and more) through one account
  icon: https://www.google.com/s2/favicons?domain=apimodels.app&sz=64
remote:
  transport_type: streamable-http
  url: https://api.apimodels.app/mcp
oauth:
  - provider: apimodels
    secret: apimodels.personal_access_token
    env: APIMODELS_PERSONAL_ACCESS_TOKEN
