name: dunkapi-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - basketball
    - nba
    - sports-data
    - remote
about:
  title: DunkAPI
  description: "NBA player props by sportsbook since 2023, plus play-by-play, shot locations and odds. REST and MCP."
  icon: https://www.google.com/s2/favicons?domain=dunkapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.dunkapi.com/mcp
oauth:
  - provider: dunkapi-remote
    secret: dunkapi-remote.personal_access_token
    env: DUNKAPI_REMOTE_PERSONAL_ACCESS_TOKEN
