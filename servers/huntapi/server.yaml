name: huntapi
type: remote
meta:
  category: video
  tags:
    - video
    - audio
    - media
    - remote
about:
  title: HuntAPI
  description: "Download video and audio from public media URLs, or extract their metadata, through async jobs the agent can wait on."
  icon: https://avatars.githubusercontent.com/u/157812325?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.huntapi.com/
  headers:
    x-api-key: "${HUNTAPI_API_KEY}"
config:
  description: Configure your HuntAPI API key
  secrets:
    - name: huntapi.api_key
      env: HUNTAPI_API_KEY
      example: <YOUR_API_KEY>
