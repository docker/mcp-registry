name: agentseo
type: remote
dynamic:
  tools: true
meta:
  category: tools
  tags:
    - seo
    - search
    - analytics
    - remote
about:
  title: AgentSEO
  description: Run SEO research from MCP clients with live search results, keyword research, rank tracking, backlinks, and site audits. Requires an AgentSEO account and API key. Analysis calls can use account credits.
  icon: https://github.com/AgentSEO-dev.png?size=256
remote:
  transport_type: streamable-http
  url: https://www.agentseo.dev/mcp
  headers:
    x-api-key: "${AGENTSEO_API_KEY}"
config:
  secrets:
    - name: agentseo.api_key
      env: AGENTSEO_API_KEY
      example: <YOUR_AGENTSEO_API_KEY>
