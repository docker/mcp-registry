name: zerouter
image: mcp/zerouter
type: server
meta:
  category: ai
  tags:
    - ai
    - llm
    - ai-gateway
about:
  title: Zerouter
  description: AI API gateway for Claude, GPT, Gemini, Grok and Kimi through one OpenAI-compatible Zerouter API key. Chat with any model, compare up to four models side by side with token usage and estimated cost, and look up API pricing per 1M tokens (pricing and model list work without a key).
  icon: https://www.zerouter.ai/icon.svg
source:
  project: https://github.com/ZerouterAI/zerouter-mcp
  commit: 94e313c520252cb90c79049ec92a7e51dbf05d07
config:
  description: Configure your Zerouter API key (needed for chat and compare_models)
  secrets:
    - name: zerouter.api_key
      env: ZEROUTER_API_KEY
      example: sk-xxxx
      description: Create a key in the [Zerouter dashboard](https://www.zerouter.ai). get_pricing and list_models work without it.
