name: gsc-wizard
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - seo
    - google-search-console
    - google-analytics
    - remote
about:
  title: GSC Wizard
  description: Analyze your Google Search Console, Bing Webmaster Tools and GA4 data with SEO audits, ranking changes, content decay, cannibalization and indexing checks
  icon: https://www.gscwizard.com/wizard-logo-icon-512_circle.png
remote:
  transport_type: streamable-http
  url: https://mcp.gscwizard.com/mcp
oauth:
  - provider: gsc-wizard
    secret: gsc-wizard.personal_access_token
    env: GSC_WIZARD_PERSONAL_ACCESS_TOKEN
