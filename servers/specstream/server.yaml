name: specstream
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - web-data
    - lead-generation
    - research
    - remote
about:
  title: SpecStream
  description: Live web data for your agent. Search the live web, read pages (HTML, PDF, Word, Excel) and get structured rows for a request in plain words, every value with its source URL. A paid run shows its price before it starts.
  icon: https://raw.githubusercontent.com/Specstreamai/specstream-tools/main/assets/specstream-icon-400.png
remote:
  transport_type: streamable-http
  url: https://api.specstream.ai/mcp
oauth:
  - provider: specstream
    secret: specstream.personal_access_token
    env: SPECSTREAM_PERSONAL_ACCESS_TOKEN
