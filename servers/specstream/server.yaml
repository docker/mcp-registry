name: specstream
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - web-data
    - lead-generation
    - research
    - remote
about:
  title: SpecStream
  description: Finished lists from the live web for your agent. Ask in plain words for companies, local businesses, grants, tenders, papers or datasets and get only the rows that match, each with its source, priced before anything runs.
  icon: https://raw.githubusercontent.com/Specstreamai/specstream-tools/main/assets/specstream-icon-400.png
remote:
  transport_type: streamable-http
  url: https://api.specstream.ai/mcp
oauth:
  - provider: specstream
    secret: specstream.personal_access_token
    env: SPECSTREAM_PERSONAL_ACCESS_TOKEN
