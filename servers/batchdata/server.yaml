name: batchdata
type: remote
dynamic:
  tools: true
meta:
  category: data-analytics
  tags:
    - real-estate
    - property-data
    - skip-tracing
    - data-analytics
    - geocoding
    - remote
    - oauth
about:
  title: BatchData
  description: "Real estate data for AI agents: property lookup, comparables, property search, owner skip tracing, phone verification, and address verification and geocoding."
  icon: https://batchdata.io/wp-content/uploads/2025/05/cropped-batch-icon-green-2.png
remote:
  transport_type: streamable-http
  url: https://mcp.batchdata.com
oauth:
  - provider: batchdata
    secret: batchdata.api_token
    env: BATCHDATA_API_TOKEN
