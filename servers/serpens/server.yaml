name: serpens
type: remote
meta:
  category: search
  tags:
    - search
    - google
    - serp
    - ai-overview
    - remote
about:
  title: SERPens
  description: Live Google results — organic listings, People Also Ask, and Google's AI Overview with its citations.
  icon: https://raw.githubusercontent.com/starnikovoleg/serpens-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://serpens.p.rapidapi.com/mcp
  headers:
    x-rapidapi-host: serpens.p.rapidapi.com
    x-rapidapi-key: "${SERPENS_API_KEY}"
config:
  description: Requires a RapidAPI key for SERPens. The free plan needs no card.
  secrets:
    - name: serpens.api_key
      env: SERPENS_API_KEY
      example: <YOUR_API_KEY>
