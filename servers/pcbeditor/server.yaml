name: pcbeditor
type: remote
dynamic:
  tools: true
meta:
  category: development
  tags:
    - pcb
    - electronics
    - hardware
    - kicad
    - remote
about:
  title: PCBEditor
  description: Design, route, check and export manufacturable printed circuit boards from a plain-language description, with Gerber and KiCad files
  icon: https://pcbeditor.com/icon-192.png
remote:
  transport_type: streamable-http
  url: https://mcp.pcbeditor.com/mcp
oauth:
  - provider: pcbeditor
    secret: pcbeditor.personal_access_token
    env: PCBEDITOR_PERSONAL_ACCESS_TOKEN
