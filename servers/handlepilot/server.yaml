name: handlepilot
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - instagram
    - social-media
    - content
    - remote
about:
  title: HandlePilot
  description: Research Instagram competitors, break down reels, plan content and write editable carousels and scripts in your voice.
  icon: https://handlepilot.com/images/logo-512.png
remote:
  transport_type: streamable-http
  url: https://app.handlepilot.com/mcp
oauth:
  - provider: handlepilot
    secret: handlepilot.personal_access_token
    env: HANDLEPILOT_PERSONAL_ACCESS_TOKEN
