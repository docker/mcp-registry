name: flowsery-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - web-analytics
    - session-replay
    - remote
about:
  title: Flowsery
  description: Query cookie-free web analytics, including live visitors, traffic breakdowns, goals, revenue, visitor journeys and issues found in session recordings
  icon: https://www.google.com/s2/favicons?domain=flowsery.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.flowsery.com/mcp
oauth:
  - provider: flowsery-remote
    secret: flowsery-remote.personal_access_token
    env: FLOWSERY_REMOTE_PERSONAL_ACCESS_TOKEN
