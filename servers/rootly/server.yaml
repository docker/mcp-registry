name: rootly
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - incident-management
    - on-call
    - remote
about:
  title: Rootly
  description: Manage incidents, investigate alerts, and check on-call schedules with Rootly directly from your AI assistant.
  icon: https://www.google.com/s2/favicons?domain=rootly.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.rootly.com/mcp
  headers:
    Authorization: "Bearer ${ROOTLY_API_TOKEN}"
config:
  secrets:
    - name: rootly.api_token
      env: ROOTLY_API_TOKEN
      example: <YOUR_ROOTLY_API_TOKEN>
