name: minddory
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - education
    - language-learning
    - flashcards
    - remote
about:
  title: MindDory
  description: Turn words from your AI chats into spaced-repetition vocabulary flashcards, check which words you already know, and review what is due
  icon: https://www.google.com/s2/favicons?domain=minddory.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.minddory.com/v1/brain/mcp
oauth:
  - provider: minddory
    secret: minddory.personal_access_token
    env: MINDDORY_PERSONAL_ACCESS_TOKEN
