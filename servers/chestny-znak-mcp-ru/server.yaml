about:
  title: Chestny ZNAK (GIS MT & SUZ) product marking API
  description: Connects an assistant to Chestny ZNAK, the mandatory Russian product marking and traceability system (GIS MT and SUZ). Look up marking codes and their status, export codes by filter, trace a product's route by GTIN, place emission orders, file application reports and verify authenticity. Schema-driven methods sit behind generic search / describe / call tools, and every method is classified read / write / destructive — writes require an explicit confirmation before anything changes in the account. Marking is compulsory for most consumer goods sold in Russia, so this covers a legal obligation rather than a convenience.
  icon: https://raw.githubusercontent.com/ilyautov/chestny-znak-mcp-ru/main/assets/logo.png
