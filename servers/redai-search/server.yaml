name: redai-search
type: remote
meta:
  category: search
  tags:
    - search
    - web-search
    - poland
    - companies
    - remote
about:
  title: RedAi Search
  description: Polish web search engine for AI by redAi. Search .pl websites and Polish companies in one ranking, with contacts, offer and NIP checked against the Polish Ministry of Finance White List.
  icon: https://redai.pl/assets/img/redai-mcp-ikona-256.png
remote:
  transport_type: streamable-http
  url: https://search.redai.pl/mcp
  headers:
    Authorization: "Bearer ${REDAI_SEARCH_API_KEY}"
config:
  secrets:
    - name: redai-search.api_key
      env: REDAI_SEARCH_API_KEY
      example: <YOUR_API_KEY>
