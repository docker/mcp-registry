name: qrcode-barcode-scanner
image: mcp/qrcode-barcode-scanner
type: server
meta:
  category: productivity
  tags:
    - productivity
    - qr-code
    - barcode
    - scanner
    - images
about:
  title: QR Code & Barcode Scanner
  description: Read QR codes and barcodes in local images, offline and read-only, with exact payload bytes and a QR scannability score.
  icon: https://avatars.githubusercontent.com/u/349890106?s=200&v=4
source:
  project: https://github.com/qrcode-ai-com/qrcode-barcode-scanner-mcp
  commit: d79d4a7bf3d526f158f1ac40ae4982055ef7fe8e
run:
  volumes:
    - "{{qrcode-barcode-scanner.path|volume}}"
  disableNetwork: true
config:
  description: The scanner reads image files in this directory with scan_file. It never writes to it.
  env:
    - name: QRSCAN_MCP_ALLOWED_DIRECTORIES
      example: /Users/local-test
      value: "{{qrcode-barcode-scanner.path|volume-target}}"
  parameters:
    type: object
    properties:
      path:
        type: string
        description: Absolute path of a directory of images the scanner may read.
        default: /Users/local-test
    required:
      - path
