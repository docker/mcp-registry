name: steadyscrape-jobs-data
type: remote
meta:
  category: search
  tags:
    - jobs
    - recruiting
    - search
    - data extraction
    - remote
about:
  title: SteadyScrape Jobs Data
  description: Live job postings from employer career sites (Greenhouse, Lever, Ashby, Workday and more) - company job boards, title search across career sites, and remote jobs. Read-only; calls run in your own Apify account using your Apify API token.
  icon: https://apify-image-uploads-prod.s3.us-east-1.amazonaws.com/edcVJcI7rkKrnkf8J-actor-e5sEN9iLUZVwpYdgm-tn7wZpeljH-steadyscrape-logo.png
remote:
  transport_type: streamable-http
  url: https://jobs.mcp.steadyscrape.dev/mcp
  headers:
    Authorization: "Bearer ${APIFY_API_KEY}"
config:
  secrets:
    - name: steadyscrape-jobs-data.api_key
      env: APIFY_API_KEY
      example: apify_api_xxxxxxxx
