name: steadyscrape-jobs-data
type: remote
meta:
  category: search
  tags:
    - jobs
    - recruiting
    - search
    - data extraction
    - remote
about:
  title: SteadyScrape Jobs Data
  description: Live job postings straight from company career sites (Greenhouse, Lever, Ashby, Workday and 10+ other ATS platforms) plus remote jobs filtered by eligible country and time zone. Runs on Apify; uses your Apify API token.
  icon: https://www.google.com/s2/favicons?domain=apify.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.apify.com/?tools=steady-scrape/ats-job-feed,steady-scrape/career-jobs-search,steady-scrape/remote-jobs-api
  headers:
    Authorization: "Bearer ${APIFY_API_KEY}"
config:
  secrets:
    - name: steadyscrape-jobs-data.api_key
      env: APIFY_API_KEY
      example: apify_api_xxxxxxxx
