name: snaprender
type: remote
dynamic:
  tools: true
meta:
  category: tools
  tags:
    - tools
    - browser
    - screenshots
    - pdf
    - web-scraping
    - remote
about:
  title: SnapRender
  description: Screenshot any URL as PNG, JPEG, WebP or PDF, extract page content as markdown and run batches of up to 50 URLs
  icon: https://www.google.com/s2/favicons?domain=snap-render.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.snap-render.com/mcp
oauth:
  - provider: snaprender
    secret: snaprender.personal_access_token
    env: SNAPRENDER_PERSONAL_ACCESS_TOKEN
