name: remcp
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - developer-tools
    - remote
    - automation
    - terminal
    - mcp
about:
  title: ReMcp
  description: Securely work with files, terminals, screenshots, search, and processes on computers you explicitly pair with ReMCP
  icon: https://raw.githubusercontent.com/antonbaider/remcp/main/assets/remcp-marketplace-400.png
remote:
  transport_type: streamable-http
  url: https://remcp.site/mcp
oauth:
  - provider: remcp
    secret: remcp.personal_access_token
    env: REMCP_PERSONAL_ACCESS_TOKEN
