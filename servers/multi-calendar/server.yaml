name: multi-calendar
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - calendar
    - scheduling
    - remote
about:
  title: Multi Calendar
  description: Your Outlook.com, Hotmail, Microsoft 365 and Google calendars - many accounts at once, one search for free time across all of them. Read, create, move and cancel events, answer invitations, make booking links, booking pages and group polls. No copy kept.
  icon: https://lumman.co/icon-512.png
remote:
  transport_type: streamable-http
  url: https://calendar.lumman.co/mcp
oauth:
  - provider: multi-calendar
    secret: multi-calendar.personal_access_token
    env: MULTI_CALENDAR_PERSONAL_ACCESS_TOKEN
