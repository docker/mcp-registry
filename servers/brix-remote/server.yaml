name: brix-remote
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - digital-signage
    - screens
    - content-management
    - remote
about:
  title: Brix Signage
  description: Manage digital signage screens, playlists, schedules and media, put content on screens, check screen status and pull uptime and proof-of-play reports.
