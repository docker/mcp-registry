name: formfeed
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - pdf
    - documents
    - remote
about:
  title: Formfeed
  description: Render PDFs and images from your Formfeed templates (HTML in Jinja2, Liquid or Handlebars, or Word and PowerPoint files), check data against a template's schema, and convert Office documents to PDF.
  icon: https://formfeed.dev/brand/formfeed-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.formfeed.dev/mcp
  headers:
    Authorization: "Bearer ${FORMFEED_API_KEY}"
config:
  secrets:
    - name: formfeed.api_key
      env: FORMFEED_API_KEY
      example: <YOUR_FORMFEED_API_KEY>
