name: semantichub
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - news
    - monitoring
    - content
    - remote
about:
  title: SemanticHub
  description: Monitor news sources, read clustered articles and generated texts, and manage goals and workflows
  icon: https://www.google.com/s2/favicons?domain=semantichub.app&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.semantichub.app/mcp
oauth:
  - provider: semantichub
    secret: semantichub.personal_access_token
    env: SEMANTICHUB_PERSONAL_ACCESS_TOKEN
