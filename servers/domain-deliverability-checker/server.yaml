config:
  description: Configure the connection to the Apify API
  secrets:
    - name: domain-deliverability-checker.apify_token
      env: APIFY_TOKEN
      example: <APIFY_TOKEN>
      description: Apify API token, created at https://console.apify.com/account/integrations
