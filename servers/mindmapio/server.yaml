name: mindmapio
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - mindmap
    - brainstorming
    - research
    - remote
about:
  title: Mindmap.io
  description: Create mindmaps of any topic from any AI agent. Every node can be an AI chat.
  icon: https://mindmap.io/favicon.png
remote:
  transport_type: streamable-http
  url: https://mindmap.io/mcp
oauth:
  - provider: mindmapio
    secret: mindmapio.personal_access_token
    env: MINDMAPIO_PERSONAL_ACCESS_TOKEN
