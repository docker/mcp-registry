name: screenverb
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - screenshots
    - ocr
    - search
    - remote
about:
  title: ScreenVerb
  description: Search, read and organize the screenshots in your ScreenVerb cloud library, including the text inside them
  icon: https://www.google.com/s2/favicons?domain=screenverb.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.screenverb.com/mcp
oauth:
  - provider: screenverb
    secret: screenverb.personal_access_token
    env: SCREENVERB_PERSONAL_ACCESS_TOKEN
