name: mcptoon
image: mcp/mcptoon
type: server
meta:
  category: development
  tags:
    - mcp
    - token-optimization
    - toon
    - python
    - cli
about:
  title: Mcptoon
  description: |
    MCP client and token-efficient tool manifest layer: register your upstream MCP servers once,
    then serve tool manifests to models in compressed TOON form instead of full JSON, so tool
    definitions stop eating the context window. Measured on a 255-server manifest:
    71,929 -> 581 tokens (-99.2%), round-trip lossless.
  icon: https://avatars.githubusercontent.com/u/305860409?v=4&s=64
source:
  project: https://github.com/activeing123/mcptoon
  commit: f1149b840247ae0a344647036e3d32865c6edfe9
run:
  command:
    - serve
config:
  description: mcptoon - upstream servers registered via `mcptoon add` / `mcptoon scan`; no secrets required to start
