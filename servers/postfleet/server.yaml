name: postfleet
type: remote
meta:
  category: communication
  tags:
    - communication
    - email
    - inbox
    - agents
    - remote
about:
  title: Postfleet
  description: "Give an AI agent its own email address: send, reply, read, and wait for mail."
  icon: https://postfleet.ai/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://api.postfleet.ai/api/mcp
  headers:
    Authorization: "Bearer ${POSTFLEET_API_KEY}"
config:
  secrets:
    - name: postfleet.api_key
      env: POSTFLEET_API_KEY
      example: <YOUR_API_KEY>
