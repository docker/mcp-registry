name: makeviral
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - image-generation
    - content-creation
    - remote
about:
  title: MakeViral
  description: Find the newest viral AI video and photo trend templates and make them from your own photos, or make any AI image or video from a prompt
