name: lurkapi
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - social-media
    - data
    - remote
about:
  title: LurkAPI
  description: Read public posts, profiles, comments, video transcripts and ad library results from 16 social platforms, including TikTok, Instagram, YouTube, Reddit, X and LinkedIn. Paid per call, with free credits at signup.
  icon: https://lurkapi.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.lurkapi.com/mcp
oauth:
  - provider: lurkapi
    secret: lurkapi.personal_access_token
    env: LURKAPI_PERSONAL_ACCESS_TOKEN
