name: zillapi
type: remote
dynamic:
  tools: true
meta:
  category: data-analytics
  tags:
    - real-estate
    - property-data
    - housing
    - data-analytics
    - remote
about:
  title: ZillAPI
  description: U.S. property data for AI agents from Zillow listings, 200+ fields per property, including property details by address, URL or zpid, Zestimates, listing search, photos, schools, and tax and price history
  icon: https://zillapi.com/mcp-icon-128.png
remote:
  transport_type: streamable-http
  url: https://api.zillapi.com/mcp
oauth:
  - provider: zillapi
    secret: zillapi.personal_access_token
    env: ZILLAPI_PERSONAL_ACCESS_TOKEN
