name: sluicer
image: mcp/sluicer
type: server
meta:
  category: search
  tags:
    - scraping
    - structured-data
    - json-ld
    - schema-org
    - extraction
about:
  title: Sluicer
  description: The data a web page declares, with where each value came from. JSON-LD, microdata, RDFa, OpenGraph and four more vocabularies merged into one record per thing, extractors that fail loudly when a site changes, and audits against what Google documents. No model, no API key; every tool only reads.
  icon: https://raw.githubusercontent.com/Gi0tto/sluicer/main/docs/assets/mark-512.png
source:
  project: https://github.com/Gi0tto/sluicer
  commit: 31d3e396bf09c885f783cc275432126d39db4a84
config:
  description: Choose which of Sluicer's twelve tools to offer
  env:
    - name: SLUICER_MCP_TOOLS
      example: ""
      value: "{{sluicer.tools}}"
  parameters:
    type: object
    properties:
      tools:
        type: string
        description: Comma-separated tool names, such as extract_declared,page_markdown. Empty offers all twelve.
