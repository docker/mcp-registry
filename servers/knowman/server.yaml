name: knowman
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - knowledge-management
    - read-it-later
    - search
    - remote
about:
  title: KnowMan
  description: Save links and articles, then search, read and ask questions over your personal knowledge base with cited answers.
  icon: https://raw.githubusercontent.com/Essatt/knowman-mcp/main/icon.png
remote:
  transport_type: streamable-http
  url: https://api.knowman.io/mcp
  headers:
    Authorization: "Bearer ${KNOWMAN_API_KEY}"
config:
  description: Connect to your KnowMan account with an API key from Settings, then API keys at https://app.knowman.io
  secrets:
    - name: knowman.api_key
      env: KNOWMAN_API_KEY
      example: <YOUR_KNOWMAN_API_KEY>
