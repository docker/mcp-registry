name: qarunbook
type: remote
meta:
  category: development
  tags:
    - testing
    - qa
    - test-management
    - development
    - remote
about:
  title: qarunbook
  description: Shared app-testing runbook - read the test plan, record results per platform, raise and fix issues. A fixed issue sends the check back for a retest rather than passing.
  icon: https://www.google.com/s2/favicons?domain=qarunbook.com&sz=64
remote:
  transport_type: streamable-http
  url: https://qarunbook.com/api/mcp
  headers:
    Authorization: "Bearer ${QARUNBOOK_TOKEN}"
config:
  secrets:
    - name: qarunbook.token
      env: QARUNBOOK_TOKEN
      example: <YOUR_TOKEN>
