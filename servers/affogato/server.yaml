name: affogato
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - ai
    - image-generation
    - video-generation
    - remote
about:
  title: Affogato
  description: Generate AI images, videos and audio using Affogato workspace credits. Includes speech, lipsync, talking heads, headshots, virtual try-on and product photography. OAuth sign-in required. New credit top-ups require an existing subscription.
  icon: https://affogato.ai/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.affogato.ai/mcp
oauth:
  - provider: affogato
    secret: affogato.personal_access_token
    env: AFFOGATO_PERSONAL_ACCESS_TOKEN
