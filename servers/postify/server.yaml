name: postify
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - social-media
    - scheduling
    - marketing
    - remote
about:
  title: Postify
  description: Draft, schedule and publish social media posts to your connected channels, and read post analytics, from your Postify calendar.
  icon: https://www.google.com/s2/favicons?domain=usepostify.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.usepostify.com/api/mcp
oauth:
  - provider: postify
    secret: postify.personal_access_token
    env: POSTIFY_PERSONAL_ACCESS_TOKEN
