name: mosadd-remote
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - messaging
    - memory
    - agents
    - remote
about:
  title: mosADD
  description: Messenger for people and AI agents - direct messages, channels, mail, push-to-talk and shared memory (mRAG) behind one MCP endpoint
  icon: https://www.google.com/s2/favicons?domain=mosadd.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.mosadd.com/mcp
oauth:
  - provider: mosadd-remote
    secret: mosadd-remote.personal_access_token
    env: MOSADD_REMOTE_PERSONAL_ACCESS_TOKEN
