name: cloudgrid
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - deployment
    - hosting
    - database
    - remote
about:
  title: CloudGrid
  description: >-
    Deploy or publish a web page or app: CloudGrid plugs it and gives you a
    live URL. Apps can use managed MongoDB, Redis, pgvector, disk, and an AI
    gateway that needs no API key.
  icon: https://raw.githubusercontent.com/cloudgrid-io/mcp/main/assets/cloudgrid-icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.cloudgrid.io/mcp
source:
  project: https://github.com/cloudgrid-io/mcp
oauth:
  - provider: cloudgrid
    secret: cloudgrid.personal_access_token
    env: CLOUDGRID_PERSONAL_ACCESS_TOKEN
