name: netlicensing-mcp
image: labs64/netlicensing-mcp
type: server
meta:
  category: ecommerce
  tags:
    - licensing
    - license-management
    - saas
    - labs64
    - entitlements
about:
  title: NetLicensing
  description: Manage your software licensing in plain language. Create products and license templates, add licensees, issue and validate licenses, generate shop links, and audit your NetLicensing account.
  icon: https://avatars.githubusercontent.com/u/1461983?s=200&v=4
source:
  project: https://github.com/Labs64/NetLicensing-MCP
  commit: 74fdcd75ae6f4bede2471d7cd9a291a95701e2eb
config:
  description: Connect to your NetLicensing vendor account. Get your API key at ui.netlicensing.io and paste it below.
  secrets:
    - name: netlicensing-mcp.api_key
      env: NETLICENSING_API_KEY
      example: <NETLICENSING_API_KEY>
  env:
    - name: NETLICENSING_BASE_URL
      example: https://go.netlicensing.io/core/v2/rest
      value: "{{netlicensing-mcp.base_url}}"
  parameters:
    type: object
    properties:
      base_url:
        type: string
        description: NetLicensing API address. Leave the default unless you run your own NetLicensing server.
        default: https://go.netlicensing.io/core/v2/rest
