name: storyshort
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - content-creation
    - remote
about:
  title: StoryShort
  description: Turn a story idea into a narrated faceless short video with AI-generated scenes and voice on your StoryShort (storyshort.app) account; renders spend credits
  icon: https://www.google.com/s2/favicons?domain=storyshort.app&sz=64
remote:
  transport_type: streamable-http
  url: https://storyshort.app/api/mcp
oauth:
  - provider: storyshort
    secret: storyshort.personal_access_token
    env: STORYSHORT_PERSONAL_ACCESS_TOKEN
