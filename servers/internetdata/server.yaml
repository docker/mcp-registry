name: internetdata
type: remote
meta:
  category: database
  tags:
    - database
    - ip-intelligence
    - asn
    - remote
about:
  title: InternetData
  description: List InternetData's IP and ASN databases, your license for each, what one holds, and its digests.
  icon: https://www.google.com/s2/favicons?domain=internetdata.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.internetdata.io/mcp
  headers:
    Authorization: "Bearer ${INTERNETDATA_API_KEY}"
config:
  secrets:
    - name: internetdata.api_key
      env: INTERNETDATA_API_KEY
      example: <YOUR_API_KEY>
