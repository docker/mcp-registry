name: crbro-memory
image: mcp/crbro-memory
type: server
longLived: true
meta:
  category: ai
  tags:
    - memory
    - ai
    - knowledge-base
about:
  title: CRBRO Memory
  description: Persistent local memory for AI agents, kept as plain JSON in a Docker volume. A correction replaces the old fact, values that may be out of date come back flagged, and a question with nothing stored behind it is answered as such.
  icon: https://raw.githubusercontent.com/Octonove/crbro-memory/master/mcpb/icon.png
source:
  project: https://github.com/Octonove/crbro-memory
  commit: b77fd873f412f2177658be6ea29272c15671da58
run:
  volumes:
    - crbro-memory:/data
  env:
    CRBRO_PATH: /data/brain
  disableNetwork: true
