name: mcpemails
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - email
    - imap
    - smtp
    - gmail
    - communication
    - remote
about:
  title: Emails
  description: Read, search, organize, draft, send and schedule email from Gmail or any IMAP/SMTP mailbox. Mail is fetched live from your provider on every call and never stored, and outbound mail is sent through your own SMTP from your real address.
  icon: https://www.google.com/s2/favicons?domain=mcpemails.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcpemails.com/api/mcp
  headers:
    Authorization: "Bearer ${MCPEMAILS_API_KEY}"
config:
  description: Configure access to your MCP Emails workspace with a scoped API key
  secrets:
    - name: mcpemails.api_key
      env: MCPEMAILS_API_KEY
      example: <YOUR_API_KEY>
