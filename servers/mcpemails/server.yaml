name: mcpemails
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - email
    - imap
    - smtp
    - gmail
    - outlook
    - communication
    - remote
about:
  title: Emails
  description: "Hosted email for AI agents. Connect Gmail, Outlook / Microsoft 365 or any IMAP mailbox to Claude, ChatGPT, Cursor and other MCP clients, then read, search, send, organize, draft, schedule and auto-triage mail. Email is fetched live and never stored. Free for 1 inbox and 150 email actions a month."
  icon: https://mcpemails.com/icon.png
remote:
  transport_type: streamable-http
  url: https://mcpemails.com/api/mcp
  headers:
    Authorization: "Bearer ${MCPEMAILS_API_KEY}"
config:
  description: Configure access to your MCP Emails workspace with a scoped API key
  secrets:
    - name: mcpemails.api_key
      env: MCPEMAILS_API_KEY
      example: <YOUR_API_KEY>
