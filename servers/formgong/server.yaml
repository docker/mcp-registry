name: formgong
type: remote
meta:
  category: productivity
  tags:
    - forms
    - leads
    - webhooks
    - remote
about:
  title: Formgong
  description: Create website contact and lead forms, get the HTML snippet, read recent submissions and manage webhooks that deliver leads to Telegram, Discord, Slack or any URL
  icon: https://www.google.com/s2/favicons?domain=formgong.com&sz=64
remote:
  transport_type: streamable-http
  url: https://formgong.com/mcp
  headers:
    Authorization: "Bearer ${FORMGONG_API_TOKEN}"
config:
  secrets:
    - name: formgong.api_token
      env: FORMGONG_API_TOKEN
      example: <YOUR_FORMGONG_API_TOKEN>
