about:
  title: AeonProxy
  description: Residential and mobile proxies for AI agents. Look up proxy locations, prices and ISP or datacenter IP stock, test proxies and search the setup guides without an account; after signing in, generate proxy lines, check traffic and orders, and fetch a page through a proxy in a chosen country.
