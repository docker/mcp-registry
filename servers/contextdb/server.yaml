name: contextdb
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - memory
    - context
    - agents
    - remote
about:
  title: ContextDB
  description: Persistent cross-session customer memory, working context continuity, and slot-scoped pre-action evidence checks (act, ask, abstain) for AI agents.
  icon: https://contextdb.ai/assets/favicon.svg
remote:
  transport_type: streamable-http
  url: https://api.contextdb.ai/mcp
oauth:
  - provider: contextdb
    secret: contextdb.personal_access_token
    env: CONTEXTDB_PERSONAL_ACCESS_TOKEN
