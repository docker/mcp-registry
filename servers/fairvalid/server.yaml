name: fairvalid
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - email-verification
    - productivity
    - remote
about:
  title: FairValid
  description: Verify email addresses, read asynchronous verification results, and check workspace credits. Live verification can consume credits.
  icon: https://fairvalid.com/brand/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.fairvalid.com/mcp
oauth:
  - provider: fairvalid
    secret: fairvalid.personal_access_token
    env: FAIRVALID_PERSONAL_ACCESS_TOKEN
