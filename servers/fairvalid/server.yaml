name: fairvalid
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - email-verification
    - lead-discovery
    - productivity
    - remote
about:
  title: FairValid
  description: >-
    Verify email addresses, read verification jobs and workspace credits, and
    discover business leads with FairMatch. Quote selected leads before unlocking
    verified work emails with explicit credit-limit approval. Live operations
    can consume credits.
  icon: https://fairvalid.com/brand/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.fairvalid.com/mcp
oauth:
  - provider: fairvalid
    secret: fairvalid.personal_access_token
    env: FAIRVALID_PERSONAL_ACCESS_TOKEN
