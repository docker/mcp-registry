name: proofsnap
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - evidence
    - legal
    - web-capture
    - remote
about:
  title: ProofSnap
  description: Preserve public web pages as signed, timestamped evidence packages, then verify them, compare versions and monitor pages for changes.
  icon: https://www.google.com/s2/favicons?domain=getproofsnap.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.getproofsnap.com/mcp
oauth:
  - provider: proofsnap
    secret: proofsnap.personal_access_token
    env: PROOFSNAP_PERSONAL_ACCESS_TOKEN
