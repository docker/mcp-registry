name: pinnfeed
type: remote
meta:
  category: finance
  tags:
    - finance
    - sports
    - odds
    - remote
about:
  title: PinnFeed
  description: Live and prematch Pinnacle odds, no-vig fair prices, price drops and closing lines for AI assistants
  icon: https://pinnfeed.io/logo.png
remote:
  transport_type: streamable-http
  url: https://pinnfeed.io/mcp
  headers:
    Authorization: "Bearer ${PINNFEED_API_KEY}"
config:
  secrets:
    - name: pinnfeed.api_key
      env: PINNFEED_API_KEY
      example: <YOUR_API_KEY>
