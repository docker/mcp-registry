name: pluginstack-mcp
image: mcp/pluginstack-mcp
type: server
meta:
  category: search
  tags:
    - search
    - directory
    - mcp
    - guides
    - ai
about:
  title: PluginStack
  description: Search PluginStack's hand-checked directory of MCP servers, AI plugins, agent tools and setup guides.
  icon: https://raw.githubusercontent.com/pluginstackai/pluginstack-mcp/main/icon.png
source:
  project: https://github.com/pluginstackai/pluginstack-mcp
  commit: bcea0c9b825a558b7acaf52247e95b79dc96b17e
run:
  allowHosts:
    - www.pluginstackai.com:443
config:
  description: Optional settings. The server works with no configuration. It loads PluginStack's public directory, or a bundled snapshot if the site cannot be reached.
  env:
    - name: PLUGINSTACK_OFFLINE
      example: "1"
      value: "{{pluginstack-mcp.offline}}"
    - name: PLUGINSTACK_DIRECTORY_URL
      example: https://www.pluginstackai.com/directory.json
      value: "{{pluginstack-mcp.directory_url}}"
  parameters:
    type: object
    properties:
      offline:
        type: string
        description: Set to 1 to use only the bundled snapshot and make no network requests.
      directory_url:
        type: string
        description: Where to load the directory from. Defaults to https://www.pluginstackai.com/directory.json if left empty.
