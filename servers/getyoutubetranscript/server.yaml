name: getyoutubetranscript
type: remote
meta:
  category: search
  tags:
    - youtube
    - transcript
    - search
    - remote
about:
  title: GetYouTubeTranscript
  description: YouTube video transcripts in any caption language a video has, plus YouTube search, channel browsing and playlist extraction.
  icon: https://www.google.com/s2/favicons?domain=getyoutubetranscript.com&sz=64
remote:
  transport_type: streamable-http
  url: https://getyoutubetranscript.com/api/mcp
  headers:
    Authorization: "Bearer ${GETYOUTUBETRANSCRIPT_API_KEY}"
config:
  secrets:
    - name: getyoutubetranscript.api_key
      env: GETYOUTUBETRANSCRIPT_API_KEY
      example: <YOUR_API_KEY>
