name: getyoutubetranscript
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - youtube
    - transcript
    - search
    - video
    - remote
about:
  title: GetYouTubeTranscript
  description: Get YouTube video transcripts (optionally with per-line timestamps), search YouTube, and list a channel's or playlist's videos
  icon: https://getyoutubetranscript.com/images/logo.png
remote:
  transport_type: streamable-http
  url: https://getyoutubetranscript.com/api/mcp
oauth:
  - provider: getyoutubetranscript
    secret: getyoutubetranscript.personal_access_token
    env: GETYOUTUBETRANSCRIPT_PERSONAL_ACCESS_TOKEN
