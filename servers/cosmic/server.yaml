name: cosmic
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - cms
    - content
    - productivity
    - remote
about:
  title: Cosmic
  description: Manage Cosmic CMS content, media, object types, and AI generation.
  icon: https://raw.githubusercontent.com/cosmicjs/mcp/4454ad208d71b43ad996a4aec1eda4745b00f767/listing/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.cosmicjs.com/v1/buckets/${COSMIC_BUCKET_SLUG}
  headers:
    Authorization: "Bearer ${COSMIC_READ_KEY}"
    X-Cosmic-Write-Key: "${COSMIC_WRITE_KEY}"
config:
  description: Bucket slug and read key are required. Add the write key to create, update, delete, and generate.
  secrets:
    - name: cosmic.bucket_slug
      env: COSMIC_BUCKET_SLUG
      example: your-bucket-slug
    - name: cosmic.read_key
      env: COSMIC_READ_KEY
      example: your-read-key
    - name: cosmic.write_key
      env: COSMIC_WRITE_KEY
      example: your-write-key
      required: false
