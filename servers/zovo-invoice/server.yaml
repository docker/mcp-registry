name: zovo-invoice
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - invoicing
    - billing
    - remote
about:
  title: Zovo Invoice
  description: Create numbered, tax-correct invoices and render them as PDF from any MCP client, with recurring schedules and an overdue report.
  icon: https://mcp.zovo.one/favicon.ico
remote:
  transport_type: streamable-http
  url: https://mcp.zovo.one/mcp/invoice
  headers:
    Authorization: "Bearer ${ZOVO_INVOICE_TOKEN}"
config:
  secrets:
    - name: zovo-invoice.token
      env: ZOVO_INVOICE_TOKEN
      example: <free token from https://mcp.zovo.one/mcp/token>
