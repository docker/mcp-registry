name: vidwords
type: remote
meta:
  category: search
  tags:
    - youtube
    - transcripts
    - video
    - search
    - remote
about:
  title: VidWords YouTube
  description: Search a YouTube video's transcript and read its frames — slides, charts, demos and on-screen text — with every answer citing a clickable timestamp.
  icon: https://www.google.com/s2/favicons?domain=vidwords.com&sz=64
remote:
  transport_type: streamable-http
  url: https://vidwords.com/mcp
  headers:
    Authorization: "Basic ${VIDWORDS_API_TOKEN}"
config:
  secrets:
    - name: vidwords.api_token
      env: VIDWORDS_API_TOKEN
      example: <YOUR_API_TOKEN>
