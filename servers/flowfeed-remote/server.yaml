name: flowfeed-remote
type: remote
meta:
  category: finance
  tags:
    - finance
    - news
    - forex
    - macro
    - remote
about:
  title: FlowFeed
  description: Real-time macro, forex and crypto news for AI agents. Central bank releases (Fed, ECB, BoE, BoJ), economic data parsed into actual vs forecast, an economic calendar and deduplicated market headlines, each with source, publish time and link.
  icon: https://raw.githubusercontent.com/loyt1/flowfeed-mcp/main/logo-400.png
remote:
  transport_type: streamable-http
  url: https://mcp.flowfeed.cc
  headers:
    Authorization: "Bearer ${FLOWFEED_REMOTE_API_KEY}"
config:
  secrets:
    - name: flowfeed-remote.api_key
      env: FLOWFEED_REMOTE_API_KEY
      example: <YOUR_FLOWFEED_KEY>
