name: urlpipe
type: remote
meta:
  category: web-scraping
  tags:
    - web-scraping
    - markdown
    - screenshot
    - lighthouse
    - remote
about:
  title: URLpipe
  description: Read any page after its JavaScript runs. Returns clean Markdown, rendered HTML, full-page screenshots, reconciled Open Graph and JSON-LD metadata, console errors, Lighthouse audits, summaries and keywords for a URL, with cached results free for up to 30 days.
  icon: https://www.google.com/s2/favicons?domain=urlpipe.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://urlpipe.dev/mcp
  headers:
    Authorization: "Bearer ${URLPIPE_TOKEN}"
config:
  secrets:
    - name: urlpipe.token
      env: URLPIPE_TOKEN
      example: <YOUR_ORGANIZATION_TOKEN>
