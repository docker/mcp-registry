about:
  title: Omniseal
  description: >-
    Conceal, retrieve, verify, and remove hidden files with PureCipher Omniseal.
    File inputs require reachable HTTPS URLs or exact base64 bytes. Outputs are
    binary MCP resources limited to 140,000 serialized characters. Selected file
    contents and operation seeds are processed by PureCipher's hosted service.
  icon: https://raw.githubusercontent.com/PureCipher/omniseal-vscode/main/icon.png
remote:
  transport_type: streamable-http
  url: https://api.purecipher.com/mcp?platform=claude
