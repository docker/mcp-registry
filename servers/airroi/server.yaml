name: airroi
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - airbnb
    - short-term-rental
    - vacation-rental
    - real-estate
    - market-data
    - travel
    - remote
about:
  title: AirROI Airbnb Market Data
  description: Airbnb and short-term rental market data for 20M+ listings in 190+ countries. Occupancy, ADR, RevPAR, revenue, comps, live Airbnb calendars and price recommendations. Calls start at $0.01.
  icon: https://www.airroi.com/static/airroi-192x192-square.png
remote:
  transport_type: streamable-http
  url: https://mcp.airroi.com
  headers:
    X-API-KEY: "${AIRROI_API_KEY}"
config:
  description: Every request needs an AirROI API key, sent as the X-API-KEY header. Get a free key at https://www.airroi.com/api.
  secrets:
    - name: airroi.api_key
      env: AIRROI_API_KEY
      example: <YOUR_API_KEY>
