config:
  description: Configure the VK token the server acts with
  secrets:
    - name: vk.access_token
      env: VK_ACCESS_TOKEN
      example: vk1.a.<your-token>
      description: A community token — community → Manage → API usage → Access tokens, ticking wall, photos, stories, messages and manage. It posts, comments, publishes stories and handles messages as the community, and is tied to neither a browser nor an IP. A service key from your VK app works too, for public reads only. See the [setup guide](https://github.com/bulatko/vk-mcp-server/blob/master/docs/SETUP.md).
