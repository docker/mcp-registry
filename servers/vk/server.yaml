about:
  title: VK
  description: Run a VK (VKontakte) community from an AI assistant — work through the community inbox and reply as the community, publish posts, comments and stories, and read walls, profiles and communities. Writes are annotated so clients ask first, every tool declares an output schema, and walls, communities and profiles render as cards on hosts with MCP Apps.
  icon: https://www.google.com/s2/favicons?domain=vk.com&sz=64
