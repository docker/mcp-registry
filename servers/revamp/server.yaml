name: revamp
type: remote
dynamic:
  tools: true
meta:
  category: developer-tools
  tags:
    - developer-tools
    - website-builder
    - website-redesign
    - web-app
    - remote
about:
  title: Revamp
  description: Create or redesign websites and build web apps by chatting. Preview the result and keep refining it in the same conversation.
