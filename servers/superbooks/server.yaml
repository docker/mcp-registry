name: superbooks
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - bookkeeping
    - invoices
    - accounting
    - remote
about:
  title: SuperBooks
  description: Work with your SuperBooks books: transactions and categories, invoices, customers, receipts, time tracking and financial reports.
  icon: https://raw.githubusercontent.com/DevinoSolutions/mcp-servers/main/superbooks/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://app.superbooks.io/mcp
oauth:
  - provider: superbooks
    secret: superbooks.personal_access_token
    env: SUPERBOOKS_PERSONAL_ACCESS_TOKEN
