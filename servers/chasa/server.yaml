name: chasa
type: remote
meta:
  category: finance
  tags:
    - finance
    - invoicing
    - ai
    - remote
about:
  title: Chasa
  description: AI-drafted invoice follow-up emails for freelancers. Draft-only — never sends anything on your behalf. Free tier works without a key; a paid API key removes the monthly draft cap.
  icon: https://www.google.com/s2/favicons?domain=chasa.io&sz=64
remote:
  transport_type: streamable-http
  url: https://api.chasa.io/mcp
  headers:
    Authorization: "Bearer ${CHASA_API_KEY}"
config:
  description: Optionally provide a Chasa API key to remove the free-tier draft cap. draft_chase_email and get_chase_tip work without one.
  secrets:
    - name: chasa.api_key
      env: CHASA_API_KEY
      example: <YOUR_API_KEY>
      required: false
