about:
  title: EU & Nordic Open Data
  description: Official EU and Nordic open data for AI agents — TED tenders, EU sanctions, VIES VAT, ECB rates, Finnish PRH and Norwegian Brreg company events, Fingrid grid signals and FMI weather. Licence attribution in every response.
  icon: https://raw.githubusercontent.com/itulo/eu-nordic-open-data-mcp/main/assets/logo-400.png
source:
  project: https://github.com/itulo/eu-nordic-open-data-mcp
  commit: d26f340379fc6e9bdec2108055fc705bf3a20175
config:
  description: Optional free Fingrid API key. Required only for fingrid_* tools; every other tool runs without a key.
  env:
    - name: FINGRID_API_KEY
      example: your_fingrid_api_key
      value: "{{eu-nordic-open-data-mcp.fingrid_api_key}}"
  parameters:
    type: object
    properties:
      fingrid_api_key:
        type: string
        description: Optional free CC BY 4.0 API key from data.fingrid.fi, required only for fingrid_* tools
