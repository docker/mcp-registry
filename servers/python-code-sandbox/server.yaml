name: python-code-sandbox
image: mcp/python-code-sandbox
type: server
meta:
  category: devops
  tags:
    - python
    - sandbox
    - code-execution
    - docker
about:
  title: Python Code Sandbox
  description: >-
    A secure, isolated Python execution environment. Runs code in disposable or
    persistent Docker containers, installs pip dependencies on demand, and
    returns stdout, stderr, and any files or plots the script produces.
  icon: https://cdn.jsdelivr.net/npm/simple-icons@v7/icons/python.svg
source:
  project: https://github.com/li-xiu-qi/python-code-sandbox-mcp
  commit: 5af8cf635d9c03040387ac651c6c6917728c3809
run:
  env:
    SANDBOX_MEMORY_LIMIT: "2g"
    SANDBOX_CPU_QUOTA: "50000"
    ENABLE_PIP_CACHE: "true"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
