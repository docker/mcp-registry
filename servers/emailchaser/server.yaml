name: emailchaser
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - email
    - cold-email
    - sales
    - marketing
    - outbound
    - remote
about:
  title: Emailchaser
  description: Run cold email outbound from an AI agent - campaigns, leads, replies, sender accounts, ICPs and autopilot runs
  icon: https://www.emailchaser.com/logo512.png
remote:
  transport_type: streamable-http
  url: https://app.emailchaser.com/api/mcp
  headers:
    Authorization: "Bearer ${EMAILCHASER_API_KEY}"
config:
  secrets:
    - name: emailchaser.api_key
      env: EMAILCHASER_API_KEY
      example: run_YOUR_API_KEY
