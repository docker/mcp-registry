name: tidy-byte-tools
image: mcp/tidy-byte-tools
type: server
meta:
  category: productivity
  tags:
    - productivity
    - json
    - markdown
    - pdf
    - csv
    - conversion
    - links
about:
  title: Tidy Byte Tools
  description: Small offline file and data tools in one server. Repair broken JSON, turn text into JSON, Base64 and hashes, split Markdown into chunks, turn PDF and HTML into Markdown, pull PDF tables into CSV, and check links.
  icon: https://avatars.githubusercontent.com/u/352319590?s=200&v=4
source:
  project: https://github.com/tidybytetools/tidy-byte-tools
  commit: a40f4cc735f43ff34fb93539c536a37d5184da62
run:
  volumes:
    - "{{tidy-byte-tools.paths|volume|into}}"
config:
  description: The server can read and write files only in these folders
  parameters:
    type: object
    properties:
      paths:
        type: array
        items:
          type: string
        default:
          - /Users/local-test
    required:
      - paths
