name: visual-sentinel
image: mcp/visual-sentinel
type: server
meta:
  category: monitoring
  tags:
    - monitoring
    - uptime
    - ssl
    - dns
    - website
about:
  title: Visual Sentinel
  description: Website monitoring that catches pages that look broken even when the site is up. DNS, SSL, speed and website checks work with no account; monitor, incident and alert tools need an API key (Business and Agency plans).
  icon: https://visualsentinel.com/icon-512.png
source:
  project: https://github.com/VisualSentinel/mcp-server
  branch: main
  commit: 2d2bc8c1551e6a0e19963351f6f4620c7e604e9f
config:
  description: Optional Visual Sentinel API key for the account tools (Business and Agency plans). The five public tools work without it.
  secrets:
    - name: visual-sentinel.api_key
      env: VS_API_KEY
      example: <your Visual Sentinel API key>
