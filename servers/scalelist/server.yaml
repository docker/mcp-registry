name: scalelist
type: remote
dynamic:
  tools: true
meta:
  category: crm
  tags:
    - crm
    - sales
    - lead-generation
    - email-finder
    - phone-number-finder
    - remote
about:
  title: Scalelist
  description: Find B2B leads with verified work emails and mobile numbers. Search people by title, seniority, industry, location and company size, then enrich them. Credits are spent only when something is found.
  icon: https://www.google.com/s2/favicons?domain=scalelist.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.scalelist.com/mcp
oauth:
  - provider: scalelist
    secret: scalelist.personal_access_token
    env: SCALELIST_PERSONAL_ACCESS_TOKEN
