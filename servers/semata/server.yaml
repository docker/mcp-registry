name: semata
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - hiring
    - recruiting
    - remote
about:
  title: Semata
  description: Review roles, ranked candidates and screening reports, record notes and reviews, and prepare sourcing searches. Requires a Semata account.
  icon: https://app.semata.ai/web-app-manifest-512x512.png
remote:
  transport_type: streamable-http
  url: https://app.semata.ai/api/mcp
oauth:
  - provider: semata
    secret: semata.personal_access_token
    env: SEMATA_PERSONAL_ACCESS_TOKEN
