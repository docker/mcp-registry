name: varosity
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - video
    - image-generation
    - audio
    - remote
about:
  title: Varosity
  description: Generate video, images, voice and music with 60+ AI models (Veo 3.1, Kling 3.0, Seedance, FLUX, ElevenLabs) from one account
