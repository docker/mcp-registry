name: stack-internal
type: remote
dynamic:
    tools: true
meta:
    category: productivity
    tags:
        - productivity
        - remote
about:
    title: Stack Internal
    description: This mcp server connects your agents to your trusted Stack Internal knowledge without breaking focus. Get the answers you need where you work, as you work. Brought to you by Stack Overflow. Available in the United States.
    icon: https://raw.githubusercontent.com/StackExchange/stack-internal-plugin/refs/heads/main/assets/stack-internal-logo.svg
remote:
    transport_type: streamable-http
    url: https://mcp.stackinternal.com
oauth:
    - provider: stack-internal
      secret: stack-internal.personal_access_token
      env: STACK_INTERNAL_PERSONAL_ACCESS_TOKEN
