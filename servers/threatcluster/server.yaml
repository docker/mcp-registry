name: threatcluster
type: remote
meta:
  category: security
  tags:
    - security
    - threat-intelligence
    - cve
    - ransomware
    - ioc
    - remote
about:
  title: ThreatCluster
  description: Live cyber threat intelligence for agents. Incident clusters built from every source that covered a story, threat actor and malware profiles, CVE records with KEV, EPSS and exploit status, validated IOCs and ransomware leak-site victim listings. Free key, 100 credits a day.
  icon: https://www.google.com/s2/favicons?domain=threatcluster.io&sz=64
remote:
  transport_type: streamable-http
  url: https://threatcluster.io/mcp
  headers:
    x-api-key: "${THREATCLUSTER_API_KEY}"
config:
  description: Create a free API key at https://threatcluster.io/get-started (100 credits a day, 7-day lookback). Paid plans raise the daily budget and archive depth.
  secrets:
    - name: threatcluster.api_key
      env: THREATCLUSTER_API_KEY
      example: tc_live_your_key_here
