name: kyrodata
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - trade-data
    - commodities
    - agriculture
    - brazil
    - forecasting
    - remote
about:
  title: Kyrodata
  description: Brazilian foreign-trade, production, supply/demand, climate and commodity forecast data. Read-only, with like-for-like comparisons and a labeled window on every answer.
  icon: https://kyrodata.com/brand/logo-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.kyrodata.com/mcp
  headers:
    Authorization: "Bearer ${KYRODATA_API_KEY}"
config:
  description: Create a Kyrodata API key at https://kyrodata.com/user/api-keys — it is shown only once. Queries spend the credits included in your plan.
  secrets:
    - name: kyrodata.api_key
      env: KYRODATA_API_KEY
      example: kd_live_xxxxxxxxxxxxxxxxxxxxxxxx
      required: true
