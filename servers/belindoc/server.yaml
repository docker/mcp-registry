name: belindoc
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - translation
    - documents
    - video
    - remote
about:
  title: Belindoc Translator
  description: Translate PDF, Word, Excel, Markdown, image and video files with Belindoc, and rewrite video subtitles. Asks the user to confirm before any paid job and reports progress while waiting.
  icon: https://www.google.com/s2/favicons?domain=belindoc.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.belindoc.com/api/mcp
  headers:
    Authorization: "Bearer ${BELINDOC_API_KEY}"
config:
  secrets:
    - name: belindoc.api_key
      env: BELINDOC_API_KEY
      example: <YOUR_API_KEY>
