name: warmysender
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - email
    - deliverability
    - remote
about:
  title: WarmySender
  description: Check email warmup, mailbox health and deliverability, read campaign analytics and manage consented contacts and the suppression list
  icon: https://www.google.com/s2/favicons?domain=warmysender.com&sz=64
remote:
  transport_type: streamable-http
  url: https://warmysender.com/mcp
oauth:
  - provider: warmysender
    secret: warmysender.personal_access_token
    env: WARMYSENDER_PERSONAL_ACCESS_TOKEN
