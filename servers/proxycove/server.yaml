name: proxycove
type: remote
meta:
  category: tools
  tags:
    - proxy
    - scraping
    - automation
    - remote
about:
  title: ProxyCove
  description: Buy and manage residential, mobile and datacenter proxies in 170+ countries, prepaid per GB, with no signup forms
  icon: https://www.google.com/s2/favicons?domain=proxycove.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.proxycove.com/mcp
  headers:
    Authorization: "Bearer ${PROXYCOVE_API_KEY}"
config:
  secrets:
    - name: proxycove.api_key
      env: PROXYCOVE_API_KEY
      example: pc_live_0000000000000000000000000000000000000000000000
