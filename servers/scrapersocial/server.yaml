name: scrapersocial
type: remote
dynamic:
  tools: true
meta:
  category: automation
  tags:
    - automation
    - web-scraping
    - social-media
    - data-extraction
    - remote
about:
  title: ScraperSocial
  description: Hosted MCP server for public social and web data — profiles, posts, comments, search and transcripts from TikTok, Instagram, LinkedIn, YouTube, X, Reddit and 26 more platforms (231 endpoints). 25 free credits, then $5/month for 1,000.
  icon: https://scrapersocial.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.scrapersocial.com
  headers:
    Authorization: "Bearer ${SCRAPERSOCIAL_KEY}"
config:
  secrets:
    - name: scrapersocial.api_key
      env: SCRAPERSOCIAL_KEY
      example: sk_live_...
