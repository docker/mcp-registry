name: outcrawl
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - web-scraping
    - browser
    - ai
    - remote
about:
  title: Outcrawl
  description: Web infrastructure for AI agents. Scrape any URL to clean markdown or JSON, crawl a site, search the web with the results already read, and hand multi-step tasks to an agent in a real browser.
  icon: https://api.outcrawl.ai/brand/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.outcrawl.ai/mcp
oauth:
  - provider: outcrawl
    secret: outcrawl.personal_access_token
    env: OUTCRAWL_PERSONAL_ACCESS_TOKEN
