name: insightjet
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - testing
    - qa
    - playwright
    - devops
    - remote
about:
  title: InsightJet
  description: Find UI bugs, verify fixes and run Playwright tests on your live web app from your AI coding agent
  icon: https://www.google.com/s2/favicons?domain=insightjet.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://insightjet.ai/mcp
oauth:
  - provider: insightjet
    secret: insightjet.personal_access_token
    env: INSIGHTJET_PERSONAL_ACCESS_TOKEN
