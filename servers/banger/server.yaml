name: banger
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - email
    - communication
    - marketing
    - remote
about:
  title: Banger
  description: Let your agent run your company's email on your own domain. Set up inboxes and answer replies, send product email, build Journeys, send Broadcasts, manage contacts and signup forms, and check deliverability, with approvals before risky sends.
  icon: https://bangermail.com/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://api.bangermail.com/mcp
oauth:
  - provider: banger
    secret: banger.personal_access_token
    env: BANGER_PERSONAL_ACCESS_TOKEN
