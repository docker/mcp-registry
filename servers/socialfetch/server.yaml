name: socialfetch
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - social-media
    - scraping
    - data
    - remote
about:
  title: Social Fetch
  description: Live public data from TikTok, Instagram, YouTube, X, LinkedIn, Reddit and more for AI agents.
  icon: https://www.socialfetch.dev/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.socialfetch.dev/mcp
oauth:
  - provider: socialfetch
    secret: socialfetch.personal_access_token
    env: SOCIALFETCH_PERSONAL_ACCESS_TOKEN
