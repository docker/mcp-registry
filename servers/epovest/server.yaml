name: epovest
type: remote
meta:
  category: monitoring
  tags:
    - monitoring
    - analytics
    - marketing
    - seo
    - remote
about:
  title: Epovest
  description: Measure how AI assistants answer the questions your market asks, which sources shape those answers, and act on them. Every answer is archived with its cited sources and dated.
  icon: https://epovest.com/icon-180.png
remote:
  transport_type: streamable-http
  url: https://mcp.epovest.com/mcp
  headers:
    Authorization: "Bearer ${EPOVEST_API_KEY}"
config:
  secrets:
    - name: epovest.api_key
      env: EPOVEST_API_KEY
      example: epo_xxxxxxxxxxxxxxxx
