name: multi-mail
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - email
    - remote
about:
  title: Multi Mail
  description: Your Gmail, Outlook.com, Hotmail, Microsoft 365, iCloud and Fastmail mailboxes - several at once, one search across all of them. Read, draft, send and organise mail. No copy kept.
  icon: https://lumman.co/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mail.lumman.co/mcp
oauth:
  - provider: multi-mail
    secret: multi-mail.personal_access_token
    env: MULTI_MAIL_PERSONAL_ACCESS_TOKEN
