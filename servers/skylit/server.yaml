name: skylit
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - market-data
    - options
    - volatility
    - remote
about:
  title: Skylit
  description: Read-only US options market data for AI agents - options flow and scores, sweeps, screeners, dark pool, dealer positioning (GEX/vanna levels with point-in-time replay) and implied-volatility analytics
  icon: https://www.google.com/s2/favicons?domain=skylit.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.skylit.ai/mcp
oauth:
  - provider: skylit
    secret: skylit.personal_access_token
    env: SKYLIT_PERSONAL_ACCESS_TOKEN
