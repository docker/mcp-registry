name: scrapingbot
type: remote
meta:
  category: search
  tags:
    - search
    - scraping
    - tiktok
    - instagram
    - google
    - amazon
    - remote
about:
  title: ScrapingBot
  description: Public TikTok, Instagram, Google and Amazon data, web scraping and AI extraction for agents.
  icon: https://www.google.com/s2/favicons?domain=scrapingbot.io&sz=64
remote:
  transport_type: streamable-http
  url: https://scrapingbot.io/api/mcp
  headers:
    x-api-key: "${SCRAPINGBOT_API_KEY}"
config:
  secrets:
    - name: scrapingbot.api_key
      env: SCRAPINGBOT_API_KEY
      example: <YOUR_API_KEY>
