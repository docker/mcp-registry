name: tapac
type: remote
dynamic:
  tools: true
meta:
  category: crm
  tags:
    - crm
    - sales
    - lead-generation
    - contacts
    - email-verification
    - remote
about:
  title: TAPAC
  description: Find and verify B2B business contacts in real time — scraped from company sites, Discord and Telegram, with every email checked over SMTP before it is returned
  icon: https://www.google.com/s2/favicons?domain=tapacapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://tapacapi.com/mcp
  headers:
    Authorization: "Bearer ${TAPAC_API_KEY}"
config:
  description: Configure the TAPAC API key (100 free searches, then pay per verified contact)
  secrets:
    - name: tapac.api_key
      env: TAPAC_API_KEY
      example: <YOUR_API_KEY>
