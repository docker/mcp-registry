name: microburbs
type: remote
dynamic:
  tools: true
meta:
  category: geospatial
  tags:
    - property
    - real-estate
    - australia
    - geospatial
    - remote
about:
  title: Microburbs
  description: The largest and most comprehensive Australian real estate and geospatial data — a price forecast for every street, crime below the suburb, and demographics, risk and liveability on real ABS mesh blocks rather than hex grids, plus sale and rent history, comparable sales, schools and zoning for every Australian address and locality.
  icon: https://www.microburbs.com.au/images/logo-mobile.png
remote:
  transport_type: streamable-http
  url: https://api.microburbs.com.au/mcp
  headers:
    Authorization: "Bearer ${MICROBURBS_API_KEY}"
config:
  secrets:
    - name: microburbs.api_key
      env: MICROBURBS_API_KEY
      example: mib_live_...
