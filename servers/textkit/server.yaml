name: textkit
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - sms
    - messaging
    - phone-verification
    - remote
about:
  title: TextKit
  description: SMS for developers. Send and receive texts, verify phone numbers, and buy US and Canada numbers
  icon: https://jointextkit.com/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.jointextkit.com
oauth:
  - provider: textkit
    secret: textkit.personal_access_token
    env: TEXTKIT_PERSONAL_ACCESS_TOKEN
