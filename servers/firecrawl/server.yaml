name: firecrawl
image: mcp/firecrawl
type: server
meta:
  category: search
  tags:
    - firecrawl
    - search
    - scraping
    - crawling
about:
  title: Firecrawl
  description: Search, scrape, and interact with the web for AI agents. Turn any URL into clean Markdown or structured JSON, search the live web and specialized indexes, parse documents, crawl and map sites, and watch pages for changes.
  icon: https://avatars.githubusercontent.com/u/135057108?s=200&v=4
source:
  project: https://github.com/firecrawl/firecrawl-mcp-server
  commit: 6c6aed6039a9e27502ea3f240aa75bb1d68c716f
config:
  description: Configure the connection to Firecrawl
  secrets:
    - name: firecrawl.api_key
      env: FIRECRAWL_API_KEY
      example: fc-YOUR-API-KEY
      description: Create a key at https://www.firecrawl.dev/app/api-keys
  env:
    - name: FIRECRAWL_API_URL
      example: https://firecrawl.example.com
      value: "{{firecrawl.url}}"
  parameters:
    type: object
    properties:
      url:
        type: string
        description: Only for a self-hosted Firecrawl API; leave empty for Firecrawl cloud.
