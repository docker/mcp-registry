name: sandbase
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - models
    - developer-tools
    - remote
about:
  title: SandBase
  description: Discover, inspect, and run 2,000+ AI models and APIs through one authenticated MCP endpoint.
  icon: https://sandbase.ai/favicon.ico
remote:
  transport_type: streamable-http
  url: https://sandbase.ai/v1/mcp
  headers:
    Authorization: "Bearer ${SANDBASE_API_KEY}"
config:
  description: Provide a SandBase API key with MCP access.
  secrets:
    - name: sandbase.api_key
      env: SANDBASE_API_KEY
      example: <YOUR_API_KEY>
