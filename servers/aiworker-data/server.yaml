    title: aiworker-data
    description: Deterministic-first data tools for agents, each paid per call in USDC over the x402 v2 protocol (no API key, no account; an unpaid call answers with the exact price). DeFi yields and protocol snapshots from DefiLlama, Base token safety and wallet cards (Blockscout, Honeypot.is, DexScreener-derived), Polymarket odds, resolution, history, screener and backtests, crypto news search, Hacker News and Polymarket mentions, page-to-Markdown, fact checks and cited topic briefs. 18 tools, $0.005-$1 per call.
