name: postgres-mcp
image: mcp/postgres-mcp
type: server
meta:
  category: database
  tags:
    - database
    - postgres
    - postgresql
    - read-only
about:
  title: Kaiva Postgres MCP
  description: >-
    Read-only access to a PostgreSQL database. A maintained drop-in replacement
    for the archived server-postgres: one read-only statement per call inside a
    transaction that is always rolled back, with time and row limits, plus
    list_tables and describe_table to learn the schema. Nothing is written.
  icon: https://kaiv.ai/web-app-manifest-512x512.png
source:
  project: https://github.com/ai-kaiva/postgres-mcp
  commit: bcb5e90e0fb0bf0c1057ae7732ec4026b1615f87
config:
  description: The database to read. A login that can only read is best.
  secrets:
    - name: postgres-mcp.database_url
      env: DATABASE_URL
      example: postgresql://user:password@host.docker.internal:5432/mydb
