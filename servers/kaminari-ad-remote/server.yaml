name: kaminari-ad-remote
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - advertising
    - malvertising
    - remote
about:
  title: Kaminari Ad
  description: Real-device ad verification - scan ads, landing pages and redirect chains for malvertising, cloaking and scams
  icon: https://www.google.com/s2/favicons?domain=kaminari.ad&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.kaminari.ad/mcp
oauth:
  - provider: kaminari-ad-remote
    secret: kaminari-ad-remote.personal_access_token
    env: KAMINARI_AD_REMOTE_PERSONAL_ACCESS_TOKEN
