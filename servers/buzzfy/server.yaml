name: buzzfy
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - instagram
    - social-media
    - marketing
    - remote
about:
  title: Buzzfy
  description: Manage your Instagram in chat - stats, comments, DMs, publishing and scheduling after you approve
  icon: https://www.google.com/s2/favicons?domain=buzzfy.co&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.buzzfy.co/mcp
oauth:
  - provider: buzzfy
    secret: buzzfy.personal_access_token
    env: BUZZFY_PERSONAL_ACCESS_TOKEN
