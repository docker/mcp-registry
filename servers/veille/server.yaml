name: veille
type: remote
meta:
  category: security
  tags:
    - security
    - fraud-prevention
    - email-validation
    - remote
about:
  title: Veille
  description: "Validate emails, domains, IPs, phone numbers, VAT numbers and IBANs to block fake sign-ups, bots and fraud, and look up EU VAT rates."
  icon: https://avatars.githubusercontent.com/u/64615976?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.veille.io/
  headers:
    x-api-key: "${VEILLE_API_KEY}"
config:
  description: Configure your Veille API key
  secrets:
    - name: veille.api_key
      env: VEILLE_API_KEY
      example: <YOUR_API_KEY>
