name: pugi
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - website-builder
    - publishing
    - security
    - design
    - remote
about:
  title: Pugi
  description: An AI product team that builds, checks and publishes websites from a brief, draws logos with a brand kit, and checks public websites and GitHub repositories for security issues
  icon: https://www.google.com/s2/favicons?domain=pugi.io&sz=64
remote:
  transport_type: streamable-http
  url: https://api.pugi.io/api/agent/v1/mcp
oauth:
  - provider: pugi
    secret: pugi.personal_access_token
    env: PUGI_PERSONAL_ACCESS_TOKEN
