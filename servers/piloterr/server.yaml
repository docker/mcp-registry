name: piloterr
type: remote
meta:
  category: web-scraping
  tags:
    - web-scraping
    - data-extraction
    - remote
about:
  title: Piloterr
  description: "Scrape 300+ websites (Amazon, LinkedIn, Google, Zillow, Crunchbase and more) as structured JSON: the agent searches the endpoint catalog, reads an endpoint's parameters and calls it."
  icon: https://avatars.githubusercontent.com/u/36337173?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.piloterr.com/
  headers:
    x-api-key: "${PILOTERR_API_KEY}"
config:
  description: Configure your Piloterr API key
  secrets:
    - name: piloterr.api_key
      env: PILOTERR_API_KEY
      example: <YOUR_API_KEY>
