name: terralab
type: remote
dynamic:
  tools: true
meta:
  category: data-science
  tags:
    - geospatial
    - maps
    - gis
    - open-data
    - remote
about:
  title: TerraLab
  description: Extract open map data, convert GIS files and coordinates, and get elevation, routes, travel-time areas, satellite images, population, natural risks and French cadastral parcels. Requires a TerraLab account.
  icon: https://raw.githubusercontent.com/TerraLabAI/mcp/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.terra-lab.ai/mcp
oauth:
  - provider: terralab
    secret: terralab.personal_access_token
    env: TERRALAB_PERSONAL_ACCESS_TOKEN
