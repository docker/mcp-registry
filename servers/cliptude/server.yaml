name: cliptude
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - video
    - youtube
    - content-creation
    - remote
about:
  title: Cliptude
  description: Make 6-60 minute faceless YouTube documentaries from a prompt, with script, voiceover, footage, maps, charts and motion graphics rendered to MP4
  icon: https://www.google.com/s2/favicons?domain=cliptude.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.cliptude.com/mcp
oauth:
  - provider: cliptude
    secret: cliptude.personal_access_token
    env: CLIPTUDE_PERSONAL_ACCESS_TOKEN
