about:
  title: Mellow Hub
  description: Find what is taking off on TikTok, Instagram and YouTube, then publish and schedule one post to ten social networks (Instagram, TikTok, YouTube, X, LinkedIn, Threads, Bluesky, Pinterest, Facebook, Telegram) with each network's rules checked first, plus Instagram comment and DM auto-replies.
