name: mellow-hub
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - social-media
    - publishing
    - scheduling
    - marketing
    - remote
about:
  title: Mellow Hub
  description: Publish and schedule posts to nine social networks (Instagram, TikTok, YouTube, X, LinkedIn, Threads, Bluesky, Pinterest, Facebook) through a remote MCP server with OAuth, per-network validation and idempotent publishing.
  icon: https://www.mellow.world/hub/discovery/mark.svg
remote:
  transport_type: streamable-http
  url: https://www.mellow.world/mcp
oauth:
  - provider: mellow-hub
    secret: mellow-hub.personal_access_token
    env: MELLOW_HUB_PERSONAL_ACCESS_TOKEN
