name: browsersolver
type: remote
meta:
  category: web-scraping
  tags:
    - web-scraping
    - anti-bot
    - remote
about:
  title: BrowserSolver
  description: "Fetch pages behind Cloudflare, DataDome and similar protections: web unlocker, JavaScript rendering, crawling, screenshots, anti-bot and technology detection."
  icon: https://avatars.githubusercontent.com/u/271792127?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.browsersolver.com/
  headers:
    x-api-key: "${BROWSERSOLVER_API_KEY}"
config:
  description: Configure your BrowserSolver API key
  secrets:
    - name: browsersolver.api_key
      env: BROWSERSOLVER_API_KEY
      example: <YOUR_API_KEY>
