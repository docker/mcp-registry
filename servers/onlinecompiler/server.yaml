name: onlinecompiler
type: remote
meta:
  category: devops
  tags:
    - devops
    - code-execution
    - sandbox
    - remote
about:
  title: OnlineCompiler.io
  description: Run code in 46 languages, each run in a fresh sandbox with no network, and judge it against test cases.
  icon: https://onlinecompiler.io/logo.png
remote:
  transport_type: streamable-http
  url: https://api.onlinecompiler.io/mcp
  headers:
    Authorization: "Bearer ${ONLINECOMPILER_API_KEY}"
config:
  secrets:
    - name: onlinecompiler.api_key
      env: ONLINECOMPILER_API_KEY
      example: <YOUR_API_KEY>
