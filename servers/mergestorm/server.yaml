name: mergestorm
type: remote
meta:
  category: devops
  tags:
    - devops
    - code-review
    - github
    - remote
about:
  title: Mergestorm
  description: AI code review for GitHub pull requests, automatic fixes for review findings, failing CI and merge conflicts, stacked PRs and a merge queue
  icon: https://www.google.com/s2/favicons?domain=mergestorm.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://api.mergestorm.ai/api/v1/mcp
  headers:
    Authorization: "Bearer ${MERGESTORM_API_KEY}"
config:
  secrets:
    - name: mergestorm.api_key
      env: MERGESTORM_API_KEY
      example: <YOUR_API_KEY>
