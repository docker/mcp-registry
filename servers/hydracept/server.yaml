name: hydracept
type: remote
meta:
  category: ai
  tags:
    - ai
    - agents
    - image-generation
    - remote
about:
  title: Hydracept
  description: Hosted MCP for Hydracept capability discovery, quotes, durable jobs, receipts, and artifacts.
  icon: https://hydracept.com/hydracept-logo.png
source:
  project: https://github.com/zencodeinc/hydracept-public
remote:
  transport_type: streamable-http
  url: https://api.hydracept.com/mcp
  headers:
    Authorization: "Bearer ${HYDRACEPT_API_KEY}"
config:
  description: Hydracept API key from https://hydracept.com/start
  secrets:
    - name: hydracept.api_key
      env: HYDRACEPT_API_KEY
      example: <YOUR_API_KEY>
