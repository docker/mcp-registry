name: webz-news-search
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - research
    - remote
about:
  title: Webz.io News Search
  description: Search global news in natural language and retrieve articles with source links, publication dates, and available metadata
  icon: https://raw.githubusercontent.com/Webhose/webz-news-search/52db9198834a81fe8771f13596108da3ea357e11/packages/grok-plugin/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://news-search-mcp.webz.io/mcp
oauth:
  - provider: webz-news-search
    secret: webz-news-search.personal_access_token
    env: WEBZ_NEWS_SEARCH_PERSONAL_ACCESS_TOKEN
