name: helpcenter-io
type: remote
meta:
  category: productivity
  tags:
    - knowledge-base
    - documentation
    - customer-support
    - help-center
    - remote
about:
  title: HelpCenter.io
  description: "Write, organize, design and migrate a HelpCenter.io help center: articles, categories, template."
  icon: https://raw.githubusercontent.com/helpcenterio/helpcenter-io-plugin/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.helpcenter.io
  headers:
    Authorization: "Bearer ${HELPCENTER_IO_API_KEY}"
config:
  description: Provide a HelpCenter.io API key, sent as an Authorization Bearer header. The server also supports OAuth 2.1 for clients that use it.
  secrets:
    - name: helpcenter-io.api_key
      env: HELPCENTER_IO_API_KEY
      example: <YOUR_API_KEY>
      required: false
