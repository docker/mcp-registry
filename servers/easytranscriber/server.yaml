name: easytranscriber
type: remote
meta:
  category: search
  tags:
    - youtube
    - transcript
    - summarization
    - search
    - remote
about:
  title: EasyTranscriber
  description: YouTube transcripts, AI summaries, video search, and channel, playlist and comment data. Requires an EasyTranscriber API key.
  icon: https://www.easytranscriber.com/apple-icon
remote:
  transport_type: streamable-http
  url: https://mcp.easytranscriber.com/mcp
  headers:
    Authorization: "Bearer ${EASYTRANSCRIBER_API_KEY}"
config:
  description: Create an API key at https://www.easytranscriber.com/dashboard/api-keys (free accounts included).
  secrets:
    - name: easytranscriber.api_key
      env: EASYTRANSCRIBER_API_KEY
      example: <YOUR_API_KEY>
      required: true
