name: scrapfly-mcp
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - data-extraction
    - screenshots
    - browser-automation
    - remote
about:
  title: Scrapfly
  description: Scrape any web page as HTML, text or Markdown, take screenshots and drive a cloud browser, with residential proxy rotation and anti-bot bypass built in.
  icon: https://scrapfly.io/logo.svg
remote:
  transport_type: streamable-http
  url: https://mcp.scrapfly.io/mcp
oauth:
  - provider: scrapfly-mcp
    secret: scrapfly-mcp.personal_access_token
    env: SCRAPFLY_MCP_PERSONAL_ACCESS_TOKEN
