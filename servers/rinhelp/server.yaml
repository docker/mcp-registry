name: rinhelp
type: remote
meta:
  category: communication
  tags:
    - customer-support
    - help-desk
    - shared-inbox
    - remote
about:
  title: Rinhelp
  description: Help desk for small teams and AI agents. Answer, note, assign, triage and close conversations, search knowledge, publish help center articles, and find Shopify orders and Stripe customers, with refunds and cancellations waiting for a teammate's approval
  icon: https://raw.githubusercontent.com/rinhelp/plugin/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.rinhelp.com/mcp
  headers:
    Authorization: "Bearer ${RINHELP_API_KEY}"
config:
  secrets:
    - name: rinhelp.api_key
      env: RINHELP_API_KEY
      example: <YOUR_API_KEY>
