name: gsc-wizard-rank-checker
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - seo
    - rank-tracking
    - google-search-console
    - keywords
    - remote
about:
  title: GSC Wizard Rank Checker
  description: Daily Google rankings for the keywords you choose, read from your own Google Search Console data, with winners, losers and ranking changes over any period.
  icon: https://raw.githubusercontent.com/jbobbink/seo-rank-checker/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.gscwizard.com/mcp/rank-checker
oauth:
  - provider: gsc-wizard-rank-checker
    secret: gsc-wizard-rank-checker.personal_access_token
    env: GSC_WIZARD_RANK_CHECKER_PERSONAL_ACCESS_TOKEN
