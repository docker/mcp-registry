name: jizhang
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - finance
    - accounting
    - ledger
    - remote










about:
  title: jizhang
  description: A personal ledger you can connect as a remote MCP. Record income and expenses, manage categories, query the books, and review spending already recorded. No investment advice.
  icon: https://www.google.com/s2/favicons?domain=yunqingkeji.site&sz=64



remote:
  transport_type: streamable-http
  url: https://yunqingkeji.site/jizhangmcp
  headers:
    Authorization: "Bearer $JIZHANG_API_KEY"




config:
  description: API key created in the jizhang web console (https://www.yunqingkeji.site/jizhangweb/). Send it as Authorization Bearer.
  secrets:
    - name: jizhang.api_key
      env: JIZHANG_API_KEY
      example: jz_live_YOUR_KEY




