name: gsc-mcp
image: mcp/gsc-mcp
type: server
meta:
  category: search
  tags:
    - seo
    - google-search-console
    - analytics
    - search
about:
  title: Google Search Console
  description: Read-only access to Google Search Console. List properties, query search analytics (clicks, impressions, CTR, position by query, page, country or device), compare two periods, list sitemaps and run URL inspection. Authenticates with a Google service account that has been added as a user on the property.
  icon: https://avatars.githubusercontent.com/u/187990956?s=200&v=4
source:
  project: https://github.com/Walma-Labs/gsc-mcp
  commit: 436304d648b9264cf2f2c72cf67bc9c7aa681ffb
config:
  description: Paste the JSON key of a Google service account with access to your Search Console property
  secrets:
    - name: gsc-mcp.service_account_json
      env: GSC_SERVICE_ACCOUNT_JSON
      example: '{"type":"service_account","project_id":"...","client_email":"...","private_key":"..."}'
