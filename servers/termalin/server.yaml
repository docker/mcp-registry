name: termalin
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - ssh
    - sftp
    - monitoring
    - database
    - remote
about:
  title: Termalin
  description: SSH, SFTP, databases and monitoring for your own Linux servers. Run commands and background jobs, read and write files, query databases and read metrics and alerts on the servers you connected, without handing an SSH key to the agent.
  icon: https://termal.in/icon-512.png
remote:
  transport_type: streamable-http
  url: https://termal.in/mcp
oauth:
  - provider: termalin
    secret: termalin.personal_access_token
    env: TERMALIN_PERSONAL_ACCESS_TOKEN
