name: verant
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - writing
    - proofreading
    - remote
about:
  title: Verant
  description: Proofread live web pages and sites for spelling, grammar, and placeholder text.
  icon: https://verant.ai/images/icon-512.png
remote:
  transport_type: streamable-http
  url: https://verant.ai/mcp
oauth:
  - provider: verant
    secret: verant.personal_access_token
    env: VERANT_PERSONAL_ACCESS_TOKEN
