name: debitura
type: remote
meta:
  category: finance
  tags:
    - finance
    - debt-collection
    - remote
about:
  title: Debitura
  description: 'Cross-border debt collection from your AI assistant: check cases, get pricing, submit new cases.'
  icon: https://avatars.githubusercontent.com/u/107886090?v=4
remote:
  transport_type: streamable-http
  url: https://mcp.debitura.com/mcp
  headers:
    XApiKey: "${DEBITURA_API_KEY}"
config:
  secrets:
    - name: debitura.api_key
      env: DEBITURA_API_KEY
      example: <YOUR_DEBITURA_API_KEY>
