name: spottable
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - shopping
    - marketplace
    - remote
about:
  title: Spottable
  description: Search Facebook Marketplace, inspect listings, and analyze deals. Requires a paid Spottable Pro or Max plan.
  icon: https://spottableapp.com/images/app-icon.webp
remote:
  transport_type: streamable-http
  url: https://api.spottableapp.com/v1/mcp
oauth:
  - provider: spottable
    secret: spottable.personal_access_token
    env: SPOTTABLE_PERSONAL_ACCESS_TOKEN
