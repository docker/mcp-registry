name: pink-agentic-payments
image: mcp/pink-agentic-payments
type: server
meta:
  category: finance
  tags:
    - agent-payments
    - ai-agents
    - model-context-protocol
    - payments
about:
  title: Pink Agentic AI Payments
  description: Checks every payment an agent requests against company spending rules (budgets, payee allow-lists, human approval) before any payment credential is issued. This is a sandbox preview (test money only) that bridges to Pink's remote MCP server.
  icon: https://raw.githubusercontent.com/Pink-Agentic-Payments/pink-agentic-payments-mcp/main/assets/logo.png
source:
  project: https://github.com/Pink-Agentic-Payments/pink-agentic-payments-mcp
  commit: ce05ace9bca906540e8e4c3d857384b096e85440
config:
  description: Configure the connection to Pink Agentic AI Payments (sandbox)
  secrets:
    - name: pink-agentic-payments.pink_agent_api_key
      env: PINK_AGENT_API_KEY
      example: <PINK_AGENT_API_KEY>
  env:
    - name: PINK_MCP_URL
      example: https://agentic-sandbox.pinkwallet.com/mcp
      value: "{{pink-agentic-payments.pink_mcp_url}}"
  parameters:
    type: object
    properties:
      pink_mcp_url:
        type: string
