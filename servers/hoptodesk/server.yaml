name: hoptodesk
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - remote-desktop
    - it-management
    - remote
about:
  title: HopToDesk
  description: See, check and fix the computers you manage, run commands and enroll new devices with HopToDesk
  icon: https://www.hoptodesk.com/img/hoptodesk-apple-touch.png
remote:
  transport_type: streamable-http
  url: https://dashboard.hoptodesk.com/mcp
oauth:
  - provider: hoptodesk
    secret: hoptodesk.personal_access_token
    env: HOPTODESK_PERSONAL_ACCESS_TOKEN
