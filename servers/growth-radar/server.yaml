name: growth-radar
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - seo
    - analytics
    - remote
about:
  title: Growth Radar
  description: Ranked fix list for a site's Google and AI search visibility, built from Search Console and Bing data, with a verdict on every change 28 days after it ships
