name: kubectl-mcp-server
image: mcp/kubectl-mcp-server
type: server
meta:
  category: devops
  tags:
    - kubectl-mcp-server
    - kubernetes
    - kubectl
    - helm
    - devops
about:
  title: Kubectl
  description: Kubernetes and Helm for AI assistants. Generic kubectl tools for every resource kind, including CRDs, with opt-in toolsets for GitOps, cert-manager, Velero, Istio, Cilium, KubeVirt and more.
  icon: https://avatars.githubusercontent.com/u/13629408?s=200&v=4
source:
  project: https://github.com/rohitg00/kubectl-mcp-server
  commit: a3fef9fe231024fe7bb218b75f11b43c43c6ee6a
run:
  volumes:
    - "{{kubectl-mcp-server.kubeconfig}}:/home/mcp/.kube"
config:
  description: Mount your kubeconfig directory and optionally choose extra toolsets
  env:
    - name: MCP_TOOLSETS
      example: default,diagnostics,gitops
      value: "{{kubectl-mcp-server.toolsets}}"
  parameters:
    type: object
    properties:
      kubeconfig:
        type: string
        description: Host directory containing your kubeconfig
        default: $HOME/.kube
      toolsets:
        type: string
        description: "Comma-separated toolsets to load. Empty means default (core and helm, 26 tools). Others: ops, diagnostics, security, cost, multicluster, crds, helm_dev, gitops, certs, policy, backup, keda, cilium, rollouts, capi, kubevirt, istio, kind, vind, or all"
    required:
      - kubeconfig
