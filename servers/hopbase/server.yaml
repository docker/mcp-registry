name: hopbase
type: remote
meta:
  category: ai
  tags:
    - ai
    - llm
    - api-gateway
    - usage
    - remote
about:
  title: HopBase
  description: Check balance, usage, available models with prices and model limits for a HopBase LLM API key, and search the HopBase docs.
  icon: https://www.google.com/s2/favicons?domain=hop-base.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.hop-base.com/mcp
  headers:
    Authorization: "Bearer ${HOPBASE_API_KEY}"
config:
  secrets:
    - name: hopbase.api_key
      env: HOPBASE_API_KEY
      example: <YOUR_API_KEY>
