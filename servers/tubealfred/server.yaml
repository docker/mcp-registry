name: tubealfred
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - youtube
    - youtube-transcript
    - youtube-comments
    - channel-data
    - remote
about:
  title: "TubeAlfred — YouTube MCP Server: Transcripts, Comments & Channel Data"
  description: >-
    Retrieve available YouTube transcripts with timestamps, comments and replies,
    channel videos, Shorts, streams, search, playlists, and video details through
    34 read-only tools. List a channel's videos and retrieve their available
    transcripts. No YouTube API key required. No YouTube Data API quota to manage.
    100 free credits on signup. Most successful tool calls cost 1 credit.
  icon: https://tubealfred.com/favicon-96x96.png
remote:
  transport_type: streamable-http
  url: https://mcp.tubealfred.com/
oauth:
  - provider: tubealfred
    secret: tubealfred.personal_access_token
    env: TUBEALFRED_PERSONAL_ACCESS_TOKEN
