name: polias
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - web-search
    - news
    - legal
    - remote
about:
  title: Polias
  description: Search Polias' own EU-hosted index for web pages in German and English, news from the last 30 days, official websites of public authorities in Germany, Austria, Switzerland and the EU, and European court decisions and legislation.
  icon: https://api.polias.eu/icon-192.png
remote:
  transport_type: streamable-http
  url: https://api.polias.eu/mcp
  headers:
    Authorization: "Bearer ${POLIAS_API_KEY}"
config:
  description: Create an API key at https://api.polias.eu/account
  secrets:
    - name: polias.api_key
      env: POLIAS_API_KEY
      example: pol_...
