name: tickerlayer
type: remote
meta:
  category: finance
  tags:
    - finance
    - market-data
    - stocks
    - crypto
    - forex
    - remote
about:
  title: TickerLayer
  description: Live and historical market data for stocks, ETFs, indices, forex, crypto, commodities, perpetual futures and bond yields
  icon: https://tickerlayer.com/icon-192.png
remote:
  transport_type: streamable-http
  url: https://mcp.tickerlayer.com/mcp
  headers:
    x-api-key: "${TICKERLAYER_API_KEY}"
config:
  description: Your TickerLayer API key. A free key is available at https://tickerlayer.com/signup
  secrets:
    - name: tickerlayer.api_key
      env: TICKERLAYER_API_KEY
      example: <YOUR_API_KEY>
