about:
    title: InvoiceIn
    description: Read the e-invoices a business receives. Send an XRechnung, ZUGFeRD/Factur-X, Peppol BIS 3, EN 16931 UBL, CII, FatturaPA or KSeF file — XML or a hybrid PDF — and get canonical EN 16931 JSON back, together with a validation report against the official rule sets where every finding carries a plain-language fix. Also renders a readable PDF and exports CSV or a DATEV Buchungsstapel. Nothing is stored — each document is parsed in memory and discarded with the response.
    icon: https://raw.githubusercontent.com/peculiar-systems/invoicein-examples/main/icon.png
remote:
    transport_type: streamable-http
    url: https://invoicein-api.peculiar.systems/mcp
