name: logbrew
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - error-tracking
    - logging
    - tracing
    - remote
about:
  title: LogBrew
  description: Read production errors, logs, traces, and releases from the LogBrew projects you approve, with a generous free tier
  icon: https://www.google.com/s2/favicons?domain=logbrew.co&sz=64
remote:
  transport_type: streamable-http
  url: https://logbrew.co/mcp
oauth:
  - provider: logbrew
    secret: logbrew.personal_access_token
    env: LOGBREW_PERSONAL_ACCESS_TOKEN
