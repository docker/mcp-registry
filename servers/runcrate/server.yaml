name: runcrate
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - gpu
    - cloud
    - ai
    - remote
about:
  title: Runcrate
  description: GPU cloud for AI developers and agents. Launch GPUs by the hour, run commands as jobs that stop their own billing, schedule runs, and manage volumes, the firewall and spend.
  icon: https://www.runcrate.ai/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.runcrate.ai/mcp
oauth:
  - provider: runcrate
    secret: runcrate.personal_access_token
    env: RUNCRATE_PERSONAL_ACCESS_TOKEN
