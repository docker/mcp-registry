name: quorumz-sense
type: remote
meta:
  category: news
  tags:
    - news
    - geopolitics
    - remote
about:
  title: Quorumz Sense
  description: Verified, geolocated world news for agents. Each story is a quorum, the viewpoints people are taking on it, with how many posts back each one, split by source (media, social, iWitness) and a 0-1 confidence. Also alpha signals found ahead of the press, and news articles with their quorums. Listing the tools and a sample quorum need no key.
  icon: https://sense.quorumz.com/brand/quorumz-tile-512.png
remote:
  transport_type: streamable-http
  url: https://api.quorumz.com/mcp
  headers:
    Authorization: "Bearer ${QUORUMZ_API_KEY}"
config:
  secrets:
    - name: quorumz-sense.api_key
      env: QUORUMZ_API_KEY
      example: qz_pk_live_...
