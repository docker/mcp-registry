name: gtm-api
type: remote
meta:
  category: business
  tags:
    - linkedin
    - sales
    - outreach
    - lead-generation
    - messaging
    - remote
about:
  title: "GTM API: LinkedIn MCP Server"
  description: Managed LinkedIn MCP server for AI agents. Search, connect, message and enrich on a LinkedIn account you own, with warm-up and server-side daily limits under every call. Self-reported 20,000+ accounts at under 1% monthly ban.
  icon: https://www.google.com/s2/favicons?domain=gtm-api.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.gtm-api.com/mcp
  headers:
    Authorization: "Bearer ${GTM_API_KEY}"
config:
  secrets:
    - name: gtm-api.api_key
      env: GTM_API_KEY
      example: <YOUR_API_KEY>
