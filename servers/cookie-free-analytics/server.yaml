name: cookie-free-analytics
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - privacy
    - web-analytics
    - remote
about:
  title: Cookie Free Analytics
  description: See your website visitors without a cookie banner
  icon: https://www.cookiefreeanalytics.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://www.cookiefreeanalytics.com/mcp
oauth:
  - provider: cookie-free-analytics
    secret: cookie-free-analytics.personal_access_token
    env: COOKIE_FREE_ANALYTICS_PERSONAL_ACCESS_TOKEN
