name: 1lookup
type: remote
meta:
  category: search
  tags:
    - data-enrichment
    - phone-validation
    - email-verification
    - remote
about:
  title: 1lookup.dev
  description: Validate phone numbers and emails, look up IPs, enrich contacts and companies, screen sanctions and public registries, and run 96 data products on one API key.
  icon: https://1lookup.dev/brand/1lookup-icon-dark-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.1lookup.dev/mcp
  headers:
    Authorization: "Bearer ${ONELOOKUP_API_KEY}"
config:
  secrets:
    - name: 1lookup.api_key
      env: ONELOOKUP_API_KEY
      example: <YOUR_API_KEY>
