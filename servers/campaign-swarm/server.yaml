name: campaign-swarm
type: remote
meta:
  category: marketing
  tags:
    - marketing
    - social-media
    - campaigns
    - remote
about:
  title: Campaign Swarm
  description: "Run social campaigns end to end: plan, create, schedule, publish, measure, and optimize."
  icon: https://www.google.com/s2/favicons?domain=campaignswarm.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.campaignswarm.com/mcp
  headers:
    Authorization: "Bearer ${CAMPAIGN_SWARM_API_KEY}"
config:
  description: Connect Campaign Swarm with an organization API key.
  secrets:
    - name: campaign-swarm.api_key
      env: CAMPAIGN_SWARM_API_KEY
      example: csw_your_api_key
