name: tweetapi
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - social-media
    - twitter
    - remote
about:
  title: TweetAPI
  description: Read-only Twitter data for agents. Search tweets and look up profiles, followers, lists, communities and Spaces, plus the TweetAPI docs.
  icon: https://www.google.com/s2/favicons?domain=tweetapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.tweetapi.com/mcp
oauth:
  - provider: tweetapi
    secret: tweetapi.personal_access_token
    env: TWEETAPI_PERSONAL_ACCESS_TOKEN
