name: keats
type: remote
meta:
  category: analytics
  tags:
    - marketing
    - seo
    - aeo
    - ai-visibility
    - remote
about:
  title: Keats
  description: Get your brand named when buyers ask ChatGPT and other AI assistants what to buy. See where rivals are named instead of you, get each fix drafted, and prove it worked.
  icon: https://getkeats.com/brand/keats-icon-512.png
remote:
  transport_type: streamable-http
  url: https://getkeats.com/mcp
  headers:
    Authorization: "Bearer ${KEATS_API_KEY}"
config:
  secrets:
    - name: keats.api_key
      env: KEATS_API_KEY
      example: <YOUR_API_KEY>
