name: mail-by-pony
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - mail
    - letters
    - printing
    - remote
about:
  title: Mail By Pony
  description: Write letters, preview the exact printed proof, then print and mail them through USPS to US addresses
  icon: https://www.mailbypony.com/static/brand/icon-512.png
remote:
  transport_type: streamable-http
  url: https://www.mailbypony.com/mcp
oauth:
  - provider: mail-by-pony
    secret: mail-by-pony.personal_access_token
    env: MAIL_BY_PONY_PERSONAL_ACCESS_TOKEN
