name: datawebot
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - ecommerce
    - shopping
    - price-comparison
    - remote
about:
  title: Datawebot
  description: Search products across online shops worldwide, in local languages, and get every seller's price, total with shipping and a direct link to the product page.
  icon: https://www.datawebot.com/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.datawebot.com/mcp
oauth:
  - provider: datawebot
    secret: datawebot.personal_access_token
    env: DATAWEBOT_PERSONAL_ACCESS_TOKEN
