name: browser-use
type: remote
meta:
  category: devops
  tags:
    - browser-automation
    - web-scraping
    - browser-use
    - remote
about:
  title: Browser Use
  description: Run browser agents in Browser Use Cloud stealth browsers to complete web tasks, fill forms and extract data.
  icon: https://avatars.githubusercontent.com/u/192012301?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://api.browser-use.com/v3/mcp
  headers:
    Authorization: "Bearer ${BROWSER_USE_API_KEY}"
config:
  secrets:
    - name: browser-use.api_key
      env: BROWSER_USE_API_KEY
      example: <YOUR_API_KEY>
