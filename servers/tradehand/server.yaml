name: tradehand
type: remote
dynamic:
  tools: true
meta:
  category: ecommerce
  tags:
    - ecommerce
    - marketplace
    - booking
    - remote
about:
  title: Tradehand
  description: "Find and book local tradespeople: search traders by trade and area, compare fixed prices and reviews, get instant quotes, book and pay through a secure checkout link. Tradespeople use it to manage their business."
  icon: https://tradehand.com/tradehand-icon-640.png
remote:
  transport_type: streamable-http
  url: https://tradehand.com/api/mcp
oauth:
  - provider: tradehand
    secret: tradehand.personal_access_token
    env: TRADEHAND_PERSONAL_ACCESS_TOKEN
