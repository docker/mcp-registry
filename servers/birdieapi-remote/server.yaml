name: birdieapi-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - golf
    - pga-tour
    - sports-data
    - remote
about:
  title: BirdieAPI
  description: "PGA Tour data from 2001: leaderboards, holes, courses, ratings, par-3/4/5 splits, major winner odds."
  icon: https://www.google.com/s2/favicons?domain=birdieapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.birdieapi.com/mcp
oauth:
  - provider: birdieapi-remote
    secret: birdieapi-remote.personal_access_token
    env: BIRDIEAPI_REMOTE_PERSONAL_ACCESS_TOKEN
