name: health-mcp
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - health
    - apple-health
    - privacy
    - remote
about:
  title: Health MCP
  description: Read an encrypted Apple Health cache. Files are encrypted on the iPhone and the decryption key never reaches the server.
  icon: https://www.google.com/s2/favicons?domain=healthmcp.cc&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.healthmcp.cc/mcp
oauth:
  - provider: health-mcp
    secret: health-mcp.personal_access_token
    env: HEALTHMCP_PERSONAL_ACCESS_TOKEN
