name: qurl
type: remote
meta:
  category: security
  tags:
    - security
    - access-links
    - remote
about:
  title: qURL
  description: Mint, resolve, audit, and rotate scope-limited expiring access links (qURLs) for AI agents.
  icon: https://www.google.com/s2/favicons?domain=layerv.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.connector.layerv.ai/mcp
  headers:
    Authorization: "Bearer ${QURL_API_KEY}"
config:
  secrets:
    - name: qurl.api_key
      env: QURL_API_KEY
      example: <YOUR_QURL_API_KEY>
