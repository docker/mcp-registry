name: fincodesapi
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - banking
    - iban
    - sanctions
    - remote
about:
  title: Fin Codes API
  description: Validate IBANs and bank codes, verify payee names, and screen sanctions lists. Account quotas and prepaid payee-check credits apply.
  icon: https://raw.githubusercontent.com/swiftcodesapi/fincodesapi-mcp/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.fincodesapi.com/mcp
oauth:
  - provider: fincodesapi
    secret: fincodesapi.personal_access_token
    env: FINCODESAPI_PERSONAL_ACCESS_TOKEN
