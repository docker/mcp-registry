name: qrflow
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - qr-codes
    - marketing
    - analytics
    - remote
about:
  title: QRFLOW.codes
  description: Create QR codes, change where a printed code points without reprinting it, and read scan statistics
  icon: https://qrflow.codes/icon-512.png
remote:
  transport_type: streamable-http
  url: https://qrflow.codes/mcp
oauth:
  - provider: qrflow
    secret: qrflow.personal_access_token
    env: QRFLOW_PERSONAL_ACCESS_TOKEN
