name: clawifi
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - web-scraping
    - remote
about:
  title: Clawifi
  description: Web search and page reading for AI agents. Search many engines as one, read pages and PDFs, and get back the passages that answer the question, each with its source.
  icon: https://raw.githubusercontent.com/ReARCLabs/clawifi-mcp/main/assets/clawifi-logo-400.png
remote:
  transport_type: streamable-http
  url: https://api.clawifi.dev/mcp
oauth:
  - provider: clawifi
    secret: clawifi.personal_access_token
    env: CLAWIFI_PERSONAL_ACCESS_TOKEN
