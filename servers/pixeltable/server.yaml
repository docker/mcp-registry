name: pixeltable
image: mcp/pixeltable
type: server
meta:
  category: database
  tags:
    - pixeltable
    - database
    - multimodal
    - ai
about:
  title: Pixeltable Developer
  description: Build and operate Pixeltable multimodal apps from one app.py, with declarative tables, computed columns, embedding indexes, schema and service reconciliation, and row inspection.
  icon: https://avatars.githubusercontent.com/u/160283145?s=200&v=4
source:
  project: https://github.com/pixeltable/mcp-server-pixeltable-developer
  commit: 3941007d74a38d16d17bc1b30d3abc35d1277c9c
run:
  volumes:
    - "{{pixeltable.project_root}}:/work/app"
    - pixeltable-catalog:/work/catalog
config:
  description: Mount the directory holding your Pixeltable app.py. The catalog persists in the pixeltable-catalog Docker volume.
  env:
    - name: PIXELTABLE_MCP_PROJECT_ROOT
      example: /work/app
      value: /work/app
    - name: PIXELTABLE_HOME
      example: /work/catalog
      value: /work/catalog
  parameters:
    type: object
    properties:
      project_root:
        type: string
        description: Directory holding your Pixeltable app.py.
        default: /Users/local-test/pixeltable-app
    required:
      - project_root
