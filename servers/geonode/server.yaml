name: geonode
type: remote
meta:
  category: web-scraping
  tags:
    - web-scraping
    - search
    - crawler
    - data-extraction
    - remote
about:
  title: Geonode
  description: Web search and content collection for MCP-compatible agents. Extract pages, discover URLs, crawl sites and run batches for research and downstream analysis. Geonode offers limited keyless page extraction; an API key enables the full toolset, including JavaScript rendering and country targeting.
  icon: https://mcp.geonode.com/mcp/icons/geonode-mark-256.png
source:
  project: https://github.com/geonodecom/mcp
remote:
  transport_type: streamable-http
  url: https://mcp.geonode.com/mcp
  headers:
    X-Api-Key: "${GEONODE_API_KEY}"
config:
  description: Optionally provide a Geonode API key. The server also works without one, with synchronous page extraction only and lower limits.
  secrets:
    - name: geonode.api_key
      env: GEONODE_API_KEY
      example: <YOUR_API_KEY>
      required: false
