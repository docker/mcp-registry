name: writ
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - browser-automation
    - web-data
    - api
    - remote
about:
  title: Writ
  description: Turn any website into something you can call. Read a page, collect a site, build a real API from it, or run a task on a site you are signed in to, in a real cloud browser. Logins stay sealed in Writ; the model never sees a password.
  icon: https://usewrit.app/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.usewrit.app/mcp
oauth:
  - provider: writ
    secret: writ.personal_access_token
    env: WRIT_PERSONAL_ACCESS_TOKEN
