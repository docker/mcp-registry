name: docspring
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - pdf
    - documents
    - e-signatures
    - remote
about:
  title: DocSpring
  description: Fill PDF and Word templates, generate PDFs and Word documents, and collect e-signatures.
  icon: https://docspring.com/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.docspring.com/mcp
oauth:
  - provider: docspring
    secret: docspring.personal_access_token
    env: DOCSPRING_PERSONAL_ACCESS_TOKEN
