name: joa
type: remote
meta:
  category: search
  tags:
    - search
    - jobs
    - remote
about:
  title: Job Opportunities API
  description: Search live jobs from employers' own career sites, with company hiring signals and a change feed.
  icon: https://www.google.com/s2/favicons?domain=jobopportunitiesapi.org&sz=64
remote:
  transport_type: streamable-http
  url: https://api.jobopportunitiesapi.org/mcp
  headers:
    Authorization: "Bearer ${JOA_API_KEY}"
config:
  secrets:
    - name: joa.api_key
      env: JOA_API_KEY
      example: <YOUR_API_KEY>
