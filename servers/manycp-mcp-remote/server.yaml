name: manycp-mcp-remote
type: remote
meta:
  category: devops
  tags:
    - devops
    - mcp-directories
    - mcp-registry
    - directory-submission
    - remote
about:
  title: ManyCP MCP server
  description: >-
    Submit an MCP server to many MCP directories and track each listing from an
    AI assistant
  icon: https://manycp.com/brand/manycp-logo-1024.png
remote:
  transport_type: streamable-http
  url: https://manycp.com/mcp
config:
  description: Configure ManyCP MCP server
  env:
    - name: MANYCP_AUTH
      example: value
      value: '{{manycp-mcp-remote.manycp_auth}}'
  parameters:
    type: object
    properties:
      manycp_auth:
        type: string
    required:
      - manycp_auth
