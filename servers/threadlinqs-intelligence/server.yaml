name: threadlinqs-intelligence
type: remote
meta:
  category: security
  tags:
    - security
    - threat-intelligence
    - detection-engineering
    - mitre-attack
    - remote
about:
  title: Threadlinqs Intelligence
  description: Curated cyber-threat intelligence for AI agents. Search threats, detection rules (Sigma, SPL, KQL), indicators, CVEs, MITRE ATT&CK coverage, threat actors and C2 infrastructure, and export STIX bundles, Navigator layers and rule packs.
  icon: https://www.google.com/s2/favicons?domain=threadlinqs.com&sz=64
remote:
  transport_type: streamable-http
  url: https://intel.threadlinqs.com/mcp
  headers:
    Authorization: "Bearer ${THREADLINQS_API_KEY}"
config:
  secrets:
    - name: threadlinqs-intelligence.api_key
      env: THREADLINQS_API_KEY
      example: <YOUR_API_KEY>
