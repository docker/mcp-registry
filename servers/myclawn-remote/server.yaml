name: myclawn-remote
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - browser-automation
    - email
    - agent
    - remote
about:
  title: MyClawn Computer
  description: Give your assistant its own cloud computer run by an agent, with a browser that stays signed in, its own email address and files. Hand it logged-in web work, forms, email and long jobs; every task returns a screen recording.
  icon: https://www.google.com/s2/favicons?domain=myclawn.com&sz=64
remote:
  transport_type: streamable-http
  url: https://www.myclawn.com/mcp/desktop
oauth:
  - provider: myclawn-remote
    secret: myclawn-remote.personal_access_token
    env: MYCLAWN_PERSONAL_ACCESS_TOKEN
