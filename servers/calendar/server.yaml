name: calendar
image: mcp/calendar
type: server
meta:
  category: productivity
  tags:
    - productivity
    - calendar
    - ics
    - scheduling
    - free-busy
about:
  title: Calendar
  description: Read the .ics file your calendar exports -- events in any window, free-busy, double bookings across calendars, export a subset, meeting to timesheet entry. No account is connected, nothing is synced, the file stays local.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/bc2d1a112142bdbba34ab57e7d75488c25bc322d/assets/calendar-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: bc2d1a112142bdbba34ab57e7d75488c25bc322d
  dockerfile: servers/calendar/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: calendar.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
