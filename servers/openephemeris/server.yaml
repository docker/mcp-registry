name: openephemeris
type: remote
dynamic:
  tools: true
meta:
  category: tools
  tags:
    - astrology
    - astronomy
    - ephemeris
    - remote
about:
  title: OpenEphemeris
  description: Astrology and astronomy tools backed by the NASA JPL DE440 ephemeris — natal charts, transits, synastry, electional timing, Human Design, and astrocartography
  icon: https://mcp.openephemeris.com/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.openephemeris.com/mcp
oauth:
  - provider: openephemeris
    secret: openephemeris.personal_access_token
    env: OPENEPHEMERIS_PERSONAL_ACCESS_TOKEN
