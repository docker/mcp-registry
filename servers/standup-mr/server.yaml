name: standup-mr
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - gitlab
    - github
    - standup
    - ci
    - merge-requests
    - remote
about:
  title: Standup MR
  description: >-
    Writes your daily standup from GitLab or GitHub merge request state —
    what's ready, blocked or waiting on your review, and why a pipeline is
    red, read from the failing job log.
  icon: https://raw.githubusercontent.com/Jubstaaa/standup-mr/main/assets/icon-512.png
remote:
  transport_type: streamable-http
  url: https://standup.ilkerbalcilar.com/mcp
oauth:
  - provider: standup-mr
    secret: standup-mr.personal_access_token
    env: STANDUP_MR_PERSONAL_ACCESS_TOKEN
