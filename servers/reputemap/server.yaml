name: reputemap
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - reviews
    - google-business-profile
    - reputation-management
    - remote
about:
  title: ReputeMap
  description: "Manage Google Business Profile reviews: list locations, read reviews and rating stats, draft AI replies, publish the replies you approve, and send review-request emails."
  icon: https://reputemap.com/press/logo-300.png
remote:
  transport_type: streamable-http
  url: https://api.reputemap.com/mcp
oauth:
  - provider: reputemap
    secret: reputemap.personal_access_token
    env: REPUTEMAP_PERSONAL_ACCESS_TOKEN
