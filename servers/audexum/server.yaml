name: audexum
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - text-to-speech
    - transcription
    - audio
    - remote
about:
  title: Audexum
  description: Text to speech in 30+ languages as MP3 links, audio transcription, and YouTube transcripts for any AI model or agent
  icon: https://www.google.com/s2/favicons?domain=audexum.com&sz=64
remote:
  transport_type: streamable-http
  url: https://audexum.com/mcp
oauth:
  - provider: audexum
    secret: audexum.personal_access_token
    env: AUDEXUM_PERSONAL_ACCESS_TOKEN
