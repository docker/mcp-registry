name: wapliss
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - whatsapp
    - messaging
    - remote
about:
  title: Wapliss WhatsApp
  description: Read, summarize and send your own WhatsApp messages (chats, groups, latest messages, text, media, location, contacts and polls) with user confirmation. Not affiliated with Meta or WhatsApp.
  icon: https://www.google.com/s2/favicons?domain=wapliss.com&sz=64
remote:
  transport_type: streamable-http
  url: https://wapliss.com/mcp/v1
oauth:
  - provider: wapliss
    secret: wapliss.personal_access_token
    env: WAPLISS_PERSONAL_ACCESS_TOKEN
