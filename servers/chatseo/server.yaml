name: chatseo
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - marketing
    - seo
    - analytics
    - google-search-console
    - remote
about:
  title: ChatSEO
  description: AI SEO agent on your Google Search Console data. Audit your site, find quick wins, then write and publish SEO content to WordPress.
  icon: https://www.google.com/s2/favicons?domain=chatseo.app&sz=64
remote:
  transport_type: streamable-http
  url: https://api.chatseo.app/mcp
oauth:
  - provider: chatseo
    secret: chatseo.personal_access_token
    env: CHATSEO_PERSONAL_ACCESS_TOKEN
