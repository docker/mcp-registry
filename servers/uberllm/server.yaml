name: uberllm
type: remote
meta:
  category: ai
  tags:
    - ai
    - image-generation
    - video-generation
    - llm
    - remote
about:
  title: UberLLM
  description: Make images and videos, price a request before you run it, list AI models with their prices and read your balance, from one UberLLM API key.
  icon: https://uberllm.dev/favicon.svg
remote:
  transport_type: streamable-http
  url: https://api.uberllm.dev/mcp
  headers:
    Authorization: "Bearer ${UBERLLM_API_KEY}"
config:
  description: Your UberLLM API key (starts with ull_). Create one at https://uberllm.dev/dashboard/keys
  secrets:
    - name: uberllm.api_key
      env: UBERLLM_API_KEY
      example: ull_<YOUR_API_KEY>
