name: gategoat
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - testing
    - qa
    - user-acceptance-testing
    - human-in-the-loop
    - remote
about:
  title: GateGoat
  description: Ask a person to check your preview build with a short checklist. Pass or fail per step and their notes come back to the agent.
  icon: https://gategoat.com/gategoat-icon-512.png
remote:
  transport_type: streamable-http
  url: https://gategoat.com/api/mcp
oauth:
  - provider: gategoat
    secret: gategoat.personal_access_token
    env: GATEGOAT_PERSONAL_ACCESS_TOKEN
