name: sizemyfile
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - files
    - conversion
    - compression
    - remote
about:
  title: SizeMyFile
  description: Convert, compress, and inspect files in ordered workflows using Rust edge processing with bounded server fallback. Requires a SizeMyFile account for file processing; file and account limits apply.
  icon: https://raw.githubusercontent.com/ankitsharma-tech/sizemyfile-agents/v1.0.0/plugin/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://sizemyfile.com/mcp
oauth:
  - provider: sizemyfile
    secret: sizemyfile.personal_access_token
    env: SIZEMYFILE_PERSONAL_ACCESS_TOKEN
