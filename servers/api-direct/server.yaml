name: api-direct
type: remote
meta:
  category: search
  tags:
    - search
    - social-media
    - news
    - data-extraction
    - remote
about:
  title: API Direct
  description: Search and read public data from X/Twitter, Reddit, YouTube, Instagram, TikTok, Facebook, Threads, Bluesky, Trustpilot, Amazon, Google Maps, news, forums and the web. Every tool is read-only.
  icon: https://raw.githubusercontent.com/apidirect/mcp-server/main/logo.png
remote:
  transport_type: streamable-http
  url: https://apidirect.io/mcp
  headers:
    X-API-Key: "${API_DIRECT_API_KEY}"
config:
  description: Your API Direct API key. Create a free account at https://apidirect.io/signup?utm_source=docker (50 free requests per endpoint each month).
  secrets:
    - name: api-direct.api_key
      env: API_DIRECT_API_KEY
      example: <YOUR_API_KEY>
