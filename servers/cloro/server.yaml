name: cloro
type: remote
meta:
  category: search
  tags:
    - search
    - web-search
    - ai-search
    - seo
    - remote
about:
  title: Cloro
  description: Live Google Search and Google News results, and the answers of ChatGPT, Gemini, Google AI Mode and Bing AI Mode with the sources they cite, for any country.
  icon: https://avatars.githubusercontent.com/u/231516126?v=4
remote:
  transport_type: streamable-http
  url: https://mcp.cloro.dev/mcp
  headers:
    Authorization: "Bearer ${CLORO_API_KEY}"
config:
  secrets:
    - name: cloro.api_key
      env: CLORO_API_KEY
      example: <YOUR_API_KEY>
