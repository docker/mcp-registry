name: answerline
type: remote
meta:
  category: search
  tags:
    - search
    - ai
    - seo
    - remote
about:
  title: AnswerLine
  description: Answers from ChatGPT, Gemini, Copilot and Google AI Mode, plus Google Search (with AI Overviews) and Google News results, as structured JSON with sources and citations.
  icon: https://answerline.dev/favicon.svg
remote:
  transport_type: streamable-http
  url: https://mcp.answerline.dev/mcp
  headers:
    Authorization: "Bearer ${ANSWERLINE_API_KEY}"
config:
  description: Get an API key (500 free credits, no card) at https://dashboard.answerline.dev
  secrets:
    - name: answerline.api_key
      env: ANSWERLINE_API_KEY
      example: <ANSWERLINE_API_KEY>
