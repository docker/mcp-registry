about:
  title: Jithox
  description: >-
    Read-only checks before an invoice is sent or a payment is made: IBAN check
    digits, EU VAT number format, 21 Peppol BIS Billing 3.0 rules, supplier
    bank-detail changes, and CSV/XLSX-to-data mapping. Seven tools answer
    without an account or token; the other tools return payment_required
    until a Jithox token is sent.
  icon: https://jithox.com/icon.png
remote:
  transport_type: streamable-http
  url: https://jithox.com/api/mcp
