name: chorus-host
type: remote
meta:
  category: devops
  tags:
    - devops
    - hosting
    - deployment
    - static-sites
    - remote
about:
  title: Chorus.host
  description: Publish HTML, static sites and other files to a live https://<slug>.chorus.host URL in one call, with no account needed. Anonymous sites last 24 hours and come with a claim link. Add an optional chorus.host API key to publish to your account, where sites are kept permanently.
  icon: https://raw.githubusercontent.com/chorus-host/skill/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://chorus.host/mcp
  headers:
    Authorization: "Bearer ${CHORUS_API_KEY}"
config:
  description: Optionally provide a chorus.host API key (chk_...) to publish sites to your account so they don't expire. The server also works without one.
  secrets:
    - name: chorus-host.api_key
      env: CHORUS_API_KEY
      example: chk_...
      required: false
