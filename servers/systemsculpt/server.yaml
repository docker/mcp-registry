name: systemsculpt
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - remote
about:
  title: SystemSculpt
  description: Manage your SystemSculpt account, credits, billing and server-side captures over OAuth. No local vault access.
  icon: https://systemsculpt.com/images/brand/logo-512.png
remote:
  transport_type: streamable-http
  url: https://systemsculpt.com/mcp
oauth:
  - provider: systemsculpt
    secret: systemsculpt.personal_access_token
    env: SYSTEMSCULPT_PERSONAL_ACCESS_TOKEN
