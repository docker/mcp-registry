name: asitis
image: mcp/asitis
type: server
meta:
  category: code
  tags:
    - code
    - linter
    - markdown
    - security
about:
  title: AsItIs
  description: Read-only linter for CLAUDE.md, AGENTS.md and SKILL.md. Shows what each coding agent loads, token budgets, broken imports and instructions hidden in comments or invisible characters.
  icon: https://asitis.app/icons/icon-512.png
source:
  project: https://github.com/Katta041/asitis-agent-tools
  commit: c6fbdf20809e07a51eb5ec43eefd9d14f8a222ec
run:
  volumes:
    - "{{asitis.path|volume-target}}:/workspace:ro"
  disableNetwork: true
config:
  description: The project folder AsItIs may read. It is mounted read-only.
  parameters:
    type: object
    properties:
      path:
        type: string
        default: /Users/demo/sources
    required:
      - path
