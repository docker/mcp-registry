name: puckapi-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - hockey
    - nhl
    - sports-data
    - remote
about:
  title: PuckAPI
  description: "NHL and PWHL stats, play-by-play, expected goals and odds. REST API and MCP server. Free to start."
  icon: https://www.google.com/s2/favicons?domain=puckapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.puckapi.com/mcp
oauth:
  - provider: puckapi-remote
    secret: puckapi-remote.personal_access_token
    env: PUCKAPI_REMOTE_PERSONAL_ACCESS_TOKEN
