name: stackin
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - invoicing
    - tax
    - brazil
    - remote
about:
  title: Stackin
  description: Issue, consult, cancel and correct Brazilian fiscal documents (NF-e for goods, NFS-e for services) through the Stackin API
  icon: https://www.google.com/s2/favicons?domain=stackin.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.stackin.io/mcp
oauth:
  - provider: stackin
    secret: stackin.personal_access_token
    env: STACKIN_PERSONAL_ACCESS_TOKEN
