name: cobrain
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - memory
    - notes
    - markdown
    - remote
about:
  title: Cobrain
  description: Shared Markdown memory your AIs read and write. Load a project's notes and decisions in one call, search, and save as you work; the same notes reach Claude, ChatGPT, Codex and any MCP client.
  icon: https://www.google.com/s2/favicons?domain=cobrain.space&sz=64
remote:
  transport_type: streamable-http
  url: https://cobrain.space/mcp
oauth:
  - provider: cobrain
    secret: cobrain.personal_access_token
    env: COBRAIN_PERSONAL_ACCESS_TOKEN
