name: tokportal
type: remote
meta:
  category: automation
  tags:
    - social-media
    - tiktok
    - instagram
    - youtube
    - marketing
    - automation
    - remote
about:
  title: TokPortal
  description: Managed social infrastructure API — real TikTok, Instagram and YouTube accounts created, warmed and operated by human account managers in 16+ countries. Create bundles, upload and schedule videos at scale, read analytics, handle bans. No per-account OAuth, no 25-posts/day cap, no app review.
  icon: https://www.google.com/s2/favicons?domain=tokportal.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.tokportal.com/api/ext/mcp
  headers:
    Authorization: "Bearer ${TOKPORTAL_API_KEY}"
config:
  secrets:
    - name: tokportal.api_key
      env: TOKPORTAL_API_KEY
      example: sk_your_tokportal_api_key
