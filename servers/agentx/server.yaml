name: agentx
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - coding-agents
    - remote
about:
  title: AgentX
  description: Cloud console for a fleet of AI coding agents running on your own machines. Check on your agents, hand them work, and read what they publish.
  icon: https://www.agentxhq.com/assets/img/icon-512.png
remote:
  transport_type: streamable-http
  url: https://www.agentxhq.com/mcp
oauth:
  - provider: agentx
    secret: agentx.personal_access_token
    env: AGENTX_PERSONAL_ACCESS_TOKEN
