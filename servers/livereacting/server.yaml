name: livereacting
type: remote
meta:
  category: media
  tags:
    - media
    - video
    - live-streaming
    - remote
about:
  title: LiveReacting
  description: Run 24/7 live streams of pre-recorded videos, schedule broadcasts, and multistream to YouTube, Facebook, Twitch and any RTMP destination.
  icon: https://raw.githubusercontent.com/LiveReacting/livereacting-mcp/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.livereacting.com/mcp
  headers:
    Authorization: "Bearer ${LIVEREACTING_API_KEY}"
config:
  secrets:
    - name: livereacting.api_key
      env: LIVEREACTING_API_KEY
      example: <YOUR_API_KEY>
