name: mobilebox
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - testing
    - android
    - ios
    - mobile
    - remote
about:
  title: Mobilebox
  description: Cloud Android phones and iOS simulators for AI agents to read, tap, type and test apps on, over MCP
  icon: https://mobilebox.dev/brand/avatar-400.png
remote:
  transport_type: streamable-http
  url: https://mobilebox.dev/mcp
oauth:
  - provider: mobilebox
    secret: mobilebox.personal_access_token
    env: MOBILEBOX_PERSONAL_ACCESS_TOKEN
