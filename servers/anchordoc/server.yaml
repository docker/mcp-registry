name: anchordoc
image: mcp/anchordoc
type: server
meta:
  category: search
  tags:
    - pdf
    - document-ai
    - rag
    - verification
    - search
    - financial-analysis
about:
  title: AnchorDoc
  description: Deterministic, zero-LLM MCP server for navigating long PDFs on demand, locating cross-page evidence, and verifying verbatim quotes and numerical formulas without a vector database.
  icon: https://avatars.githubusercontent.com/u/93818805?s=200&v=4
source:
  project: https://github.com/ryanvii/AnchorDoc
  commit: 4b8620c84c17c6fadd2d26827b0ad7d41882c802
run:
  volumes:
    - "{{anchordoc.docs_path}}:/data"
config:
  description: Configure the local directory containing PDF or DOCX documents that AnchorDoc can read in read-only mode
  parameters:
    type: object
    properties:
      docs_path:
        type: string
        description: Absolute path to a local folder of PDF/DOCX documents to mount into /data
        default: /tmp
    required:
      - docs_path
