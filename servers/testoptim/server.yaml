name: testoptim
type: remote
meta:
  category: devops
  tags:
    - testing
    - qa
    - devops
    - remote
about:
  title: TestOptim
  description: Run AI QA test runs on your web app and read the bugs they find, with steps to reproduce.
  icon: https://www.testoptim.com/logo.png
remote:
  transport_type: streamable-http
  url: https://api.testoptim.com/api/mcp
  headers:
    Authorization: "Bearer ${TESTOPTIM_API_KEY}"
config:
  secrets:
    - name: testoptim.api_key
      env: TESTOPTIM_API_KEY
      example: <YOUR_API_KEY>
