name: testoptim
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - testing
    - qa
    - automation
    - remote
about:
  title: TestOptim
  description: Run AI QA test suites on your web app, follow each run and read the bugs it finds, with screenshots and steps to reproduce
  icon: https://www.google.com/s2/favicons?domain=testoptim.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.testoptim.com/api/mcp
oauth:
  - provider: testoptim
    secret: testoptim.personal_access_token
    env: TESTOPTIM_PERSONAL_ACCESS_TOKEN
