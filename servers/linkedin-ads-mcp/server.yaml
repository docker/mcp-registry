name: linkedin-ads-mcp
image: mcp/linkedin-ads-mcp
type: server
meta:
  category: business
  tags:
    - linkedin
    - advertising
    - marketing
    - analytics
about:
  title: LinkedIn Ads
  description: LinkedIn Campaign Manager over the Marketing API. List ad accounts, campaigns and creatives, get performance with demographic breakdowns, compare periods and look up targeting. With the rw_ads scope it can also build campaign groups, campaigns and ads as drafts only; nothing can be launched from the server.
  icon: https://avatars.githubusercontent.com/u/187990956?s=200&v=4
source:
  project: https://github.com/Walma-Labs/linkedin-ads-mcp
  commit: 7547068c3a2e667c6cd6bc920300ea1228148db8
config:
  description: Configure your LinkedIn app credentials and a refresh token (see the repository README for signing in once)
  secrets:
    - name: linkedin-ads-mcp.client_id
      env: LINKEDIN_CLIENT_ID
      example: YOUR_LINKEDIN_CLIENT_ID
    - name: linkedin-ads-mcp.client_secret
      env: LINKEDIN_CLIENT_SECRET
      example: YOUR_LINKEDIN_CLIENT_SECRET
    - name: linkedin-ads-mcp.refresh_token
      env: LINKEDIN_REFRESH_TOKEN
      example: YOUR_LINKEDIN_REFRESH_TOKEN
