name: unipile
type: remote
meta:
  category: communication
  tags:
    - communication
    - linkedin
    - whatsapp
    - instagram
    - telegram
    - email
    - calendar
    - api
    - remote
about:
  title: Unipile
  description: Read and call the Unipile API (LinkedIn Classic, Sales Navigator and Recruiter, WhatsApp, Instagram, Telegram, Gmail, Outlook, IMAP, Google and Outlook Calendar) from your coding agent, and test each call on your own connected accounts
  icon: https://raw.githubusercontent.com/unipile/unipile-mcp/main/assets/icon-256.png
remote:
  transport_type: streamable-http
  url: https://developer.unipile.com/mcp?branch=v2.0
  headers:
    X-API-KEY: "${UNIPILE_API_KEY}"
config:
  secrets:
    - name: unipile.api_key
      env: UNIPILE_API_KEY
      example: <YOUR_SCOPED_ACCOUNT_API_KEY>
