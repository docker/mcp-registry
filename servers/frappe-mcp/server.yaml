name: frappe-mcp
image: muthanii/frappe-mcp
type: server
meta:
  category: developer-tools
  tags:
    - developer-tools
    - frappe
    - erpnext
    - erp
    - business
about:
  title: Frappe Framework
  description: >
    MCP server for Frappe Framework — interact with any Frappe/ERPNext site
    via its REST API. Perform document CRUD, search, and call whitelisted
    server-side Python methods directly from Claude, Copilot, and other MCP clients.
  icon: https://avatars.githubusercontent.com/u/45550783?s=200&v=4
source:
  project: https://github.com/muthanii/frappe_mcp
  commit: 2620893cdbac9d6f53ddcef359dc8f214c34cd97
config:
  description: Configure the connection to your Frappe/ERPNext site
  secrets:
    - name: frappe-mcp.api_key
      env: FRAPPE_API_KEY
      example: abcdef1234567890
    - name: frappe-mcp.api_secret
      env: FRAPPE_API_SECRET
      example: abcdef1234567890
  env:
    - name: FRAPPE_URL
      example: https://your-site.erpnext.com
    - name: FRAPPE_VERIFY_SSL
      example: "true"
    - name: FRAPPE_TIMEOUT
      example: "30"
  parameters:
    type: object
    properties:
      frappe_url:
        type: string
        description: Base URL of your Frappe/ERPNext site
    required:
      - frappe_url
