name: hallofelix
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - telephony
    - whatsapp
    - insurance
    - crm
    - remote
about:
  title: HalloFelix Von InsurMagic
  description: >-
    Official remote MCP server of HalloFelix, the AI phone and WhatsApp
    assistant for insurance brokers in Germany, Austria and Switzerland. Access
    calls with transcripts and summaries, customers, outbound call campaigns,
    phone, e-mail and WhatsApp assistants, the WhatsApp inbox (chats, messages,
    notes, labels, templates), task types, calendars and account settings.
  icon: https://raw.githubusercontent.com/timgutberlet/hallofelix-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://app.hallofelix.de/api/mcp
oauth:
  - provider: hallofelix
    secret: hallofelix.personal_access_token
    env: HALLOFELIX_PERSONAL_ACCESS_TOKEN
