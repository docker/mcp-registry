name: mcpsurfr
image: mcp/mcpsurfr
type: server
meta:
  category: search
  tags:
    - search
    - web-search
    - research
about:
  title: Local Web Search (mcpsurfr)
  description: Local web search with no API keys. Searches several engines, re-ranks results on-device and returns only the passages that answer the question. Also reads URLs and PDFs, with recency, region, domain and news filters.
  icon: https://avatars.githubusercontent.com/u/12816113?s=200&v=4
source:
  project: https://github.com/nkapila6/mcpsurfr
  commit: 20e483f5e8e9b1b9317157ea196da38fadffb0cd
config:
  description: Optional settings. Both can be left empty.
  env:
    - name: MCPSURFR_MAX_CHARS
      example: "40000"
      value: "{{mcpsurfr.max_chars}}"
    - name: MCPSURFR_LEGACY_TOOLS
      example: "1"
      value: "{{mcpsurfr.legacy_tools}}"
  parameters:
    type: object
    properties:
      max_chars:
        type: string
      legacy_tools:
        type: string
