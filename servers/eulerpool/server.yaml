name: eulerpool
type: remote
meta:
  category: finance
  tags:
    - finance
    - stocks
    - market-data
    - macro
    - remote
about:
  title: Eulerpool
  description: Financial data for AI agents. 250+ tools covering stocks, fundamentals, ETFs, macro series (FRED/ECB/IMF/World Bank), crypto, FX, insider trades, congress trading and options flow.
  icon: https://www.google.com/s2/favicons?domain=eulerpool.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.eulerpool.com/mcp
  headers:
    Authorization: "Bearer ${EULERPOOL_API_KEY}"
config:
  secrets:
    - name: eulerpool.api_key
      env: EULERPOOL_API_KEY
      example: <YOUR_API_KEY>
