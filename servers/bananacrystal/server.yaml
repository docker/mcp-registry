name: bananacrystal
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - fx-rates
    - payments
    - stablecoin
    - agent-wallet
    - hedera
    - remote
about:
  title: BananaCrystal
  description: "Give your AI agent a wallet: live FX rates, swaps and payments in 140+ local currencies."
  icon: https://raw.githubusercontent.com/BananaCrystal/mcp-server-bananacrystal/main/assets/icon-400.png
remote:
  transport_type: streamable-http
  url: https://agentic.bananacrystal.com/mcp
  headers:
    x-api-key: "${BANANACRYSTAL_API_KEY}"
config:
  secrets:
    - name: bananacrystal.api_key
      env: BANANACRYSTAL_API_KEY
      example: <YOUR_API_KEY>
