about:
  title: GridPin
  description: Offline geocoding and reverse geocoding with no API key. Downloads a country file once (Brazil, France, Germany without Bavaria, Italy, the Netherlands, Serbia, Spain), checks it against the signed release, then answers addresses and coordinates inside the container.
  icon: https://avatars.githubusercontent.com/u/301769080?s=200&v=4
source:
  project: https://github.com/gridpin/gridpin
  commit: e0198608f167ce76990177557e57409ebca39993
  directory: mcp
run:
  volumes:
    - gridpin-sheets:/data
  allowHosts:
    - dl.gridpin.dev:443
