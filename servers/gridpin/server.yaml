about:
  title: GridPin
  description: Offline geocoding and reverse geocoding with no API key. Downloads a country file once (the United States, Canada, Germany without Bavaria, France, Italy, Spain, Australia, Mexico, the Netherlands, Brazil, Serbia), checks it against the signed release, then answers addresses and coordinates inside the container.
