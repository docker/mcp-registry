name: yatmo
type: remote
meta:
  category: data
  tags:
    - real-estate
    - location
    - geodata
    - maps
    - remote
about:
  title: Yatmo
  description: Neighbourhood data around any property in 25 countries, for real estate assistants. Nearest school, nursery, supermarket, public transport, train station and motorway with distances and travel times, and a quotable neighbourhood summary. Read-only.
  icon: https://www.google.com/s2/favicons?domain=yatmo.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.yatmo.com/mcp/v1
  headers:
    LicenceKey: "${YATMO_LICENCE_KEY}"
config:
  secrets:
    - name: yatmo.licence_key
      env: YATMO_LICENCE_KEY
      example: <YOUR_YATMO_BACKEND_KEY>
