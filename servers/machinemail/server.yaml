name: machinemail
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - email
    - communication
    - remote
about:
  title: MachineMail
  description: Email inboxes for AI agents. Send, receive, and read email with a trust report on every message.
  icon: https://machinemail.dev/favicon.svg
remote:
  transport_type: streamable-http
  url: https://mcp.machinemail.dev/mcp
oauth:
  - provider: machinemail
    secret: machinemail.personal_access_token
    env: MACHINEMAIL_PERSONAL_ACCESS_TOKEN
