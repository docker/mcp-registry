name: sightradar
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - face-recognition
    - computer-vision
    - image-search
    - remote
about:
  title: SightRadar Face Recognition API
  description: Official MCP server for the SightRadar face recognition API. Index photos into collections, find every photo of a person from one selfie, compare and detect faces, and run batches of up to 1,000 photo URLs.
  icon: https://www.google.com/s2/favicons?domain=sightradar.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.sightradar.com/mcp
  headers:
    Authorization: "Bearer ${SIGHTRADAR_API_KEY}"
config:
  secrets:
    - name: sightradar.api_key
      env: SIGHTRADAR_API_KEY
      example: <YOUR_API_KEY>
