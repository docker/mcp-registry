name: transcriptfetch
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - rag
    - transcription
    - video
    - youtube
    - remote
about:
  title: TranscriptFetch
  description: Transcripts from YouTube, TikTok and Instagram for RAG pipelines and AI agents, from single videos to whole channels, playlists and searches
  icon: https://transcriptfetch.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://transcriptfetch.com/mcp
oauth:
  - provider: transcriptfetch
    secret: transcriptfetch.personal_access_token
    env: TRANSCRIPTFETCH_PERSONAL_ACCESS_TOKEN
