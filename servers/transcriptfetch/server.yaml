name: transcriptfetch
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - rag
    - transcription
    - video
    - youtube
    - remote
about:
  title: TranscriptFetch
  description: Turn YouTube, TikTok, Instagram videos and podcasts into clean, structured transcripts for RAG pipelines and AI agents
  icon: https://www.google.com/s2/favicons?domain=transcriptfetch.com&sz=64
remote:
  transport_type: streamable-http
  url: https://transcriptfetch.com/mcp
oauth:
  - provider: transcriptfetch
    secret: transcriptfetch.personal_access_token
    env: TRANSCRIPTFETCH_PERSONAL_ACCESS_TOKEN
