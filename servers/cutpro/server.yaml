name: cutpro
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - image-generation
    - video-generation
    - social-media
    - video
    - remote
about:
  title: CutPro
  description: Generate images and videos with Veo, Kling, Seedance, Nano Banana, GPT Image and more, then post them to TikTok, Instagram and YouTube through their official APIs. Also clips long videos and transcribes audio
  icon: https://cut.pro/icons/icon-192.png
remote:
  transport_type: streamable-http
  url: https://mcp.cut.pro
oauth:
  - provider: cutpro
    secret: cutpro.personal_access_token
    env: CUTPRO_PERSONAL_ACCESS_TOKEN
