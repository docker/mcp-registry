name: golivemcp
type: remote
meta:
  category: devops
  tags:
    - devops
    - deployment
    - dns
    - domains
    - security
    - remote
about:
  title: GoLive MCP
  description: Take what your agent built live. Domains, DNS, email, deploys, secrets, storage, routing and pre-launch audits, with dry runs, budgets and an audit log.
  icon: https://golivemcp.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://golivemcp.com/mcp
  headers:
    x-api-key: "${GOLIVEMCP_API_KEY}"
config:
  secrets:
    - name: golivemcp.api_key
      env: GOLIVEMCP_API_KEY
      example: <YOUR_API_KEY>
