about:
  title: Warp Freight
  description: Compare freight quotes, book shipments, track deliveries, and retrieve shipment documents and invoices through Warp. Supports LTL, FTL, cargo van, box truck, and multi-stop freight. Booking tools create real shipments and require user approval.
  icon: https://mcp.wearewarp.com/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.wearewarp.com/api/mcp
oauth:
  - provider: warp-freight
    secret: warp-freight.personal_access_token
    env: WARP_FREIGHT_PERSONAL_ACCESS_TOKEN
