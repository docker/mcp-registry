name: ship
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - coding-agents
    - agentic-coding
    - agentic-sdlc
    - code-review
    - agentic-testing
    - pull-requests
    - headless
    - ai-software-factory
    - remote
about:
  title: SHIP
  description: "Assign Linear, Jira or GitHub issues to an AI coding agent team that plans, builds, reviews and tests pull requests."
  icon: https://letsship.ai/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.letsship.ai/mcp
oauth:
  - provider: ship
    secret: ship.personal_access_token
    env: SHIP_PERSONAL_ACCESS_TOKEN
