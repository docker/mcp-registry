name: ethora-remote
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - ethora
    - chat
    - messaging
    - ai-agents
    - remote
about:
  title: Ethora
  description: Create chat apps, rooms and users on the Ethora messaging platform, build RAG knowledge bases, deploy AI agents into rooms and embed website chat widgets.
  icon: https://www.google.com/s2/favicons?domain=ethora.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.chat.ethora.com/mcp/oauth
oauth:
  - provider: ethora-remote
    secret: ethora-remote.personal_access_token
    env: ETHORA_REMOTE_PERSONAL_ACCESS_TOKEN
