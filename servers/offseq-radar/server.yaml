name: offseq-radar
type: remote
meta:
  category: security
  tags:
    - security
    - vulnerability-management
    - threat-intelligence
    - remote
about:
  title: OffSeq Threat Radar
  description: Live CVE, CISA KEV and exploit intelligence, SBOM and lockfile scans, patch prioritization and IOC checks
  icon: https://radar.offseq.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://radar.offseq.com/mcp
  headers:
    X-API-Key: "${OFFSEQ_RADAR_API_KEY}"
config:
  secrets:
    - name: offseq-radar.api_key
      env: OFFSEQ_RADAR_API_KEY
      example: tr_<64 hex characters>
