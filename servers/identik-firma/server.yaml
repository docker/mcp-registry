name: identik-firma
type: remote
meta:
  category: productivity
  tags:
    - e-signature
    - documents
    - legal
    - argentina
    - remote
about:
  title: Identik Firma Digital
  description: Argentine digital signature under Ley 25.506 with licensed-CA certificates — send documents out for signature, track status, download the signed PDF, and verify signatures cryptographically.
  icon: https://firma.identik.me/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://firma.identik.me/api/mcp
  headers:
    Authorization: "Bearer ${IDENTIK_FIRMA_API_TOKEN}"
config:
  secrets:
    - name: identik-firma.api_token
      env: IDENTIK_FIRMA_API_TOKEN
      example: <YOUR_API_TOKEN>
