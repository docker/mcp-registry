name: vedetta-mcp
image: mcp/vedetta-mcp
type: server
meta:
  category: finance
  tags:
    - finance
    - crypto
    - x402
    - mcp
about:
  title: Vedetta
  description: >-
    Pay-per-call crypto market intelligence MCP. Four FREE funnel tools
    (feed, route, snapshot, track-record) return 200 with no auth; sixteen
    paid analytical tools settle via x402 USDC on Base ($0.01–$0.09).
    Descriptive market analysis only — not financial advice.
  icon: https://www.google.com/s2/favicons?domain=vedetta.dethboy.com&sz=64
source:
  project: https://github.com/lacryptorina/vedetta-mcp
  # REPLACE with commit that includes Dockerfile (lab Dockerfile not on main as of 2026-10-29)
  commit: d4fa5a4d87af9abbb7f28c60ad55fe4ae1519359
config:
  description: Optional Base USDC wallet for settling paid x402 tools. Free funnel works with empty config.
  secrets:
    - name: vedetta-mcp.evm_private_key
      env: EVM_PRIVATE_KEY
      example: "0xYOUR_DEDICATED_LOW_BALANCE_KEY"
  env:
    - name: VEDETTA_API_URL
      example: https://vedetta.dethboy.com
      value: "{{vedetta-mcp.vedetta_api_url}}"
  parameters:
    type: object
    properties:
      vedetta_api_url:
        title: Vedetta API URL
        type: string
        format: uri
        default: https://vedetta.dethboy.com
