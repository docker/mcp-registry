  url: https://app.forthclear.io/mcp
oauth:
  - provider: forthclear-liquidation
    secret: forthclear-liquidation.personal_access_token
    env: FORTHCLEAR_LIQUIDATION_PERSONAL_ACCESS_TOKEN
