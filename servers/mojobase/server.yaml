name: mojobase
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - email
    - calendar
    - crm
    - remote
about:
  title: Mojobase
  description: One server for your whole business in Mojobase. Work across email, team chat, calendar, tasks, files, the Handbook, customers and numbers, as you. Needs a Mojobase account (invite-only for now)
  icon: https://www.google.com/s2/favicons?domain=mojobase.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://app.mojobase.ai/mcp
  headers:
    Authorization: "Bearer ${MOJOBASE_API_KEY}"
config:
  secrets:
    - name: mojobase.api_key
      env: MOJOBASE_API_KEY
      example: <YOUR_API_KEY>
