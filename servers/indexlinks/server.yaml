name: indexlinks
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - seo
    - indexing
    - remote
about:
  title: IndexLinks
  description: Check how search engines and AI crawlers see a site, send new pages to search engines and AI crawlers, see Google rankings and verified crawl receipts.
  icon: https://www.google.com/s2/favicons?domain=indexlinks.app&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.indexlinks.app/mcp
oauth:
  - provider: indexlinks
    secret: indexlinks.personal_access_token
    env: INDEXLINKS_PERSONAL_ACCESS_TOKEN
