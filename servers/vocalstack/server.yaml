name: vocalstack
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - transcription
    - translation
    - speech-to-text
    - audio
    - remote
about:
  title: VocalStack
  description: Transcribe and translate audio, video and live streams in about 100 languages, with speaker labels; run live broadcasts listeners follow in their own language.
  icon: https://vocalstack.com/vocalstack-mark.svg
remote:
  transport_type: streamable-http
  url: https://api.vocalstack.com/v1/mcp
oauth:
  - provider: vocalstack
    secret: vocalstack.personal_access_token
    env: VOCALSTACK_PERSONAL_ACCESS_TOKEN
