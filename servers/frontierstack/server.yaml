name: frontierstack
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - devops
    - macos
    - server-management
    - remote
about:
  title: FrontierStack
  description: Check the health of your Macs and linked servers, read scrubbed logs, run read-only diagnostics and restart supported web services
  icon: https://www.google.com/s2/favicons?domain=frontierstack.app&sz=64
remote:
  transport_type: streamable-http
  url: https://frontierstack.app/plugin/mcp
oauth:
  - provider: frontierstack
    secret: frontierstack.personal_access_token
    env: FRONTIERSTACK_PERSONAL_ACCESS_TOKEN
