name: svg-new
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - design
    - svg
    - remote
about:
  title: SVG.new
  description: Convert PNG, JPG and WebP to SVG. Recolor an SVG, reduce its colors or remove its background.
  icon: https://svg.new/icon.png
remote:
  transport_type: streamable-http
  url: https://svg.new/api/mcp
oauth:
  - provider: svg-new
    secret: svg-new.personal_access_token
    env: SVG_NEW_PERSONAL_ACCESS_TOKEN
