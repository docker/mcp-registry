name: springprompt
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - llm
    - prompt-testing
    - evaluation
    - remote
about:
  title: Spring Prompt
  description: Test the LLM prompts in your app on realistic cases across several models, with pass rates and cost per model, and improve a prompt from its failures
  icon: https://springprompt.com/static/brand/favicon.svg
remote:
  transport_type: streamable-http
  url: https://springprompt.com/mcp
oauth:
  - provider: springprompt
    secret: springprompt.personal_access_token
    env: SPRINGPROMPT_PERSONAL_ACCESS_TOKEN
