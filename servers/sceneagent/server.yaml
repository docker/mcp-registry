name: sceneagent
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - robotics
    - simulation
    - openusd
    - remote
about:
  title: SceneAgent
  description: Turn 3D scans, Gaussian splats and video into sim-ready OpenUSD and MJCF robot scenes for Isaac Sim, Isaac Lab and MuJoCo
  icon: https://sceneagent.dev/sceneagent-icon-512.png
remote:
  transport_type: streamable-http
  url: https://app.sceneagent.dev/mcp
oauth:
  - provider: sceneagent
    secret: sceneagent.personal_access_token
    env: SCENEAGENT_PERSONAL_ACCESS_TOKEN
