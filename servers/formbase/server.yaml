name: formbase
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - forms
    - requests
    - ai-agents
    - remote
about:
  title: Formbase
  description: Collect verified customer information for workflows and AI agents. One request sends a branded, prefilled form; the customer confirms or corrects the answers.
  icon: https://formbase.so/assets/logo-light.png
remote:
  transport_type: streamable-http
  url: https://api.formbase.so/api/mcp
oauth:
  - provider: formbase
    secret: formbase.personal_access_token
    env: FORMBASE_PERSONAL_ACCESS_TOKEN
