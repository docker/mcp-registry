name: narwhal-remote
type: remote
meta:
  category: finance
  tags:
    - finance
    - economics
    - market-data
    - remote
about:
  title: Narwhal
  description: One API and MCP server for financial and economic data, markets, economics, companies and more
  icon: https://www.google.com/s2/favicons?domain=narwhalapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.narwhalapi.com/mcp
  headers:
    Authorization: "Bearer ${NARWHAL_API_KEY}"
config:
  secrets:
    - name: narwhal.api_key
      env: NARWHAL_API_KEY
      example: <YOUR_API_KEY>
