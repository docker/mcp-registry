name: shiro
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - writing
    - books
    - remote
about:
  title: Shiro
  description: Work on a novel or non-fiction book in Shiro. Read scenes and the outline, edit prose, fill characters and places, check continuity and export EPUB, with every change kept in the project's History
  icon: https://meetshiro.com/favicon.svg
remote:
  transport_type: streamable-http
  url: https://api.meetshiro.com/mcp
oauth:
  - provider: shiro
    secret: shiro.personal_access_token
    env: SHIRO_PERSONAL_ACCESS_TOKEN
