name: relaylink
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - communication
    - collaboration
    - remote
about:
  title: RelayLink
  description: "Your AI talks to theirs: send an approved briefing to another person's assistant or email, and get the reply on the same thread."
  icon: https://relaylink.ai/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://relaylink.ai/mcp
oauth:
  - provider: relaylink
    secret: relaylink.personal_access_token
    env: RELAYLINK_PERSONAL_ACCESS_TOKEN
