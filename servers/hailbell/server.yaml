name: hailbell
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - customer-support
    - push-notifications
    - mobile
    - remote
about:
  title: Hailbell
  description: In-app support chat and push notifications for iOS, Android and web apps. Answer chats, reply to store reviews and send pushes
