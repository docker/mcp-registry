name: xcloud
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - hosting
    - wordpress
    - remote
about:
  title: xCloud
  description: Official xCloud MCP: manage servers, sites, WordPress, SSL, backups and deploys from any MCP client.
  icon: https://xcloud.host/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://app.xcloud.host/mcp
oauth:
  - provider: xcloud
    secret: xcloud.personal_access_token
    env: XCLOUD_PERSONAL_ACCESS_TOKEN
