name: reviewbot
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - customer-feedback
    - app-reviews
    - remote
about:
  title: ReviewBot
  description: Read collected App Store and Google Play reviews and bounded feedback statistics.
  icon: https://reviewbot.io/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://api.reviewbot.io/mcp
oauth:
  - provider: reviewbot
    secret: reviewbot.personal_access_token
    env: REVIEWBOT_PERSONAL_ACCESS_TOKEN
