name: lookupdock
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - email
    - phone
    - ip
    - signup
    - remote
about:
  title: LookupDock
  description: Email syntax and mail-domain/DNS signals, basic phone numbering-plan validation, and IP hosting/Tor signals for signup checks. Results include uncertainty; mailbox existence, current carrier and VPN detection are not provided.
  icon: https://lookupdock.com/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://lookupdock.com/mcp
  headers:
    Authorization: "Bearer ${LOOKUPDOCK_API_KEY}"
config:
  secrets:
    - name: lookupdock.api_key
      env: LOOKUPDOCK_API_KEY
      example: <YOUR_LOOKUPDOCK_API_KEY>
