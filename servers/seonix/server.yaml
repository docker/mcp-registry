name: seonix
type: remote
meta:
  category: analytics
  tags:
    - seo
    - marketing
    - analytics
    - remote
about:
  title: Seonix
  description: Read-only access to your Seonix SEO workspace - search rankings and clicks from Google Search Console/GA4, technical site audit issues, keyword research and clusters, content, and brand mentions in ChatGPT, Gemini, Claude and Perplexity answers.
  icon: https://www.google.com/s2/favicons?domain=seonix.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://api.seonix.ai/mcp
  headers:
    Authorization: "Bearer ${SEONIX_API_KEY}"
config:
  secrets:
    - name: seonix.api_key
      env: SEONIX_API_KEY
      example: sx_mcp_<YOUR_KEY>
