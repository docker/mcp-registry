name: youcom
type: remote
meta:
  category: search
  tags:
    - search
    - web-search
    - research
    - ai-search
    - remote
about:
  title: You.com Search
  description: AI-powered web search with real-time results, content extraction, and cited research for enhanced AI assistant capabilities.
  icon: https://www.google.com/s2/favicons?domain=you.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.you.com/mcp
  headers:
    Authorization: "Bearer ${YDC_API_KEY}"
    User-Agent: "Docker-MCP-Registry/1.0 (docker/mcp-registry integration)"
config:
  description: Configure You.com MCP server access. API key is optional - keyless mode provides basic search with daily limits.
  secrets:
    - name: youcom.api_key
      env: YDC_API_KEY
      example: <YOUR_YDC_API_KEY>
      description: "Optional: Get your API key at https://you.com/platform/api-keys for enhanced features"