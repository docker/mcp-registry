name: gitranks
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - github
    - open-source
    - pull-request
    - remote
about:
  title: GitRanks Contribute
  description: Find open-source GitHub issues to contribute to, matched to your skills; you approve every PR.
  icon: https://raw.githubusercontent.com/gitranks/contribute/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.gitranks.com/mcp
oauth:
  - provider: gitranks
    secret: gitranks.personal_access_token
    env: GITRANKS_PERSONAL_ACCESS_TOKEN
