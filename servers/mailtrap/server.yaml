name: mailtrap
image: mcp/mailtrap
type: server
meta:
  category: communication
  tags:
    - mailtrap
    - email
about:
  title: Mailtrap
  description: Official MCP server for Mailtrap — send and test email, manage templates, sandbox, campaigns, contacts, and account settings.
  icon: https://avatars.githubusercontent.com/u/228706481?s=200&v=4
source:
  project: https://github.com/mailtrap/mailtrap-mcp
  branch: add-docker-mcp-catalog
  commit: 5abcec7733e881eaf4a35c591190462c844cfbf5
config:
  description: Configure Mailtrap API access and optional defaults for sending and sandbox tools.
  secrets:
    - name: mailtrap.api_token
      env: MAILTRAP_API_TOKEN
      example: YOUR_MAILTRAP_API_TOKEN
    - name: mailtrap.organization_api_token
      env: MAILTRAP_ORGANIZATION_API_TOKEN
      example: YOUR_MAILTRAP_ORGANIZATION_API_TOKEN
  env:
    - name: MAILTRAP_ACCOUNT_ID
      example: "1342055"
      value: "{{mailtrap.mailtrap_account_id}}"
    - name: DEFAULT_FROM_EMAIL
      example: sender@example.com
      value: "{{mailtrap.default_from_email}}"
    - name: MAILTRAP_SANDBOX_ID
      example: "123456"
      value: "{{mailtrap.mailtrap_sandbox_id}}"
    - name: MAILTRAP_ORGANIZATION_ID
      example: "1"
      value: "{{mailtrap.mailtrap_organization_id}}"
  parameters:
    type: object
    properties:
      mailtrap_account_id:
        type: string
        description: Mailtrap account ID for account-scoped tools (templates, stats, logs, domains, sandbox list/show).
      default_from_email:
        type: string
        description: Default sender when send tools omit from.
      mailtrap_sandbox_id:
        type: string
        description: Default sandbox (test inbox) ID when sandbox tools omit sandbox_id.
      mailtrap_organization_id:
        type: string
        description: Organization ID for list-sub-accounts and create-sub-account.
