name: silkline
type: remote
meta:
  category: search
  tags:
    - social-media
    - e-commerce
    - china
    - data-extraction
    - remote
about:
  title: Silkline
  description: The Chinese internet, as one API. Xiaohongshu, Douyin, Weibo, Taobao and more, paid per record.
  icon: https://silklinedata.com/logo.png
remote:
  transport_type: streamable-http
  url: https://api.silklinedata.com/mcp
  headers:
    Authorization: "Bearer ${SILKLINE_API_KEY}"
config:
  secrets:
    - name: silkline.api_key
      env: SILKLINE_API_KEY
      example: <YOUR_API_KEY>
