name: unitpost
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - email
    - sms
    - communication
    - remote
about:
  title: Unitpost
  description: Email and SMS infrastructure, run by your agent. Send transactional email and SMS, run campaigns, and manage contacts, templates, and sending domains.
  icon: https://www.unitpost.com/web-app-manifest-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.unitpost.com/mcp
oauth:
  - provider: unitpost
    secret: unitpost.personal_access_token
    env: UNITPOST_PERSONAL_ACCESS_TOKEN
