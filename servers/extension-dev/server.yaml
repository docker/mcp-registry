name: extension-dev
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - browser-extensions
    - developer-tools
    - remote
about:
  title: Extension.dev
  description: extension.dev MCP is the MCP server for building browser extensions. Build, run, debug, test and ship Chrome, Firefox, Edge and Safari extensions from your AI agent.
  icon: https://mcp.extension.dev/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.extension.dev/mcp
oauth:
  - provider: extension-dev
    secret: extension-dev.personal_access_token
    env: EXTENSION_DEV_PERSONAL_ACCESS_TOKEN
