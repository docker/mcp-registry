name: nova-pdf-agent
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - pdf
    - documents
    - remote
about:
  title: "PDF Agent by Nova (CIVAI)"
  description: "I create PDF documents from markdown, preview, then generate a downloadable file"
  icon: https://nova.civai.co/catalog-icons/PDFIcon.svg
remote:
  transport_type: streamable-http
  url: https://nova.civai.co/mcp/agents/pdf-agent
  headers:
    Authorization: "Bearer ${NOVA_PDF_AGENT_API_KEY}"
config:
  description: Create a programmatic Nova API key at https://nova.civai.co/api-keys
  secrets:
    - name: nova-pdf-agent.api_key
      env: NOVA_PDF_AGENT_API_KEY
      example: <YOUR_NOVA_API_KEY>
