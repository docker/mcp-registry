name: promptguard
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - ai
    - prompt-injection
    - pii
    - remote
about:
  title: PromptGuard
  description: Scan prompts for injection and jailbreaks, redact PII, find unprotected LLM calls in code, and read your PromptGuard security events, usage and policies
  icon: https://www.google.com/s2/favicons?domain=promptguard.co&sz=64
remote:
  transport_type: streamable-http
  url: https://api.promptguard.co/mcp
oauth:
  - provider: promptguard
    secret: promptguard.personal_access_token
    env: PROMPTGUARD_PERSONAL_ACCESS_TOKEN
