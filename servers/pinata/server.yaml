name: pinata
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - storage
    - ipfs
    - file-storage
    - vector-search
    - remote
about:
  title: Pinata
  description: Upload, organize, and share files on Pinata's IPFS storage, manage groups and gateways, create share links, and run semantic search over vector-indexed files
  icon: https://avatars.githubusercontent.com/u/43088506?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.pinata.cloud
  headers:
    Authorization: "Bearer ${PINATA_API_KEY}"
config:
  description: Sign in with OAuth, or optionally provide a Pinata API key JWT instead.
  secrets:
    - name: pinata.api_key
      env: PINATA_API_KEY
      example: <YOUR_PINATA_JWT>
      description: Optional. A Pinata API key JWT, created at [app.pinata.cloud/developers/api-keys](https://app.pinata.cloud/developers/api-keys). Not needed if you sign in with OAuth.
      required: false
oauth:
  - provider: pinata
    secret: pinata.personal_access_token
    env: PINATA_PERSONAL_ACCESS_TOKEN
