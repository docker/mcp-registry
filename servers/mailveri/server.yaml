name: mailveri
type: remote
meta:
  category: communication
  tags:
    - email
    - email-verification
    - communication
    - remote
about:
  title: MailVeri
  description: Verify email addresses, check credit balance, and manage bulk verification jobs through the MailVeri API.
  icon: https://www.google.com/s2/favicons?domain=mailveri.com&sz=64
source:
  project: https://github.com/mailveri/mailveri-mcp
remote:
  transport_type: streamable-http
  url: https://mcp.mailveri.com/mcp
  headers:
    Authorization: "Bearer ${MAILVERI_API_KEY}"
config:
  secrets:
    - name: mailveri.api_key
      env: MAILVERI_API_KEY
      example: <YOUR_API_KEY>
