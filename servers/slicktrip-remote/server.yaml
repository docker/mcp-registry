name: slicktrip-remote
type: remote
dynamic:
  tools: true
meta:
  category: travel
  tags:
    - travel
    - flights
    - hotels
    - remote
about:
  title: SlickTrip
  description: Live flight, hotel and seat prices, cheapest-day calendars, and price-drop and seat alerts
  icon: https://www.google.com/s2/favicons?domain=slicktrip.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.slicktrip.com/mcp
oauth:
  - provider: slicktrip-remote
    secret: slicktrip-remote.personal_access_token
    env: SLICKTRIP_REMOTE_PERSONAL_ACCESS_TOKEN
