name: todoist
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - task-management
    - remote
about:
  title: Todoist
  description: Manage tasks and projects with Todoist's official hosted server
  icon: https://raw.githubusercontent.com/Doist/todoist-mcp/main/plugins/todoist/.claude-plugin/icon.png
source:
  project: https://github.com/Doist/todoist-mcp
remote:
  transport_type: streamable-http
  url: https://ai.todoist.net/mcp
oauth:
  - provider: todoist
    secret: todoist.personal_access_token
    env: TODOIST_PERSONAL_ACCESS_TOKEN
