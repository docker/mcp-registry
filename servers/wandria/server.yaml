name: wandria
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - travel
    - maps
    - journal
    - remote
about:
  title: Wandria
  description: Trip planner, travel map and travel journal. Plan trips, add places, flights and routes, write journal entries and see which countries you have visited.
  icon: https://wandria.app/icon-512.png
remote:
  transport_type: streamable-http
  url: https://wandria.app/api/mcp
oauth:
  - provider: wandria
    secret: wandria.personal_access_token
    env: WANDRIA_PERSONAL_ACCESS_TOKEN
