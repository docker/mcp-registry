name: ptdata
type: remote
meta:
  category: finance
  tags:
    - finance
    - financial-data
    - sec-edgar
    - backtesting
    - remote
about:
  title: PtData
  description: Point-in-time US equity fundamentals, SEC filing metadata, earnings events and survivorship-free index constituents, exactly as they were known on any past date. Free tier works without an API key.
  icon: https://api.ptdata.io/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.ptdata.io/mcp
  headers:
    Authorization: "Bearer ${PTDATA_API_KEY}"
config:
  description: Optionally provide a PtData API key for higher rate limits (the server also works without one on the free tier).
  secrets:
    - name: ptdata.api_key
      env: PTDATA_API_KEY
      example: <YOUR_PTDATA_API_KEY>
      required: false
