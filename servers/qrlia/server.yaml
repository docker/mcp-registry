name: qrlia
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - qr-codes
    - marketing
    - analytics
    - remote
about:
  title: QRlia
  description: >-
    Create and manage dynamic QR codes from your AI agent: URL, vCard and
    profile cards, Wi-Fi, menus, PDFs, lead forms and digital product
    passports. Edit destinations after printing, export PNG/SVG images,
    organise with folders, templates and designs, and read scan analytics.
    Hosted server with OAuth sign-in, no API key needed; the free plan
    includes 3 QR codes.
  icon: https://raw.githubusercontent.com/mgazelle/qrlia-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.qrlia.com/mcp
oauth:
  - provider: qrlia
    secret: qrlia.personal_access_token
    env: QRLIA_PERSONAL_ACCESS_TOKEN
