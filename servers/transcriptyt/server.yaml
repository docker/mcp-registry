name: transcriptyt
type: remote
meta:
  category: search
  tags:
    - youtube
    - transcript
    - subtitles
    - video
    - remote
about:
  title: TranscriptYT
  description: YouTube transcripts as text, JSON, SRT, or VTT in 150+ languages, with translation and AI transcription fallback.
  icon: https://www.google.com/s2/favicons?domain=transcript-yt.com&sz=64
remote:
  transport_type: streamable-http
  url: https://transcript-yt.com/mcp
  headers:
    Authorization: "Bearer ${TRANSCRIPTYT_API_KEY}"
config:
  secrets:
    - name: transcriptyt.api_key
      env: TRANSCRIPTYT_API_KEY
      example: <YOUR_API_KEY>
