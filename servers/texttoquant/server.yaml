name: texttoquant
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - backtesting
    - trading
    - quant
    - crypto
    - remote
about:
  title: TextToQuant
  description: Backtest plain-English trading strategies on real market data. Graded results with honesty flags, parameter sweeps and walk-forward tests, edge by regime, overfit verdicts, custom indicators (JavaScript, Python, Pine Script, CSV), multi-asset portfolios, Pine Script export and shareable interactive reports. Research only — nothing is traded.
  icon: https://raw.githubusercontent.com/Youssef2784/texttoquant-claude-plugins/main/icon-256.png
remote:
  transport_type: streamable-http
  url: https://www.texttoquant.com/api/mcp
oauth:
  - provider: texttoquant
    secret: texttoquant.personal_access_token
    env: TEXTTOQUANT_PERSONAL_ACCESS_TOKEN
