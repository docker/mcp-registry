name: rankcontrol
type: remote
meta:
  category: business
  tags:
    - seo
    - marketing
    - content
    - analytics
    - remote
about:
  title: RankControl
  description: Plan and publish SEO articles on your own site, then track Google rankings, AI search citations and AI-referred traffic
  icon: https://rctrl.com/icon.png
remote:
  transport_type: streamable-http
  url: https://api.rctrl.com/mcp
  headers:
    Authorization: "Bearer ${RANKCONTROL_API_KEY}"
config:
  secrets:
    - name: rankcontrol.api_key
      env: RANKCONTROL_API_KEY
      example: <YOUR_API_KEY>
