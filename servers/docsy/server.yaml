name: docsy
type: remote
dynamic:
  tools: true
meta:
  category: documentation
  tags:
    - documentation
    - developer-tools
    - versioned
    - remote
about:
  title: Docsy
  description: Search current and version-specific developer documentation with original source links via five read-only MCP tools
  icon: https://raw.githubusercontent.com/getremcp/docsy-plugin/main/assets/docsy-icon-192.png
remote:
  transport_type: streamable-http
  url: https://docsy.remcp.site/mcp/registry
oauth:
  - provider: docsy
    secret: docsy.personal_access_token
    env: DOCSY_PERSONAL_ACCESS_TOKEN
