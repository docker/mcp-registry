about:
  title: Tirith
  description: Coordination server for parallel coding agents working in one repository. An agent claims files or directories before editing; overlapping claims are refused with the owner, reason and expiry, and leases expire if the agent dies. The claim also returns the change notices, versioned interface contracts, decisions and path-scoped memory notes for those paths, so what one agent learned reaches the next one without a search. 22 tools across claims, a task board with dependencies, contracts, notices, a decisions log, memory notes and agent messages.
