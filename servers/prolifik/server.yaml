name: prolifik
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - social-media
    - content-creation
    - remote
about:
  title: Prolifik
  description: Turn any URL into branded short-form video and auto-post it to Instagram Reels, TikTok, and YouTube Shorts
  icon: https://www.google.com/s2/favicons?domain=getprolifik.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.getprolifik.com/mcp
  headers:
    Authorization: "Bearer ${PROLIFIK_API_KEY}"
config:
  secrets:
    - name: prolifik.api_key
      env: PROLIFIK_API_KEY
      example: <YOUR_API_KEY>
