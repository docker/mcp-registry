name: cryptonews
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - crypto
    - news
    - sentiment
    - remote
about:
  title: cryptonews.is
  description: Live crypto news from 1,000+ sources grouped into stories, in 28 languages, with a news sentiment reading and the stories driving it
  icon: https://mcp.cryptonews.is/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.cryptonews.is/mcp
oauth:
  - provider: cryptonews
    secret: cryptonews.personal_access_token
    env: CRYPTONEWS_PERSONAL_ACCESS_TOKEN
