name: anyscribe
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - transcription
    - remote
about:
  title: AnyScribe
  description: Search and read your AnyScribe transcripts, and send links to your iPhone to transcribe
  icon: https://www.anyscribe.app/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.anyscribe.app
oauth:
  - provider: anyscribe
    secret: anyscribe.personal_access_token
    env: ANYSCRIBE_PERSONAL_ACCESS_TOKEN
