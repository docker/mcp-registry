name: cleanedweb
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - data-extraction
    - structured-data
    - api
    - remote
about:
  title: CleanedWeb
  description: Find and run maintained REST APIs that return structured records (listings, products, jobs, articles, profiles) from public websites, or request a site that is not covered yet.
  icon: https://www.google.com/s2/favicons?domain=cleanedweb.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.cleanedweb.com/mcp?profile=catalog
oauth:
  - provider: cleanedweb
    secret: cleanedweb.personal_access_token
    env: CLEANEDWEB_PERSONAL_ACCESS_TOKEN
