name: pinto-notes
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - notes
    - remote
about:
  title: Pinto Notes
  description: Search, read and edit your notes in Pinto Notes, a free, open-source notes app for Mac
  icon: https://pintonotes.com/mark-256.png
remote:
  transport_type: streamable-http
  url: https://mcp.pintonotes.com
oauth:
  - provider: pinto-notes
    secret: pinto-notes.personal_access_token
    env: PINTO_NOTES_PERSONAL_ACCESS_TOKEN
