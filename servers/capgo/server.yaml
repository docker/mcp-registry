name: capgo
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - mobile
    - capacitor
    - remote
about:
  title: Capgo
  description: Push fixes to your Capacitor users in minutes, build signed iOS and Android apps without a Mac, and roll back in one click. Manage live updates, channels, rollouts, devices, native builds and stats.
  icon: https://www.google.com/s2/favicons?domain=capgo.app&sz=64
remote:
  transport_type: streamable-http
  url: https://api.capgo.app/mcp
oauth:
  - provider: capgo
    secret: capgo.personal_access_token
    env: CAPGO_PERSONAL_ACCESS_TOKEN
