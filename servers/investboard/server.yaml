name: investboard
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - portfolio
    - investing
    - remote
about:
  title: Investboard
  description: >-
    Analyze holdings, fund overlap and performance; compare rebalancing and historical
    stress scenarios against your own investment plan. Two supplied-holdings tools
    work without sign-in. Account tools require OAuth, permissions, enabled sharing
    and the applicable Free or Premium plan. No order execution or money transfers.
  icon: https://raw.githubusercontent.com/Investboard/ai-toolkit/main/plugins/investboard/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://app.investboard.com/mcp
oauth:
  - provider: investboard
    secret: investboard.personal_access_token
    env: INVESTBOARD_PERSONAL_ACCESS_TOKEN
