name: clippertask
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - games
    - social-media
    - creator-economy
    - remote
about:
  title: ClipperTask
  description: Gaming creator marketplace - game studios run CPM campaigns (pay per 1,000 views), gaming creators on YouTube, TikTok and Instagram join, post and get paid per view
  icon: https://raw.githubusercontent.com/photo2skin/clippertask-mcp/main/logo-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.clippertask.com/mcp
source:
  project: https://github.com/photo2skin/clippertask-mcp
oauth:
  - provider: clippertask
    secret: clippertask.personal_access_token
    env: CLIPPERTASK_PERSONAL_ACCESS_TOKEN
