name: novigapi
type: remote
meta:
  category: data-analytics
  tags:
    - sports
    - odds
    - exchange
    - remote
about:
  title: Novig API
  description: "Read-only Novig exchange data with player and team names resolved: both sides of the book, intraday line history, fair no-vig prices and line-move alerts. No Novig account or request signing needed. Not affiliated with Novig."
  icon: https://novigapi.com/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://novigapi.com/api/mcp
  headers:
    Authorization: "Bearer ${NOVIG_API_KEY}"
config:
  secrets:
    - name: novigapi.api_key
      env: NOVIG_API_KEY
      example: <YOUR_API_KEY>
