about:
  title: Lantern Works GPU Prices
  description: |
    GPU price comparison for agents, checked daily. Read-only MCP server that compares tracked hourly GPU rental prices (H100, A100, RTX 4090 and more) across cloud providers. Each rate comes with its source page, check date and optional price history. It also includes a stack cost optimizer and a directory of AI-infra deals and free tiers.

    Tools: compare_gpu_prices, optimize_stack, search_deals, compare_deals, get_deal. Reads a public JSON feed; no API key. "Cheapest" means cheapest among tracked providers. Some result links are referral links (labelled in results); affiliate status is not a ranking factor. MIT licensed.
