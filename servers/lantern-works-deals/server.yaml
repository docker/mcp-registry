about:
  title: Lantern Works GPU Prices
  description: |
    GPU price comparison for agents, checked daily. Read-only MCP server that compares tracked hourly GPU rental prices (H100, A100, RTX 4090 and more) across cloud providers. Each rate comes with its source page, check date and optional price history; get_price_changes lists daily price moves since a date, each with the vendor source URL. It also includes a stack cost optimizer (optimize_agent_stack takes a plain-text description of an agent and returns the cheapest option with a cited price per component) and a directory of AI-infra deals and free tiers.

    Tools (7): compare_gpu_prices, get_price_changes, optimize_stack, optimize_agent_stack, search_deals, compare_deals, get_deal. Reads a public JSON feed; no API key. "Cheapest" means cheapest among tracked providers. Some result links are referral links (labelled in results); affiliate status is not a ranking factor. MIT licensed.
  icon: https://avatars.githubusercontent.com/u/268781603?v=4
