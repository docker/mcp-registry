about:
  title: Site-Shot
  description: Take screenshots of public web pages from an AI agent, rendered in real Chromium. Viewport or full page, PNG, JPEG or WebP, with ads and cookie banners removed by default; country proxies on paid plans. A confirmed account's key includes 100 free API captures a month.
  icon: https://avatars.githubusercontent.com/u/293588913?s=200&v=4
source:
  project: https://github.com/site-shot/site-shot-mcp
  commit: 01cb601ef51c4927adff8dfc721500dc53987154
config:
  description: Configure your Site-Shot API key
  secrets:
    - name: site-shot.api_key
      env: SITESHOT_API_KEY
      example: YOUR_SITESHOT_API_KEY
      description: Get a key at https://www.site-shot.com/start/ (the free plan includes 100 API captures a month, no card needed)
