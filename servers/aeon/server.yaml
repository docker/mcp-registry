name: aeon
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - agents
    - automation
    - github
    - remote
about:
  title: Aeon
  description: >-
    Run and manage your Aeon autonomous agent from chat: list and run skills,
    follow runs and read their output, search the agent's memory, edit its
    strategy and voice, install skill packs and change settings. Aeon is an
    open-source agent that runs skills on a schedule with GitHub Actions in
    your own repo; sign in with GitHub and choose which agent the client may
    use.
  icon: https://www.aeon.fun/icon.png
remote:
  transport_type: streamable-http
  url: https://www.aeon.fun/connect/mcp
oauth:
  - provider: aeon
    secret: aeon.personal_access_token
    env: AEON_PERSONAL_ACCESS_TOKEN
