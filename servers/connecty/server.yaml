name: connecty
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - website-status
    - uptime
    - remote
about:
  title: Connecty
  description: Read public website status pages and manage your own monitored sites with OAuth. Free, with daily checks rather than live monitoring.
  icon: https://connecty.nl/favicon.svg
remote:
  transport_type: streamable-http
  url: https://connecty.nl/mcp
oauth:
  - provider: connecty
    secret: connecty.oauth_token
    env: CONNECTY_OAUTH_TOKEN
