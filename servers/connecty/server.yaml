name: connecty
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - uptime
    - status-page
    - remote
about:
  title: Connecty
  description: Public status pages for up to five HTTPS websites, checked once a day, with tools an AI assistant can use after sign-in.
  icon: https://www.google.com/s2/favicons?domain=connecty.nl&sz=64
remote:
  transport_type: streamable-http
  url: https://connecty.nl/mcp
oauth:
  - provider: connecty
    secret: connecty.personal_access_token
    env: CONNECTY_PERSONAL_ACCESS_TOKEN
