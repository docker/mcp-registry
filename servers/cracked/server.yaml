name: cracked
type: remote
dynamic:
  tools: true
meta:
  category: tools
  tags:
    - tools
    - search
    - web-scraping
    - social-media
    - ai
    - remote
about:
  title: Cracked
  description: Tool router for agents. One MCP server gives access to 60,000+ tools (web search and scraping, social media data, maps, ecommerce, company enrichment, finance, weather, AI models) through discover, inspect and run meta-tools with per-call billing from one balance
  icon: https://www.google.com/s2/favicons?domain=cracked.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://cracked.ai/mcp
  headers:
    Authorization: "Bearer ${CRACKED_API_KEY}"
config:
  secrets:
    - name: cracked.api_key
      env: CRACKED_API_KEY
      example: ck_live_<YOUR_API_KEY>
