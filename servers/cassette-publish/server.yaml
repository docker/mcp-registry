name: cassette-publish
type: remote
dynamic:
  tools: true
meta:
  category: gaming
  tags:
    - gaming
    - publishing
    - remote
about:
  title: Cassette Publish
  description: Publish and manage browser games on Cassette from a coding agent, using OAuth with human approval.
  icon: https://cassette.gg/icon-512.png
remote:
  transport_type: streamable-http
  url: https://cassette.gg/mcp/publish
oauth:
  - provider: cassette-publish
    secret: cassette-publish.personal_access_token
    env: CASSETTE_PUBLISH_PERSONAL_ACCESS_TOKEN
