name: fudge
type: remote
dynamic:
  tools: true
meta:
  category: ecommerce
  tags:
    - ecommerce
    - shopify
    - seo
    - marketing
    - remote
about:
  title: Fudge for Shopify
  description: "Run your Shopify store with AI: make changes as drafts you approve, find what to fix, and measure how your store is doing."
  icon: https://raw.githubusercontent.com/fudge-ai/fudge-plugin/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.fudge.ai/mcp
oauth:
  - provider: fudge
    secret: fudge.personal_access_token
    env: FUDGE_PERSONAL_ACCESS_TOKEN
