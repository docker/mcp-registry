name: pandus
type: remote
dynamic:
  tools: true
meta:
  category: development
  tags:
    - accessibility
    - wcag
    - testing
    - web
    - remote
about:
  title: Pandus Accessibility
  description: Explain any WCAG 2.2 rule with fixes for free; sign in to see what to fix on your sites and re-check after a fix
  icon: https://www.google.com/s2/favicons?domain=pandus.online&sz=64
remote:
  transport_type: streamable-http
  url: https://pandus.online/mcp
oauth:
  - provider: pandus
    secret: pandus.personal_access_token
    env: PANDUS_PERSONAL_ACCESS_TOKEN
