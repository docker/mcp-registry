name: searchapi
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - serp
    - google
    - web-search
    - remote
about:
  title: SearchApi
  description: Real-time search results as structured JSON from Google (Web, Maps, Shopping, Flights, Hotels, News, Scholar, Images, Jobs, Trends), Bing, YouTube, Amazon and 100+ other engines
  icon: https://www.searchapi.io/favicon.svg
remote:
  transport_type: streamable-http
  url: https://www.searchapi.io/mcp
oauth:
  - provider: searchapi
    secret: searchapi.personal_access_token
    env: SEARCHAPI_PERSONAL_ACCESS_TOKEN
