name: summitscribe
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - meeting-notes
    - transcription
    - remote
about:
  title: SummitScribe
  description: Search your SummitScribe meeting notes, transcripts and action items. Read-only tools, OAuth sign-in
  icon: https://summitscribe.app/web-app-manifest-512x512.png
remote:
  transport_type: streamable-http
  url: https://summitscribe.app/api/mcp
oauth:
  - provider: summitscribe
    secret: summitscribe.personal_access_token
    env: SUMMITSCRIBE_PERSONAL_ACCESS_TOKEN
