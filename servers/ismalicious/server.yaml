name: ismalicious
image: mcp/ismalicious
type: server
meta:
  category: security
  tags:
    - security
    - threat-intelligence
    - prompt-injection
about:
  title: IsMalicious
  description: Indicator reputation with source evidence, CVE context, and prompt-injection and link-reputation checks for AI agents through the isMalicious API.
  icon: https://ismalicious.com/favicon.ico
source:
  project: https://github.com/hexablob/ismalicious-mcp-server
  commit: 2892ea76f871b30911620ea39d79ec876cd9b722
config:
  description: Configure an isMalicious API key pair from https://ismalicious.com/app/account. A free tier is available; requests and scans have separate quotas.
  secrets:
    - name: ismalicious.api_key
      env: ISMALICIOUS_API_KEY
      example: YOUR_API_KEY
      description: The API key from your isMalicious account. Keep it private.
    - name: ismalicious.api_secret
      env: ISMALICIOUS_API_SECRET
      example: YOUR_API_SECRET
      description: The corresponding API secret from your isMalicious account. Keep it private.
