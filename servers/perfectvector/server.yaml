name: perfectvector
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - design
    - svg
    - vectorization
    - image-processing
    - remote
about:
  title: PerfectVector
  description: Convert PNG, JPEG and WebP images into clean, editable SVG with an in-house vectorization model. Best for logos, icons, stickers and line art.
  icon: https://perfectvector.com/brand/mcp/perfectvector-logo-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.perfectvector.com/mcp
oauth:
  - provider: perfectvector
    secret: perfectvector.personal_access_token
    env: PERFECTVECTOR_PERSONAL_ACCESS_TOKEN
