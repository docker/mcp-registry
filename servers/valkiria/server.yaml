name: valkiria
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - marketing
    - advertising
    - remote
about:
  title: Valkiria
  description: Ask your AI about your Google, Meta, TikTok, Amazon and other ad accounts. It reads and proposes; nothing changes without your approval in Valkiria.
  icon: https://raw.githubusercontent.com/valkiria-pro/valkiria-ai-plugins/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://valkiria.pro/mcp
oauth:
  - provider: valkiria
    secret: valkiria.personal_access_token
    env: VALKIRIA_PERSONAL_ACCESS_TOKEN
