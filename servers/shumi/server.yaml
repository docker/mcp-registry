name: shumi
type: remote
meta:
  category: finance
  tags:
    - finance
    - crypto
    - research
    - remote
about:
  title: Shumi
  description: Crypto market intelligence for MCP clients — prices, funding rates, narratives, regime, and delta-neutral research. Read-only tools; requires a Shumi API key.
  icon: https://shumi.ai/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://shumi-mcp.onrender.com/mcp
  headers:
    Authorization: "Bearer ${SHUMI_TOKEN}"
config:
  secrets:
    - name: shumi.token
      env: SHUMI_TOKEN
      example: shumi_sk_your_key_here
