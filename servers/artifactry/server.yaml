name: artifactry
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - knowledge-management
    - collaboration
    - ai
    - remote
about:
  title: Artifactry
  description: Search, read, and save your team's AI-generated work (code, components, documents, and diagrams) in shared Artifactry workspaces
  icon: https://mcp.artifactry.ai/icons/artifactry-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.artifactry.ai/mcp
oauth:
  - provider: artifactry
    secret: artifactry.personal_access_token
    env: ARTIFACTRY_PERSONAL_ACCESS_TOKEN
