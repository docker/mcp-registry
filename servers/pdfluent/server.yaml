name: pdfluent
image: mcp/pdfluent
type: server
meta:
  category: productivity
  tags:
    - pdf
    - documents
    - extraction
    - markdown
    - forms
about:
  title: PDFluent
  description: Read, search and fill local PDFs. Extracts Markdown, text, tables and layout blocks, and fills AcroForms. Documents stay on your machine.
  icon: https://www.google.com/s2/favicons?domain=pdfluent.com&sz=64
source:
  project: https://github.com/pdfluent/pdfluent-mcp
  commit: 4ddabd233901910ff758e6530c089d3e9f86eb5d
run:
  volumes:
    - "{{pdfluent.folder}}:/data"
config:
  description: Choose the folder the server may read. It is mounted at /data inside the container.
  parameters:
    type: object
    properties:
      folder:
        type: string
        default: /Users/local-test
    required:
      - folder
