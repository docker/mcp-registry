name: soundgen
type: remote
meta:
  category: media
  tags:
    - media
    - music
    - audio
    - daw
    - remote
about:
  title: SoundGen
  description: Build and edit multitrack music projects in SoundGen's browser DAW - tracks, audio and MIDI clips, effects, automation and stems.
  icon: https://www.google.com/s2/favicons?domain=soundgen.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://soundgen.ai/api/mcp-server
  headers:
    Authorization: "Bearer ${SOUNDGEN_API_KEY}"
config:
  secrets:
    - name: soundgen.api_key
      env: SOUNDGEN_API_KEY
      example: <YOUR_API_KEY>
