name: readymade
type: remote
meta:
  category: development
  tags:
    - figma
    - wordpress
    - design-to-code
    - remote
about:
  title: ready→made
  description: Convert Figma frames into native WordPress builder layouts (Elementor, Gutenberg, Oxygen, Etch, Divi or HTML) with a deterministic layout engine. Needs a ready→made key (3 free conversions, then Pro or Lifetime) and a Figma personal access token.
  icon: https://avatars.githubusercontent.com/u/210353969?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://api.levels.dev/mcp
  headers:
    Authorization: "Bearer ${READYMADE_API_KEY}"
    x-figma-token: "${FIGMA_TOKEN}"
config:
  secrets:
    - name: readymade.api_key
      env: READYMADE_API_KEY
      example: rm_live_<YOUR_KEY>
    - name: readymade.figma_token
      env: FIGMA_TOKEN
      example: figd_<YOUR_FIGMA_TOKEN>
