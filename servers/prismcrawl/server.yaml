name: prismcrawl
type: remote
meta:
  category: search
  tags:
    - search
    - web-scraping
    - serp
    - maps
    - reviews
    - shopping
    - remote
about:
  title: PrismCrawl
  description: >-
    Live search data for AI agents. Query Google, Bing, DuckDuckGo, and Amazon
    search, map and place results from Google, Bing, Apple, and DuckDuckGo,
    reviews from Google Maps, Apple Maps, Yelp, and Tripadvisor, and Google Play
    and Apple App Store listings and reviews, returned as structured JSON.
  icon: https://www.prismcrawl.com/icon.svg
remote:
  transport_type: streamable-http
  url: https://api.prismcrawl.com/mcp
  headers:
    x-api-key: "${PRISMCRAWL_API_KEY}"
config:
  description: Configure your PrismCrawl API key. Create an account at https://www.prismcrawl.com/ and copy your API key from the dashboard.
  secrets:
    - name: prismcrawl.api_key
      env: PRISMCRAWL_API_KEY
      example: <YOUR_API_KEY>
