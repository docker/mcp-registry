name: autonoma-ai
type: remote
dynamic:
    tools: true
meta:
    category: ai
    tags:
        - ai
        - remote
about:
    title: Autonoma MCP
    description: 'Debug and configure your Autonoma preview deployment without leaving your repo: read live deploy status, build and app logs, and a diagnosis when something''s broken, then fix it, edit the build/wiring config or set a missing secret and confirm the deploy comes back up.'
    icon: https://autonoma.app/logo.svg
remote:
    transport_type: streamable-http
    url: https://api.autonoma.app/v1/mcp/debug
oauth:
    - provider: autonoma-ai
      secret: autonoma-ai.personal_access_token
      env: AUTONOMA_AI_PERSONAL_ACCESS_TOKEN
