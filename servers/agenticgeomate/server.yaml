name: agenticgeomate
type: remote
dynamic:
  tools: true
meta:
  category: data-analytics
  tags:
    - geoscience
    - mining
    - gis
    - australia
    - remote
about:
  title: AgenticGeoMate
  description: Australian geoscience data for agents - exploration reports, drillholes, geochemistry, WA prospectivity and read-only SQL
  icon: https://geomate.nlp-tlp.org/favicon.png
remote:
  transport_type: streamable-http
  url: https://geomate.nlp-tlp.org/mcp
oauth:
  - provider: agenticgeomate
    secret: agenticgeomate.personal_access_token
    env: AGENTICGEOMATE_PERSONAL_ACCESS_TOKEN
