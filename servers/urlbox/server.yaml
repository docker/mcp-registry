name: urlbox
type: remote
dynamic:
  tools: true
meta:
  category: automation
  tags:
    - automation
    - screenshot
    - pdf
    - web-scraping
    - remote
about:
  title: Urlbox
  description: Full-page screenshots, PDFs and Markdown of any site, even bot-protected ones, for teams that monitor brands, competitors and compliance.
  icon: https://www.google.com/s2/favicons?domain=urlbox.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.urlbox.com/mcp
oauth:
  - provider: urlbox
    secret: urlbox.personal_access_token
    env: URLBOX_PERSONAL_ACCESS_TOKEN
