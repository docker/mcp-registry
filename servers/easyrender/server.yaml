name: easyrender
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - 3d
    - image
    - remote
about:
  title: easyrender
  description: Remote image-to-3D MCP. Preview a product photo, then build a textured GLB with account credits.
  icon: https://www.google.com/s2/favicons?domain=easyrender.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://easyrender.ai/api/mcp
oauth:
  - provider: easyrender
    secret: easyrender.personal_access_token
    env: EASYRENDER_PERSONAL_ACCESS_TOKEN
