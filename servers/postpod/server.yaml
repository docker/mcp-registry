name: postpod
type: remote
meta:
  category: media
  tags:
    - media
    - podcast
    - audio
    - ai
    - remote
about:
  title: PostPod
  description: PostPod makes personalized AI podcast episodes from the X accounts and topics you pick. This MCP server lets an assistant read your shows, episodes, and audio, and turn a script into audio, using a PostPod API key.
  icon: https://www.google.com/s2/favicons?domain=postpodai.com&sz=64
remote:
  transport_type: streamable-http
  url: https://postpodai.com/api/mcp
  headers:
    Authorization: "Bearer ${POSTPOD_API_KEY}"
config:
  secrets:
    - name: postpod.api_key
      env: POSTPOD_API_KEY
      example: <YOUR_POSTPOD_API_KEY>
