  title: Runtime
  description: Linux sandboxes for AI agents, each a Firecracker microVM with its own kernel. Run commands, read and write files, manage processes, pause and wake with memory kept, snapshot and fork. Starts in about 100 ms and costs 42–88% less than other sandbox providers for typical agent work.
