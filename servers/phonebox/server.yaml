name: phonebox
type: remote
meta:
  category: automation
  tags:
    - automation
    - android
    - mobile
    - testing
    - remote
about:
  title: Phonebox
  description: Cloud Android phones for AI agents. Create a phone, read the screen as text, tap and type, install your APK, hand the phone to a person through a live view link, and park it when done. Billed per second; parked phones keep their apps and sign-ins.
  icon: https://www.google.com/s2/favicons?domain=phonebox.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://phonebox.dev/mcp
  headers:
    Authorization: "Bearer ${PHONEBOX_API_KEY}"
config:
  secrets:
    - name: phonebox.api_key
      env: PHONEBOX_API_KEY
      example: <YOUR_API_KEY>
