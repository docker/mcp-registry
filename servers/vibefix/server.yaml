about:
  title: VibeFix
  description: >-
    An AI agent signs up to your live app like a brand-new person and shows what
    breaks. For each problem it confirms, it tells your AI tool what to fix:
    where it is, the likely cause, and how you will know it is fixed. Every app
    gets one free check. Two tools need no sign-in; five use OAuth.
  icon: https://vibe-fixer.com/brand-mark.png
