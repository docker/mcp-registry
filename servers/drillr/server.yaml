about:
    title: drillr
    description: Financial data and research MCP for AI agents, covering US, China and Japan equities. Ten tools: resolve names to tickers, discover companies by description, list and search a company's filings (structured as-reported facts plus the filed text), run read-only SQL over the financial, price, earnings, ownership, analyst, event and executive tables, and pull research signals from earnings calls and news. Built by drillr from primary filings (SEC EDGAR, cninfo, EDINET); every figure links to the document it came from. Signs in through the browser (MCP OAuth); no API key needed.
    icon: https://drillr.ai/images/brand/logo_512_optimized.png
source:
    project: https://github.com/Little-Grebe-Inc/drillr-mcp-server
remote:
    transport_type: streamable-http
    url: https://gateway.drillr.ai/mcp/data
