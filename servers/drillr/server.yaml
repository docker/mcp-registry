name: drillr
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - financial-data
    - sec-filings
    - equity-research
    - remote
about:
  title: Drillr
  description: Financial data and research MCP for AI agents, covering US, China A-share and Japan equities. Resolve tickers, find companies by description, list and search filings, run read-only SQL over statements, prices, earnings, ownership, analyst and event tables, and pull research signals. Signs in through the browser (MCP OAuth).
  icon: https://drillr.ai/images/brand/logo_512_optimized.png
remote:
  transport_type: streamable-http
  url: https://gateway.drillr.ai/mcp/data
oauth:
  - provider: drillr
    secret: drillr.personal_access_token
    env: DRILLR_PERSONAL_ACCESS_TOKEN
