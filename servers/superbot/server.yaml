name: superbot
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - communication
    - remote
about:
  title: Superbot
  description: One tool for errands and research. Send a fax, place a phone call, send a text, draft a Gmail message, check a calendar, search the web, build documents and generate media from your AI assistant
  icon: https://superbot.gg/site/assets/brand/tile-512.png
remote:
  transport_type: streamable-http
  url: https://api.superbot.gg/mcp
oauth:
  - provider: superbot
    secret: superbot.personal_access_token
    env: SUPERBOT_PERSONAL_ACCESS_TOKEN
