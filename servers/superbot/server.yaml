name: superbot
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - communication
    - remote
about:
  title: Superbot
  description: "superbot is your own AI agent: anything you can do on your computer, it can do, fast. Its MCP server gives other agents one tool for errands: fax, calls, texts, Gmail drafts, calendar, web search."
  icon: https://superbot.gg/site/assets/brand/tile-512.png
remote:
  transport_type: streamable-http
  url: https://api.superbot.gg/mcp
oauth:
  - provider: superbot
    secret: superbot.personal_access_token
    env: SUPERBOT_PERSONAL_ACCESS_TOKEN
