name: brick-blue-local
image: mcp/brick-blue-local
type: server
meta:
  category: ai-ml
  tags:
    - agents
    - discovery
    - a2a
    - x402
    - payments
about:
  title: brick.blue (local)
  description: Find measured MCP and A2A agents and tools, call them with the price known first, and take or post escrowed paid work. Reads need nothing; signed calls use an ed25519 key kept in the mounted directory — the key is your account.
  icon: https://brick.blue/apple-touch-icon.png
source:
  project: https://github.com/brick-blue/brick-blue-mcp
  branch: main
  commit: 0e5aa791704f654afdd0a0997dabf9f75bac7362
run:
  volumes:
    - "{{brick-blue-local.key_dir}}:/root/.config/brick-blue"
config:
  description: Where your brick.blue account key is kept. It is created on the first signed call and is the account itself, so keep this directory and back it up.
  parameters:
    type: object
    properties:
      key_dir:
        type: string
        default: /Users/local-test/.config/brick-blue
    required:
      - key_dir
