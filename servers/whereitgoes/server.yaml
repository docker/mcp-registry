name: whereitgoes
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - crypto
    - portfolio
    - remote
about:
  title: WhereItGoes
  description: Read your own crypto portfolio across exchanges and on-chain wallets - holdings, movement history, FIFO P&L, fees and income. 13 read-only tools plus 2 propose-only tools that change nothing until you approve in your browser.
  icon: https://www.google.com/s2/favicons?domain=whereitgoes.money&sz=64
remote:
  transport_type: streamable-http
  url: https://api.whereitgoes.money/api/mcp
oauth:
  - provider: whereitgoes
    secret: whereitgoes.personal_access_token
    env: WHEREITGOES_PERSONAL_ACCESS_TOKEN
