name: aige-remote
type: remote
meta:
  category: ai
  tags:
    - ai
    - image-generation
    - video-generation
    - design
    - remote
about:
  title: AIGE
  description: AI creative studio for images, video and carousel decks, with one saved character in every shot. Generations spend AIGE credits; plans from $8.55 a month.
  icon: https://aige.ws/aige-512.png
remote:
  transport_type: streamable-http
  url: https://aige.ws/mcp
  headers:
    Authorization: "Bearer ${AIGE_REMOTE_API_KEY}"
config:
  secrets:
    - name: aige-remote.api_key
      env: AIGE_REMOTE_API_KEY
      example: antix_k_your_key_from_aige.ws/api-keys
