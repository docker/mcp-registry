about:
  title: Petty Cash
  description: "Runs a petty cash float on the imprest system, entirely on your machine: a voucher for every receipt paid out of the tin, a count whenever you like with the difference to the minor unit and the list of vouchers that count covers, and the replenishment that puts the float back to its imprest, with the double entry and an expense-add-ready payload per category in the same account names the sibling cash book uses. Every amount is an integer number of minor units and no balance is ever stored: every balance is derived on the call from the imprest, the top-ups, the vouchers and what each count found, because a stored balance is a second copy of what the vouchers already decide and the copy is the one believed after somebody deletes a voucher. Two decisions carry the arithmetic. The replenishment is imprest minus balance and never the sum of the vouchers: the two differ by exactly what the counts found over or short, and on the worked month a 50,000 minor unit float with five vouchers totalling 20,194 needs a cheque of 20,205, because the count found the tin 11 short. Reimbursing the voucher total instead is not obviously wrong, it is what the paperwork adds up to and it reconciles against the receipts, and it restores the float 11 light every cycle while every reconciliation still reports a clean 11: three cycles of it leave a 50,000 float at 49,967 with nothing in the record looking broken. The 11 comes back as its own cash-over-short journal line rather than folded into an expense category where it would look like postage. And a count is a fact, so it moves the book balance: once a count is recorded the balance is what was counted and the difference is carried forward, rather than the same difference being re-reported at every later count, which would make the second count a copy of the first and hide the moment a new difference appears. Under the imprest system the float account itself does not move at a replenishment at all. A voucher larger than the balance on its own date is refused, and so is a back-dated one that would make any later day negative; a reconciled voucher cannot be deleted, because the cash it took out was already counted. It reads no sibling store and writes into none. No account, no API key, no network call: everything lives under the local data directory and licence keys are verified offline."
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/04c187eddd48ed4ecb32ee47d2202b77cb46f96d/assets/petty-cash-logo.png
