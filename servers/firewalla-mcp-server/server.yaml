name: firewalla-mcp-server
image: mcp/firewalla-mcp-server
type: server
meta:
  category: security
  tags:
    - firewall
    - security
    - monitoring
    - network
    - threat-detection
about:
  title: Firewalla
  description: Real-time network monitoring and security analysis through 24 read-only tools, plus 11 opt-in write tools for firewall management. Access security alerts, network flows, device status, and firewall rules directly from your Firewalla device; nothing on the box changes unless the write tools are enabled.
  icon: https://avatars.githubusercontent.com/u/16805913?s=200&v=4
source:
  project: https://github.com/amittell/firewalla-mcp-server
  commit: b8dd6dadbc5b0796b45afd9f50efc756884e3d50
config:
  description: Configure your Firewalla MSP connection credentials
  secrets:
    - name: firewalla-mcp-server.msp_token
      env: FIREWALLA_MSP_TOKEN
      example: your_msp_access_token_here
  parameters:
    type: object
    properties:
      msp_id:
        type: string
        description: Your Firewalla MSP domain (e.g., yourdomain.firewalla.net)
        example: yourdomain.firewalla.net
      box_id:
        type: string
        description: "Optional: scope queries to one box; without it every box on the account is covered"
        example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      default_box_id:
        type: string
        description: "Optional: default box for single-box operations when no gid is passed, without scoping queries"
        example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      enable_write_tools:
        type: string
        description: 'Optional: "true" registers the 11 write tools create_rule, delete_rule, pause_rule, resume_rule, create_target_list, update_target_list, delete_target_list, rename_device, archive_alarm, mute_alarm and delete_alarm (default "false": read-only). They need an MSP token with write access.'
        example: "false"
        default: "false"
    required:
      - msp_id
  env:
    - name: FIREWALLA_MSP_ID
      example: yourdomain.firewalla.net
      value: "{{firewalla-mcp-server.msp_id}}"
    - name: FIREWALLA_BOX_ID
      example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      value: "{{firewalla-mcp-server.box_id}}"
    - name: FIREWALLA_DEFAULT_BOX_ID
      example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
      value: "{{firewalla-mcp-server.default_box_id}}"
    - name: FIREWALLA_ENABLE_WRITE_TOOLS
      example: "false"
      value: "{{firewalla-mcp-server.enable_write_tools}}"
    - name: NODE_ENV
      value: "production"
    - name: LOG_LEVEL
      value: "info"
