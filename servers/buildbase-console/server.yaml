name: buildbase-console
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - saas
    - workflows
    - remote
about:
  title: BuildBase Console
  description: Manage BuildBase organizations, members, content, email, workflows and settings as yourself.
  icon: https://www.google.com/s2/favicons?domain=buildbase.app&sz=64
remote:
  transport_type: streamable-http
  url: https://api.console.buildbase.app/mcp
oauth:
  - provider: buildbase-console
    secret: buildbase-console.personal_access_token
    env: BUILDBASE_CONSOLE_PERSONAL_ACCESS_TOKEN
