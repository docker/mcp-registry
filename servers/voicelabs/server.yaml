name: voicelabs
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - text-to-speech
    - transcription
    - voice
    - remote
about:
  title: VoiceLabs
  description: Generate speech from text in your voices and transcribe audio with VoiceLabs.
  icon: https://raw.githubusercontent.com/DevinoSolutions/mcp-servers/main/voicelabs/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://app.voicelabs.now/api/mcp
oauth:
  - provider: voicelabs
    secret: voicelabs.personal_access_token
    env: VOICELABS_PERSONAL_ACCESS_TOKEN
