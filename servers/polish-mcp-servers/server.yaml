about:
  title: Polish Public Data
  description: Official Polish public registers and law for AI agents, 16 tools over public Apify Actors. Sejm ELI legal acts, SAOS court judgments, KRS new companies, REGON company lookup, MSiG court and business gazette announcements, EU-funds, CEE and Ukrainian Prozorro tenders, EIPA EV charging stations, CEPiK vehicle registrations, GUNB building permits, ULDK land parcels and zoning, RPWDL healthcare facilities, developer apartment prices and PSE electricity market data.
