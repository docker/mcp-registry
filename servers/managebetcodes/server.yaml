name: managebetcodes
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - betting
    - sports
    - bookmakers
    - remote
about:
  title: Manage Bet Codes
  description: Convert, view, split, merge and track betting codes across bookmakers from AI tools and agents.
  icon: https://www.google.com/s2/favicons?domain=managebetcodes.app&sz=64
remote:
  transport_type: streamable-http
  url: https://api.managebetcodes.app/v1/mcp
  headers:
    X-API-Key: <redacted>
config:
  description: Optionally provide a Manage Bet Codes API key to enable paid actions such as convert, split, merge and book. Listing bookmakers and markets works without one.
  secrets:
    - name: managebetcodes.api_key
      env: MBC_API_KEY
      example: <YOUR_API_KEY>
      required: false
source:
  project: https://github.com/kayceepeece/Viewbetbot
