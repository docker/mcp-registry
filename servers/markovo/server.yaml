name: markovo
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - documents
    - markdown
    - conversion
    - remote
about:
  title: Markovo
  description: Convert PDF, DOCX, PPTX, XLSX and authorized public web pages into clean, structured Markdown for agent context
  icon: https://www.google.com/s2/favicons?domain=markovo.net&sz=64
remote:
  transport_type: streamable-http
  url: https://markovo.net/mcp
oauth:
  - provider: markovo
    secret: markovo.personal_access_token
    env: MARKOVO_PERSONAL_ACCESS_TOKEN
