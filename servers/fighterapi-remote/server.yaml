name: fighterapi-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - mma
    - ufc
    - sports-data
    - remote
about:
  title: FighterAPI
  description: "UFC fights since 2000, plus PFL and Bellator: results, round stats, fighters and odds. REST and MCP."
  icon: https://www.google.com/s2/favicons?domain=fighterapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.fighterapi.com/mcp
oauth:
  - provider: fighterapi-remote
    secret: fighterapi-remote.personal_access_token
    env: FIGHTERAPI_REMOTE_PERSONAL_ACCESS_TOKEN
