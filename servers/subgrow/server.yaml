name: subgrow
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - marketing
    - seo
    - reddit
    - remote
about:
  title: Subgrow
  description: Set up Subgrow from your assistant. It opens a subreddit for your brand and posts in it every day
  icon: https://www.google.com/s2/favicons?domain=subgrow.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://subgrow.ai/mcp
oauth:
  - provider: subgrow
    secret: subgrow.personal_access_token
    env: SUBGROW_PERSONAL_ACCESS_TOKEN
