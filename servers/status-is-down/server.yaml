name: status-is-down
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - status
    - outages
    - remote
about:
  title: Status Is Down
  description: Read-only outage intelligence for service lookup, current status, historical community reports, privacy-thresholded regional activity, problem indicators and recent report spikes
