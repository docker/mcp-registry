name: maplibre-mcp
image: mcp/maplibre-mcp
type: server
longLived: true
meta:
  category: maps
  tags:
    - maplibre
    - maps
    - geospatial
    - styles
about:
  title: MapLibre
  description: Check, render and show MapLibre styles. Validate a style, look up the style spec and the GL JS API, read vector tiles, find out why a layer draws nothing, and render with MapLibre GL JS.
  icon: https://birkskyum.github.io/maplibre-mcp/favicon.svg
source:
  project: https://github.com/birkskyum/maplibre-mcp
  commit: ed837fe67673e4c960881bb0b556c0c13d5dfd4e
config:
  description: Optional settings. The style and gl-js toolsets are on by default.
  env:
    - name: MAPLIBRE_MCP_TOOLSETS
      example: style,gl-js
      value: "{{maplibre-mcp.toolsets}}"
    - name: MARTIN_URL
      example: http://host.docker.internal:3000
      value: "{{maplibre-mcp.martin_url}}"
  parameters:
    type: object
    properties:
      toolsets:
        type: string
        description: The toolsets to turn on, comma separated, like style,gl-js,martin. Defaults to style,gl-js.
      martin_url:
        type: string
        description: The Martin server that the martin toolset reads, like http://host.docker.internal:3000 for one on this machine.
