name: generator-labs
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - security
    - blocklist
    - certificates
    - email-deliverability
    - remote
about:
  title: Generator Labs
  description: Check which of your hosts are on RBL and URIBL blocklists, find certificates that expire soon or have errors, and run on-demand blocklist and certificate checks
  icon: https://generatorlabs.com/assets/images/favicon/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://api.generatorlabs.com/4.0/mcp
oauth:
  - provider: generator-labs
    secret: generator-labs.personal_access_token
    env: GENERATOR_LABS_PERSONAL_ACCESS_TOKEN
