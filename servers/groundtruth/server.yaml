about:
    title: Groundtruth
    description: Groundtruth lets an agent ask real humans a question mid-task and get their verbatim answers back, for the questions the web genuinely cannot answer - fresh reactions to unpublished work, current on-the-ground conditions, or the experience of people who churned and never wrote about it. Replies are returned with a respondent count and per-person attribution, wrapped as untrusted data rather than instructions, and are never aggregated into a sentiment score. Questions are de-identified by default; anything carrying the user's private context requires their explicit approval first. No signup and no API key.
    icon: https://groundtruth-ruby.vercel.app/api/logo
remote:
    transport_type: streamable-http
    url: https://groundtruth-ruby.vercel.app/api/mcp
