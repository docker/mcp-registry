name: cueframe
type: remote
dynamic:
  tools: true
meta:
  category: video
  tags:
    - video
    - editing
    - rendering
    - remote
about:
  title: CueFrame
  description: Compose, edit, and render video with content-aware reframing, captions, and motion graphics.
  icon: https://cueframe.ai/icon.svg
remote:
  transport_type: streamable-http
  url: https://api.cueframe.ai/v1/mcp
oauth:
  - provider: cueframe
    secret: cueframe.personal_access_token
    env: CUEFRAME_PERSONAL_ACCESS_TOKEN
