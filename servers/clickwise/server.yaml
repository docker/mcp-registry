name: clickwise
type: remote
meta:
  category: ecommerce
  tags:
    - ecommerce
    - affiliate-marketing
    - product-catalog
    - remote
about:
  title: Clickwise
  description: Affiliate network tools for agents. Find affiliate programs that fit a site or channel, mint tracked links, browse deals, and (with a publisher API key) search 1.1M+ GTIN products with your own tracked links and read conversion reports.
  icon: https://partners.clickwise.net/static/images/clickwiselogo.png
remote:
  transport_type: streamable-http
  url: https://partners.clickwise.net/api/v1/mcp
  headers:
    X-API-Key: "${CLICKWISE_API_KEY}"
config:
  description: Optionally provide your Clickwise publisher API key (https://partners.clickwise.net/developers/) for product search, product feeds, your links and reports. Program discovery, deals, catalog stats and instant tracked links work without one.
  secrets:
    - name: clickwise.api_key
      env: CLICKWISE_API_KEY
      example: <YOUR_API_KEY>
      required: false
