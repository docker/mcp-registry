name: daily-digest
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - news
    - search
    - finance
    - remote
about:
  title: Daily Digest News
  description: News stories grouped across outlets in the US, UK, Ireland, Canada and Australia, with how many outlets and separate owners cover each, how fast coverage is growing, timelines, and which stocks and coins are in the news.
  icon: https://www.google.com/s2/favicons?domain=dailydigest.com&sz=64
remote:
  transport_type: streamable-http
  url: https://dailydigest.com/mcp
oauth:
  - provider: daily-digest
    secret: daily-digest.personal_access_token
    env: DAILY_DIGEST_PERSONAL_ACCESS_TOKEN
