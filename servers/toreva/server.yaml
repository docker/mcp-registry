name: toreva
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - solana
    - wallet
    - remote
about:
  title: Toreva
  description: Policy-checked Solana wallet actions with user-set limits, unsigned transactions, and receipts.
  icon: https://raw.githubusercontent.com/toreva/.github/main/assets/toreva-logo-cyan-dark.png
remote:
  transport_type: streamable-http
  url: https://gateway.toreva.com/mcp
oauth:
  - provider: toreva
    secret: toreva.personal_access_token
    env: TOREVA_PERSONAL_ACCESS_TOKEN
