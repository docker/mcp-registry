name: carbon-forge
type: remote
meta:
  category: devops
  tags:
    - devops
    - version-control
    - knowledge-base
    - remote
about:
  title: Carbon Forge
  description: Source control and a shared record for people and agents. Code, files and prose live in one record on the server; agents open lanes instead of cloning and land each change as one all-or-nothing changeset
  icon: https://www.google.com/s2/favicons?domain=carbonforge.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://carbonforge.dev/api/mcp
  headers:
    Authorization: "Bearer ${CARBON_FORGE_TOKEN}"
config:
  secrets:
    - name: carbon-forge.token
      env: CARBON_FORGE_TOKEN
      example: <YOUR_CARBON_FORGE_TOKEN>
