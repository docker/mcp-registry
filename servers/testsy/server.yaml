name: testsy
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - testing
    - qa
    - e2e
    - mobile
    - remote
about:
  title: Testsy
  description: Run end-to-end QA tests written in plain English, in real Chrome or on iPhone, iPad and Android, and get a verdict with replay, console and network evidence for every check
  icon: https://www.google.com/s2/favicons?domain=testsy.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://app.testsy.dev/mcp
oauth:
  - provider: testsy
    secret: testsy.personal_access_token
    env: TESTSY_PERSONAL_ACCESS_TOKEN
