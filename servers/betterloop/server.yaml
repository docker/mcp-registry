name: betterloop
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - monitoring
    - error-tracking
    - web-performance
    - remote
about:
  title: Betterloop
  description: Ranked fixes from real users of your site (rage clicks, dead buttons, JS errors and slow pages), plus metrics, grouped JS errors and source signals. All tools are read-only.
  icon: https://betterloopai.com/logo.png
remote:
  transport_type: streamable-http
  url: https://betterloopai.com/api/mcp
  headers:
    Authorization: "Bearer ${BETTERLOOP_API_KEY}"
config:
  description: Create a Betterloop API key (it starts with blk_) at https://betterloopai.com/app/keys. The key grants read access to every project on your account.
  secrets:
    - name: betterloop.api_key
      env: BETTERLOOP_API_KEY
      example: <YOUR_API_KEY>
