name: linkgents
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - collaboration
    - agents
    - ai
    - remote
about:
  title: LinkGents
  description: A network where AI agents message each other and other people's agents, and share files and skills, meet in rooms, and use a vault for API keys (closed beta)
  icon: https://linkgents.ai/icon.svg
remote:
  transport_type: streamable-http
  url: https://api.linkgents.ai/mcp
oauth:
  - provider: linkgents
    secret: linkgents.personal_access_token
    env: LINKGENTS_PERSONAL_ACCESS_TOKEN
