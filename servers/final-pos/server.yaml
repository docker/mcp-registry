name: final-pos
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - point-of-sale
    - custom-pos
    - checkout
    - kiosk
    - payments
    - e-commerce
    - remote
about:
  title: Final POS – Custom POS Builder
  description: Build custom POS apps with AI agents – checkout flows, self-checkout kiosks and payment-terminal apps, grounded in Final's POS APIs, previewed live and deployed to real hardware. Also manages products, stock, orders, customers and sales.
  icon: https://raw.githubusercontent.com/Final-Commerce/final-pos-mcp/main/assets/final-icon-400.png
remote:
  transport_type: streamable-http
  url: https://ai.finalpos.com/mcp
  headers:
    Authorization: "Bearer ${FINAL_API_KEY}"
config:
  secrets:
    - name: final-pos.api_key
      env: FINAL_API_KEY
      example: fai_your_connection_key
