name: final-pos
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - point-of-sale
    - payments
    - e-commerce
    - kiosk
    - remote
about:
  title: Final POS
  description: Build custom point of sale, kiosk, self-checkout & in-person payment apps with AI agents — grounded Final POS API lookups, vetted screen blueprints, live sandbox previews and one-command deploys.
  icon: https://raw.githubusercontent.com/Final-Commerce/final-pos-mcp/main/assets/final-icon-400.png
remote:
  transport_type: streamable-http
  url: https://build.finalpos.com/api/mcp
  headers:
    Authorization: "Bearer ${FINAL_API_KEY}"
config:
  secrets:
    - name: final-pos.api_key
      env: FINAL_API_KEY
      example: sk_your_org_api_key
