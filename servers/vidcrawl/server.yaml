name: vidcrawl
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - video
    - research
    - remote
about:
  title: VidCrawl
  description: Extract video transcripts, visual storyboard frames, and structured insights from YouTube, TikTok, Instagram, and X
  icon: https://vidcrawl.com/favicon.png
remote:
  transport_type: streamable-http
  url: https://vidcrawl.com/mcp
  headers:
    Authorization: "Bearer ${VIDCRAWL_API_KEY}"
config:
  secrets:
    - name: vidcrawl.api_key
      env: VIDCRAWL_API_KEY
      example: <YOUR_API_KEY>
