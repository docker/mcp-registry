name: pyai
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - speech
    - transcription
    - voice-agents
    - remote
about:
  title: PyAI Voice AI
  description: Generate speech, transcribe recordings, build voice agents, dub audio, and review call summaries and compliance evidence in an authorized PyAI project.
  icon: https://pyai.com/brand/logo-mark-blue-180.png
remote:
  transport_type: streamable-http
  url: https://api.pyai.com/mcp
oauth:
  - provider: pyai
    secret: pyai.personal_access_token
    env: PYAI_PERSONAL_ACCESS_TOKEN
