name: resume
image: mcp/resume
type: server
meta:
  category: productivity
  tags:
    - productivity
    - resume
    - cv
    - cover-letter
    - job-application
about:
  title: Resume
  description: Turn your CV facts into a tailored Word resume and a cover letter that invents nothing -- keyword matching against the posting, page-fit trimming, and bracketed prompts wherever a fact is missing. Everything stays on your machine.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/d980af53a3b19063d8af2e78226fc1215d6535a0/assets/resume-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: d980af53a3b19063d8af2e78226fc1215d6535a0
  dockerfile: servers/resume/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: resume.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
