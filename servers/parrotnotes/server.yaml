name: parrotnotes
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - meetings
    - notes
    - remote
about:
  title: ParrotNotes
  description: Search, read, and label your in-person meeting notes from ParrotNotes, the AI note-taker for iOS, Android, and macOS, and use summaries, action items, and insights as context for your work.
  icon: https://parrotnotes.app/icon-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.parrotnotes.app/mcp
oauth:
  - provider: parrotnotes
    secret: parrotnotes.personal_access_token
    env: PARROTNOTES_PERSONAL_ACCESS_TOKEN
