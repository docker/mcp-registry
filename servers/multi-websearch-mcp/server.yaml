name: multi-websearch-mcp
image: mcp/multi-websearch-mcp
type: server
meta:
  category: search
  tags:
    - search
    - web-search
    - news
    - fetch
about:
  title: Multi Web Search
  description: Captcha-avoiding web, news, image and video search plus page fetching over free sources (Bing RSS, Google News, GDELT, Hacker News, Wikipedia, Marginalia, optional own SearXNG). No API key needed.
  icon: https://raw.githubusercontent.com/c0decave/multi-websearch-mcp/52c188f35949bf1096cdcb3b8d7f1a13f4f4814d/docs/assets/logo.png
source:
  project: https://github.com/c0decave/multi-websearch-mcp
  commit: 52c188f35949bf1096cdcb3b8d7f1a13f4f4814d
run:
  command:
    - mcp
config:
  description: Optional settings. Without them the server uses only free sources and a generic User-Agent.
  env:
    - name: WEBSEARCH_UA
      example: websearch/0.3 (you@example.com)
      value: '{{multi-websearch-mcp.user_agent}}'
    - name: SEARXNG_URL
      example: http://host.docker.internal:8888
      value: '{{multi-websearch-mcp.searxng_url}}'
  parameters:
    type: object
    properties:
      user_agent:
        type: string
        description: User-Agent with a contact (e-mail or URL); Wikimedia, GDELT and Hacker News ask automated clients to identify themselves.
      searxng_url:
        type: string
        description: URL of your own SearXNG instance (adds Google, Bing, Brave, DuckDuckGo, Qwant). Leave empty to skip SearXNG.
