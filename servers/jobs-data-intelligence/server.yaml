name: jobs-data-intelligence
type: remote
dynamic:
  tools: true
meta:
  category: data-analytics
  tags:
    - data-analytics
    - jobs
    - recruiting
    - hiring-data
    - ats
    - remote
about:
  title: Jobs Data Intelligence
  description: "Live job listings for AI agents from 19 sources: remote boards, Greenhouse, Lever, Ashby, Workday, EURES, Reed, Wellfound, Y Combinator and more."
  icon: https://www.google.com/s2/favicons?domain=mcpize.com&sz=64
remote:
  transport_type: streamable-http
  url: https://jobs-data-intelligence.mcpize.run/mcp
  headers:
    Authorization: "Bearer ${MCPIZE_API_KEY}"
config:
  secrets:
    - name: jobs-data-intelligence.mcpize_api_key
      env: MCPIZE_API_KEY
      example: <YOUR_MCPIZE_API_KEY>
