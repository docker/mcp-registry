name: adrails
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - advertising
    - meta-ads
    - google-ads
    - remote
about:
  title: Adrails
  description: AI agents that build, test and monitor Meta Ads and Google Ads campaigns from your real data.
  icon: https://raw.githubusercontent.com/devthomy/adrails-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://adrails.ai/api/mcp
oauth:
  - provider: adrails
    secret: adrails.personal_access_token
    env: ADRAILS_PERSONAL_ACCESS_TOKEN
