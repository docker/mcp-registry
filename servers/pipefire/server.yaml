name: pipefire
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - email
    - email-deliverability
    - cold-email
    - dmarc
    - remote
about:
  title: Pipefire
  description: Check email deliverability (SPF, DKIM, DMARC, blacklists, headers) and run Pipefire cold email campaigns, replies and mailboxes
  icon: https://www.google.com/s2/favicons?domain=pipefire.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://pipefire.ai/mcp
oauth:
  - provider: pipefire
    secret: pipefire.personal_access_token
    env: PIPEFIRE_PERSONAL_ACCESS_TOKEN
