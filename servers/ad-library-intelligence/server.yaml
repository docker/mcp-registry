name: ad-library-intelligence
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - advertising
    - competitor-research
    - meta-ads
    - google-ads
    - remote
about:
  title: Ad Library Intelligence
  description: "Competitor ad research for AI agents: ads from the Meta, Google and LinkedIn ad libraries plus ads.txt and app-ads.txt sellers. No login on the source side."
  icon: https://www.google.com/s2/favicons?domain=mcpize.com&sz=64
remote:
  transport_type: streamable-http
  url: https://ad-library-intelligence.mcpize.run/mcp
  headers:
    Authorization: "Bearer ${MCPIZE_API_KEY}"
config:
  secrets:
    - name: ad-library-intelligence.mcpize_api_key
      env: MCPIZE_API_KEY
      example: <YOUR_MCPIZE_API_KEY>
