name: daydream-remote
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - music
    - audio
    - games
    - remote
about:
  title: Daydream
  description: Make original instrumental songs from words, each as five stems (drums, bass, guitar, keys, other). Redo one stem with the other four unchanged, and download the mix and stems. Royalty-free, for games and videos.
  icon: https://gen.daydream.live/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://gen.daydream.live/mcp
oauth:
  - provider: daydream-remote
    secret: daydream-remote.personal_access_token
    env: DAYDREAM_REMOTE_PERSONAL_ACCESS_TOKEN
