name: tidybutton-sanctions
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - compliance
    - sanctions
    - kyc
    - remote
about:
  title: Tidy Button Sanctions Screener
  description: Screen people and companies against the OFAC SDN and Consolidated, UK, EU and UN sanctions lists with fuzzy name matching, list dates and saved re-screening
  icon: https://tidybutton.com/favicon.svg
remote:
  transport_type: streamable-http
  url: https://sanctions.tidybutton.com/mcp
oauth:
  - provider: tidybutton-sanctions
    secret: tidybutton-sanctions.personal_access_token
    env: TIDYBUTTON_SANCTIONS_PERSONAL_ACCESS_TOKEN
