name: memoryrouter
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - memory
    - persistent-memory
    - remote
about:
  title: MemoryRouter
  description: One memory for every AI you use. Recall and save approved context across Claude, ChatGPT, Codex, and other MCP clients, scoped to a vault you control.
  icon: https://memoryrouter.ai/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.memoryrouter.ai/mcp
oauth:
  - provider: memoryrouter
    secret: memoryrouter.personal_access_token
    env: MEMORYROUTER_PERSONAL_ACCESS_TOKEN
