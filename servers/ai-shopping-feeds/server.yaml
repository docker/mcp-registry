name: ai-shopping-feeds
type: remote
dynamic:
  tools: true
meta:
  category: ecommerce
  tags:
    - ecommerce
    - product-feeds
    - google-merchant-center
    - meta-catalog
    - shopping-ads
    - remote
about:
  title: AI Shopping Feeds
  description: Audit and optimise ecommerce product feeds, then publish to Google Merchant Center and Meta.
  icon: https://raw.githubusercontent.com/AI-Shopping-Feeds/ai-shopping-feeds-mcp/main/plugin/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://app.aishoppingfeeds.com/api/v1/mcp
source:
  project: https://github.com/AI-Shopping-Feeds/ai-shopping-feeds-mcp
oauth:
  - provider: ai-shopping-feeds
    secret: ai-shopping-feeds.personal_access_token
    env: AI_SHOPPING_FEEDS_PERSONAL_ACCESS_TOKEN
