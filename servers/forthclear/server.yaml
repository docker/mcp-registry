name: forthclear
type: remote
dynamic:
  tools: true
meta:
  category: ecommerce
  tags:
    - ecommerce
    - wholesale
    - liquidation
    - marketplace
    - remote
about:
  title: ForthClear
  description: Search surplus, overstock and returned inventory lots on a B2B marketplace. Catalogue tools need no sign-in; quotes, checkout, orders and seller listings use OAuth.
  icon: https://app.forthclear.io/forthclear-logo.png
remote:
  transport_type: streamable-http
  url: https://app.forthclear.io/mcp
oauth:
  - provider: forthclear
    secret: forthclear.personal_access_token
    env: FORTHCLEAR_PERSONAL_ACCESS_TOKEN
