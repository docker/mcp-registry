name: signing-for-agents
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - e-signature
    - documents
    - remote
about:
  title: Signing for Agents
  description: E-signatures for AI agents. Upload a PDF, place the fields, and get a signing link for each person to send yourself; the service never emails anyone.
  icon: https://www.google.com/s2/favicons?domain=gurify.com&sz=64
remote:
  transport_type: streamable-http
  url: https://sign.gurify.com/mcp
  headers:
    Authorization: "Bearer ${SIGNING_FOR_AGENTS_API_TOKEN}"
config:
  secrets:
    - name: signing-for-agents.api_token
      env: SIGNING_FOR_AGENTS_API_TOKEN
      example: <YOUR_API_TOKEN>
