name: stock-compass
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - stocks
    - trading-journal
    - remote
about:
  title: Stock Compass
  description: Daily signals from your own trading rules, plus your watchlist, trades and trade journal, for HK, US and China A-share stocks. It only records; it never places orders with a broker.
  icon: https://stock-compass.app/brand/icon-512.png
remote:
  transport_type: streamable-http
  url: https://stock-compass.app/api/mcp
oauth:
  - provider: stock-compass
    secret: stock-compass.personal_access_token
    env: STOCK_COMPASS_PERSONAL_ACCESS_TOKEN
