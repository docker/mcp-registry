name: levirge-search
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - research
    - web
    - remote
about:
  title: Levirge Search
  description: Web search and page reading for AI agents — pages, JSON APIs, RSS feeds and YouTube transcripts with source links
  icon: https://raw.githubusercontent.com/levirge/search/main/plugins/levirge-search/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://search.levirge.com/mcp
oauth:
  - provider: levirge-search
    secret: levirge-search.personal_access_token
    env: LEVIRGE_SEARCH_PERSONAL_ACCESS_TOKEN
