name: agt
image: mcp/agt
type: server
meta:
  category: ai
  tags:
    - agents
    - identity
    - naming
    - a2a
    - polygon
about:
  title: .agt agent names
  description: Resolve, verify and discover .agt agent names, on-chain identities for AI agents on Polygon. Owner, records, signed manifest, MCP and A2A endpoints, availability. Read-only; nothing to configure.
  icon: https://agtnames.com/icon.svg
source:
  project: https://github.com/agtnames/agt
  branch: main
  commit: 4ddc06123e906e43f913b9cdcd4307a902b2bf7c
  directory: packages/mcp
config:
  description: Everything is optional; the defaults read Polygon mainnet over a public RPC.
  env:
    - name: AGT_CHAIN
      example: polygon
      value: '{{agt.chain}}'
    - name: AGT_RPC_URL
      example: https://polygon-rpc.com
      value: '{{agt.rpc_url}}'
    - name: AGT_IPFS_GATEWAY
      example: https://gateway.pinata.cloud/ipfs/
      value: '{{agt.ipfs_gateway}}'
  parameters:
    type: object
    properties:
      chain:
        type: string
        enum: [polygon, amoy, localhost]
        default: polygon
      rpc_url:
        type: string
      ipfs_gateway:
        type: string
