about:
  title: NPMScan
  description: >-
    Check npm packages for malware, known vulnerabilities, typosquats,
    maintainer takeovers and risky install scripts before you install them,
    and audit a whole package.json, lockfile, SBOM or GitHub repo. Advisory
    data comes from OSV.dev, GitHub Security Advisories and NVD, with CISA KEV
    and EPSS enrichment. Hosted, read-only and free, with no API key.
  icon: https://raw.githubusercontent.com/salemalem/npmscan-mcp-plugin/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://npmscan.com/api/mcp
