name: fastsocial-instagram-data
type: remote
meta:
  category: data-analytics
  tags:
    - instagram
    - social-media
    - data-extraction
    - remote
about:
  title: FastSocial Instagram Data
  description: Read-only public Instagram data as JSON. Profiles, posts, reels, stories, highlights, comments, hashtags, places and daily top-accounts charts. Free plan with 50 credits a month.
  icon: https://www.google.com/s2/favicons?domain=fastsocial.co&sz=64
remote:
  transport_type: streamable-http
  url: https://data.fastsocial.co/mcp
  headers:
    X-API-Key: "${INSTAGRAM_DATA_API_KEY}"
config:
  secrets:
    - name: fastsocial-instagram-data.api_key
      env: INSTAGRAM_DATA_API_KEY
      example: <YOUR_API_KEY>
