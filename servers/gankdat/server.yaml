name: gankdat
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - data
    - government
    - open-data
    - uk
    - procurement
    - compliance
    - remote
about:
  title: Gankdat
  description: UK and EU government registers as clean JSON — company lookup and monitor, tenders and awards, planning, sanctions, charities, schools, NHS, trade marks — with daily change feeds
  icon: https://gankdat.com/icon-raccoon.svg
remote:
  transport_type: streamable-http
  url: https://gankdat.com/mcp
  headers:
    Authorization: "Bearer ${GANKDAT_API_KEY}"
config:
  description: Optionally add a gankdat API key (free at https://gankdat.com/account) for full pages and your plan's credits. Without one every data tool answers a 5-row preview, 20 calls a day.
  secrets:
    - name: gankdat.api_key
      env: GANKDAT_API_KEY
      example: <YOUR_API_KEY>
      required: false
