name: docx
image: mcp/docx
type: server
meta:
  category: productivity
  tags:
    - productivity
    - docx
    - word
    - documents
    - templates
about:
  title: Docx
  description: Writes real Word documents from chat -- proposals, quotes, service agreements and letters -- with headings, bullet and numbered lists and tables in a plain, letter or proposal layout. Also converts markdown to docx, reads an existing docx back as text or structured JSON, renders a docx to HTML for printing, and fills {{placeholders}} in a template while keeping every style, table, header and image of the original. Runs locally with no native dependency and no upload step.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/75e358fce74fef68c20051209af64f51c917e798/assets/docx-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: 75e358fce74fef68c20051209af64f51c917e798
  dockerfile: servers/docx/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: docx.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
