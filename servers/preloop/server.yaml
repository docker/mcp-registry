name: preloop
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - governance
    - human-in-the-loop
    - mcp-proxy
    - remote
about:
  title: Preloop
  description: "Open-source AI agent control plane and software factory: every tool and model call allowed, denied or held for a human, budgeted and recorded, and agents run from tickets, webhooks and CI in hosted containers or on your own runners, landing work as pull requests."
  icon: https://www.google.com/s2/favicons?domain=preloop.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://preloop.ai/mcp/v1
oauth:
  - provider: preloop
    secret: preloop.personal_access_token
    env: PRELOOP_PERSONAL_ACCESS_TOKEN
