name: opentv
type: remote
dynamic:
  tools: true
meta:
  category: entertainment
  tags:
    - entertainment
    - tv
    - movies
    - tracking
    - remote
about:
  title: OpenTV
  description: Ask about your TV and film history, and keep it up to date by chat. Mark episodes and films watched, rate them and add to your watchlist, approving each change
  icon: https://www.google.com/s2/favicons?domain=theopentv.com&sz=64
remote:
  transport_type: streamable-http
  url: https://theopentv.com/mcp
oauth:
  - provider: opentv
    secret: opentv.personal_access_token
    env: OPENTV_PERSONAL_ACCESS_TOKEN
