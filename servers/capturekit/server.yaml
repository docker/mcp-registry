name: capturekit
type: remote
meta:
  category: web-scraping
  tags:
    - screenshots
    - web-scraping
    - remote
about:
  title: CaptureKit
  description: "Capture any website as PNG, JPEG, WebP or PDF, extract its content, or analyse it with AI."
  icon: https://avatars.githubusercontent.com/u/215749316?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.capturekit.dev/
  headers:
    x-api-key: "${CAPTUREKIT_API_KEY}"
config:
  description: Configure your CaptureKit API key
  secrets:
    - name: capturekit.api_key
      env: CAPTUREKIT_API_KEY
      example: <YOUR_API_KEY>
