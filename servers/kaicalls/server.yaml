name: kaicalls
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - telephony
    - sms
    - small-business
    - remote
about:
  title: KaiCalls
  description: Your business phone secretary. Read calls, transcripts, voicemail, texts and leads, and place calls from your KaiCalls line.
  icon: https://www.google.com/s2/favicons?domain=kaicalls.com&sz=64
remote:
  transport_type: streamable-http
  url: https://www.kaicalls.com/api/mcp
  headers:
    Authorization: "Bearer ${KAICALLS_API_KEY}"
config:
  secrets:
    - name: kaicalls.api_key
      env: KAICALLS_API_KEY
      example: kc_live_<YOUR_API_KEY>
