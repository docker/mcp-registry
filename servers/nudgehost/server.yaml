name: nudgehost
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - file-sharing
    - hosting
    - remote
about:
  title: NudgeHost
  description: Publish text and files as public links, and list the links on your NudgeHost account.
  icon: https://www.nudgehost.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://www.nudgehost.com/api/mcp
  headers:
    Authorization: "Bearer ${NUDGEHOST_API_KEY}"
config:
  description: Add an API key from the API keys panel of your NudgeHost dashboard.
  secrets:
    - name: nudgehost.api_key
      env: NUDGEHOST_API_KEY
      example: <YOUR_API_KEY>
