about:
  title: ViaSocket
  description: viaSocket is integration and AI infrastructure for developers. Through this MCP server, an AI agent can explore viaSocket's documentation and APIs, then build and verify working integrations directly into your product. Your users connect their own apps, and your product can act on them, automate workflows, and power AI experiences.
