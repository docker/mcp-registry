  commit: 9cc1d2663096a66dc1835c484802bdd9e0f78b51
config:
  description: Connect the server to your tryVidimus account with a sandbox API key.
  secrets:
    - name: tryvidimus.api_key
      env: TRYVIDIMUS_API_KEY
      example: sk_test_YOUR_SANDBOX_KEY
      description: Create a sandbox key (sk_test_…) in the customer area at https://app.tryvidimus.com. Production keys are refused by default.
