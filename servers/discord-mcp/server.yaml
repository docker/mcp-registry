name: discord-mcp
image: mcp/discord-mcp
type: server
meta:
  category: communication
  tags:
    - communication
    - discord
    - moderation
about:
  title: Discord MCP
  description: "Discord server management MCP for AI agents: chat, moderation, admin, and full server building. More than 160 tools through your own bot, up to building out a full community server from a one paragraph brief, and it can run several bots from one install. Setup is a single guided command. Destructive actions never execute on the first call. They return a preview and wait for explicit confirmation, enforced by the server itself rather than the model's judgment, and changes to a server's structure are recorded so they can be undone. Formerly Omnicord."
  icon: https://avatars.githubusercontent.com/OrygnsCode
source:
  project: https://github.com/OrygnsCode/discord-mcp
  branch: main
run:
  command:
    - node
    - dist/index.js
config:
  description: Connect discord-mcp to your Discord bot
  secrets:
    - name: discord-mcp.discord_token
      env: DISCORD_TOKEN
      example: your-bot-token-from-the-developer-portal
  env:
    - name: DISCORD_MCP_GUILD
      example: "123456789012345678"
      value: "{{discord-mcp.guild}}"
  parameters:
    type: object
    properties:
      guild:
        type: string
