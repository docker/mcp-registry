name: myspec
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - spec-driven-development
    - requirements
    - planning
    - remote
about:
  title: MySpec
  description: Spec-driven development for AI coding agents. Interviews you with focused questions, then writes constitution, requirements, solution and tasks spec files that Claude Code, Cursor and other MCP clients implement against. Needs a MySpec account and an API token.
  icon: https://www.google.com/s2/favicons?domain=myspec.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.myspec.dev/mcp
  headers:
    Authorization: "Bearer ${MYSPEC_API_TOKEN}"
config:
  description: Create an API token in your MySpec account settings.
  secrets:
    - name: myspec.api_token
      env: MYSPEC_API_TOKEN
      example: msp_pat_YOUR_TOKEN
