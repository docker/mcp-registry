name: algorover-research
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - research
    - backtesting
    - remote
about:
  title: AlgoRover Research
  description: Discover strategies, run historical backtests, and inspect research reports. Personal runs and reports require OAuth.
  icon: https://raw.githubusercontent.com/algorover/algorover-research/main/algorover-research-cloud/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://research.algorover.ai/mcp
oauth:
  - provider: algorover-research
    secret: algorover-research.personal_access_token
    env: ALGOROVER_RESEARCH_PERSONAL_ACCESS_TOKEN
