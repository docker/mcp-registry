name: simplepages
type: remote
meta:
  category: web
  tags:
    - web
    - cms
    - website-builder
    - landing-pages
    - remote
about:
  title: Simplepages
  description: Build and edit landing pages and websites from a description, and pull visitor, lead and revenue numbers
  icon: https://www.google.com/s2/favicons?domain=simplepages.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://simplepages.ai/api/mcp
  headers:
    Authorization: "Bearer ${SIMPLEPAGES_TOKEN}"
config:
  secrets:
    - name: simplepages.token
      env: SIMPLEPAGES_TOKEN
      example: <YOUR_TOKEN>
