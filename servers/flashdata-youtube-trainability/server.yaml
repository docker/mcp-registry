name: flashdata-youtube-trainability
image: mcp/flashdata-youtube-trainability
type: server
meta:
  category: search
  tags:
    - youtube
    - youtube-trainability
    - research
    - flashdata
about:
  title: YouTube Trainability and License Labels — FlashData
  description: "Inspect a YouTube video’s Creative Commons license classification. Record the returned license-label signal for a separate rights review. For AI agents. Requires your own FlashData API Key; data calls use paid Credits."
  icon: https://raw.githubusercontent.com/rocosen/flashdata-mcp/main/assets/logo.svg
source:
  project: https://github.com/rocosen/flashdata-mcp
  commit: aa89ee8810fdcae711d818647ecd04b027912f37
  dockerfile: Dockerfile
  buildTarget: youtube-trainability
config:
  description: Use your own FlashData API Key with youtube_trainability access. Data queries consume your FlashData Credits.
  secrets:
    - name: flashdata-youtube-trainability.api_key
      env: FLASHDATA_API_KEY
      example: <YOUR_FLASHDATA_API_KEY>
      description: Create a scoped key at https://flashdata.dev/app/api-keys
      required: true
  env:
    - name: FLASHDATA_REQUEST_TIMEOUT_MS
      value: "65000"
    - name: FLASHDATA_DATA_API_URL
      value: https://data.flashdata.dev
    - name: FLASHDATA_MANAGEMENT_API_URL
      value: https://api.flashdata.dev
