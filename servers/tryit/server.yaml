name: tryit
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - marketing
    - social-media
    - youtube
    - remote
about:
  title: TRYIT
  description: Short-form video trend data for AI agents. Search trending Shorts, Reels and TikTok videos, rising keywords and creators, analyze reference channels, find original-upload candidates for a clip and search ad creatives across 101 countries.
  icon: https://www.google.com/s2/favicons?domain=inctryit.com&sz=64
remote:
  transport_type: streamable-http
  url: https://inctryit.com/mcp
  headers:
    Authorization: "Bearer ${TRYIT_API_KEY}"
config:
  secrets:
    - name: tryit.api_key
      env: TRYIT_API_KEY
      example: <YOUR_API_KEY>
