name: postproxy
type: remote
meta:
  category: communication
  tags:
    - social-media
    - scheduling
    - marketing
    - communication
    - remote
about:
  title: PostProxy
  description: Publish and schedule posts and manage comments, DMs, and Google Business reviews across Instagram, Facebook, TikTok, LinkedIn, YouTube, X, Threads, Pinterest, Bluesky, Telegram, and Google Business.
  icon: https://www.google.com/s2/favicons?domain=postproxy.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.postproxy.dev/mcp
  headers:
    Authorization: "Bearer ${POSTPROXY_API_KEY}"
config:
  description: Configure your PostProxy API key. Create one in the PostProxy app under Settings, then API keys.
  secrets:
    - name: postproxy.api_key
      env: POSTPROXY_API_KEY
      example: <YOUR_API_KEY>
