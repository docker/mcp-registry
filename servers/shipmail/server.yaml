name: shipmail
type: remote
meta:
  category: communication
  tags:
    - communication
    - email
    - calendar
    - newsletters
    - remote
about:
  title: Shipmail
  description: Business email on your own domain for people and AI agents. Read, search, send and reply in mailboxes, and manage domains, mailboxes, inbox rules, calendars, booking pages, newsletters and webhooks.
  icon: https://raw.githubusercontent.com/shipmail-to/shipmail-mcp/main/assets/shipmail-mark-400.png
remote:
  transport_type: streamable-http
  url: https://shipmail.to/api/mcp
  headers:
    Authorization: "Bearer ${SHIPMAIL_API_KEY}"
config:
  secrets:
    - name: shipmail.api_key
      env: SHIPMAIL_API_KEY
      example: <YOUR_API_KEY>
