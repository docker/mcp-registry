name: xpoz-remote
type: remote
meta:
  category: data
  tags:
    - social-media
    - search
    - data
    - remote
about:
  title: Xpoz
  description: Social media intelligence for Twitter/X, Instagram, Reddit, and TikTok - search posts, look up users, track keywords, and export engagement data.
  icon: https://www.google.com/s2/favicons?domain=xpoz.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.xpoz.ai/mcp
  headers:
    Authorization: "Bearer ${XPOZ_REMOTE_ACCESS_KEY}"
config:
  secrets:
    - name: xpoz-remote.access_key
      env: XPOZ_REMOTE_ACCESS_KEY
      example: <YOUR_ACCESS_KEY>
