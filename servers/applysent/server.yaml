name: applysent
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - jobs
    - job-search
    - remote
about:
  title: ApplySent
  description: Search jobs that fit your résumé, preview each tailored application and apply on the employer's own form, one job at a time and only with your approval (no bulk auto-apply over MCP)
  icon: https://www.google.com/s2/favicons?domain=applysent.com&sz=64
remote:
  transport_type: streamable-http
  url: https://applysent.com/api/mcp
oauth:
  - provider: applysent
    secret: applysent.personal_access_token
    env: APPLYSENT_PERSONAL_ACCESS_TOKEN
