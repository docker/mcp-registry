name: tyton
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - marketing
    - meta-pixel
    - conversions-api
    - remote
about:
  title: Tyton
  description: Audits a site's Meta Pixel and Conversions API setup, then sets up the tracking you approve. Free plan for 1 site and 10,000 events a month.
  icon: https://www.google.com/s2/favicons?domain=usetyton.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.usetyton.com/mcp
oauth:
  - provider: tyton
    secret: tyton.personal_access_token
    env: TYTON_PERSONAL_ACCESS_TOKEN
