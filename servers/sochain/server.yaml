name: sochain
type: remote
meta:
  category: blockchain
  tags:
    - blockchain
    - bitcoin
    - cryptocurrency
    - remote
about:
  title: SoChain
  description: Bitcoin, Litecoin, Dogecoin and Zcash blockchain data, including addresses, transactions, blocks and fees, plus their testnets.
  icon: https://sochain.com/assets/img/favicon.svg
remote:
  transport_type: streamable-http
  url: https://sochain.com/mcp
  headers:
    API-KEY: "${SOCHAIN_API_KEY}"
config:
  description: Optionally provide a SoChain API key from https://sochain.com/dashboard for higher limits (the server also works without one, up to 2,500 lookups a day per IP).
  secrets:
    - name: sochain.api_key
      env: SOCHAIN_API_KEY
      example: <YOUR_API_KEY>
      required: false
