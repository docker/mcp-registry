name: num
type: remote
dynamic:
  tools: true
meta:
  category: travel
  tags:
    - travel
    - places
    - directory
    - search
    - remote
about:
  title: NUM
  description: Search a directory of 2.5 million travel places across 77 destinations, and submit businesses and promotions for human review
  icon: https://www.google.com/s2/favicons?domain=itsnum.com&sz=64
remote:
  transport_type: streamable-http
  url: https://itsnum.com/mcp
  headers:
    Authorization: "Bearer ${NUM_API_KEY}"
config:
  secrets:
    - name: num.api_key
      env: NUM_API_KEY
      example: <YOUR_API_KEY>
