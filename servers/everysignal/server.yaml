name: everysignal
type: remote
meta:
  category: productivity
  tags:
    - marketing
    - seo
    - competitive-intelligence
    - copywriting
    - remote
about:
  title: Every Signal
  description: Audit AI-written marketing (copy, landing pages, emails, ads, SEO) against teardowns of real companies and measured conversion rates.
  icon: https://www.google.com/s2/favicons?domain=everysignal.com&sz=64
remote:
  transport_type: streamable-http
  url: https://everysignal.com/mcp
  headers:
    Authorization: "Bearer ${EVERYSIGNAL_API_KEY}"
config:
  secrets:
    - name: everysignal.api_key
      env: EVERYSIGNAL_API_KEY
      example: <YOUR_API_KEY>
