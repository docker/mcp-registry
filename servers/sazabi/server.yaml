name: sazabi
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - observability
    - logs
    - remote
about:
  title: Sazabi
  description: Search production logs in plain language, investigate issues and root causes, and read or edit dashboards in your Sazabi workspace.
  icon: https://www.google.com/s2/favicons?domain=sazabi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.sazabi.com/mcp
oauth:
  - provider: sazabi
    secret: sazabi.personal_access_token
    env: SAZABI_PERSONAL_ACCESS_TOKEN
