name: limewire
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - file-storage
    - file-sharing
    - remote
about:
  title: LimeWire
  description: Upload, share and reuse files across AI agents with LimeWire cloud storage
  icon: https://www.google.com/s2/favicons?domain=limewire.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.limewire.com/mcp
oauth:
  - provider: limewire
    secret: limewire.personal_access_token
    env: LIMEWIRE_PERSONAL_ACCESS_TOKEN
