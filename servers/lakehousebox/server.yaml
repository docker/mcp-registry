name: lakehousebox
type: remote
dynamic:
  tools: true
meta:
  category: database
  tags:
    - database
    - analytics
    - iceberg
    - duckdb
    - remote
about:
  title: LakehouseBox
  description: Read Apache Iceberg tables hosted in Europe - find tables, see how fresh they are, run read-only SQL, read public catalogs
  icon: https://www.google.com/s2/favicons?domain=lakehousebox.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.lakehousebox.com/mcp
oauth:
  - provider: lakehousebox
    secret: lakehousebox.personal_access_token
    env: LAKEHOUSEBOX_PERSONAL_ACCESS_TOKEN
