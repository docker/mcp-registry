name: mindmetrics
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - marketing
    - advertising
    - remote
about:
  title: Mindmetrics
  description: Query ad and marketing data from 30+ platforms, build reports and workbooks, set alerts, and plan campaign changes that are applied only after you confirm.
  icon: https://app.mindmetrics.ai/brand/mindmetrics-icon-512.png
remote:
  transport_type: streamable-http
  url: https://app.mindmetrics.ai/api/mcp
oauth:
  - provider: mindmetrics
    secret: mindmetrics.personal_access_token
    env: MINDMETRICS_PERSONAL_ACCESS_TOKEN
