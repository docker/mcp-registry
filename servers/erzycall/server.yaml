name: erzycall
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - phone-calls
    - voice
    - telephony
    - remote
about:
  title: ErzyCall
  description: Lets an agent or app make and take real phone calls through MCP or API. For builders who need calling capability without assembling the telephony stack themselves.
  icon: https://www.google.com/s2/favicons?domain=erzycall.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.erzycall.com/api/mcp
oauth:
  - provider: erzycall
    secret: erzycall.personal_access_token
    env: ERZYCALL_PERSONAL_ACCESS_TOKEN
