about:
  title: FoodCalorie China
  description: |
    Nutrition data for Chinese chain-restaurant menus — the food people actually
    order, not a generic ingredient lookup.

    103 menu items across 14 chains, including Starbucks China, Luckin, Heytea,
    Nayuki, Chagee, Mixue, KFC China and McDonald's China. Every item carries
    calories, protein, fat and carbohydrate, plus a per-item health note.

    Six read-only tools: look up by barcode, search by name in Chinese or English,
    list by category, compare items side by side, total a day's intake, and pull a
    health tip for a given item.

    Requires no account, no API key and no configuration. The dataset ships inside
    the image, and the server makes no outbound requests — network access is
    disabled below.
