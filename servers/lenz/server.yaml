name: lenz
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - research
    - fact-checking
    - remote
about:
  title: Lenz Fact-Check
  description: Check the factual claims in a draft or an answer against independent sources. A quick verdict with a confidence for each claim, or a deep check that shows the key finding and its sources.
  icon: https://lenz.io/lenz-wordmark-512.png
remote:
  transport_type: streamable-http
  url: https://lenz.io/mcp
oauth:
  - provider: lenz
    secret: lenz.personal_access_token
    env: LENZ_PERSONAL_ACCESS_TOKEN
