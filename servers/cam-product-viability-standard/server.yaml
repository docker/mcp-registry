about:
  title: CAM — Product Viability Standard
  description: |
    Deterministic per-order profit verdicts for products you might source and sell.
    Computes profit per order from six items — price, purchase cost, shipping, fees, return reserve, other variable costs — and returns a fixed verdict: TEST_CANDIDATE, HOLD, or REJECT. The return reserve is always counted; if any item is missing, no verdict is issued.
    For items sold but no profit left — 「売れたのに残らない」 — and for deciding whether a product is worth stocking.
    Optionally pass a genre code to receive up to two affiliate links for that genre, appended to the output and labeled as affiliate links.
    Runs entirely locally over stdio. No network access, no API key, no account.
  icon: https://avatars.githubusercontent.com/u/196912118?v=4
