name: deliverd
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - collaboration
    - approvals
    - human-in-the-loop
    - remote
about:
  title: Deliverd
  description: Give any AI agent a way to ask a person — for approval, a decision, an answer or a review.
  icon: https://www.google.com/s2/favicons?domain=deliverd.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://deliverd.dev/api/mcp
  headers:
    Authorization: "Bearer ${DELIVERD_API_KEY}"
config:
  secrets:
    - name: deliverd.api_key
      env: DELIVERD_API_KEY
      example: dlv_<YOUR_API_KEY>
