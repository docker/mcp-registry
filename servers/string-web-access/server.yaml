name: string-web-access
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - search
    - data
    - remote
about:
  title: String Web Access
  description: >-
    Search the web, fetch any URL or send it a request, and map a site's URLs —
    all returned as clean, LLM-ready Markdown.
  icon: https://www.google.com/s2/favicons?domain=usestring.ai&sz=128
remote:
  transport_type: streamable-http
  url: https://mcp.usestring.ai/v3/mcp
  headers:
    Authorization: "Bearer ${STRING_API_KEY}"
config:
  description: Configure your String Web Access API key
  secrets:
    - name: string-web-access.api_key
      env: STRING_API_KEY
      example: <YOUR_API_KEY>
      description: Create a key at [portal.usestring.ai](https://portal.usestring.ai)
