name: string-web-access
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - search
    - data
    - remote
about:
  title: String Web Access
  description: >-
    Search the web, fetch any URL or send it a write request, and map a site's
    URLs — all returned as clean, LLM-ready Markdown. Proxy rotation, anti-bot
    handling, CAPTCHA solving and JavaScript rendering happen server-side, so
    the agent gets the page instead of a block screen. Best for sites that
    rate-limit, geo-gate or block automated traffic.
  icon: https://www.google.com/s2/favicons?domain=usestring.ai&sz=128
remote:
  transport_type: streamable-http
  url: https://mcp.usestring.ai/v1/mcp
config:
  description: Configure your String Web Access API key
  secrets:
    - name: string-web-access.api_key
      env: STRING_API_KEY
      example: <YOUR_API_KEY>
      description: Create a key at [portal.usestring.ai](https://portal.usestring.ai)
