name: string-web-access
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - search
    - data
    - remote
about:
  title: String Web Access
  description: |-
    Fetch, search, and map any website as clean, LLM-ready Markdown.

    String Web Access handles proxy rotation, anti-bot protection, CAPTCHAs, and
    JavaScript-rendered pages automatically, so your agent gets the page instead
    of a block screen. Four tools: fetch a URL, send a write request to one, run
    a web search, or crawl a site's URLs.
  icon: https://www.google.com/s2/favicons?domain=usestring.ai&sz=128
remote:
  transport_type: streamable-http
  url: https://mcp.usestring.ai/v1/mcp
config:
  description: Configure your String Web Access API key
  secrets:
    - name: string-web-access.api_key
      env: STRING_API_KEY
      example: <YOUR_API_KEY>
      description: Create a key at [portal.usestring.ai](https://portal.usestring.ai)
