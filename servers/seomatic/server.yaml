name: seomatic
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - seo
    - search-console
    - marketing
    - analytics
    - remote
about:
  title: SEOmatic
  description: SEO agent for your own site. Read Google Search Console clicks and rankings, audit pages, track AI visibility and keywords, and stage fixes that wait for your approval in WordPress, Shopify, Webflow, Wix and more
  icon: https://www.google.com/s2/favicons?domain=seomatic.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://app.seomatic.ai/api/mcp
oauth:
  - provider: seomatic
    secret: seomatic.personal_access_token
    env: SEOMATIC_PERSONAL_ACCESS_TOKEN
