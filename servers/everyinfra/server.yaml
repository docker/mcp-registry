name: everyinfra
type: remote
meta:
  category: web-scraping
  tags:
    - web-scraping
    - data
    - search
    - social-media
    - ecommerce
    - remote
about:
  title: EveryInfra
  description: Structured data from 90+ platforms (TikTok, Amazon, LinkedIn, RedNote, Douyin and more) with 400+ data capabilities, plus web search, through one API key. Call one capability with one target to test, then scale up; failed calls and empty results are not charged.
  icon: https://everyinfra.com/brand/everyinfra-mark.svg
remote:
  transport_type: streamable-http
  url: https://api.everyinfra.com/mcp
  headers:
    Authorization: "Bearer ${EVERYINFRA_API_KEY}"
config:
  description: Create an EveryInfra API key at https://everyinfra.com/app
  secrets:
    - name: everyinfra.api_key
      env: EVERYINFRA_API_KEY
      example: <YOUR_API_KEY>
