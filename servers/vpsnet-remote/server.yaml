name: vpsnet-remote
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - hosting
    - networking
    - remote
about:
  title: VPSnet
  description: "Manage your VPSnet cloud: KVM and Firecracker VPS, applications, Functions, software-defined networks, DNS, domains and TLS certificates. You choose the permissions and which servers the connection can access."
  icon: https://raw.githubusercontent.com/bacarrdy/vpsnet-mcp/main/plugin/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.vpsnet.com/mcp
oauth:
  - provider: vpsnet-remote
    secret: vpsnet-remote.personal_access_token
    env: VPSNET_REMOTE_PERSONAL_ACCESS_TOKEN
