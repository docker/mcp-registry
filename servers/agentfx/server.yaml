name: agentfx
image: mcp/agentfx
type: server
meta:
  category: video
  tags:
    - video
    - motion-graphics
    - animation
    - rendering
about:
  title: AgentFX
  description: Motion graphics and video effects for AI agents. Write a short Reel Script, lint it, preview frames and contact sheets, then render deterministic MP4, ProRes, VP9 alpha, GIF or WebP with a native Rust renderer (no browser).
  icon: https://avatars.githubusercontent.com/u/349959962?s=200&v=4
source:
  project: https://github.com/agentfxhq/agentfx
  commit: 02ed96d2c46982534628a25aaf8fe881174baea0
run:
  command:
    - mcp
  volumes:
    - "{{agentfx.workspace_path}}:/work"
config:
  description: The folder AgentFX reads Reel Scripts from and writes rendered videos to.
  parameters:
    type: object
    properties:
      workspace_path:
        type: string
        default: /Users/local-test
    required:
      - workspace_path
