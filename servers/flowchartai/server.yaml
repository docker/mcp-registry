name: flowchartai
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - diagramming
    - flowchart
    - remote
about:
  title: FlowchartAI
  description: Create and edit native flowcharts, manage saved versions, and export draw.io XML or JSON
  icon: https://flowchartai.org/logo.png
remote:
  transport_type: streamable-http
  url: https://flowchartai.org/api/mcp
oauth:
  - provider: flowchartai
    secret: flowchartai.personal_access_token
    env: FLOWCHARTAI_PERSONAL_ACCESS_TOKEN
