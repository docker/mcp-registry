name: getmattered
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - career
    - resume
    - job-search
    - ats
    - remote
about:
  title: GetMattered
  description: Find matched jobs, score and tailor resumes, write cover letters, and apply across 30+ hiring systems. Send automatically or review and approve first, track employer confirmations, prepare for interviews, translate saved resumes and create editable resume drafts.
  icon: https://raw.githubusercontent.com/getmattered/getmattered-mcp/v1.10.1/plugins/getmattered/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.getmattered.com/mcp
oauth:
  - provider: getmattered
    secret: getmattered.personal_access_token
    env: GETMATTERED_PERSONAL_ACCESS_TOKEN
