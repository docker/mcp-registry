name: readshore
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - read-later
    - knowledge
    - remote
about:
  title: ReadShore
  description: Search, read and save to your ReadShore read-later library, with saved text you can cite and ReadShore's summaries
  icon: https://readshore.app/images/connector-icon.png
remote:
  transport_type: streamable-http
  url: https://readshore.app/mcp
oauth:
  - provider: readshore
    secret: readshore.personal_access_token
    env: READSHORE_PERSONAL_ACCESS_TOKEN
