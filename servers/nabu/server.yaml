about:
  title: Nabu
  description: Read-only research library of ancient texts over MCP — full-text and lemma search, passages by citation URN, concordance, Greek/Latin dictionaries, cross-witness alignment, etymology and intertext tools, every result stamped with its source's license class. This image is a demo library slice (Greek New Testament, Hebrew Bible, Latin Vulgate, World English Bible, LSJ and Lewis & Short) and needs no configuration or mounts; the full library is a local build from the same repository. Code is MIT; the baked data carries per-source open data licences, listed in /demo/demo-census.json inside the image.
