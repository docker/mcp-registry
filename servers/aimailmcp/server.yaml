name: aimailmcp
type: remote
meta:
  category: communication
  tags:
    - email
    - communication
    - agents
    - remote
about:
  title: AI Mail MCP
  description: Real email for AI agents. Add a domain and get its DNS records, create mailboxes, read one unified inbox, wait for sign-up codes, and send, reply in-thread and forward, with scoped tokens, dry runs and an audit log.
  icon: https://raw.githubusercontent.com/hapitech/aimailmcp-docs/main/logo-400.png
remote:
  transport_type: streamable-http
  url: https://aimailmcp.com/mcp
  headers:
    Authorization: "Bearer ${AIMAIL_TOKEN}"
config:
  secrets:
    - name: aimailmcp.token
      env: AIMAIL_TOKEN
      example: amk_<YOUR_TOKEN>
