name: gpunz
type: remote
meta:
  category: devops
  tags:
    - devops
    - gpu
    - cloud
    - ai
    - remote
about:
  title: gpu.nz GPU Cloud
  description: Rent cloud GPUs by the minute from your agent. Find live offers (RTX 3060 to B300), estimate the VRAM a model needs, launch servers from templates (ComfyUI, Jupyter, Ollama, vLLM) or any Docker image, read logs, stop and delete them.
  icon: https://avatars.githubusercontent.com/u/344856705?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://gpu.nz/mcp
  headers:
    Authorization: "Bearer ${GPUNZ_API_KEY}"
config:
  description: Browsing offers and estimating VRAM work without a key. To launch and manage servers, create an API key at https://gpu.nz/en/console/keys.
  secrets:
    - name: gpunz.api_key
      env: GPUNZ_API_KEY
      example: <YOUR_API_KEY>
      required: false
