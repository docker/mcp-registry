name: gitlab-mcp-server
type: remote
meta:
  category: devops
  tags:
    - devops
    - gitlab
    - ci-cd
    - code-review
    - remote
about:
  title: GitLab (mcp.jmrp.io)
  description: Free hosted GitLab MCP endpoint for gitlab.com, used with your own personal access token, which is never written to disk. Two tools (find an action, execute it) in front of a catalog of 700+ operations across projects, merge requests, pipelines, issues, releases and more.
  icon: https://avatars.githubusercontent.com/u/28966312?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.jmrp.io/gitlab
  headers:
    Authorization: "Bearer ${GITLAB_MCP_TOKEN}"
config:
  description: A gitlab.com personal access token. Ask for the narrowest scope you need. read_api is admitted and served the read-only part of the catalog; api is only needed for the actions that write.
  secrets:
    - name: gitlab-mcp-server.personal_access_token
      env: GITLAB_MCP_TOKEN
      example: <YOUR_GITLAB_COM_TOKEN>
