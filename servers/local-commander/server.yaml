name: local-commander
type: remote
dynamic:
  tools: true
meta:
  category: development
  tags:
    - development
    - pc
    - remote
about:
  title: Local Commander
  description: "Give your AI hands on every computer you own. One chat, all your machines — even from your phone."
  icon: https://raw.githubusercontent.com/netbka/local-commander-plugins/0166035a4274ff4a4ed7909dbd3f938b615de010/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://localcmd.app/mcp
oauth:
  - provider: local-commander
    secret: local-commander.personal_access_token
    env: LOCAL_COMMANDER_PERSONAL_ACCESS_TOKEN
