name: rhino-rank
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - seo
    - link-building
    - press-release
    - remote
about:
  title: Rhino Rank
  description: Quote and order link building and press releases, run a press release through briefing and approval, and manage orders, coupons and your Rhino Rank account
  icon: https://app.rhinorank.io/assets/images/favicon-new.png
remote:
  transport_type: streamable-http
  url: https://app.rhinorank.io/mcp
oauth:
  - provider: rhino-rank
    secret: rhino-rank.personal_access_token
    env: RHINO_RANK_PERSONAL_ACCESS_TOKEN
