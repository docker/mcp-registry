name: dmparrot
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - marketing
    - instagram
    - social-media
    - automation
    - remote
about:
  title: DMParrot
  description: Build and run Instagram comment-to-DM funnels, keyword replies, tags, and broadcasts on the official Instagram API
  icon: https://www.google.com/s2/favicons?domain=dmparrot.com&sz=64
remote:
  transport_type: streamable-http
  url: https://dmparrot.com/mcp
oauth:
  - provider: dmparrot
    secret: dmparrot.personal_access_token
    env: DMPARROT_PERSONAL_ACCESS_TOKEN
