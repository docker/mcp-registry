name: fudaut-bmecat-oci-mcp
image: mcp/fudaut-bmecat-oci-mcp
type: server
meta:
  category: ecommerce
  tags:
    - ecommerce
    - bmecat
    - b2b
    - erp
    - punchout
about:
  title: Fudaut BMEcat and OCI Validator
  description: Read-only validator and converter for B2B wholesale BMEcat 1.2/2005 catalogs, ERP exports (JTL-Wawi, weclapp, Shopware 6, Sage 100, SelectLine), and SAP OCI carts.
  icon: https://www.google.com/s2/favicons?domain=fudaut.com&sz=64
source:
  project: https://github.com/iisakovbusiness-wq/fudaut-bmecat-oci-mcp
  commit: b68419b2f8f3c47f09a4f7eb93e0ab3c5147e5a5
run:
  volumes:
    - "{{fudaut-bmecat-oci-mcp.path|volume-target}}:/data:ro"
  disableNetwork: true
config:
  description: The MCP server is allowed to read BMEcat, CSV, JSON, and OCI files from this directory
  env:
    - name: BMECAT_ORDNER
      example: /app/fixtures
      value: /data
  parameters:
    type: object
    properties:
      path:
        type: string
        default: /Users/demo/catalogs
    required:
      - path
