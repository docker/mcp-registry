name: socialapis
type: remote
meta:
  category: automation
  tags:
    - social-media
    - facebook
    - instagram
    - data-extraction
    - web-scraping
    - remote
about:
  title: SocialAPIs
  description: Public Facebook and Instagram data for AI agents — pages, posts, comments, groups, the Facebook Ads Library, Marketplace, Instagram profiles, reels and locations. 47 read-only tools with structured output.
  icon: https://socialapis.io/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.socialapis.io/mcp
  headers:
    Authorization: "Bearer ${SOCIALAPIS_API_KEY}"
config:
  secrets:
    - name: socialapis.api_key
      env: SOCIALAPIS_API_KEY
      example: <YOUR_API_KEY>
