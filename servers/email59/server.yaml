name: email59
type: remote
meta:
  category: communication
  tags:
    - communication
    - email
    - email-validation
    - remote
about:
  title: email59
  description: Send transactional and marketing email from agents, check and validate addresses, manage blocklists and unsubscribes. Mail goes out from a name at email59.com, so there is no domain to set up.
  icon: https://www.google.com/s2/favicons?domain=email59.com&sz=64
remote:
  transport_type: streamable-http
  url: https://email59.com/v1/mcp
  headers:
    Authorization: "Bearer ${EMAIL59_API_KEY}"
config:
  secrets:
    - name: email59.api_key
      env: EMAIL59_API_KEY
      example: <YOUR_API_KEY>
