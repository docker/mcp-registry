name: docracy
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - e-signature
    - documents
    - remote
about:
  title: Docracy
  description: Free, no-signup sequential e-signatures (the product). The MCP connector itself is a paid-account feature — check_status and find_documents both require an API key.
  icon: https://www.google.com/s2/favicons?domain=docracy.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.docracy.io/mcp
  headers:
    Authorization: "Bearer ${DOCRACY_API_KEY}"
config:
  description: Requires a Docracy API key from a paid account's Dashboard → Connector & API key card. Both check_status and find_documents need it.
  secrets:
    - name: docracy.api_key
      env: DOCRACY_API_KEY
      example: <YOUR_API_KEY>
      required: true
