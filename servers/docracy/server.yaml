name: docracy
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - e-signature
    - documents
    - remote
about:
  title: Docracy
  description: Free, no-signup sequential e-signatures. Check the status of a signing chain, or (with a paid API key) search your own documents.
  icon: https://www.google.com/s2/favicons?domain=docracy.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.docracy.io/mcp
  headers:
    Authorization: "Bearer ${DOCRACY_API_KEY}"
config:
  description: Optionally provide a Docracy API key (from the Dashboard's Connector & API key card) to unlock document search. check_status works without one.
  secrets:
    - name: docracy.api_key
      env: DOCRACY_API_KEY
      example: <YOUR_API_KEY>
      required: false
