name: docracy
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - e-signature
    - documents
    - remote
about:
  title: Docracy
  description: Free, no-signup sequential e-signatures. check_status works for anyone, no account needed; find_documents (search your own documents) requires a paid API key.
  icon: https://www.google.com/s2/favicons?domain=docracy.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.docracy.io/mcp
  headers:
    Authorization: "Bearer ${DOCRACY_API_KEY}"
config:
  description: Optionally provide a Docracy API key (from a paid account's Dashboard → Connector & API key card) to unlock find_documents. check_status works without one.
  secrets:
    - name: docracy.api_key
      env: DOCRACY_API_KEY
      example: <YOUR_API_KEY>
      required: false
