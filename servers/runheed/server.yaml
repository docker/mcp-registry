name: runheed
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - error-tracking
    - debugging
    - developer-tools
    - remote
about:
  title: Runheed
  description: Your app reports errors; Claude Code, Cursor or any MCP client reads the stack trace, fixes it and marks it resolved.
  icon: https://runheed.com/icon.png
source:
  project: https://github.com/getrunheed/runheed-plugin
remote:
  transport_type: streamable-http
  url: https://runheed.com/api/mcp
oauth:
  - provider: runheed
    secret: runheed.personal_access_token
    env: RUNHEED_PERSONAL_ACCESS_TOKEN
