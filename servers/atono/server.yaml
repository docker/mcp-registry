name: atono
image: atonoio/atono-mcp-server
type: server
meta:
  category: productivity
  tags:
    - productivity
    - project-management
    - developer-tools
    - product-management

about:
  title: Atono
  description: >-
    Give your AI coding tools your team's product context. Read and write stories,
    bugs, epics, acceptance criteria, and AI context in an Atono workspace, plus the
    workspace glossary of product concepts, so agents stop guessing at your domain.
  icon: https://atono.io/favicon.ico

source:
  project: https://github.com/atono-io/atono-mcp-server
  commit: 411dfd732a471ab90575afdf4b52d029f65672de

config:
  description: >-
    Requires an Atono API key. Create one in workspace settings under Manage API keys.
    Works on every Atono plan including Free (up to 25 users) — note that Glossary and
    AI Context are a 30-day trial on Free, so an agent on an expired Free workspace will
    find the tools present and the context empty.
  secrets:
    - name: atono.api_key
      env: X_API_KEY
      example: <YOUR_ATONO_API_KEY>
