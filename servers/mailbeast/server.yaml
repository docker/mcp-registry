name: mailbeast
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - email
    - marketing
    - sales
    - outreach
    - remote
about:
  title: MailBeast.ai
  description: Run cold email outreach - create campaigns with A/B steps, add leads, check sending mailboxes and warmup, read and answer replies, and see campaign analytics
  icon: https://mailbeast.ai/android-chrome-192x192.png
remote:
  transport_type: streamable-http
  url: https://mcp.mailbeast.ai/mcp
oauth:
  - provider: mailbeast
    secret: mailbeast.personal_access_token
    env: MAILBEAST_PERSONAL_ACCESS_TOKEN
