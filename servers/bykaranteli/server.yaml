name: bykaranteli
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - crypto
    - finance
    - market-data
    - derivatives
    - remote
about:
  title: ByKaranteli
  description: Crypto derivatives market data covering funding rates, open interest, liquidations, options flow and gamma exposure, CFTC COT positioning, spot ETF flows, and order-flow toxicity. Needs a free ByKaranteli account key.
  icon: https://bykaranteli.com/brand/icon-192.png
remote:
  transport_type: streamable-http
  url: https://mcp.bykaranteli.com/
  headers:
    x-api-key: "${BYKARANTELI_API_KEY}"
config:
  description: Your ByKaranteli account key (bk_...), free with any verified account at https://bykaranteli.com/dashboard/api
  secrets:
    - name: bykaranteli.api_key
      env: BYKARANTELI_API_KEY
      example: <YOUR_ACCOUNT_KEY>
