name: fantasma
type: remote
dynamic:
  tools: true
meta:
  category: design
  tags:
    - design
    - ghost
    - website-builder
    - remote
about:
  title: Fantasma
  description: Build and publish Ghost themes with your AI agent. Edit pages, styles and patterns, check desktop and mobile screenshots, and publish to Ghost.
  icon: https://www.google.com/s2/favicons?domain=fantasma.io&sz=64
remote:
  transport_type: streamable-http
  url: https://www.fantasma.io/api/mcp
oauth:
  - provider: fantasma
    secret: fantasma.personal_access_token
    env: FANTASMA_PERSONAL_ACCESS_TOKEN
