name: ace-music
image: mcp/ace-music
type: server
meta:
  category: ai
  tags:
    - music
    - audio
about:
  title: ACE Music
  description: Generate songs and lyrics, import reference audio, create covers or mashups, and check the status of an existing ACE Music task with your Ace Data Cloud account.
  icon: https://cdn.acedata.cloud/acemusic-icon-52deddfc87b9.png
source:
  project: https://github.com/AceDataCloud/AceMusicMCP
  commit: 008270d2db948f979ad9424ec0a6fa4a1832eb23
run:
  command:
    - mcp-acemusic
    - --transport
    - stdio
config:
  description: Use an Ace Data Cloud application key with ACE Music access. Generating music or lyrics and importing reference audio may incur charges.
  secrets:
    - name: ace-music.api_key
      description: Create an [Ace Data Cloud application key](https://platform.acedata.cloud/console/applications?utm_source=docker-mcp&utm_medium=referral&utm_campaign=evergreen) with ACE Music access.
      env: ACEDATACLOUD_API_TOKEN
      example: YOUR_ACEDATACLOUD_API_TOKEN
