name: leash
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - privacy
    - productivity
    - remote
about:
  title: Leash
  description: Free protected access to connected personal accounts with configurable checks, activity history and undo for supported reversible actions.
  icon: https://raw.githubusercontent.com/open-leash/leash-plugin/main/assets/icon-small.png
remote:
  transport_type: streamable-http
  url: https://secure.openleash.com/mcp
oauth:
  - provider: leash
    secret: leash.personal_access_token
    env: LEASH_PERSONAL_ACCESS_TOKEN
