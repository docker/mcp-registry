name: scaledthought
type: remote
meta:
  category: ai
  tags:
    - ai
    - llm
    - inference
    - remote
about:
  title: ScaledThought
  description: Manage a ScaledThought account (OpenAI-compatible API for open-weight models) from an agent - API keys, budgets per key, usage, prepaid top-ups, webhooks, model and docs search.
  icon: https://raw.githubusercontent.com/Scaled-Thought/scaledthought-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://api.us.scaledthought.com/mcp?source=org-docker
  headers:
    Authorization: "Bearer ${SCALEDTHOUGHT_API_KEY}"
config:
  secrets:
    - name: scaledthought.api_key
      env: SCALEDTHOUGHT_API_KEY
      example: <YOUR_API_KEY>
