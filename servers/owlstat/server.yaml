name: owlstat
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - social-media
    - instagram
    - tiktok
    - marketing
    - remote
about:
  title: OwlStat
  description: Instagram and TikTok analytics for agencies that manage many accounts, with reach, views, saves, shares, competitors and client reports
  icon: https://www.google.com/s2/favicons?domain=owlstat.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.owlstat.io/mcp
oauth:
  - provider: owlstat
    secret: owlstat.personal_access_token
    env: OWLSTAT_PERSONAL_ACCESS_TOKEN
