name: turbo-notify
type: remote
meta:
  category: communication
  tags:
    - communication
    - whatsapp
    - messaging
    - remote
about:
  title: Turbo Notify
  description: Send, receive, edit and react to WhatsApp messages from your own number, with contacts, groups and quotas. Needs a Turbo Notify API key.
  icon: https://docs.turbonotify.com/brand/icon-tile-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.turbonotify.com
  headers:
    Authorization: "Bearer ${TURBO_NOTIFY_API_KEY}"
config:
  secrets:
    - name: turbo-notify.api_key
      env: TURBO_NOTIFY_API_KEY
      example: <YOUR_API_KEY>
