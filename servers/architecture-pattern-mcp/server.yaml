name: architecture-pattern-mcp
image: mcp/architecture-pattern-mcp
type: server
meta:
    category: ai
    tags:
        - ai
about:
    title: Architecture Pattern MCP server
    description: An MCP (Model Context Protocol) server that provides architecture design expertise to AI coding agents. Given a requirements string and a domain, it analyses the problem, selects matching architecture patterns (from 36 built-in patterns), generates a concrete architecture design with components, relationships, API contracts, data models, and event contracts, and evaluates it against quality attributes (maintainability, scalability, reliability, security, performance).
    icon: https://avatars.githubusercontent.com/u/914496?v=4
source:
    project: https://github.com/olk/architecture-pattern-mcp
    commit: d9689e26ee2fa87492fc3628392c5693cfa04adb
    dockerfile: docker/Dockerfile
config:
    description: Configure the connection to Architecture Pattern MCP server
    env:
        - name: GENERATOR_API_KEY
          example: sk-proj-mOzVq...
          value: '{{architecture-pattern-mcp.generator_api_key}}'
        - name: GENERATOR_PROVIDER
          example: openai
          value: '{{architecture-pattern-mcp.generator_provider}}'
        - name: GENERATOR_BASE_URL
          example: https://api.openai.com/v1
          value: '{{architecture-pattern-mcp.generator_base_url}}'
        - name: GENERATOR_MODEL
          example: gpt-4o-mini
          value: '{{architecture-pattern-mcp.generator_model}}'
        - name: EMBEDDER_BASE_URL
          example: http://127.0.0.1:8080/v1
          value: '{{architecture-pattern-mcp.embedder_base_url}}'
        - name: CONFIG_PATH
          example: ~/.config/architecture-pattern-mcp/config.json
          value: '{{architecture-pattern-mcp.config_path}}'
    parameters:
        type: object
        properties:
            generatorapikey:
                type: string
            generatorprovider:
                type: string
            generatorbaseurl:
                type: string
            generatormodel:
                type: string
            embedderbaseurl:
                type: string
            configpath:
                type: string
