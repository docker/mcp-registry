name: architecture-pattern-mcp
image: mcp/architecture-pattern-mcp
type: server
meta:
  category: ai
  tags:
    - architecture-patterns
    - ai-agents
about:
  title: Architecture Pattern
  description: Turn requirements into a concrete software architecture - match them against 40 built-in architecture patterns, generate the full design (components, relationships, API contracts, data models, event contracts) and evaluate it against quality attributes.
  icon: https://avatars.githubusercontent.com/u/914496?v=4
source:
  project: https://github.com/olk/architecture-pattern-mcp
  commit: d5daad4f79435b0aa334a03c27ee249db66b63f7
run:
  command:
    - --transport
    - stdio
  env:
    PATTERN_DIRECTORY: /app/pattern
    EMBEDDER_API_KEY: not-needed
config:
  description: Configure the design generator LLM plus the TEI embedder and reranker endpoints that serve the pattern catalog.
  secrets:
    - name: architecture-pattern-mcp.generator_api_key
      env: GENERATOR_API_KEY
      example: <GENERATOR_API_KEY>
      description: API key for the design-generation LLM (LiteLLM provider).
      required: true
  env:
    - name: GENERATOR_PROVIDER
      example: openai
      value: "{{architecture-pattern-mcp.generator_provider}}"
    - name: GENERATOR_MODEL
      example: gpt-4o-mini
      value: "{{architecture-pattern-mcp.generator_model}}"
    - name: GENERATOR_BASE_URL
      example: https://api.openai.com/v1
      value: "{{architecture-pattern-mcp.generator_base_url}}"
    - name: EMBEDDER_BASE_URL
      example: http://host.docker.internal:8080/v1
      value: "{{architecture-pattern-mcp.embedder_base_url}}"
    - name: RERANKER_BASE_URL
      example: http://host.docker.internal:8081
      value: "{{architecture-pattern-mcp.reranker_base_url}}"
  parameters:
    type: object
    properties:
      generator_provider:
        type: string
        description: LiteLLM provider prefix for the design generator LLM.
      generator_model:
        type: string
        description: Model name, combined as <provider>/<model> by LiteLLM.
      generator_base_url:
        type: string
        description: OpenAI-compatible base URL of the generator endpoint.
      embedder_base_url:
        type: string
        description: Base URL of the TEI embedder that serves the pattern index (must be reachable at startup).
      reranker_base_url:
        type: string
        description: Base URL of the TEI cross-encoder reranker.
