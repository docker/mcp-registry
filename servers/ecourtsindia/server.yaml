name: ecourtsindia
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - legal
    - india
    - court-records
    - case-law
    - statutes
    - remote
about:
  title: eCourtsIndia
  description: "Search 27.6 crore Indian court cases from the Supreme Court, High Courts, district courts and tribunals; read orders with AI summaries, check cause lists and look up any Indian statute section"
  icon: https://raw.githubusercontent.com/rchtjn2-gif/ecourtsindia-mcp-server/main/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.ecourtsindia.com/mcp
oauth:
  - provider: ecourtsindia
    secret: ecourtsindia.personal_access_token
    env: ECOURTSINDIA_PERSONAL_ACCESS_TOKEN
