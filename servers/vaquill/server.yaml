name: vaquill
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - legal
    - law
    - statutes
    - regulations
    - remote
about:
  title: Vaquill AI Primary Law
  description: Search, read and cite US statutes, regulations, court rules and constitutions from official government sources, and verify that citations are real
