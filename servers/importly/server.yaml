name: importly
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - audio
    - transcription
    - remote
about:
  title: Importly
  description: Turn any video or audio link into downloadable files, transcripts, and structured metadata - for apps and AI agents
  icon: https://www.google.com/s2/favicons?domain=importly.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.importly.io/mcp
oauth:
  - provider: importly
    secret: importly.personal_access_token
    env: IMPORTLY_PERSONAL_ACCESS_TOKEN
