name: kissmypost
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - reddit
    - analytics
    - marketing
    - research
    - remote
about:
  title: KissMyPost
  description: Reddit audience data for your AI assistant. Ask about any subreddit or brand and get answers from KissMyPost data instead of guesses - subreddit size and growth, best time to post, similar subreddits and shared audiences, who the regulars are, and how often Reddit mentions a brand or a phrase. All tools are read-only.
  icon: https://www.google.com/s2/favicons?domain=kissmypost.com&sz=64
remote:
  transport_type: streamable-http
  url: https://kissmypost.com/api/mcp
  headers:
    Authorization: "Bearer ${KISSMYPOST_API_KEY}"
config:
  description: Get a free KissMyPost API key (starts with kmp_) at https://kissmypost.com/mcp
  secrets:
    - name: kissmypost.api_key
      env: KISSMYPOST_API_KEY
      example: kmp_YOUR_API_KEY
