name: kissmypost
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - reddit
    - subreddits
    - social-media
    - marketing
    - audience-research
    - reddit-analytics
    - research
    - analytics
    - remote
about:
  title: "KissMyPost: Reddit Audience Research"
  description: "Reddit analytics and audience research for AI assistants: find subreddits for a topic, see who is in them, the best time to post, posting rules and Reddit brand mentions. KissMyPost works as a subreddit finder and Reddit marketing tool: subreddit growth and audience stats, similar subreddits, trending topics, Reddit post and mention search, and threads worth a reply. 17 read-only tools. Free API key at kissmypost.com/mcp. Not affiliated with Reddit, Inc."
  icon: https://raw.githubusercontent.com/krutytskyi/kissmypost-mcp/main/assets/logo-512.png
remote:
  transport_type: streamable-http
  url: https://kissmypost.com/api/mcp?src=docker
  headers:
    Authorization: "Bearer ${KISSMYPOST_API_KEY}"
source:
  project: https://github.com/krutytskyi/kissmypost-mcp
config:
  description: "Get a free KissMyPost API key (starts with kmp_) at https://kissmypost.com/mcp?utm_source=docker&utm_medium=directory"
  secrets:
    - name: kissmypost.api_key
      env: KISSMYPOST_API_KEY
      example: kmp_YOUR_API_KEY
