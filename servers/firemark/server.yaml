about:
  title: Firemark
  description: Track how often ChatGPT, Perplexity, Gemini and Google AI name your brand. Read rank, competitor gaps, cited sources and ChatGPT fan-out queries, and set up a brand's prompt set by interview.
  icon: https://tryfiremark.com/brand/firemark-logo-plate.svg
remote:
  transport_type: streamable-http
  url: https://app.tryfiremark.com/mcp
oauth:
  - provider: firemark
    secret: firemark.personal_access_token
    env: FIREMARK_PERSONAL_ACCESS_TOKEN
