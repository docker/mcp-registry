name: fattly
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - image-generation
    - video-generation
    - text-to-speech
    - remote
about:
  title: Fattly
  description: Generate AI images, video, voiceovers and music through 50+ models (Veo 3.1, Kling 3, Seedance, Nano Banana, GPT Image, ElevenLabs)
  icon: https://raw.githubusercontent.com/industriesfatty-spec/fattly-mcp/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://fattly.app/api/mcp
oauth:
  - provider: fattly
    secret: fattly.personal_access_token
    env: FATTLY_PERSONAL_ACCESS_TOKEN
