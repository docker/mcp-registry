name: reqbeat-remote
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - sales
    - gtm
    - hiring-signals
    - jobs
    - remote
about:
  title: Reqbeat
  description: Hiring signals for GTM agents — find companies hiring for a role and geo, qualify them, and watch them for new reqs pushed to a webhook.
  icon: https://reqbeat.com/assets/mcp/logo-128.png
remote:
  transport_type: streamable-http
  url: https://mcp.reqbeat.com/mcp
  headers:
    X-API-Key: "${REQBEAT_REMOTE_API_KEY}"
config:
  secrets:
    - name: reqbeat-remote.api_key
      env: REQBEAT_REMOTE_API_KEY
      example: <YOUR_API_KEY>
