name: aifa-memory
type: remote
meta:
  category: ai
  tags:
    - ai
    - memory
    - security
    - remote
about:
  title: AIfa Memory
  description: Hosted memory for AI agents, one memory across every client. Search, save and export your verbatim memory as Markdown. API keys, passwords and wallet keys are masked before storage with the same rules as the open-source PADAM NOCTURNE.
  icon: https://www.google.com/s2/favicons?domain=aifa.works&sz=64
remote:
  transport_type: streamable-http
  url: https://aifa.works/api/mcp
  headers:
    Authorization: "Bearer ${AIFA_MCP_KEY}"
config:
  secrets:
    - name: aifa-memory.api_key
      env: AIFA_MCP_KEY
      example: <YOUR_API_KEY>
