name: socialdatax-sensitive-check
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - research
    - remote
about:
  title: SocialDataX Sensitive Text Check
  description: Check text for sensitive terms and moderation risks, and query account points balance. Requires a SocialDataX API Key and sufficient credits for business tool calls.
  icon: https://avatars.githubusercontent.com/DevinChen2014?s=128
remote:
  transport_type: streamable-http
  url: https://mcp.socialdatax.com/sensitive-check/mcp
  headers:
    Authorization: "Bearer ${SOCIALDATAX_API_KEY}"
config:
  description: Get your SocialDataX API Key at https://socialdatax.com/ai?from=docker
  secrets:
    - name: socialdatax-sensitive-check.api_key
      env: SOCIALDATAX_API_KEY
      example: <SOCIALDATAX_API_KEY>
      description: Your SocialDataX API Key. Obtain it at https://socialdatax.com/ai?from=docker
      required: true
