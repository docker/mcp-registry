name: snapvisor
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - testing
    - visual-regression
    - ci
    - remote
about:
  title: SnapVisor
  description: Review visual regression builds, approve or reject screenshot changes, and manage SnapVisor projects.
  icon: https://www.google.com/s2/favicons?domain=snapvisor.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.snapvisor.io/
oauth:
  - provider: snapvisor
    secret: snapvisor.personal_access_token
    env: SNAPVISOR_PERSONAL_ACCESS_TOKEN
