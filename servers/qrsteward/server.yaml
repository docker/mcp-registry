name: qrsteward
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - qr-code
    - marketing
    - remote
about:
  title: QRSteward
  description: Create and manage printed dynamic QR codes, one at a time or up to 200 at once, change where a printed code points, replace the PDF behind a code, group codes by campaign and read scan reports
  icon: https://qrsteward.com/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.qrsteward.com/mcp
oauth:
  - provider: qrsteward
    secret: qrsteward.personal_access_token
    env: QRSTEWARD_PERSONAL_ACCESS_TOKEN
