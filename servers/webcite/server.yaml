name: webcite
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - document-parsing
    - ocr
    - fact-checking
    - citations
    - remote
about:
  title: Webcite
  description: Parse documents to Markdown with OCR, verify claims against sources with verdicts, and bind citations to the passages they quote
  icon: https://www.google.com/s2/favicons?domain=webcite.co&sz=64
remote:
  transport_type: streamable-http
  url: https://api.webcite.co/mcp
oauth:
  - provider: webcite
    secret: webcite.personal_access_token
    env: WEBCITE_PERSONAL_ACCESS_TOKEN
