name: arroway
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - memory
    - knowledge-management
    - collaboration
    - remote
about:
  title: Arroway
  description: Shared memory for a team and its AIs. Each AI reads what was decided before it acts and records what it did; a person approves what is saved.
  icon: https://www.google.com/s2/favicons?domain=arroway.app&sz=64
remote:
  transport_type: streamable-http
  url: https://www.arroway.app/api/mcp
oauth:
  - provider: arroway
    secret: arroway.personal_access_token
    env: ARROWAY_PERSONAL_ACCESS_TOKEN
