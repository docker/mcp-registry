name: mcpapi
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - api
    - openapi
    - gateway
    - remote
about:
  title: MCPAPI
  description: One MCP URL for every API and MCP server you use, your own APIs included. Your agent gets three tools (search, details, execute), about 400 tokens however many APIs sit behind them.
  icon: https://www.google.com/s2/favicons?domain=getmcpapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcpapi.one/mcp
oauth:
  - provider: mcpapi
    secret: mcpapi.personal_access_token
    env: MCPAPI_PERSONAL_ACCESS_TOKEN
