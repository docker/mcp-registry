name: portos
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - smart-home
    - iot
    - remote
about:
  title: Port OS Smart Home
  description: Control your Philips lights, Sonos speakers, Roborock vacuums and more with Port OS cloud
  icon: https://portoperatingsystem.com/favicon.svg
remote:
