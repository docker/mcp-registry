name: nukebg
type: remote
meta:
  category: media
  tags:
    - image-processing
    - background-removal
    - ecommerce
    - remote
about:
  title: NukeBG
  description: Remove image backgrounds, remove objects and upscale images. Transparent PNG, pure white and Amazon, Shopify, Etsy and eBay sizes.
  icon: https://nukebg.com/brand/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.nukebg.com/mcp
  headers:
    X-Api-Key: "${NUKEBG_API_KEY}"
config:
  secrets:
    - name: nukebg.api_key
      env: NUKEBG_API_KEY
      example: <YOUR_API_KEY>
