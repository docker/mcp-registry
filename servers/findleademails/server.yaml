name: findleademails
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - sales
    - lead-generation
    - email-verification
    - remote
about:
  title: FindLeadEmails
  description: Find and verify B2B work emails (single and bulk) from your AI agent. Pay per verified email.
  icon: https://www.findleademails.com/icon.svg
remote:
  transport_type: streamable-http
  url: https://www.findleademails.com/api/mcp
  headers:
    Authorization: "Bearer ${FINDLEADEMAILS_API_KEY}"
config:
  description: Configure your FindLeadEmails API key
  secrets:
    - name: findleademails.api_key
      env: FINDLEADEMAILS_API_KEY
      example: <YOUR_API_KEY>
