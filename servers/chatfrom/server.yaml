name: chatfrom
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - chatbot
    - customer-support
    - knowledge-base
    - remote
about:
  title: ChatFrom
  description: Build AI chatbots that answer from your own documents and website, try them, put them live on your site or in chat apps, and read their conversations
  icon: https://chatfrom.io/icon.png
remote:
  transport_type: streamable-http
  url: https://chatfrom.io/api/agent/mcp
oauth:
  - provider: chatfrom
    secret: chatfrom.personal_access_token
    env: CHATFROM_PERSONAL_ACCESS_TOKEN
