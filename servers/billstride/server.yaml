name: billstride
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - invoicing
    - billing
    - remote
about:
  title: Billstride
  description: Create, send and track invoices from a conversation, chase overdue payments, see revenue, and export e-invoices (ZUGFeRD, XRechnung) and DATEV
  icon: https://billstride.com/avatar.png
remote:
  transport_type: streamable-http
  url: https://billstride.com/api/mcp
oauth:
  - provider: billstride
    secret: billstride.personal_access_token
    env: BILLSTRIDE_PERSONAL_ACCESS_TOKEN
