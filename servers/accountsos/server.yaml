name: accountsos
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - accounting
    - vat
    - remote
about:
  title: AccountsOS
  description: Query your live AccountsOS books (balances, transactions, VAT, deadlines, invoices, documents) from any MCP client
  icon: https://raw.githubusercontent.com/thriveventurelabs/accountsos-agent-plugin/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://accounts-os.com/api/mcp/plugin
oauth:
  - provider: accountsos
    secret: accountsos.personal_access_token
    env: ACCOUNTSOS_PERSONAL_ACCESS_TOKEN
