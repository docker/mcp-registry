name: acesapi-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - tennis
    - atp
    - sports-data
    - remote
about:
  title: AcesAPI
  description: "ATP and WTA tennis since 2007: sets, draws, rankings, head to head, surface Elo, sportsbook lines."
  icon: https://www.google.com/s2/favicons?domain=acesapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.acesapi.com/mcp
oauth:
  - provider: acesapi-remote
    secret: acesapi-remote.personal_access_token
    env: ACESAPI_REMOTE_PERSONAL_ACCESS_TOKEN
