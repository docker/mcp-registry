name: jobo
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - jobs
    - remote
about:
  title: Jobo Job Search
  description: Search a live index of millions of open jobs from employer career sites and 200+ ATS platforms (read-only).
  icon: https://jobo.world/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://jobs-mcp.jobo.world/mcp
oauth:
  - provider: jobo
    secret: jobo.personal_access_token
    env: JOBO_PERSONAL_ACCESS_TOKEN
