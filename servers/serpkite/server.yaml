name: serpkite
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - web-scraping
    - remote
about:
  title: SerpKite
  description: Google search, news, maps, scholar and public web content for AI agents, with Markdown results.
  icon: https://avatars.githubusercontent.com/u/335740867?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://api.serpkite.com/v1/mcp
  headers:
    Authorization: "Bearer ${SERPKITE_API_KEY}"
config:
  description: Create a SerpKite API key at https://app.serpkite.com. Tool calls use credits; set a dedicated key's monthly credit limit to control spending.
  secrets:
    - name: serpkite.api_key
      env: SERPKITE_API_KEY
      example: <YOUR_SERPKITE_API_KEY>
