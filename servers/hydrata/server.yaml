name: hydrata
type: remote
dynamic:
  tools: true
meta:
  category: data-analytics
  tags:
    - flood-modelling
    - hydrology
    - simulation
    - geospatial
    - remote
about:
  title: Hydrata
  description: Build and run ANUGA flood simulations on Hydrata Cloud
