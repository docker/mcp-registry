name: fanduelapi
type: remote
meta:
  category: data-analytics
  tags:
    - sports
    - odds
    - player-props
    - remote
about:
  title: FanDuel API
  description: "FanDuel Sportsbook prices as data: player props, moneylines, spreads, totals, alternates, futures and soccer markets, normalized per player and stat, with the timestamped history of every line move. Read-only; not affiliated with FanDuel."
  icon: https://fanduelapi.com/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://fanduelapi.com/api/mcp
  headers:
    Authorization: "Bearer ${FANDUEL_API_KEY}"
config:
  secrets:
    - name: fanduelapi.api_key
      env: FANDUEL_API_KEY
      example: <YOUR_API_KEY>
