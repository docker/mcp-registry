name: qveris
type: remote
meta:
  category: tools
  tags:
    - ai
    - tools
    - api
    - automation
    - remote
about:
  title: QVeris
  description: Discover, inspect, probe, call, and audit 10,000+ real-world capabilities for AI agents through one hosted MCP server.
  icon: https://qveris.ai/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.qveris.ai/mcp
  headers:
    Authorization: "Bearer ${QVERIS_API_KEY}"
config:
  description: Configure a QVeris API key from https://qveris.ai/dashboard/api-keys.
  secrets:
    - name: qveris.api_key
      env: QVERIS_API_KEY
      example: <YOUR_API_KEY>
