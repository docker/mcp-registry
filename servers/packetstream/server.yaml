name: packetstream
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - web-scraping
    - remote
about:
  title: PacketStream
  description: Live web search results (web, news, shopping, places, autocomplete, Scholar and AI Mode, with country, language and location targeting) and public web pages as Markdown, fetched through PacketStream's residential network. Two read-only tools. Paid; $0.0025 per successful call from a prepaid balance.
  icon: https://www.google.com/s2/favicons?domain=packetstream.io&sz=64
remote:
  transport_type: streamable-http
  url: https://api.packetstream.io/v1/mcp/oauth
oauth:
  - provider: packetstream
    secret: packetstream.personal_access_token
    env: PACKETSTREAM_PERSONAL_ACCESS_TOKEN
