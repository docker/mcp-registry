name: pixelbolt
image: mcp/pixelbolt
type: server
meta:
  category: games
  tags:
    - pixel-art
    - sprites
    - sprite-sheet
    - sprite-animation
    - texture-atlas
    - game-assets
    - gamedev
    - apng
about:
  title: Pixelbolt
  description: Make pixel art sprites, animations, tilesets, particle effects and fluid simulations (fire, smoke, water) from deterministic JSON recipes, inspect them frame by frame, and export PNG and APNG sprite sheets, atlas JSON, GIFs and video frame sequences. Works offline with no API keys.
  icon: https://raw.githubusercontent.com/skulitom/pixelbolt-plugin/main/.claude-plugin/icon.png
source:
  project: https://github.com/skulitom/Pixelbolt
  commit: d8776d4447ad228aa41727c3d07baf705793ca4b
run:
  volumes:
    - "{{pixelbolt.data_dir}}:/data"
  disableNetwork: true
config:
  description: Pixelbolt writes exports to output/ and saved recipe revisions to output/.revisions/ inside this directory, and reads input files (for example PNGs to import) only from it.
  parameters:
    type: object
    properties:
      data_dir:
        type: string
        default: $HOME/pixelbolt
    required:
      - data_dir
