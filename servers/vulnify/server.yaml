name: vulnify
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - ai
    - authorization
    - remote
about:
  title: Vulnify
  description: Runtime authorization for AI agents. Every agent action gets ALLOW, REVIEW or BLOCK in real time, with an audit trail
  icon: https://www.google.com/s2/favicons?domain=vulnify.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.vulnify.io/mcp
oauth:
  - provider: vulnify
    secret: vulnify.personal_access_token
    env: VULNIFY_PERSONAL_ACCESS_TOKEN
