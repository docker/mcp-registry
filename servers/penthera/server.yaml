name: penthera
image: mcp/penthera
type: server
meta:
  category: security
  tags:
    - security
    - secrets
    - supply-chain
    - devsecops
about:
  title: Penthera
  description: Offline, rule-based security checks for your repo, dependencies, AI agent config and local app.
  icon: https://raw.githubusercontent.com/danoszz/penthera/58ae9d713199c432f7547015855caca3fa096287/assets/penthera-logo-400.png
source:
  project: https://github.com/danoszz/penthera
  commit: 58ae9d713199c432f7547015855caca3fa096287
run:
  command:
    - mcp
    - --root
    - /src
  volumes:
    - "{{penthera.path|volume-target}}:/src:ro"
  disableNetwork: true
config:
  description: The project folder Penthera may read. It reads only inside it and never writes.
  parameters:
    type: object
    properties:
      path:
        type: string
        default: /Users/local-test/my-app
    required:
      - path
