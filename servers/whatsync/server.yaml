name: whatsync
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - whatsapp
    - messaging
    - communication
    - remote
about:
  title: WhatSync
  description: >-
    WhatsApp for AI agents. Search your chats, see who is waiting for a reply,
    and send messages from a personal WhatsApp number or the official
    WhatsApp Business API. OAuth sign-in; you choose which chats are shared.
  icon: https://whatsync.app/logos/whatsync-logo.png
remote:
  transport_type: streamable-http
  url: https://whatsync.app/api/mcp
oauth:
  - provider: whatsync
    secret: whatsync.personal_access_token
    env: WHATSYNC_PERSONAL_ACCESS_TOKEN
