name: magic-hour
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - video
    - image
    - audio
    - media-generation
    - remote
about:
  title: Magic Hour
  description: Generate and edit videos, images, and audio with Magic Hour's hosted AI media tools.
  icon: https://www.google.com/s2/favicons?domain=magichour.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.magichour.ai/
  headers:
    Authorization: "Bearer ${MAGIC_HOUR_API_KEY}"
config:
  secrets:
    - name: magic-hour.api_key
      env: MAGIC_HOUR_API_KEY
      example: <YOUR_API_KEY>
Docs: https://magichour.ai/mcp
