name: ihateposting
type: remote
meta:
  category: communication
  tags:
    - social-media
    - scheduling
    - marketing
    - remote
about:
  title: IHatePosting
  description: Draft, check and schedule posts to your connected social accounts.
  icon: https://ihateposting.com/icon.png
remote:
  transport_type: streamable-http
  url: https://ihateposting.com/api/mcp
  headers:
    Authorization: "Bearer ${IHATEPOSTING_API_KEY}"
config:
  secrets:
    - name: ihateposting.api_key
      env: IHATEPOSTING_API_KEY
      example: <YOUR_API_KEY>
