name: spica-post
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - social-media
    - scheduling
    - remote
about:
  title: Spica Post
  description: Social media scheduler for small businesses and creators. Your AI assistant drafts a post per network, checks it against each network's rules, and schedules or publishes it once you approve.
  icon: https://raw.githubusercontent.com/unbowedgod/spica-post-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://app.spicapost.com/mcp
oauth:
  - provider: spica-post
    secret: spica-post.personal_access_token
    env: SPICA_POST_PERSONAL_ACCESS_TOKEN
