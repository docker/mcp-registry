name: weio-site-check
type: remote
meta:
  category: security
  tags:
    - security
    - web
    - https
    - seo
    - remote
about:
  title: Weio Site Check
  description: Check whether a website loads securely in browsers (privacy warning or 'Not secure', the cause, certificate expiry), read the public business facts on its homepage, and look up businesses in a small dated local scan index. All tools are read-only.
  icon: https://raw.githubusercontent.com/weioai/site-check-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://weio.ai/mcp
  headers:
    X-API-Key: "${WEIO_SITE_CHECK_API_KEY}"
config:
  description: Optionally provide a Weio site check API key (wk_...) for paid usage. The server also works without one, with 10 free calls per day.
  secrets:
    - name: weio-site-check.api_key
      env: WEIO_SITE_CHECK_API_KEY
      example: <YOUR_API_KEY>
      required: false
