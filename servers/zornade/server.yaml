name: zornade
type: remote
meta:
  category: geospatial
  tags:
    - geospatial
    - cadastral
    - real-estate
    - italy
    - remote
about:
  title: Zornade
  description: "Italian cadastral, geospatial and real-estate data for AI agents: geocoding, parcel profiles with risk and solar layers, valuations and administrative lists."
  icon: https://www.google.com/s2/favicons?domain=zornade.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.zornade.com/mcp
  headers:
    x-api-key: "${ZORNADE_API_KEY}"
config:
  description: Provide a free Zornade API key (create one at https://app.zornade.com/api).
  secrets:
    - name: zornade.api_key
      env: ZORNADE_API_KEY
      example: <YOUR_ZORNADE_API_KEY>
