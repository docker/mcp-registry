name: alerthub
image: mcp/alerthub
type: server
meta:
  category: devops
  tags:
    - alerthub
    - notifications
    - alerts
    - monitoring
    - devops
    - productivity
about:
  title: AlertHub
  description: |
    Send instant multi-channel notifications, schedule reminders, and inspect recent events via AlertHub.
  icon: https://avatars.githubusercontent.com/u/352088514?v=4
source:
  project: https://github.com/alerthubio/mcp-server
  commit: 1e3589cb6424f2ec59199952cb787418bb76fb63
  branch: main
config:
  description: Configure your AlertHub User ID and API Key from https://alerthub.io
  secrets:
    - name: alerthub.api_key
      env: ALERTHUB_API_KEY
      example: <ALERTHUB_API_KEY>
  env:
    - name: ALERTHUB_USER_ID
      example: xxxxxxxxxxxxxxxxxxxx
      value: "{{alerthub.user_id}}"
    - name: ALERTHUB_BASE_URL
      example: https://alerthub.io
      value: "{{alerthub.base_url}}"
  parameters:
    type: object
    properties:
      user_id:
        type: string
        description: Your AlertHub User ID
      base_url:
        type: string
        description: Optional AlertHub API base URL override
        default: https://alerthub.io
    required:
      - user_id
