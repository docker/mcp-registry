name: contextstream
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - memory
    - remote
about:
  title: ContextStream
  description: Persistent project memory for AI coding agents. Decisions, lessons, and prior sessions via hosted MCP.
  icon: https://contextstream.io/logo-hex.png
remote:
  transport_type: streamable-http
  url: https://mcp.contextstream.io/mcp
oauth:
  - provider: contextstream
    secret: contextstream.personal_access_token
    env: CONTEXTSTREAM_PERSONAL_ACCESS_TOKEN
