name: aegis-risk-events
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - risk
    - news
    - geospatial
    - remote
about:
  title: AEGIS Risk Events
  description: Search risk events from the news (protests, strikes, crime, attacks, hazards) by place, radius, category and date, each with source links
  icon: https://raw.githubusercontent.com/inttech-solutions/events-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.int-tech.solutions
oauth:
  - provider: aegis-risk-events
    secret: aegis-risk-events.personal_access_token
    env: AEGIS_RISK_EVENTS_PERSONAL_ACCESS_TOKEN
