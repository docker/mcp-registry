about:
  title: patchbay
  description: Audit any remote Model Context Protocol server for OAuth 2.1 and security gaps. The audit_mcp_server tool returns a letter grade, numeric score and full findings list as structured content. Covers authentication posture, PKCE, client registration, Protected Resource Metadata (RFC 9728), audience validation (RFC 8707 / RFC 9068), loopback redirects (RFC 8252), transport-security headers, tool-manifest drift and prompt-injection patterns in tool descriptions. Zero-auth by default, optional probes behind flags. Never calls any of the target server's tools.
