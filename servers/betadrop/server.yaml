name: betadrop
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - mobile
    - beta-testing
    - ios
    - android
    - remote
about:
  title: BetaDrop
  description: Publish iOS and Android beta builds and share over-the-air install links. Manage standing links, tester devices, feedback, install stats and webhooks.
  icon: https://betadrop.app/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.betadrop.app
oauth:
  - provider: betadrop
    secret: betadrop.personal_access_token
    env: BETADROP_PERSONAL_ACCESS_TOKEN
