name: screenshot-com-ar
type: remote
meta:
  category: web-scraping
  tags:
    - web-scraping
    - screenshots
    - browser
    - markdown
    - remote
about:
  title: Screenshot.com.ar
  description: Screenshots and clean markdown of any public web page, rendered in a real Chrome browser. Tools to read a page as markdown, take a screenshot, or both with a single page load.
  icon: https://www.google.com/s2/favicons?domain=screenshot.com.ar&sz=64
remote:
  transport_type: streamable-http
  url: https://screenshot.com.ar/mcp
  headers:
    Authorization: "Bearer ${SCREENSHOT_COM_AR_API_KEY}"
config:
  secrets:
    - name: screenshot-com-ar.api_key
      env: SCREENSHOT_COM_AR_API_KEY
      example: <YOUR_API_KEY>
