name: keyline
image: ghcr.io/keyline-dev/keyline-mcp
type: server
meta:
  category: productivity
  tags:
    - design
    - images
    - video
    - productivity
about:
  title: Keyline
  description: Design engine for AI agents. The agent writes a small JSON scene; keyline renders it to PNG, JPEG, WebP, PDF, GIF or MP4 at every size, with no browser and 2× fewer tokens than an agent driving headless Chrome.
  icon: https://keyline.dev/apple-touch-icon.png
source:
  project: https://github.com/keyline-dev/keyline
  commit: 9e4a66c4c9d3e387b3148ae629d7c9785bb7f2a1
run:
  volumes:
    - "{{keyline.data}}:/data"
config:
  description: The folder where keyline keeps scenes and writes the rendered files
  parameters:
    type: object
    properties:
      data:
        type: string
        default: /Users/local-test/keyline
    required:
      - data
