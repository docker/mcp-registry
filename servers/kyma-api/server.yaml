name: kyma-api
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - developer-tools
    - llm
    - gateway
    - remote
about:
  title: Kyma API
  description: "Kyma API for your agent: live model catalog with prices and measured uptime, rankings, your credits and spend, and spend-capped chat (one OAuth sign-in, dedicated key per connection, $10 per 30 days by default)."
  icon: https://raw.githubusercontent.com/kyma-api/kyma-mcp-plugin/main/assets/icon.svg
remote:
  transport_type: streamable-http
  url: https://mcp.kymaapi.com/mcp
oauth:
  - provider: kyma-api
    secret: kyma-api.personal_access_token
    env: KYMA_API_PERSONAL_ACCESS_TOKEN
