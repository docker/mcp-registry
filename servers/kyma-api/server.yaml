name: kyma-api
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - developer-tools
    - llm
    - gateway
    - remote
about:
  title: Kyma API
  description: "Kyma API for your agent: browse the live open-model catalog with real prices and measured uptime, check credits and spend, get a model recommendation for your coding agent, and send test completions. One MCP URL, OAuth sign-in, spend-capped keys."
  icon: https://raw.githubusercontent.com/kyma-api/kyma-mcp-plugin/main/assets/icon.svg
remote:
  transport_type: streamable-http
  url: https://mcp.kymaapi.com/mcp
oauth:
  - provider: kyma-api
    secret: kyma-api.personal_access_token
    env: KYMA_API_PERSONAL_ACCESS_TOKEN
