name: fastclip
type: remote
meta:
  category: productivity
  tags:
    - video
    - podcast
    - clips
    - captions
    - remote
about:
  title: FastClip
  description: Import a video or podcast, find the moment in the transcript and cut it into a captioned vertical or original-frame MP4 clip
  icon: https://fastclips.app/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.fastclip.it/mcp
  headers:
    Authorization: "Bearer ${FASTCLIP_TOKEN}"
config:
  secrets:
    - name: fastclip.token
      env: FASTCLIP_TOKEN
      example: <YOUR_FASTCLIP_TOKEN>
