name: insertchat
type: remote
dynamic:
  tools: true
meta:
  category: crm
  tags:
    - crm
    - customer-support
    - ai-receptionist
    - chatbot
    - remote
about:
  title: InsertChat
  description: AI receptionist and AI chatbot. Triage calls and chats that need you, draft replies, look up leads, review reports, and train your assistant on web pages
  icon: https://raw.githubusercontent.com/MindCraftersGroup/claude-plugin/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://api.insertchat.com/v2/mcp
oauth:
  - provider: insertchat
    secret: insertchat.personal_access_token
    env: INSERTCHAT_PERSONAL_ACCESS_TOKEN
