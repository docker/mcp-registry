name: weir
type: remote
dynamic:
  tools: true
meta:
  category: data
  tags:
    - data
    - search
    - social-media
    - remote
about:
  title: Weir
  description: Read public X (Twitter) and Reddit data - search, posts, replies, threads, profiles, followers and comments - with no X or Reddit account. Paid per result, 5,000 free credits a month.
  icon: https://www.google.com/s2/favicons?domain=weirapp.io&sz=64
remote:
  transport_type: streamable-http
  url: https://api.weirapp.io/mcp
oauth:
  - provider: weir
    secret: weir.personal_access_token
    env: WEIR_PERSONAL_ACCESS_TOKEN
