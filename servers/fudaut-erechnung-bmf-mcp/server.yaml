name: fudaut-erechnung-bmf-mcp
image: mcp/fudaut-erechnung-bmf-mcp
type: server
meta:
  category: finance
  tags:
    - finance
    - e-invoicing
    - xrechnung
    - zugferd
    - gaeb
about:
  title: Fudaut E-Rechnung and GAEB Validator
  description: Read-only validator and parser for German B2B e-invoicing (BMF 2026-10-15, EN 16931, XRechnung, ZUGFeRD PDF/A-3 XMP), Shopware 6 credit notes, and GAEB XML.
  icon: https://www.google.com/s2/favicons?domain=fudaut.com&sz=64
source:
  project: https://github.com/iisakovbusiness-wq/fudaut-erechnung-bmf-mcp
  commit: 2fd7b19817f7f659324e13cf3ae87e349a65816b
run:
  volumes:
    - "{{fudaut-erechnung-bmf-mcp.path|volume-target}}:/data:ro"
  disableNetwork: true
config:
  description: The MCP server is allowed to read invoice and GAEB files from this directory
  env:
    - name: ERECHNUNG_ORDNER
      example: /app/fixtures
      value: /data
  parameters:
    type: object
    properties:
      path:
        type: string
        default: /Users/demo/invoices
    required:
      - path
