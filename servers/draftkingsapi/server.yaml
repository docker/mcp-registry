name: draftkingsapi
type: remote
meta:
  category: data-analytics
  tags:
    - sports
    - odds
    - dfs
    - remote
about:
  title: DraftKings API
  description: "Independent DraftKings data for agents: current Pick6 lines and multipliers with recorded line moves, DFS salaries, contests and slates, sportsbook moneylines, spreads and totals, and box scores. Read-only; not affiliated with DraftKings."
  icon: https://draftkingsapi.com/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://draftkingsapi.com/api/mcp
  headers:
    Authorization: "Bearer ${DRAFTKINGS_API_KEY}"
config:
  secrets:
    - name: draftkingsapi.api_key
      env: DRAFTKINGS_API_KEY
      example: <YOUR_API_KEY>
