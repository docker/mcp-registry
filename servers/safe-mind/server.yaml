about:
  title: Safe Mind
  description: Run the legally required psychological risk assessment (Gefährdungsbeurteilung psychischer Belastung, GBU Psyche) for German companies. Onboard an account, set up departments and locations, create survey drafts and read anonymity-protected aggregated results - segmented analytics never return groups below the minimum group size.
  icon: https://www.google.com/s2/favicons?domain=safe-mind.de&sz=64
source:
  project: https://github.com/lewo-media/safe-mind-tools
  commit: 89023247a9d68f9d1aff2ac4ac861ca6597574db
config:
  description: Optional Safe Mind API key - the safe_mind_register and safe_mind_get_api_key tools can onboard a new account without it
  secrets:
    - name: safe-mind.api_key
      env: SAFE_MIND_API_KEY
      example: sm_live_0123456789abcdef
