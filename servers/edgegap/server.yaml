name: edgegap
type: remote
meta:
  category: games
  tags:
    - games
    - game-server
    - multiplayer
    - matchmaking
    - devops
    - remote
about:
  title: Edgegap
  description: Host multiplayer game servers on Edgegap from your coding agent. Build and validate the server container, register app versions, deploy dedicated servers near players, read logs and metrics, generate matchmaker configs, manage relays, and load tested agent skills for Unity, Unreal, Godot, Colyseus, Nakama, Three.js and more. Dry runs and guardrails on every write.
  icon: https://raw.githubusercontent.com/edgegap/llm-mcp-server/main/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.edgegap.dev/mcp
  headers:
    Authorization: "token ${EDGEGAP_API_TOKEN}"
config:
  secrets:
    - name: edgegap.api_token
      env: EDGEGAP_API_TOKEN
      example: <YOUR_EDGEGAP_API_TOKEN>
