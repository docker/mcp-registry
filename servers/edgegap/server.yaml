name: edgegap
type: remote
dynamic:
  tools: true
meta:
  category: games
  tags:
    - games
    - game-server
    - multiplayer
    - matchmaking
    - devops
    - remote
about:
  title: Edgegap
  description: Host multiplayer game servers on Edgegap from your coding agent. Build and validate the server container, register app versions, deploy dedicated servers near players, read logs and metrics, generate matchmaker configs, and load tested agent skills for Unity, Unreal, Godot, Colyseus, Nakama, Three.js and more. Dry runs and guardrails on every write.
  icon: https://raw.githubusercontent.com/edgegap/llm-mcp-server/main/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.edgegap.com/mcp
oauth:
  - provider: edgegap
    secret: edgegap.personal_access_token
    env: EDGEGAP_PERSONAL_ACCESS_TOKEN
