name: nuasense
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - agriculture
    - weather
    - market-data
    - africa
    - remote
about:
  title: NuaSense
  description: East African farm and market data. Your own weather stations and soil probes with spray windows, disease risk and irrigation need, plus county prices, satellite demand, news signals and food security for Kenya, Tanzania, Uganda and Rwanda.
  icon: https://raw.githubusercontent.com/nuasense/homeassistant-nuasense/main/brand/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.nuasense.com/mcp
oauth:
  - provider: nuasense
    secret: nuasense.personal_access_token
    env: NUASENSE_PERSONAL_ACCESS_TOKEN
