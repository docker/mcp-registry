name: qrx
type: remote
meta:
  category: media
  tags:
    - media
    - qr-code
    - image-generation
    - remote
about:
  title: QRX
  description: Generate artistic AI QR codes that are checked to scan, and change where existing codes point.
  icon: https://qrx.codes/images/brand/qrx-mark.svg
remote:
  transport_type: streamable-http
  url: https://qrx.codes/mcp
  headers:
    Authorization: "Bearer ${QRX_API_KEY}"
config:
  secrets:
    - name: qrx.api_key
      env: QRX_API_KEY
      example: <YOUR_API_KEY>
