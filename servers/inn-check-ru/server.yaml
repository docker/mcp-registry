about:
  title: INN Check RU (Russian counterparty due diligence)
  description: Checks a Russian company or sole trader by INN (taxpayer ID) before a deal and returns a green / yellow / red risk verdict over open government registries — the company register (EGRUL), tax risk flags, the SME register, GIR BO financial statements, bankruptcies and RFM / OFAC / EU sanctions. A source that could not be reached is reported as "not checked", never as clean, so a green light is never produced from missing data. Financial red flags and business-splitting signs are computed by code, not by the model, and every figure traces back to a line of the filing. Works without any key; an optional Checko key adds the affiliates graph.
  icon: https://avatars.githubusercontent.com/ilyautov
source:
  project: https://github.com/ilyautov/inn-check-ru
  branch: main
  commit: 0e9709d811b1b5dcd91c549b190becf5c56df1ad
config:
  description: Optional. The server works without any configuration; a Checko key adds the affiliates graph, a proxy routes requests through an exit in Russia (several registries answer only Russian IP addresses)
  secrets:
    - name: inn-check-ru.checko_api_key
      env: CHECKO_API_KEY
      example: your_checko_api_key
    - name: inn-check-ru.proxy
      env: INN_CHECK_PROXY
      example: http://user:password@proxy.example:3128
