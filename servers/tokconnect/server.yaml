name: tokconnect
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - tiktok
    - social-media
    - marketing
    - analytics
    - remote
about:
  title: TokConnect (TikTok Research)
  description: "Research TikTok with real data: search demand and trends from Creator Search Insights, content gaps, videos, creators, hashtags, comments and captions, for marketers, agencies and TikTok Shop sellers"
  icon: https://www.google.com/s2/favicons?domain=tokconnect.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.tokconnect.com/mcp
oauth:
  - provider: tokconnect
    secret: tokconnect.personal_access_token
    env: TOKCONNECT_PERSONAL_ACCESS_TOKEN
