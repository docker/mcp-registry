name: factdock-remote
type: remote
meta:
  category: search
  tags:
    - search
    - research
    - multilingual
    - remote
about:
  title: Factdock
  description: Multilingual search engine for primary sources. Searches each country's official sites, academic papers, patents, company registries and medicine databases in their own language and returns the original sources with URLs and dates.
  icon: https://www.google.com/s2/favicons?domain=fact-dock.com&sz=64
remote:
  transport_type: streamable-http
  url: https://fact-dock.com/mcp
  headers:
    Authorization: "Bearer ${FACTDOCK_REMOTE_API_KEY}"
config:
  secrets:
    - name: factdock-remote.api_key
      env: FACTDOCK_REMOTE_API_KEY
      example: <YOUR_FACTDOCK_PERSONAL_API_KEY>
