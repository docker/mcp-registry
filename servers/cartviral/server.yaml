name: cartviral
type: remote
dynamic:
  tools: true
meta:
  category: commerce
  tags:
    - ecommerce
    - video
    - marketing
    - shopify
    - remote
about:
  title: CartViral
  description: Turn any product link into TikTok, Reels and Shorts clips made from the real product photos, track renders and downloads, and join creator marketplace offers that pay per sale
