name: askone
type: remote
meta:
  category: productivity
  tags:
    - productivity
    - events
    - polls
    - remote
about:
  title: AskOne
  description: Read your live Q&A rooms, audience questions and poll results, and draft a FAQ from them.
  icon: https://raw.githubusercontent.com/phuryn/askone/main/icon.png
remote:
  transport_type: streamable-http
  url: https://askone.org/api/mcp
  headers:
    Authorization: "Bearer ${ASKONE_API_TOKEN}"
config:
  secrets:
    - name: askone.api_token
      env: ASKONE_API_TOKEN
      example: <YOUR_API_TOKEN>
