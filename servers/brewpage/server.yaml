name: brewpage
image: mcp/brewpage
type: server
meta:
  category: productivity
  tags:
    - productivity
    - hosting
    - publishing
    - html
    - markdown
about:
  title: BrewPage
  description: Publish HTML, Markdown, multi-file sites, JSON, KV and files to free instant hosting at brewpage.app and get a shareable link. No account or API key; each publish returns an owner token to update or delete the resource later.
  icon: https://raw.githubusercontent.com/kochetkov-ma/brewpage-openapi/main/mcp-server/logo-400.png
source:
  project: https://github.com/kochetkov-ma/brewpage-openapi
  branch: main
  commit: 531dfb613837599f4b6ec725ad5c36ade9cc8cdb
  directory: mcp-server
config:
  description: Optional. Point the server at another BrewPage-compatible API; defaults to https://brewpage.app.
  env:
    - name: BREWPAGE_URL
      example: https://brewpage.app
      value: "{{brewpage.brewpage_url}}"
  parameters:
    type: object
    properties:
      brewpage_url:
        type: string
        description: Base URL of the BrewPage API
        default: https://brewpage.app
