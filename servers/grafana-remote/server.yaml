name: grafana-remote
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - observability
    - grafana
    - remote
about:
  title: Grafana Cloud
  description: Query metrics, logs, traces, and profiles, and manage dashboards, alerts, and incidents in your Grafana Cloud stack
  icon: https://raw.githubusercontent.com/grafana/mcp-grafana/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.grafana.com/mcp
oauth:
  - provider: grafana-remote
    secret: grafana-remote.personal_access_token
    env: GRAFANA_REMOTE_PERSONAL_ACCESS_TOKEN
