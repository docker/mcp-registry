name: cronitor
type: remote
meta:
  category: monitoring
  tags:
    - monitoring
    - cron
    - uptime
    - devops
    - remote
about:
  title: Cronitor
  description: Monitor cron jobs, heartbeats, websites, and APIs; manage issues, status pages, and alerts
  icon: https://www.google.com/s2/favicons?domain=cronitor.io&sz=64
remote:
  transport_type: streamable-http
  url: https://cronitor.io/mcp
  headers:
    Authorization: "Bearer ${CRONITOR_API_KEY}"
config:
  secrets:
    - name: cronitor.api_key
      env: CRONITOR_API_KEY
      example: <YOUR_SDK_INTEGRATION_API_KEY>
