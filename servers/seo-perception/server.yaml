name: seo-perception
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - seo
    - search-console
    - remote
about:
  title: SEO Perception
  description: Stored Search Console, crawl, and SEO to-dos. OAuth or a personal token. Optionally mark to-dos done or ignored.
  icon: https://www.google.com/s2/favicons?domain=seoperception.com&sz=64
remote:
  transport_type: streamable-http
  url: https://seoperception.com/mcp
oauth:
  - provider: seo-perception
    secret: seo-perception.personal_access_token
    env: SEO_PERCEPTION_PERSONAL_ACCESS_TOKEN
