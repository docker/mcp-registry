name: tendeck
type: remote
dynamic:
  tools: true
meta:
  category: crm
  tags:
    - crm
    - real-estate
    - productivity
    - remote
about:
  title: Tendeck
  description: CRM for real estate agents that you run from your AI assistant. Work your daily call list, contacts, follow-ups and drafted messages. Sign in with OAuth.
remote:
  transport_type: streamable-http
  url: https://tendeck.ai/mcp
oauth:
  - provider: tendeck
    secret: tendeck.personal_access_token
    env: TENDECK_PERSONAL_ACCESS_TOKEN
