name: screvi
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - reading
    - highlights
    - knowledge-management
    - remote
about:
  title: Screvi
  description: Search and organize your reading library of highlights, saved articles, notes and tags
  icon: https://www.google.com/s2/favicons?domain=screvi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.screvi.com/mcp
oauth:
  - provider: screvi
    secret: screvi.personal_access_token
    env: SCREVI_PERSONAL_ACCESS_TOKEN
