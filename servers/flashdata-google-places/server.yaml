name: flashdata-google-places
image: mcp/flashdata-google-places
type: server
meta:
  category: search
  tags:
    - google
    - google-places
    - research
    - flashdata
about:
  title: Google Places — FlashData
  description: "Search for local businesses and places with addresses, available ratings and review counts. Build location-specific research shortlists. For AI agents. Requires your own FlashData API Key; data calls use paid Credits."
  icon: https://raw.githubusercontent.com/rocosen/flashdata-mcp/main/assets/logo.svg
source:
  project: https://github.com/rocosen/flashdata-mcp
  commit: aa89ee8810fdcae711d818647ecd04b027912f37
  dockerfile: Dockerfile
  buildTarget: google-places
config:
  description: Use your own FlashData API Key with google_places access. Data queries consume your FlashData Credits.
  secrets:
    - name: flashdata-google-places.api_key
      env: FLASHDATA_API_KEY
      example: <YOUR_FLASHDATA_API_KEY>
      description: Create a scoped key at https://flashdata.dev/app/api-keys
      required: true
  env:
    - name: FLASHDATA_REQUEST_TIMEOUT_MS
      value: "65000"
    - name: FLASHDATA_DATA_API_URL
      value: https://data.flashdata.dev
    - name: FLASHDATA_MANAGEMENT_API_URL
      value: https://api.flashdata.dev
