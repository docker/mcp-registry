name: conbridge
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - vulnerability-management
    - devops
    - remote
about:
  title: ConBridge
  description: Known vulnerabilities on the systems you own, fixed from your AI app with your approval
  icon: https://conbridge.app/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.conbridge.app/mcp
oauth:
  - provider: conbridge
    secret: conbridge.personal_access_token
    env: CONBRIDGE_PERSONAL_ACCESS_TOKEN
