name: tintloom
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - image-generation
    - image-editing
    - design
    - remote
about:
  title: Tintloom
  description: Generate and edit images in Claude chats, with a card to select, erase, resize and comment. Independent, not made by Anthropic. 10 free credits, then paid plans.
  icon: https://tintloom.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.tintloom.com/mcp
oauth:
  - provider: tintloom
    secret: tintloom.personal_access_token
    env: TINTLOOM_PERSONAL_ACCESS_TOKEN
