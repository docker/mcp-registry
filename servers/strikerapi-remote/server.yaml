name: strikerapi-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - soccer
    - football
    - sports-data
    - remote
about:
  title: StrikerAPI
  description: "Premier League, MLS and European football: lineups, shot maps, xG, tables and odds. REST and MCP."
  icon: https://www.google.com/s2/favicons?domain=strikerapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.strikerapi.com/mcp
oauth:
  - provider: strikerapi-remote
    secret: strikerapi-remote.personal_access_token
    env: STRIKERAPI_REMOTE_PERSONAL_ACCESS_TOKEN
