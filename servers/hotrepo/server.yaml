name: hotrepo
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - github
    - developer-tools
    - search
    - remote
about:
  title: HotRepo
  description: Discover trending GitHub projects, search project reviews, retrieve historical rankings and monthly reports, and access your saved projects.
  icon: https://hotrepo.ai/favicon.svg
remote:
  transport_type: streamable-http
  url: https://hotrepo.ai/mcp
  headers:
    Authorization: "Bearer ${HOTREPO_API_KEY}"
config:
  description: Create an API key at https://hotrepo.ai/account. Setup and current plan limits are documented at https://hotrepo.ai/mcp-server.
  secrets:
    - name: hotrepo.api_key
      env: HOTREPO_API_KEY
      example: <YOUR_HOTREPO_API_KEY>
      required: true
