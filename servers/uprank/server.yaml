name: uprank
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - content
    - seo
    - writing
    - remote
about:
  title: UpRank
  description: Research, draft, score and publish cited articles for your own site in UpRank, with every claim traced to a source and hard quality gates enforced.
  icon: https://www.google.com/s2/favicons?domain=uprank.devino.ca&sz=64
