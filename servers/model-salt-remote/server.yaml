about:
  title: Model Salt (hosted)
  description: >-
    One tool, model_salt. Before a creative task the model calls it and gets
    back a few choices to settle this time, drawn from randomness outside the
    model (atmospheric and quantum noise), so the same prompt gives different
    answers that still do what was asked. Hosted, no sign-in, no API key.
