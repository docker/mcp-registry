name: model-salt-remote
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - creativity
    - randomness
    - remote
about:
  title: Model Salt (hosted)
  description: >-
    One tool, model_salt. Before a creative task the model calls it and gets
    back a few choices to settle this time, drawn from randomness outside the
    model (atmospheric and quantum noise), so the same prompt gives different
    answers that still do what was asked. Hosted: sign in by email, no API key.
  icon: https://modelsalt.com/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://modelsalt.com/mcp
oauth:
  - provider: model-salt-remote
    secret: model-salt-remote.personal_access_token
    env: MODEL_SALT_PERSONAL_ACCESS_TOKEN
