name: call4me
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - telephony
    - phone-calls
    - remote
about:
  title: Call4me
  description: Let your AI agent place real phone calls for you to book, reschedule, or cancel appointments and ask businesses questions, with live transcripts and the option to join the call
  icon: https://call4.me/favicon.svg
remote:
  transport_type: streamable-http
  url: https://call4.me/mcp
oauth:
  - provider: call4me
    secret: call4me.personal_access_token
    env: CALL4ME_PERSONAL_ACCESS_TOKEN
