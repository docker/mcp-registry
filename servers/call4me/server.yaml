name: call4me
type: remote
meta:
  category: communication
  tags:
    - communication
    - phone
    - voice
    - remote
about:
  title: Call4me
  description: Let your AI agent make real phone calls to businesses. It books, reschedules, cancels, asks questions, waits on hold and navigates phone trees, then reports back with a transcript.
  icon: https://www.google.com/s2/favicons?domain=call4.me&sz=64
remote:
  transport_type: streamable-http
  url: https://call4.me/mcp
  headers:
    Authorization: "Bearer ${CALL4ME_API_KEY}"
config:
  secrets:
    - name: call4me.api_key
      env: CALL4ME_API_KEY
      example: <YOUR_API_KEY>
