name: repo-pulse
image: mcp/repo-pulse
type: server
meta:
  category: devops
  tags:
    - git
    - devops
    - code-review
about:
  title: Repo Pulse
  description: Read-only git insights for local repositories. Review context for a branch (risky files, forgotten companion files, suggested reviewers), bug-fix hotspots, code ownership and bus factor, change coupling, release-notes drafts and stale branches.
  icon: https://avatars.githubusercontent.com/u/28481316?s=200&v=4
source:
  project: https://github.com/hasanyelaldi/repo-pulse-mcp
  commit: 233bc9ff9488dfc9a72f5763d7d3d53e1a6a968a
run:
  command:
    - "{{repo-pulse.paths|volume-target|into}}"
  volumes:
    - "{{repo-pulse.paths|volume|into}}"
  disableNetwork: true
config:
  description: The git repositories repo-pulse is allowed to read
  parameters:
    type: object
    properties:
      paths:
        type: array
        items:
          type: string
        default:
          - /Users/local-test
    required:
      - paths
