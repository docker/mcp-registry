name: gmapsscraper
type: remote
meta:
  category: search
  tags:
    - google-maps
    - lead-generation
    - web-scraping
    - data-extraction
    - remote
about:
  title: GMapsScraper.AI
  description: Search Google Maps businesses, fetch reviews, and retrieve photos via a Streamable HTTP MCP endpoint with Bearer API key auth.
  icon: https://www.google.com/s2/favicons?domain=gmapsscraper.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://gmapsscraper.ai/api/mcp
  headers:
    Authorization: "Bearer ${GMAPSSCRAPER_API_KEY}"
config:
  secrets:
    - name: gmapsscraper.api_key
      env: GMAPSSCRAPER_API_KEY
      example: <YOUR_API_KEY>
