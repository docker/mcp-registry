name: kling-ai-global-plugin
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - image-generation
    - video-generation
    - remote
    - oauth
about:
  title: Kling AI Global Plugin
  description: Generate Kling AI images and videos, use reference inputs, and track tasks from MCP clients with OAuth and Global account credits.
  icon: https://kling.ai/favicon.ico
remote:
  transport_type: streamable-http
  url: https://kling.ai/mcp/plugin
oauth:
  - provider: kling-ai-global-plugin
    secret: kling-ai-global-plugin.personal_access_token
    env: KLING_AI_GLOBAL_PLUGIN_PERSONAL_ACCESS_TOKEN
