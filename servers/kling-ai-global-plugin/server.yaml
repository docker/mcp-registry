name: kling-ai-global-plugin
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - image-generation
    - video-generation
    - kling-ai
    - remote
about:
  title: Kling AI Global Plugin
  description: Official Kling AI Global MCP plugin for image and video generation. Sign in with Kling OAuth; generation uses credits from the Global Kling account.
  icon: https://www.google.com/s2/favicons?domain=kling.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://kling.ai/mcp/plugin
oauth:
  - provider: kling-ai-global-plugin
    secret: kling-ai-global-plugin.personal_access_token
    env: KLING_AI_GLOBAL_PLUGIN_PERSONAL_ACCESS_TOKEN
