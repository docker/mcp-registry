name: getsonar
image: mcp/getsonar
type: server
meta:
  category: finance
  tags:
    - kyb
    - due-diligence
    - sanctions-screening
    - company-registry
    - finance
about:
  title: SONAR KYB
  description: >-
    KYB due diligence on vendors, partners and resellers through the SONAR API:
    official company register lookups in 10+ countries (exists, active, good
    standing, officers), sanctions and PEP screening, ICIJ Offshore Leaks records
    and adverse media, each finding naming its kind of source. Full written KYB
    reports run asynchronously. Pay per call; a test key runs company lookups for
    free against fixed scenarios. SONAR is a due-diligence aid, not a regulated
    AML/KYC provider.
  icon: https://getsonar.report/icon-512.png
source:
  project: https://github.com/Ivanolegvak/getsonar-mcp
  commit: 88640918ff62598e5ddbac44cf0ee9138ef8c89f
run:
  command:
    - python
    - -m
    - getsonar_mcp
  env:
    PYTHONPATH: /app/src
config:
  description: Configure your SONAR API key (create one at https://getsonar.report/developer/keys)
  secrets:
    - name: getsonar.api_key
      env: SONAR_API_KEY
      example: sk-sonar-...
