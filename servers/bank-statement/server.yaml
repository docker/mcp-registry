type: server
meta:
  category: finance
  tags:
    - finance
    - banking
    - csv
    - reconciliation
    - subscriptions
    - freelance
about:
  title: Bank Statement
  description: "Turns a bank CSV export into a local, categorised ledger. Finds the header row under whatever preamble the bank prints above it, works out which column is the date and which is the money and which way it went, and reads amounts in the file's own locale, so a Revolut, Wise, mBank, PKO BP, ING or N26 export -- or a generic CSV read from its headers alone -- all land the same way. Re-importing the same file adds nothing: every line is deduplicated on a hash of its date, amount, currency and description. Category rules apply as transactions arrive, statement_summary reports money in, money out and the net per currency without ever mixing currencies, recurring_detect finds subscriptions and what each costs per year, and reconcile_expenses matches bank debits against receipts in mcp-expense-tracker. Everything is a plain JSON file inside the container volume; nothing is uploaded anywhere."
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/c03d4f031308ec063f00e7088051722d0b58e94f/assets/bank-statement-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: c03d4f031308ec063f00e7088051722d0b58e94f
  dockerfile: servers/bank-statement/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: bank-statement.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
