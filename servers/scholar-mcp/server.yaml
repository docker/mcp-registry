name: scholar-mcp
image: ghcr.io/liyux3/scholar-mcp:0.9.0
type: server
meta:
  category: search
  tags: [academic, research, papers]
about:
  title: Scholar MCP
  description: Search papers, follow citations, read primary text and figures, and keep a local research library.
  icon: https://raw.githubusercontent.com/Liyux3/scholar-mcp/v0.9.0/site/public/favicon.svg
source:
  project: https://github.com/Liyux3/scholar-mcp
  commit: 32b7231f06a7c08c9b6b8a90e4f6019d27ce497d
run:
  env:
    SCHOLAR_MCP_EXTENSIONS: research
  volumes:
    - scholar-mcp-data:/home/scholar
config:
  description: Optional source keys increase coverage and limits. Local ranking and the research library work without keys.
  secrets:
    - name: scholar-mcp.s2_api_key
      env: S2_API_KEY
      description: Optional Semantic Scholar API key.
      required: false
    - name: scholar-mcp.openalex_api_key
      env: OPENALEX_API_KEY
      description: Optional OpenAlex API key.
      required: false
    - name: scholar-mcp.core_api_key
      env: CORE_API_KEY
      description: Optional CORE repository API key.
      required: false
