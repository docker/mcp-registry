name: postreef
type: remote
dynamic:
  tools: true
meta:
  category: data-extraction
  tags:
    - search
    - data-extraction
    - youtube
    - social-media
    - transcripts
    - remote
about:
  title: Post Reef
  description: Turn YouTube, TikTok, Instagram, Facebook, X and article links into transcripts, comments, metadata, media and schema-typed JSON
  icon: https://www.google.com/s2/favicons?domain=postreef.com&sz=64
remote:
  transport_type: streamable-http
  url: https://postreef.com/mcp
oauth:
  - provider: postreef
    secret: postreef.personal_access_token
    env: POSTREEF_PERSONAL_ACCESS_TOKEN
