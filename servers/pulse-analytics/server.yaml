name: pulse-analytics
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - web-analytics
    - privacy
    - remote
about:
  title: Pulse Analytics
  description: "Ask about your Pulse Analytics websites: visitors, top pages, traffic sources and live visitors, for the sites you choose."
  icon: https://cdn.ciphera.net/brand/v12/kit/drupal/pulse/logo.png
remote:
  transport_type: streamable-http
  url: https://pulse-api.ciphera.net/mcp
oauth:
  - provider: pulse-analytics
    secret: pulse-analytics.personal_access_token
    env: PULSE_ANALYTICS_PERSONAL_ACCESS_TOKEN
