name: firedrill
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - ai
    - simulation
    - testing
    - devops
    - remote
about:
  title: Firedrill
  description: Prepare AI agent simulations, manage synthetic tools, and inspect saved runs, assessments, and evidence
  icon: https://firedrill.run/assets/firedrill-icon.svg
