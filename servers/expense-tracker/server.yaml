name: expense-tracker
image: mcp/expense-tracker
type: server
meta:
  category: finance
  tags:
    - finance
    - expenses
    - receipts
    - mileage
    - vat
    - freelance
about:
  title: Expense Tracker
  description: Logs business expenses from a chat instruction, splits the gross amount on the receipt into net and VAT with vat_rate, categorises new expenses from merchant rules, attaches receipts by path and sha256 for an audit trail, and prices mileage trips from a built-in regional rate table. Summaries group by category, project, month or merchant, always per currency. Exports to csv, xlsx or json, and expense_to_invoice hands billable expenses to mcp-invoice as ready line items. All records are plain JSON files inside the container volume.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/05dfa1871b42e2132cca70eb02ad853158d7b7d2/assets/expense-tracker-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: 05dfa1871b42e2132cca70eb02ad853158d7b7d2
  dockerfile: servers/expense-tracker/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: expense-tracker.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
