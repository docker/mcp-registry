name: dokladbot
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - accounting
    - invoices
    - vat
    - finance
    - czech
    - remote
about:
  title: DokladBot
  description: "Czech accounting for freelancers: invoices, VAT summaries, tax deadlines, bank transactions and data box overview from your DokladBot account."
  icon: https://www.google.com/s2/favicons?domain=dokladbot.cz&sz=64
remote:
  transport_type: streamable-http
  url: https://dokladbot.cz/api/mcp
oauth:
  - provider: dokladbot
    secret: dokladbot.personal_access_token
    env: DOKLADBOT_PERSONAL_ACCESS_TOKEN
