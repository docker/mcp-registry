name: useful-work
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - websites
    - proofreading
    - seo
    - remote
about:
  title: Useful Work
  description: Find and fix mistakes on your live website - typos, wrong facts, out-of-date text, broken links and images, slow pages, and expiring certificates and domains
  icon: https://usefulwork.app/icon-512.png
remote:
  transport_type: streamable-http
  url: https://usefulwork.app/mcp
oauth:
  - provider: useful-work
    secret: useful-work.personal_access_token
    env: USEFUL_WORK_PERSONAL_ACCESS_TOKEN
