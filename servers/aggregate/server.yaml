name: aggregate
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - accounting
    - bookkeeping
    - remote
about:
  title: Aggregate
  description: Every company's money in one ledger (cash, runway, invoices, payroll, books) from your banks, payments, accounting and payroll. Records money, can't move it.
  icon: https://aggregate.finance/brand/app-icons/aggregate-gold-on-black-64.png
remote:
  transport_type: streamable-http
  url: https://app.aggregate.finance/mcp
oauth:
  - provider: aggregate
    secret: aggregate.personal_access_token
    env: AGGREGATE_PERSONAL_ACCESS_TOKEN
