name: twitterapis
type: remote
dynamic:
  tools: true
meta:
  category: automation
  tags:
    - automation
    - data-extraction
    - social-media
    - remote
about:
  title: TwitterAPIs
  description: Read and write X (Twitter) data without the official API. Search tweets and users, pull timelines, followers, replies, quotes and communities, and post, reply, like, follow or send DMs from a linked account. Priced per call with no subscription.
  icon: https://www.google.com/s2/favicons?domain=twitterapis.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.twitterapis.com/mcp
oauth:
  - provider: twitterapis
    secret: twitterapis.personal_access_token
    env: TWITTERAPIS_PERSONAL_ACCESS_TOKEN
