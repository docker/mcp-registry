name: simpleverifier
type: remote
meta:
  category: communication
  tags:
    - communication
    - email
    - email-verification
    - phone
    - remote
about:
  title: SimpleVerifier
  description: Verify email addresses (live SMTP mailbox check, catch-all grading, disposable and role detection) and check phone number formats. Remote server, API key auth.
  icon: https://www.google.com/s2/favicons?domain=simpleverifier.com&sz=64
remote:
  transport_type: streamable-http
  url: https://simpleverifier.com/api/mcp
  headers:
    Authorization: "Bearer ${SIMPLEVERIFIER_API_KEY}"
config:
  secrets:
    - name: simpleverifier.api_key
      env: SIMPLEVERIFIER_API_KEY
      example: <YOUR_API_KEY>
