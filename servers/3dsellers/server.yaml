name: 3dsellers
type: remote
meta:
  category: commerce
  tags:
    - commerce
    - marketplace
    - ecommerce
    - remote
about:
  title: 3Dsellers
  description: Manage eBay, Amazon, Walmart, Etsy, Shopify and TikTok Shop listings, orders, inventory and bulk edits with 150+ tools
  icon: https://www.google.com/s2/favicons?domain=3dsellers.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.3dsellers.com/mcp
  headers:
    Authorization: "Bearer ${SELLERS3D_API_TOKEN}"
config:
  secrets:
    - name: 3dsellers.api_token
      env: SELLERS3D_API_TOKEN
      example: <YOUR_3DSELLERS_MCP_TOKEN>
