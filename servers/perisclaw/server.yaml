name: perisclaw
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - messaging
    - whatsapp
    - productivity
    - remote
about:
  title: Perisclaw
  description: Use your own WhatsApp from AI clients through Perisclaw, your executive assistant on WhatsApp. Catch up on what needs your reply, search chats and messages, and review and send replies. OAuth sign-in with read-only or read and write access.
  icon: https://raw.githubusercontent.com/periskope-org/perisclaw-plugin/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://api.perisclaw.com/mcp/plugin
oauth:
  - provider: perisclaw
    secret: perisclaw.personal_access_token
    env: PERISCLAW_PERSONAL_ACCESS_TOKEN
