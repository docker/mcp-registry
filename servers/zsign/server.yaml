name: zsign
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - e-signature
    - documents
    - remote
about:
  title: Zsign
  description: Send documents for e-signature from AI assistants, track signers, and download sealed, signed PDFs.
  icon: https://zsign.io/favicon.svg
remote:
  transport_type: streamable-http
  url: https://zsign.io/mcp
oauth:
  - provider: zsign
    secret: zsign.personal_access_token
    env: ZSIGN_PERSONAL_ACCESS_TOKEN
