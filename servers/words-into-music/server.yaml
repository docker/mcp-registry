name: words-into-music
type: remote
dynamic:
  tools: true
meta:
  category: music
  tags:
    - music
    - audio
    - songwriting
    - remote
about:
  title: Words Into Music
  description: Generate songs from prompts or lyrics, check credits, and access your private song library with your existing Words into Music account.
  icon: https://wordsintomusic.com/assets/brand/app-icon.svg
remote:
  transport_type: streamable-http
  url: https://mcp.wordsintomusic.com/mcp
oauth:
  - provider: words-into-music
    secret: words-into-music.personal_access_token
    env: WORDS_INTO_MUSIC_PERSONAL_ACCESS_TOKEN
