name: quantset
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - stock-market
    - sec-filings
    - quantitative-finance
    - remote
about:
  title: QuantSet
  description: Free to try (mw_demo + 250 free credits). Query 90,000+ symbols and 52,000+ stocks across 67 countries, 734 crypto pairs, 42 FX currencies, 36,000+ companies with standardized financial statements, 127M+ SEC EDGAR XBRL facts, 4,899 ETF look-through holdings, consensus estimates, and 40-factor stock screening.
  icon: https://raw.githubusercontent.com/quantset/skills/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://api.quantset.dev/mcp
oauth:
  - provider: quantset
    secret: quantset.personal_access_token
    env: QUANTSET_PERSONAL_ACCESS_TOKEN
