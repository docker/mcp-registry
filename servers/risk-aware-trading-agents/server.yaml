about:
  title: Risk-Aware Trading Agents
  description: AI trading agents for US stocks. Read the market regime from VIX and the FOMC/CPI calendar, scan for signals, backtest built-in strategies or code the model writes (checked for look-ahead), run paper-trading agents ranked against SPY, and run reproducible experiments on a frozen point-in-time 2026 market with news. Every tool is read-only or works on local paper accounts; none can place a real order. Not investment advice.
