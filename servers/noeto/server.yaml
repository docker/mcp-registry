name: noeto
image: mcp/noeto
type: server
meta:
  category: productivity
  tags:
    - productivity
    - project-management
    - kanban
about:
  title: Noeto
  description: Work a Noeto kanban board from an AI agent - read and search boards, create, update, move and comment on cards, and keep a Markdown design document on a card. It cannot delete anything a person made.
  icon: https://www.google.com/s2/favicons?domain=noeto.online&sz=64
source:
  project: https://github.com/noeto-tasks/noeto-mcp
  commit: 2412c0e1611b9cf186503e18563d7d9ce5cca6fa
config:
  description: Configure the connection to your Noeto team
  secrets:
    - name: noeto.token
      env: NOETO_TOKEN
      example: noeto_pat_...
  env:
    - name: NOETO_API_URL
      example: https://api.noeto.online/api/v1
      value: "{{noeto.api_url}}"
  parameters:
    type: object
    properties:
      api_url:
        type: string
        default: https://api.noeto.online/api/v1
    required:
      - api_url
