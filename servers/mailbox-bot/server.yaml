name: mailbox-bot
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - postal-mail
    - certified-mail
    - mailing-address
    - remote
about:
  title: Mailbox.bot
  description: A real street address you and your agent share for receiving mail and small packages, plus letters and certified mail sent by USPS and FedEx. You approve every live letter, scan, forward and discard.
  icon: https://mailbox.bot/favicon-192x192.png
remote:
  transport_type: streamable-http
  url: https://mailbox.bot/api/mcp
oauth:
  - provider: mailbox-bot
    secret: mailbox-bot.personal_access_token
    env: MAILBOX_BOT_PERSONAL_ACCESS_TOKEN
