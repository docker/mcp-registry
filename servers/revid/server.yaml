name: revid
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - content-creation
    - social-media
    - remote
about:
  title: Revid
  description: Research what goes viral, make finished short-form videos (voice, captions, music, AI footage) and post them to TikTok, YouTube, Instagram and X
  icon: https://www.google.com/s2/favicons?domain=revid.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://www.revid.ai/api/mcp
oauth:
  - provider: revid
    secret: revid.personal_access_token
    env: REVID_PERSONAL_ACCESS_TOKEN
