name: pushary
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - human-in-the-loop
    - approvals
    - notifications
    - remote
about:
  title: Pushary
  description: Human-in-the-loop for AI agents. Ask a person and get approvals or answers by push notification on their phone.
  icon: https://www.google.com/s2/favicons?domain=pushary.com&sz=64
remote:
  transport_type: streamable-http
  url: https://pushary.com/api/mcp/mcp
oauth:
  - provider: pushary
    secret: pushary.personal_access_token
    env: PUSHARY_PERSONAL_ACCESS_TOKEN
