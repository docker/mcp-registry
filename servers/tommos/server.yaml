name: tommos
type: remote
dynamic:
  tools: true
meta:
  category: crm
  tags:
    - crm
    - sales
    - b2b
    - ai-agents
    - remote
about:
  title: Tommos
  description: A CRM whose AI agents take a B2B inquiry to a signed contract. Read and write contacts, deals, forms and bookings; read where the work stands.
  icon: https://tommos.ai/favicon.svg
remote:
  transport_type: streamable-http
  url: https://app.tommos.ai/api/mcp
  headers:
    Authorization: "Bearer ${TOMMOS_API_KEY}"
config:
  secrets:
    - name: tommos.api_key
      env: TOMMOS_API_KEY
      example: <YOUR_API_KEY>
