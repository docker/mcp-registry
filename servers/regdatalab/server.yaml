name: regdatalab
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - regulatory
    - fda
    - compliance
    - remote
about:
  title: RegDataLab
  description: Hosted MCP connector for looking up free FDA company records, inspections, Form 483s, warning letters, recalls and import alerts.
  icon: https://www.regdatalab.com/favicon.png
source:
  project: https://github.com/medley/fda-data-mcp
remote:
  transport_type: streamable-http
  url: https://www.regdatalab.com/mcp
oauth:
  - provider: regdatalab
    secret: regdatalab.personal_access_token
    env: REGDATALAB_PERSONAL_ACCESS_TOKEN
