name: gtd-brain
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - task-management
    - gtd
    - remote
about:
  title: GTD Brain
  description: Run a Getting Things Done (GTD) board from your AI assistant. Capture to Inbox, list next actions by context, manage projects and waiting-for, and run weekly reviews
  icon: https://gtdbrain.com/gtdbrain/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.gtdbrain.com/api/gtdbrain/v1/mcp
oauth:
  - provider: gtd-brain
    secret: gtd-brain.personal_access_token
    env: GTD_BRAIN_PERSONAL_ACCESS_TOKEN
