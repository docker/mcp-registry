name: grupy
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - whatsapp
    - summarization
    - productivity
    - remote
about:
  title: Grupy
  description: Summarize, search, and manage the WhatsApp groups on your own account. Read and search group summaries, review join requests, and turn groups on or off.
  icon: https://grupy.chat/icon-192.png
remote:
  transport_type: streamable-http
  url: https://mcp.grupy.chat/mcp
oauth:
  - provider: grupy
    secret: grupy.personal_access_token
    env: GRUPY_PERSONAL_ACCESS_TOKEN
