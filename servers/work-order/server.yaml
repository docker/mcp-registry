about:
  title: Work Order
  description: "Keeps job orders for trades and field work the way a job card is kept, entirely on your machine: a work order raised against a client the sibling invoice server already knows rather than a second spelling of the name, with a site address, the date it was asked for, what the job is and how urgent, then labour logged as hours at a rate and parts as a quantity at a unit cost with an optional markup, a status that moves one step at a time with every step stamped with its own date, a completion report with a sign-off block, and an invoice-create-ready payload at the end. The decision the whole server rests on is that the markup goes on the UNIT cost and never on the line total, because the invoice server rounds a unit price into minor units first and computes the line from that stored value, so the marked-up unit is the only basis an invoice can reproduce: seven parts at 1299 with 15 percent on top is 1494 a unit and 10,458 on the line, where marking up the line total instead is 10,457. Both are defensible arithmetic, both reconcile against their own workings, and only one of them is what the customer is billed, so the unit suite asserts that gap is exactly 1 and a change of basis fails the build rather than quietly re-pricing every job on the board. No total is stored: the value, the hours, the materials and the VAT are derived from the lines on every call, because a stored total is a second copy of what the lines already decide and the copy is the one that gets believed after somebody edits a line. The status machine moves draft to scheduled to in progress to done to invoiced and refuses a skipped step naming the step that is next, because every step carries its own date and a job that went straight to invoiced was never marked done, so nothing records the day the work finished; backwards is refused because a job that has to go back is a new work order. Hours are counted on the line date rather than the order date, so a February call worked in March logs its hours in March. The invoice payload's totals are computed by the invoice server's own totals function over the very items it hands back, so there is no second implementation to disagree, and it posts nothing and marks nothing. It reads two files it does not own, both read-only and both best-effort, and writes into neither. No account, no API key, no network call: everything lives under the local data directory and licence keys are verified offline."
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/41fa48021ef8e5cad3f57d5c5ce5c3b19f1d2cdb/assets/work-order-logo.png
