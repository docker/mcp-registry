name: outreachbox
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - marketing
    - email-outreach
    - crm
    - remote
about:
  title: OutreachBox
  description: Agentic marketing automation from any MCP client - prospect research, contacts, email campaigns, content and inbox triage.
  icon: https://outreachbox.com/assets/images/outreach_iso.png
remote:
  transport_type: streamable-http
  url: https://api.outreachbox.com/mcp
  headers:
    Authorization: "Bearer ${OUTREACHBOX_API_KEY}"
config:
  secrets:
    - name: outreachbox.api_key
      env: OUTREACHBOX_API_KEY
      example: <YOUR_OUTREACHBOX_API_KEY>
