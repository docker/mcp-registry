name: time-tracker
image: mcp/time-tracker
type: server
meta:
  category: productivity
  tags:
    - productivity
    - time-tracking
    - timesheet
    - invoicing
    - freelance
about:
  title: Time Tracker
  description: Tracks billable time from the chat window. Start and stop named timers, log entries after the fact, tag work by project and client, then produce day, week and project reports, a CSV export, or invoice-ready line items with rounded hours and amounts. Entries are stored as plain JSON files inside the container volume and nothing is sent to any service.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/05dfa1871b42e2132cca70eb02ad853158d7b7d2/assets/time-tracker-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: 05dfa1871b42e2132cca70eb02ad853158d7b7d2
  dockerfile: servers/time-tracker/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: time-tracker.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
