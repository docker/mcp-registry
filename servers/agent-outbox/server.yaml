name: agent-outbox
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - notifications
    - messaging
    - telegram
    - remote
about:
  title: Agent Outbox
  description: Let AI assistants post messages to your Telegram private chat, groups and channels through a bot, with OAuth login and no bot token. Not affiliated with Telegram.
  icon: https://outbox.roxinbox.io/icon.png
remote:
  transport_type: streamable-http
  url: https://outbox.roxinbox.io/mcp
oauth:
  - provider: agent-outbox
    secret: agent-outbox.personal_access_token
    env: AGENT_OUTBOX_PERSONAL_ACCESS_TOKEN
