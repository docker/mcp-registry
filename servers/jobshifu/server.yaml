name: jobshifu
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - jobs
    - job-search
    - careers
    - remote
about:
  title: JobShifu
  description: Search jobs posted on employer career sites, check whether a posting is still open or was reposted, and open resume tailoring in your JobShifu account
  icon: https://www.google.com/s2/favicons?domain=jobshifu.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.jobshifu.com/mcp
oauth:
  - provider: jobshifu
    secret: jobshifu.personal_access_token
    env: JOBSHIFU_PERSONAL_ACCESS_TOKEN
