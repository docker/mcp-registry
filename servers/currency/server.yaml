name: currency
image: mcp/currency
type: server
meta:
  category: finance
  tags:
    - finance
    - currency
    - exchange-rates
    - ecb
    - fx
about:
  title: Currency
  description: Converts amounts between any currencies the European Central Bank publishes daily reference rates for, states the rate date used, and shows how a pair moved over a window with min, max, average and change. Also returns an fx_rates object shaped for the expense-tracker and invoice servers. Both the rate file and the history are cached locally, no API key and no rate limit, because the ECB publishes the series openly.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/c03d4f031308ec063f00e7088051722d0b58e94f/assets/currency-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: c03d4f031308ec063f00e7088051722d0b58e94f
  dockerfile: servers/currency/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: currency.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
