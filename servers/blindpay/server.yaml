name: blindpay
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - payments
    - stablecoin
    - fintech
    - remote
about:
  title: BlindPay
  description: Official BlindPay MCP server for stablecoin global payments. Create receivers and virtual accounts, get FX quotes, run payouts and payins across bank rails and blockchains, and read balances and transaction history.
  icon: https://www.google.com/s2/favicons?domain=blindpay.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.blindpay.com/mcp
  headers:
    Authorization: "Bearer ${BLINDPAY_API_KEY}"
config:
  secrets:
    - name: blindpay.api_key
      env: BLINDPAY_API_KEY
      example: <YOUR_API_KEY>
