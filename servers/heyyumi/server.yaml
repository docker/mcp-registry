remote:
  transport_type: streamable-http
  url: https://mcp.heyyumi.ai/mcp
oauth:
  - provider: heyyumi
    secret: heyyumi.personal_access_token
    env: HEYYUMI_PERSONAL_ACCESS_TOKEN
