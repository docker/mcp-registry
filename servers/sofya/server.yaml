name: sofya
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - sofya
    - search
    - web
    - research
    - remote
about:
  title: Sofya
  description: Web search, page fetch, extraction and deep research for AI agents. Search results come with full page content, fetch returns clean Markdown (PDFs and Office documents included), and research returns a cited report. Hosted server; sign in with your Sofya account.
  icon: https://sofya.co/static/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.sofya.co/mcp
oauth:
  - provider: sofya
    secret: sofya.personal_access_token
    env: SOFYA_PERSONAL_ACCESS_TOKEN
