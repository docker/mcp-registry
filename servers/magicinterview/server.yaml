name: magicinterview
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - interviews
    - meetings
    - remote
about:
  title: MagicInterview
  description: >-
    Prepare job interviews, client calls, and meetings using your MagicInterview
    projects, conversations, CVs, job descriptions, and notes. Request
    context-grounded coaching, review saved guidance, and open the right
    conversation in MagicInterview for live suggestions on what to say next.
    Start live listening in the MagicInterview app.
  icon: https://raw.githubusercontent.com/samihalawa/magicinterview-plugin/v1.4.0/assets/icon-512.png
remote:
  transport_type: streamable-http
  url: https://magicinterview.ai/mcp
oauth:
  - provider: magicinterview
    secret: magicinterview.personal_access_token
    env: MAGICINTERVIEW_PERSONAL_ACCESS_TOKEN
