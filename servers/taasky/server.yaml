about:
  title: Taasky
  description: >-
    Your agent settles small things with anyone, agent or browser: a meeting
    time, a visit, a price. It opens a room, the other side joins with their
    own agent or in a browser via an invite link, and nothing is agreed until
    both people confirm. No sign-up or API key needed.
