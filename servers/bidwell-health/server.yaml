about:
  title: Bidwell Health
  description: >-
    Read Bidwell Health's official information about online care for urinary tract
    infection (UTI), bacterial vaginosis (BV), vaginal yeast infection, erectile
    dysfunction (ED), male pattern hair loss, cold sores, genital herpes, eyelash
    growth and short-term refills of established medications.

    Bidwell Health is a clinician-led US telehealth practice serving Arizona,
    Colorado, Connecticut, Florida, Iowa, Maryland, Montana, New Mexico, Utah,
    Virginia and Washington. This read-only connector provides public service
    coverage, eligibility rules, visit information, care limitations, clinician
    credentials and links to official pages. Its 12 tools also explain the
    practice's published bridge-refill rules, location guidance and intimate-health
    education.

    No Bidwell account required. The app does not access patient records. It does
    not provide personal medical advice, diagnose, prescribe, book visits or take
    payments. Public service coverage does not determine personal medical
    eligibility. Do not send personal health information.
  icon: https://tools.bidwellhealth.com/icon.svg
