name: mcpbinder
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - project-management
    - task-management
    - remote
about:
  title: MCPBinder
  description: Read project goals, tasks, and activity, plan work, and record decisions in MCPBinder with access you control.
  icon: https://raw.githubusercontent.com/ReedStories/mcpbinder-plugins/6d5dd4ca1066b70abba4a3eb40aa85475b07d66a/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://www.mcpbinder.com/api/mcp
oauth:
  - provider: mcpbinder
    secret: mcpbinder.personal_access_token
    env: MCPBINDER_PERSONAL_ACCESS_TOKEN
