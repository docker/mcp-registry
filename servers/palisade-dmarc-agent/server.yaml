name: palisade-dmarc-agent
type: remote
meta:
  category: security
  tags:
    - email-security
    - dmarc
    - email-authentication
    - dns
    - remote
about:
  title: Palisade DMARC Agent
  description: Manage DMARC, SPF, DKIM, BIMI, MTA-STS, DNS records, and email-authentication remediation from AI agents.
  icon: https://www.google.com/s2/favicons?domain=palisade.email&sz=64
remote:
  transport_type: streamable-http
  url: https://api.palisade.email/mcp
  headers:
    Authorization: "Bearer ${PALISADE_API_KEY}"
config:
  description: Configure your Palisade API access
  secrets:
    - name: palisade-dmarc-agent.api_key
      env: PALISADE_API_KEY
      example: <YOUR_PALISADE_API_KEY>
