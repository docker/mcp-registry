name: dagon-inference
type: remote
meta:
  category: ai
  tags:
    - ai
    - llm
    - inference
    - solana
    - payments
    - remote
about:
  title: Dagon Inference
  description: List abliterated open-weight models and prices, create an account key, check credits, buy credits with USDC on Solana, and run chat completions with signed receipts.
  icon: https://inference.dagon.so/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://inference.dagon.so/mcp
  headers:
    Authorization: "Bearer ${DAGON_API_KEY}"
config:
  description: Listing models and creating a key work without a key; balance, credit purchases and chat need a Dagon account key (gk_...).
  secrets:
    - name: dagon-inference.api_key
      env: DAGON_API_KEY
      example: <YOUR_API_KEY>
      required: false
