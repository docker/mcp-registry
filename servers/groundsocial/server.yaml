name: groundsocial
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - social-media
    - web-scraping
    - data-extraction
    - search
    - remote
about:
  title: Groundsocial
  description: Public social and web data as JSON from 77 platforms, including Reddit, X, TikTok, Instagram, YouTube, LinkedIn, Bluesky, Hacker News, Google Search, Amazon and app stores. Read-only tools for posts, comments, profiles, transcripts, reviews and search, each in the platform's own JSON shape.
  icon: https://raw.githubusercontent.com/shivanshmehendiratta/groundsocial-mcp/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://api.groundsocial.dev/mcp
  headers:
    Authorization: "Bearer ${GROUNDSOCIAL_API_KEY}"
config:
  description: Create an API key at https://groundsocial.dev/app (100 free credits, no card).
  secrets:
    - name: groundsocial.api_key
      env: GROUNDSOCIAL_API_KEY
      example: <YOUR_API_KEY>
