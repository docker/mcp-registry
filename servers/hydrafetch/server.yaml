name: hydrafetch
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - search
    - data-extraction
    - remote
about:
  title: Hydrafetch
  description: Clean web data for developers and agents. Read pages as markdown, search, crawl and extract.
  icon: https://hydrafetch.com/brand/mark-512.png
remote:
  transport_type: streamable-http
  url: https://api.hydrafetch.com/mcp
oauth:
  - provider: hydrafetch
    secret: hydrafetch.api_key
    env: HYDRAFETCH_API_KEY
