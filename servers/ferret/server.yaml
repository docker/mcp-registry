name: ferret
image: mcp/ferret
type: server
meta:
  category: productivity
  tags:
    - productivity
    - home-inventory
    - self-hosted
    - home-assistant
about:
  title: Ferret
  description: Your self-hosted home inventory — find where things are, add and update what you own, and track stock, the shopping list, maintenance, warranties and lending. Connects to your own Ferret server with an API key (read-only keys work too).
  icon: https://raw.githubusercontent.com/ferret-project/ferret/main/apps/web/public/icon-512.png
source:
  project: https://github.com/ferret-project/ferret
  commit: 1b8a59bb3419b78d6466cfc7204cae1fe29b8ddd
  directory: contrib/mcp-bridge
config:
  description: Connect to your Ferret server
  secrets:
    - name: ferret.api_key
      env: FERRET_API_KEY
      example: ferret_…
      description: An API key from Ferret — Household & settings → Claude & API → New key
  env:
    - name: FERRET_URL
      example: https://ferret.example.com
      value: "{{ferret.url}}"
  parameters:
    type: object
    properties:
      url:
        type: string
        description: Your Ferret server's address, e.g. https://ferret.example.com
    required:
      - url
