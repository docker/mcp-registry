about:
  title: RegiaBI
  description: Profiles a table you send, lists the chart types that fit it, and returns interactive D3 charts, maps and app widgets as code you own.
  icon: https://www.google.com/s2/favicons?domain=regiabi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://bizintelligencechampions.com/mcp
oauth:
  - provider: regiabi-remote
    secret: regiabi-remote.personal_access_token
    env: REGIABI_PERSONAL_ACCESS_TOKEN
