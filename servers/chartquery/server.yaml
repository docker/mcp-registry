name: chartquery
type: remote
meta:
  category: data-visualization
  tags:
    - charts
    - qr-codes
    - barcodes
    - remote
about:
  title: ChartQuery
  description: "Generate chart images, diagrams, QR codes, barcodes and thermal shipping labels as PNG, SVG or PDF, from a spec or a plain-language prompt."
  icon: https://avatars.githubusercontent.com/u/271792094?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.chartquery.com/
  headers:
    x-api-key: "${CHARTQUERY_API_KEY}"
config:
  description: Configure your ChartQuery API key
  secrets:
    - name: chartquery.api_key
      env: CHARTQUERY_API_KEY
      example: <YOUR_API_KEY>
