name: stellara
image: mcp/stellara
type: server
meta:
  category: ai
  tags:
    - astrology
    - swiss-ephemeris
    - natal-chart
    - transits
    - synastry
about:
  title: Stellara Astrology
  description: Deterministic Swiss Ephemeris tools for astrology — natal chart (14 points, houses, angles, aspects with exact orbs and applying/separating), transits to a natal chart, synastry, and a birth-place resolver that turns a place name plus local birth time into coordinates and the historically correct UTC offset. No AI inside, nothing stored server-side.
  icon: https://raw.githubusercontent.com/mihnin/stellara-mcp/main/assets/logo.png
source:
  project: https://github.com/mihnin/stellara-mcp
  commit: e39ac0d34b679f3530a055eba54fedbbc583a6e0
config:
  description: Access key for the Stellara astrology API. Get a free key (5 requests/day) at https://stellara.natlex.it/#api
  secrets:
    - name: stellara.api_key
      env: STELLARA_API_KEY
      example: sk_stellara_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
