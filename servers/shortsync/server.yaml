name: shortsync
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - social-media
    - scheduling
    - marketing
    - remote
about:
  title: ShortSync
  description: Draft, schedule and publish posts to 17 social platforms (Instagram, TikTok, YouTube, LinkedIn, X, Threads, Reddit and more), read analytics and reply to comments
  icon: https://www.google.com/s2/favicons?domain=shortsync.app&sz=64
remote:
  transport_type: streamable-http
  url: https://www.shortsync.app/api/mcp
oauth:
  - provider: shortsync
    secret: shortsync.personal_access_token
    env: SHORTSYNC_PERSONAL_ACCESS_TOKEN
