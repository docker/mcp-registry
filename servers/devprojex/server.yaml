name: devprojex
image: mcp/devprojex
type: server
meta:
  category: devops
  tags:
    - codebase
    - code-search
    - context
    - git
    - secrets
    - devops
about:
  title: DevProjex
  description: Token-efficient codebase context for AI coding agents. Read files, search code, review Git diffs and follow dependencies with secrets masked. A Repomix alternative with up to 40% fewer tokens.
  icon: https://raw.githubusercontent.com/Avazbek22/DevProjex/master/Assets/AppIcon/Linux/png/256.png
source:
  project: https://github.com/Avazbek22/DevProjex
  commit: e6ab595d7761c69a5e4a6bf216def02b45559f2b
run:
  command:
    - mcp
    - --root
    - /project
  volumes:
    - "{{devprojex.project_path}}:/project:ro"
  disableNetwork: true
config:
  description: Choose the project folder the agent may read.
  parameters:
    type: object
    properties:
      project_path:
        type: string
        description: Absolute path of the project folder the agent may read.
    required:
      - project_path
