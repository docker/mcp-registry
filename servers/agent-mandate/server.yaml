about:
  title: Agent Mandate
  description: Checks whether a proposed agent action stays inside a signed mandate, and returns an allow, deny or requires_approval receipt. The mandate is a detached-signature document naming what one agent may do for one principal, so a third party can verify the decision without having issued the authority. Verification only; it never issues or revokes mandates and never executes the action.
  icon: https://www.google.com/s2/favicons?domain=agentmandate-api.com&sz=64
source:
