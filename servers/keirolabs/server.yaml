name: keirolabs
type: remote
meta:
  category: search
  tags:
    - search
    - web-search
    - data-extraction
    - remote
about:
  title: Keirolabs
  description: Web search for AI agents. Fast and deep web search, live Google results, page extraction to Markdown and cited answers.
  icon: https://www.google.com/s2/favicons?domain=keirolabs.cloud&sz=64
remote:
  transport_type: streamable-http
  url: https://api.keirolabs.cloud/mcp/api
  headers:
    Authorization: "Bearer ${KEIROLABS_API_KEY}"
config:
  secrets:
    - name: keirolabs.api_key
      env: KEIROLABS_API_KEY
      example: <YOUR_API_KEY>
