name: evp-public-data
image: mcp/evp-public-data
type: server
meta:
  category: web-scraping
  tags:
    - web-scraping
    - data-extraction
    - public-data
    - government-data
    - market-intelligence
about:
  title: EVP Public Data
  description: Focused public data extraction tools for marketplaces, government opportunities, federal spending, clinical trials, SEC filings, podcasts, and games. Returns clean JSON with source links and caps each call at 25 records.
  icon: https://raw.githubusercontent.com/intius/evp-public-data-mcp/main/icon.png
source:
  project: https://github.com/intius/evp-public-data-mcp
  commit: 524e1401f789454f697def0c8edbebb6f6a4a98b
run:
  allowHosts:
    - api.apify.com:443
config:
  description: Configure access to the underlying Apify Actors
  secrets:
    - name: evp-public-data.apify_token
      env: APIFY_TOKEN
      example: your-apify-token
      description: Create a token at https://console.apify.com/account/integrations
