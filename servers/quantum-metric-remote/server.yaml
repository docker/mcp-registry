name: quantum-metric-remote
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - analytics
    - session-replay
    - observability
    - remote
about:
  title: Quantum Metric
  description: Analyze funnels, errors, friction and session replays in Quantum Metric to find and fix digital experience issues
  icon: https://raw.githubusercontent.com/quantummetric/qm-plugin-claude/main/logo.png
remote:
  transport_type: streamable-http
  url: https://api.quantummetric.com/mcp
oauth:
  - provider: quantum-metric-remote
    secret: quantum-metric-remote.personal_access_token
    env: QUANTUM_METRIC_REMOTE_PERSONAL_ACCESS_TOKEN
