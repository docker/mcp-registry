about:
  title: Catalogue
  description: "One price list and one rate card, kept locally where the sibling invoice and quote servers can both read them: a SKU holds its code, its name, its unit, its VAT rate and its price ROWS, each row a currency, a tier, a valid-from date and an amount in minor units, and a role holds its hourly rate the same way; hand it a list of what a customer had and it hands back the line items already priced. The decision the whole server rests on is that the two servers it feeds take the same price in DIFFERENT scales, and the gap is exactly 100x. The invoice server's item carries unit_price in MAJOR units ('Price per unit in major units, e.g. 90 for 90 EUR'), the quotes server's item carries unit_price_minor in MINOR units ('9000 = 90.00 EUR, 90 = JPY 90. Never a decimal'), both fields are plain numbers, both are called the unit price, and neither tool can tell that the number it was handed was scaled for the other one: 45000 passed as unit_price is a perfectly valid invoice line for EUR 45,000.00 and it reconciles against itself. Measured on the worked resolution, the correct payload nets 261,363 minor units and the quote field fed into the invoice engine nets 26,136,300, asserted in the unit suite as exactly 100x; in a 3-decimal currency such as KWD it is 1000x. So the catalogue stores MINOR units, which is the only lossless form, and lines_resolve builds BOTH payloads itself in one call with the scale named against each, rather than returning 'the price' and letting the caller pick the field, which would be wrong half the time and wrong by two orders of magnitude when it was. Every stored price is a whole number of minor units, so the invoice server's own totals function rounds the major-unit form straight back to the integer it came from and rounding_drift_minor on a resolution is zero by construction. No current price is stored: the price on a date is the latest valid_from at or before it, worked out on the call, and the answer names the row it picked, how many it considered and any later row already booked, so raising a price in July does not rewrite what June was quoted. A date before every row has no price and is refused naming the earliest row, because filling it with the earliest price reprices history and reconciles perfectly against a price list that did not exist yet. One row per currency, tier and valid-from date, and setting that key again REPLACES the row, so 'the price that day' is never decided by array order. Nothing is invented: an unknown SKU or role is refused by name, so is a code with no price in the currency and tier asked for, and nothing converts a currency. It creates no invoice and no quote; lines_resolve returns arguments and says posted false. No account, no API key, no network call: everything lives under the local data directory, the one file outside it is the shared business profile read read-only, and licence keys are verified offline."
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/8f37031e265b59cf9c0c9c0bddb089b6f320d7b9/assets/catalogue-logo.png
