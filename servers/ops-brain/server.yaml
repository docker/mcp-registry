name: ops-brain
image: mcp/ops-brain
type: server
meta:
  category: productivity
  tags:
    - productivity
    - ai-agents
    - coordination
    - handoffs
    - postgresql
about:
  title: Ops Brain
  description: A small team bus for AI agents. Lets agents across machines and vendors hand work to each other, reply in thread, and share a small set of cross-agent gotchas, backed by your own PostgreSQL with pgvector.
  icon: https://avatars.githubusercontent.com/u/252354070?s=200&v=4
source:
  project: https://github.com/TheK3nsai/ops-brain
  commit: 2c120e36a940d4c5a196b95e10e0b9ff4758ed37
config:
  description: Connect ops-brain to your own PostgreSQL database with the pgvector extension. Migrations run on startup. Embeddings are optional; full-text search works without them.
  secrets:
    - name: ops-brain.database_url
      env: DATABASE_URL
      example: postgres://ops_brain:password@host.docker.internal:5432/ops_brain
    - name: ops-brain.embedding_api_key
      env: OPS_BRAIN_EMBEDDING_API_KEY
      example: <OPS_BRAIN_EMBEDDING_API_KEY>
      required: false
  env:
    - name: OPS_BRAIN_EMBEDDINGS_ENABLED
      example: "false"
      value: "{{ops-brain.embeddings_enabled}}"
    - name: OPS_BRAIN_EMBEDDING_URL
      example: http://host.docker.internal:11434/v1/embeddings
      value: "{{ops-brain.embedding_url}}"
    - name: OPS_BRAIN_EMBEDDING_MODEL
      example: nomic-embed-text
      value: "{{ops-brain.embedding_model}}"
  parameters:
    type: object
    properties:
      embeddings_enabled:
        type: boolean
        description: Generate embeddings for semantic and hybrid search. Leave off to use full-text search only.
        default: false
      embedding_url:
        type: string
        description: OpenAI-compatible embeddings endpoint, such as Ollama serving nomic-embed-text.
        default: http://host.docker.internal:11434/v1/embeddings
      embedding_model:
        type: string
        description: Embedding model name. It must produce 768-dimension vectors.
        default: nomic-embed-text
