name: ops-brain
image: mcp/ops-brain
type: server
meta:
  category: productivity
  tags:
    - productivity
    - ai-agents
    - coordination
    - handoffs
    - postgresql
about:
  title: Ops Brain
  description: A small team bus for AI agents. Lets agents across machines and vendors hand work to each other, check in for open work, and reply in thread, backed by your own PostgreSQL.
  icon: https://avatars.githubusercontent.com/u/252354070?s=200&v=4
source:
  project: https://github.com/TheK3nsai/ops-brain
  commit: cfae1956b3815877acfd4d08766b51b97422ab43
config:
  description: Connect ops-brain to your own PostgreSQL database. The database needs the pgvector extension installed, because the migrations create its columns. Migrations run on startup. Over stdio it runs as a single trusted operator; multi-machine teams should use the HTTP setup with per-agent tokens (see the repo docs).
  secrets:
    - name: ops-brain.database_url
      env: DATABASE_URL
      example: postgres://ops_brain:password@host.docker.internal:5432/ops_brain
