name: fillo
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - forms
    - developer-tools
    - remote
about:
  title: Fillo
  description: Provision, scaffold, publish, and query native product forms from a coding agent — browser-direct uploads to your own storage, no iframe.
  icon: https://www.google.com/s2/favicons?domain=fillo.so&sz=64
remote:
  transport_type: streamable-http
  url: https://fillo.so/api/mcp
oauth:
  - provider: fillo
    secret: fillo.personal_access_token
    env: FILLO_PERSONAL_ACCESS_TOKEN
