name: sentfromai-remote
type: remote
meta:
  category: communication
  tags:
    - email
    - ai-agents
    - inbox
    - communication
    - remote
about:
  title: SentFromAI
  description: Give AI agents their own email inboxes to create inboxes, send and reply to email, and read or search messages.
  icon: https://sentfrom.ai/brand/sentfromai-icon.png
remote:
  transport_type: streamable-http
  url: https://api.sentfrom.ai/mcp
  headers:
    Authorization: "Bearer ${SENTFROMAI_REMOTE_API_KEY}"
config:
  secrets:
    - name: sentfromai-remote.api_key
      env: SENTFROMAI_REMOTE_API_KEY
      example: <YOUR_SENTFROMAI_API_KEY>
