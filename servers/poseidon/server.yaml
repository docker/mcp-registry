name: poseidon
type: remote
meta:
  category: marketing
  tags:
    - marketing
    - advertising
    - ecommerce
    - meta-ads
    - remote
about:
  title: Poseidon
  description: Winning e-commerce ads on Meta in Europe, with Meta's own EU reach by country, age and sex, scripts, brands' A/B tests and a competitor watchlist
  icon: https://www.google.com/s2/favicons?domain=askposeidon.app&sz=64
remote:
  transport_type: streamable-http
  url: https://api.askposeidon.app/mcp
  headers:
    Authorization: "Bearer ${POSEIDON_API_KEY}"
config:
  secrets:
    - name: poseidon.api_key
      env: POSEIDON_API_KEY
      example: <YOUR_API_KEY>
