name: timezone
image: mcp/timezone
type: server
meta:
  category: productivity
  tags:
    - productivity
    - time-zone
    - scheduling
    - calendar
    - freelance
about:
  title: Timezone
  description: Converts times between cities, reports the current time in a list of places, finds meeting slots ranked by fairness across every participant's own working hours, computes daily overlap windows, lists daylight-saving changes for a year, counts business days between two dates, remembers saved contacts and their zones, and writes a .ics calendar invite. Saved contacts and working hours are stored as plain JSON files inside the container volume.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/95130230c70b066b416d13209571a41d9191a6b2/assets/timezone-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: 95130230c70b066b416d13209571a41d9191a6b2
  dockerfile: servers/timezone/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: timezone.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
