name: proxy302
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - proxy
    - residential-proxy
    - remote
about:
  title: Proxy302
  description: Residential proxies for AI agents. Check traffic and usage, get proxy URLs by country, list your proxies and static IPs, rotate exit IPs, check IP purity and quote plan costs. Read-only and never spends money.
  icon: https://www.google.com/s2/favicons?domain=proxy302.com&sz=128
remote:
  transport_type: streamable-http
  url: https://proxy302.com/v1/mcp
  headers:
    Authorization: "Bearer ${PROXY302_API_KEY}"
config:
  description: Configure your Proxy302 API key
  secrets:
    - name: proxy302.api_key
      env: PROXY302_API_KEY
      example: <KEY_ID>:<SECRET>
