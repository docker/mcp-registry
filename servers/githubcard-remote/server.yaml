name: githubcard-remote
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - github
    - readme
    - cards
    - images
    - remote
about:
  title: GitHubCard
  description: Create GitHub profile and repository cards for READMEs, link previews and social posts.
  icon: https://www.google.com/s2/favicons?domain=githubcard.com&sz=64
remote:
  transport_type: streamable-http
  url: https://githubcard.com/mcp
  headers:
    Authorization: "Bearer ${GHCARD_API_KEY}"
config:
  description: API key from https://githubcard.com/dashboard (needed to create cards; browsing templates works without it).
  secrets:
    - name: githubcard-remote.api_key
      env: GHCARD_API_KEY
      example: ghc_live_…
