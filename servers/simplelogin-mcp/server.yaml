name: simplelogin-mcp
image: ghcr.io/enthouan/simplelogin-mcp:1.0.2
type: server
meta:
  category: productivity
  tags:
    - email
    - aliases
    - privacy
    - simplelogin
    - mcp
about:
  title: SimpleLogin
  description: Independent MCP server for SimpleLogin alias and account workflows.
  icon: https://simplelogin-mcp.com/favicon.svg
source:
  project: https://github.com/enthouan/simplelogin-mcp
  branch: main
  commit: c6e702b72a12c1612f67d9347b313e4d588865a2
config:
  description: Configure SimpleLogin API access for simplelogin-mcp.
  secrets:
    - name: simplelogin-mcp.sl_api_key
      env: SL_API_KEY
      example: sl-your-key-here
  env:
    - name: TRANSPORT
      value: stdio
    - name: SL_API_URL
      example: https://app.simplelogin.io
      value: "{{simplelogin-mcp.sl_api_url}}"
    - name: SL_REQUEST_TIMEOUT_MS
      example: "15000"
      value: "{{simplelogin-mcp.sl_request_timeout_ms}}"
  parameters:
    type: object
    properties:
      sl_api_url:
        type: string
        default: https://app.simplelogin.io
      sl_request_timeout_ms:
        type: string
        default: "15000"
