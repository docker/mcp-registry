name: ycli
image: mcp/ycli
type: server
meta:
  category: productivity
  tags:
    - yandex
    - tracker
    - wiki
    - forms
    - project-management
about:
  title: Yandex 360 (Tracker, Wiki, Forms)
  description: Read and write Yandex Tracker issues, Wiki pages and Forms surveys. Every tool says whether it only reads, writes or deletes.
  icon: https://avatars.githubusercontent.com/bim-ba?s=200&v=4
source:
  project: https://github.com/bim-ba/ycli
  commit: c92dc8ded1d52d5e25fef2f82d78a15b3612e983
config:
  description: A Yandex ID OAuth token and the Yandex 360 organization it works in
  secrets:
    - name: ycli.oauth_token
      env: YANDEX_ID_OAUTH_TOKEN
      example: y0_****
  env:
    - name: YANDEX_ID_ORGANIZATION_ID
      example: "1234567"
      value: "{{ycli.organization_id}}"
  parameters:
    type: object
    properties:
      organization_id:
        type: string
    required:
      - organization_id
