name: parcelapi
type: remote
meta:
  category: database
  tags:
    - real-estate
    - property
    - gis
    - building-permits
    - remote
about:
  title: ParcelAPI
  description: Pay-per-request US property parcel and building permit data for AI agents, covering 29 states. Free 1,000-credit trial.
  icon: https://www.google.com/s2/favicons?domain=parcelapi.net&sz=64
remote:
  transport_type: streamable-http
  url: https://api.parcelapi.net/mcp
  headers:
    X-API-Key: "${PARCELAPI_API_KEY}"
config:
  secrets:
    - name: parcelapi.api_key
      env: PARCELAPI_API_KEY
      example: <YOUR_API_KEY>
