name: retasc
type: remote
meta:
  category: productivity
  tags:
    - ai-agents
    - task-management
    - issue-tracker
    - remote
about:
  title: Retasc
  description: Retasc is a work queue for AI coding agents. Two agents can never hold the same issue.
  icon: https://retasc.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.retasc.com/mcp
  headers:
    Authorization: "Bearer ${RETASC_API_KEY}"
config:
  secrets:
    - name: retasc.api_key
      env: RETASC_API_KEY
      example: <YOUR_API_KEY>
