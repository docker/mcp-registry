name: xlide-mcp
image: mcp/xlide-mcp
type: server
meta:
  category: productivity
  tags:
    - excel
    - office
    - vba
    - powerquery
    - spreadsheet
about:
  title: XLIDE
  description: Read, write, analyze and test the VBA inside Excel, Word, PowerPoint and Access files, and edit the document around it. No Office installation needed.
  icon: https://avatars.githubusercontent.com/u/116382973?v=4
source:
  project: https://github.com/WilliamSmithEdward/xlide_mcp
  branch: main
  commit: 7aaa872a409c0bfa02ff901451d6e604de360818
run:
  command:
    - "{{xlide-mcp.paths|volume-target|into}}"
  volumes:
    - "{{xlide-mcp.paths|volume|into}}"
  disableNetwork: true
config:
  description: The MCP server is allowed to reach Office files under these paths
  parameters:
    type: object
    properties:
      paths:
        type: array
        items:
          type: string
        default:
          - /Users/local-test
    required:
      - paths
