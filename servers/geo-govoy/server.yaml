name: geo-govoy
type: remote
dynamic:
  tools: true
meta:
  category: maps
  tags:
    - maps
    - geocoding
    - routing
    - traffic
    - weather
    - spain
    - remote
about:
  title: Geo Govoy
  description: Spain-only street and road data for delivery routes - address geocoding, travel-time matrices by departure time, DGT traffic incidents and AEMET weather along the route
  icon: https://raw.githubusercontent.com/GovoySL/geo-govoy-mcp/main/assets/geo-icon-512.png
remote:
  transport_type: streamable-http
  url: https://geo.govoy.es/mcp
oauth:
  - provider: geo-govoy
    secret: geo-govoy.personal_access_token
    env: GEO_GOVOY_PERSONAL_ACCESS_TOKEN
