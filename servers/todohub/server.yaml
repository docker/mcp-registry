name: todohub
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - project-management
    - task-management
    - remote
about:
  title: TodoHub
  description: A free task manager for teams with AI. Create, change and move tasks, projects and comments in a task list you share with your AI app
  icon: https://todohub.work/images/icon-512.png
remote:
  transport_type: streamable-http
  url: https://todohub.work/mcp
oauth:
  - provider: todohub
    secret: todohub.personal_access_token
    env: TODOHUB_PERSONAL_ACCESS_TOKEN
