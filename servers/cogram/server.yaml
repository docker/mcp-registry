name: cogram
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - project-management
    - document-management
    - architecture
    - engineering
    - construction
    - remote
about:
  title: Cogram Project
  description: >-
    Connect AI agents to Cogram, the AI platform for architecture and
    engineering firms, for read-only access to the project record: projects,
    meetings, emails, RFIs, submittals, transmittals, drawings and field
    reports. The agent sees exactly what the connecting user can see, and
    cannot create, change or delete anything.
  icon: https://cogram.com/Cogram%20Logo%20-%20Production/cogram-icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.cogram.com/mcp
oauth:
  - provider: cogram
    secret: cogram.personal_access_token
    env: COGRAM_PERSONAL_ACCESS_TOKEN
