name: windsock
type: remote
meta:
  category: data
  tags:
    - aviation
    - aircraft
    - data
    - finance
    - remote
about:
  title: Windsock
  description: Aircraft intelligence for general aviation and business aircraft. Valuations with confidence bands, FAA registry lookup by tail number, cost of ownership, comparable aircraft, fleet search, airworthiness directives and STCs, market metrics with forecasts, verified value reports and logbook search. Free tier; paid plans unlock the full 38-tool catalog.
  icon: https://windsock.ai/logo.png
remote:
  transport_type: streamable-http
  url: https://windsock.ai/mcp
  headers:
    X-API-Key: "${WINDSOCK_API_KEY}"
config:
  secrets:
    - name: windsock.api_key
      env: WINDSOCK_API_KEY
      example: wsk_...
