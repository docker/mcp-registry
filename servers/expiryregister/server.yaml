name: expiryregister
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - reminders
    - compliance
    - remote
about:
  title: ExpiryRegister
  description: Track business expiry and renewal dates with named owners and email reminders that escalate to the next contact until someone acknowledges
  icon: https://expiryregister.com/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.expiryregister.com/mcp
oauth:
  - provider: expiryregister
    secret: expiryregister.personal_access_token
    env: EXPIRYREGISTER_PERSONAL_ACCESS_TOKEN
