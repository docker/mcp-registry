name: converter-studio
type: remote
meta:
  category: media
  tags:
    - media
    - file-conversion
    - video
    - documents
    - remote
about:
  title: Converter Studio
  description: Convert video, audio, images, PDFs, documents, e-books, subtitles, data and archives across 67 formats. Give a link or a file and get a download link back (kept for 6 hours).
  icon: https://raw.githubusercontent.com/tariksucu/converter-studio/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://converter.studio/api/mcp
  headers:
    Authorization: "Bearer ${CONVERTER_STUDIO_API_KEY}"
config:
  description: Create an API key at https://converter.studio/account#api-keys (keys start with cvs_live_). Free accounts get 13 credits a day; most files cost 1 credit.
  secrets:
    - name: converter-studio.api_key
      env: CONVERTER_STUDIO_API_KEY
      example: <YOUR_API_KEY>
