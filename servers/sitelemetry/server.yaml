name: sitelemetry
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - seo
    - accessibility
    - performance
    - website-audit
    - remote
about:
  title: Sitelemetry
  description: Audit websites you own for security, technical SEO, AI visibility, accessibility, performance and analytics tags, with evidence and a fix for each finding
  icon: https://sitelemetry.com/favicon.svg
remote:
  transport_type: streamable-http
  url: https://sitelemetry.com/mcp
oauth:
  - provider: sitelemetry
    secret: sitelemetry.personal_access_token
    env: SITELEMETRY_PERSONAL_ACCESS_TOKEN
