name: planningledger
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - planning
    - property
    - uk
    - government-data
    - remote
about:
  title: PlanningLedger
  description: Check the planning history of a UK property or site. Planning applications and their documents, officer reports, decision notices, decision counts, appeal decisions and Local Plan policies, with results linked to their sources. Read-only.
  icon: https://planningledger.com/static/brand/planningledger-icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.planningledger.com/mcp
oauth:
  - provider: planningledger
    secret: planningledger.personal_access_token
    env: PLANNINGLEDGER_PERSONAL_ACCESS_TOKEN
