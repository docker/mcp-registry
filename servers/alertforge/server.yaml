name: alertforge
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - design
    - streaming
    - video
    - remote
about:
  title: AlertForge
  description: Create stream overlays, AI alerts, and transparent videos. Account tools require a paid AlertForge subscription and generation credits.
  icon: https://alertforge.ai/icon-512.png
remote:
  transport_type: streamable-http
  url: https://alertforge.ai/api/mcp
oauth:
  - provider: alertforge
    secret: alertforge.personal_access_token
    env: ALERTFORGE_PERSONAL_ACCESS_TOKEN
