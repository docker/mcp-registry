name: okdata
type: remote
meta:
  category: data-analytics
  tags:
    - data-analytics
    - social-media
    - data-extraction
    - remote
about:
  title: Okdata
  description: Public data from 17 social and content platforms for AI agents, including Douyin, Xiaohongshu, WeChat, TikTok, X and YouTube. Find and describe endpoints for free, then pay per call; failed calls are free.
  icon: https://okdata.online/logo-512.png
remote:
  transport_type: streamable-http
  url: https://api.okdata.online/mcp
  headers:
    Authorization: "Bearer ${OKDATA_API_KEY}"
config:
  secrets:
    - name: okdata.api_key
      env: OKDATA_API_KEY
      example: <YOUR_API_KEY>
