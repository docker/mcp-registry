name: heylead
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - linkedin
    - outreach
    - lead-generation
    - sales
    - recruiting
    - job-search
    - remote
about:
  title: HeyLead
  description: "HeyLead is an AI agent for LinkedIn outreach: it finds the right people, writes to them in the voice of your own LinkedIn posts, follows up, and handles replies. It runs from Claude Code, Cursor, any MCP client or a web dashboard. A campaign has one of six goals: Sell a product or service, Find a job, Hire people, Find partners or investors, Find a vendor and Research interviews."
  icon: https://www.google.com/s2/favicons?domain=heylead.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://heylead.dev/mcp
oauth:
  - provider: heylead
    secret: heylead.personal_access_token
    env: HEYLEAD_PERSONAL_ACCESS_TOKEN
