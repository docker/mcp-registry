name: bannerproof
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - privacy
    - gdpr
    - cookie-consent
    - compliance
    - remote
about:
  title: Bannerproof
  description: Audit EU cookie consent on any website - trackers that load before consent, Reject all, Google Consent Mode v2, IAB TCF, with evidence and fixes
  icon: https://raw.githubusercontent.com/bannerproof/bannerproof/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://api.bannerproof.app/mcp
oauth:
  - provider: bannerproof
    secret: bannerproof.personal_access_token
    env: BANNERPROOF_PERSONAL_ACCESS_TOKEN
