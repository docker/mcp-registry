name: sokal
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - calendar
    - remote
about:
  title: SoKal
  description: Ask about your week, find a time that works for you and your friends, see what a friend is up to, and plan where to go with SoKal.
  icon: https://sokal.app/apple-touch-icon-v2.png
remote:
  transport_type: streamable-http
  url: https://mcp.sokal.app
oauth:
  - provider: sokal
    secret: sokal.personal_access_token
    env: SOKAL_PERSONAL_ACCESS_TOKEN
