name: monito
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - testing
    - browser
    - remote
about:
  title: Monito
  description: Check a deployed URL in a real browser and get a verdict with evidence
  icon: https://www.monito.dev/brand/monito-app-icon-512.png
remote:
  transport_type: streamable-http
  url: https://www.monito.dev/api/mcp
oauth:
  - provider: monito
    secret: monito.personal_access_token
    env: MONITO_PERSONAL_ACCESS_TOKEN
