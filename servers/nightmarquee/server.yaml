about:
  title: NightMarquee
  description: Cinematic website and mobile app build prompts, each with a live demo, tuned for Lovable, Bolt, Cursor, Claude and Codex. Signed-in accounts also get the footage each demo plays. Free prompts need no account.
  icon: https://raw.githubusercontent.com/nightmarquee/nightmarquee-mcp/main/icon.png
source:
  project: https://github.com/nightmarquee/nightmarquee-mcp
  branch: main
  commit: 682fac62f6c9a693c39603e530139f3b8ab5db8e
config:
  description: Free prompts work without configuration. An API token opens the prompts that need a plan, and footage; on a workstation, run the nightmarquee_sign_in tool instead.
  secrets:
    - name: nightmarquee.token
      env: NIGHTMARQUEE_TOKEN
      example: nm_live_...
      required: false
