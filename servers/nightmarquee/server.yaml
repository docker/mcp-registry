about:
  title: NightMarquee
  description: Cinematic website and mobile app build prompts, each with a live demo, tuned for Lovable, Bolt, Cursor, Claude and Codex. Signed-in accounts also get the footage each demo plays. Free prompts need no account.
  icon: https://raw.githubusercontent.com/ant-dev-lab/nightmarquee-mcp/main/icon.png
source:
  project: https://github.com/ant-dev-lab/nightmarquee-mcp
  branch: main
  commit: 55d260cfec90a3615f5d22c19ea74bf5c8c5a65a
config:
  description: Free prompts work without configuration. An API token unlocks Unlimited prompts and footage; on a workstation, run the nightmarquee_sign_in tool instead.
  secrets:
    - name: nightmarquee.token
      env: NIGHTMARQUEE_TOKEN
      example: nm_live_...
      required: false
