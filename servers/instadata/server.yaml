name: instadata
type: remote
meta:
  category: data-analytics
  tags:
    - instagram
    - research
    - remote
about:
  title: Instadata
  description: Public Instagram profiles, reels, comments, hashtags and ads as JSON. $5 per 1,000 credits; 25 free credits.
  icon: https://instadata.dev/icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.instadata.dev
  headers:
    Authorization: "Bearer ${INSTADATA_KEY}"
config:
  secrets:
    - name: instadata.api_key
      env: INSTADATA_KEY
      example: <YOUR_INSTADATA_API_KEY>
