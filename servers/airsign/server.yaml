name: airsign
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - e-signature
    - documents
    - australia
    - crm
    - compliance
    - remote
about:
  title: AirSign
  description: Australian e-signatures. Draft, prepare and track signing sessions, templates, forms and training. Documents are drafts until you approve sending.
  icon: https://airsign.com.au/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://api.airsign.com.au/mcp
oauth:
  - provider: airsign
    secret: airsign.personal_access_token
    env: AIRSIGN_PERSONAL_ACCESS_TOKEN
