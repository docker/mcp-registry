name: eno-vn
type: remote
meta:
  category: ecommerce
  tags:
    - ecommerce
    - marketplace
    - vietnam
    - remote
    - agentic-commerce
about:
  title: eno Agentic Commerce
  description: eno.vn's MCP server for AI agents that source, sell and promote - search listings, run a shop (listings, catalogue sync, analytics, webhooks), chat with buyers and buy ads
  icon: https://www.google.com/s2/favicons?domain=eno.vn&sz=64
remote:
  transport_type: streamable-http
  url: https://eno.vn/api/mcp
  headers:
    Authorization: "Bearer ${ENO_VN_API_KEY}"
config:
  secrets:
    - name: eno-vn.api_key
      env: ENO_VN_API_KEY
      example: <YOUR_API_KEY>
