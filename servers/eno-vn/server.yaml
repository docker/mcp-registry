name: eno-vn
type: remote
meta:
  category: ecommerce
  tags:
    - ecommerce
    - marketplace
    - vietnam
    - remote
about:
  title: eno.vn
  description: Run a shop on eno.vn, Vietnam's expat marketplace - listings, bulk catalogue sync, analytics and webhooks
  icon: https://www.google.com/s2/favicons?domain=eno.vn&sz=64
remote:
  transport_type: streamable-http
  url: https://eno.vn/api/mcp
  headers:
    Authorization: "Bearer ${ENO_VN_API_KEY}"
config:
  secrets:
    - name: eno-vn.api_key
      env: ENO_VN_API_KEY
      example: <YOUR_API_KEY>
