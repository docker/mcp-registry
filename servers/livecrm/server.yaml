name: livecrm
type: remote
dynamic:
  tools: true
meta:
  category: crm
  tags:
    - crm
    - salesforce
    - hubspot
    - sales
    - remote
about:
  title: LiveCRM
  description: "Salesforce and HubSpot operations with typed, audited tools: deduplication, normalization, enrichment, assignment, job changes, record creation, mass update and segmentation. Reads are free; every write needs a permission you grant and can be reversed."
  icon: https://livecrm.ai/assets/connector-icon.png
remote:
  transport_type: streamable-http
  url: https://api.livecrm.ai/mcp
oauth:
  - provider: livecrm
    secret: livecrm.personal_access_token
    env: LIVECRM_PERSONAL_ACCESS_TOKEN
