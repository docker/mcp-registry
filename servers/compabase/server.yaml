name: compabase
type: remote
meta:
  category: finance
  tags:
    - finance
    - company-data
    - poland
    - business-intelligence
    - remote
about:
  title: Compabase
  description: "3M+ Polish companies from KRS and CEIDG: financials, board members, rankings, tenders and public registries."
  icon: https://www.google.com/s2/favicons?domain=compabase.com&sz=64
remote:
  transport_type: streamable-http
  url: https://compabase.com/api/mcp
  headers:
    Authorization: "Bearer ${COMPABASE_MCP_KEY}"
config:
  secrets:
    - name: compabase.api_key
      env: COMPABASE_MCP_KEY
      example: mcpk_<YOUR_MCP_KEY>
