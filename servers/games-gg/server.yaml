name: games-gg
type: remote
dynamic:
  tools: true
meta:
  category: games
  tags:
    - gaming
    - games
    - remote
about:
  title: GAMES.GG
  description: Game guides, reviews, news, deals and release dates, plus saved games and redeem code alerts
  icon: https://games.gg/logos/g3-logo-sq.png
remote:
  transport_type: streamable-http
  url: https://mcp.games.gg/mcp
oauth:
  - provider: games-gg
    secret: games-gg.personal_access_token
    env: GAMES_GG_PERSONAL_ACCESS_TOKEN
