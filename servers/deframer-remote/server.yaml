name: deframer-remote
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - developer-tools
    - web-development
    - code-generation
    - nextjs
    - remote
about:
  title: Deframer
  description: Convert a published Framer website into a TypeScript code project (Next.js, TanStack Start, Astro, React Router, Vite, Nuxt or static HTML) with its pages, components, CMS content, fonts and animations.
  icon: https://www.google.com/s2/favicons?domain=deframer.co&sz=64
remote:
  transport_type: streamable-http
  url: https://deframer.co/mcp
oauth:
  - provider: deframer-remote
    secret: deframer-remote.personal_access_token
    env: DEFRAMER_PERSONAL_ACCESS_TOKEN
