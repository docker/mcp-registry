name: elaichi
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - integrations
    - governance
    - remote
about:
  title: Elaichi
  description: Connect your AI to 650+ work apps such as Salesforce, Slack and Gmail through one governed endpoint. Each person signs in as themselves, so their AI can do only what they're allowed to, and every action is logged.
  icon: https://elaichi.ai/brand/elaichi-favicon.png
remote:
  transport_type: streamable-http
  url: https://api.elaichi.ai/mcp
oauth:
  - provider: elaichi
    secret: elaichi.personal_access_token
    env: ELAICHI_PERSONAL_ACCESS_TOKEN
