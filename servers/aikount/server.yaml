name: aikount
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - accounting
    - invoicing
    - tax
    - spain
    - finance
    - remote
about:
  title: Aikount
  description: Spanish accounting for freelancers and small companies - issue invoices, record supplier invoices with AI, reconcile the bank, keep the PGC ledger and prepare the AEAT tax returns (303, 130, 111, 115, 390)
  icon: https://aikount.com/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://api.aikount.com/mcp
  headers:
    Authorization: "Bearer ${AIKOUNT_API_KEY}"
config:
  secrets:
    - name: aikount.api_key
      env: AIKOUNT_API_KEY
      example: agl_<YOUR_API_KEY>
