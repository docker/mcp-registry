name: recordwire
type: remote
meta:
  category: finance
  tags:
    - business-registry
    - secretary-of-state
    - kyb
    - company-data
    - new-businesses
    - webhooks
    - remote
about:
  title: Recordwire
  description: U.S. business-registry data and change events for agents.
  icon: https://recordwirehq.com/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://api.recordwirehq.com/mcp
  headers:
    Authorization: "Bearer ${RECORDWIRE_API_KEY}"
config:
  secrets:
    - name: recordwire.api_key
      env: RECORDWIRE_API_KEY
      example: <YOUR_API_KEY>
