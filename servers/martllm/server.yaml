name: martllm
type: remote
meta:
  category: ai
  tags:
    - ai
    - image-generation
    - video-generation
    - llm
    - remote
about:
  title: MartLLM
  description: Make images and videos, price a request before you run it, list AI models with their prices and read your balance, from one MartLLM API key.
  icon: https://martllm.com/favicon.svg
remote:
  transport_type: streamable-http
  url: https://api.martllm.com/mcp
  headers:
    Authorization: "Bearer ${MARTLLM_API_KEY}"
config:
  description: Your MartLLM API key (starts with ull_). Create one at https://martllm.com/dashboard/keys
  secrets:
    - name: martllm.api_key
      env: MARTLLM_API_KEY
      example: ull_<YOUR_API_KEY>
