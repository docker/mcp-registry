name: sendraven
type: remote
meta:
  category: communication
  tags:
    - email
    - communication
    - ai-agents
    - remote
about:
  title: SendRaven
  description: Email infrastructure for AI agents. Send from your own domain, read replies as threads, reply in the same conversation, and run campaigns, within the daily cap, recipient allowlist and approval hold set on the API key.
  icon: https://www.google.com/s2/favicons?domain=sendraven.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.sendraven.ai/mcp
  headers:
    Authorization: "Bearer ${SENDRAVEN_API_KEY}"
config:
  description: A SendRaven API key (dashboard, API keys). Its scopes and any daily cap, recipient allowlist or approval hold apply to every tool call.
  secrets:
    - name: sendraven.api_key
      env: SENDRAVEN_API_KEY
      example: sk_live_<YOUR_API_KEY>
