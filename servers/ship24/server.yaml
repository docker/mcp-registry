name: ship24
type: remote
meta:
  category: ecommerce
  tags:
    - ecommerce
    - logistics
    - shipping
    - package-tracking
    - remote
about:
  title: Ship24 Tracking
  description: Track parcels across 2,500+ carriers and 3PLs worldwide. Create and manage trackers, fetch live delivery status and full event history, look up carrier codes, and replay webhook deliveries.
  icon: https://cdn.ship24.com/assets/favicon/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://api.ship24.com/mcp
  headers:
    Authorization: "Bearer ${SHIP24_API_KEY}"
config:
  description: Provide a Ship24 API key. Tools can be listed without one, but calling them requires a key. Create a key at https://dashboard.ship24.com/integrations/api-keys
  secrets:
    - name: ship24.api_key
      env: SHIP24_API_KEY
      example: <YOUR_API_KEY>
