name: timesheet
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - time-tracking
    - timesheet
    - remote
about:
  title: Timesheet
  description: Track time with Timesheet. Start, pause and stop timers, log past work, manage projects, todos, expenses and absences, and pull statistics, reports and exports
