name: devdome
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - web-analytics
    - monitoring
    - wordpress
    - remote
about:
  title: DevDome
  description: Website traffic, human vs bot split, realtime visitors and site health for your DevDome sites.
  icon: https://www.google.com/s2/favicons?domain=devdome.com&sz=64
remote:
  transport_type: streamable-http
  url: https://analytics.devdome.com/mcp
  headers:
    Authorization: "Bearer ${DEVDOME_API_KEY}"
config:
  secrets:
    - name: devdome.api_key
      env: DEVDOME_API_KEY
      example: ddk_xxxxxxxxxxxxxxxx
