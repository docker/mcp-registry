name: keploy-remote
type: remote
meta:
  category: devops
  tags:
    - devops
    - testing
    - api-testing
    - remote
about:
  title: Keploy
  description: Generate, mock and run API tests from real traffic, OpenAPI specs, curl or Postman. Captures API, database and Kafka calls with eBPF and replays them as deterministic tests with auto-generated mocks.
  icon: https://avatars.githubusercontent.com/u/92252339?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://api.keploy.io/client/v1/mcp
  headers:
    X-API-Key: "${KEPLOY_REMOTE_API_KEY}"
config:
  secrets:
    - name: keploy-remote.api_key
      env: KEPLOY_REMOTE_API_KEY
      example: kep_xxxxxxxxxxxxxxxxxxxx
