name: forthcast-inventory
type: remote
dynamic:
  tools: true
meta:
  category: ecommerce
  tags:
    - ecommerce
    - shopify
    - inventory
    - forecasting
    - remote
about:
  title: Forthcast Inventory
  description: Reorder points, order quantities, demand forecasts and inventory health scoring. The calculators need no sign-in; live Shopify inventory, purchase-order and supplier data are read-only after OAuth.
  icon: https://www.forthcast.io/static/images/favicons/forthcast-favicon-180.png
remote:
  transport_type: streamable-http
  url: https://app.forthcast.io/mcp
oauth:
  - provider: forthcast-inventory
    secret: forthcast-inventory.personal_access_token
    env: FORTHCAST_INVENTORY_PERSONAL_ACCESS_TOKEN
