name: twittrapi
image: mcp/twittrapi
type: server
meta:
  category: search
  tags:
    - twitter
    - x
    - social-media
    - search
about:
  title: TwittrAPI
  description: Read public X (Twitter) data - search with X operators, profiles, timelines, followers, lists, communities and trends. No X developer account needed.
  icon: https://avatars.githubusercontent.com/u/340532162?v=4
source:
  project: https://github.com/twittrapi/twittrapi-mcp
  commit: 87d3c9c2afe9e2634d5be03402573666714548b9
run:
  command:
    - node
    - dist/index.js
  allowHosts:
    - api.twittrapi.com:443
config:
  description: Configure your TwittrAPI key
  secrets:
    - name: twittrapi.api_key
      env: TWITTRAPI_API_KEY
      example: <TWITTRAPI_API_KEY>
      description: Create a key at [twittrapi.com](https://www.twittrapi.com) (new accounts get test credit)
