name: anakin
type: remote
dynamic:
  tools: true
meta:
  category: web
  tags:
    - web-scraping
    - search
    - crawling
    - research
    - monitoring
    - browser-automation
    - remote
about:
  title: Anakin
  description: >-
    Web data for AI agents: scrape any URL to clean markdown or structured
    JSON, run AI-native search and multi-source deep research, execute
    pre-built read/write actions across hundreds of popular websites, watch
    pages for changes on a schedule, and drive a real cloud browser from
    natural language.
  icon: https://anakin.io/favicon.png
remote:
  transport_type: streamable-http
  url: https://mcp.anakin.io/mcp
oauth:
  - provider: anakin
    secret: anakin.personal_access_token
    env: ANAKIN_PERSONAL_ACCESS_TOKEN
source:
  project: https://github.com/Anakin-Inc/anakin-mcp
