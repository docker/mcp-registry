name: spritefuse
type: remote
dynamic:
  tools: true
meta:
  category: developer-tools
  tags:
    - sprites
    - animation
    - game-development
    - remote
about:
  title: SpriteFuse
  description: Create 2D game characters and animations, revise sprites, adjust frame timing, and export game assets
  icon: https://spritefuse.com/spritefuse/logo-mark.svg
remote:
  transport_type: streamable-http
  url: https://spritefuse.com/api/mcp
oauth:
  - provider: spritefuse
    secret: spritefuse.personal_access_token
    env: SPRITEFUSE_PERSONAL_ACCESS_TOKEN
