name: capawesome
type: remote
dynamic:
  tools: true
meta:
  category: documentation
  tags:
    - documentation
    - capacitor
    - mobile
    - remote
about:
  title: Capawesome
  description: Search the Capawesome documentation for the Capacitor plugins, Capawesome Cloud, Capawesome Insiders and the CLI, and with an API token manage Capawesome Cloud apps, channels, native builds, live updates, deployments and devices
  icon: https://capawesome.io/assets/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.capawesome.io/mcp?toolsets=all
  headers:
    Authorization: "Bearer ${CAPAWESOME_TOKEN}"
config:
  description: Optionally provide a Capawesome Cloud API token to enable the Capawesome Cloud management tools. Documentation search works without one. Create a token at https://console.cloud.capawesome.io/settings/tokens
  secrets:
    - name: capawesome.token
      env: CAPAWESOME_TOKEN
      example: <CAPAWESOME_TOKEN>
      required: false
