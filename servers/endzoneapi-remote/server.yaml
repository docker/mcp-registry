name: endzoneapi-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - football
    - nfl
    - sports-data
    - remote
about:
  title: EndzoneAPI
  description: "NFL player props by sportsbook since 2023, plus play-by-play with EPA, stats and odds. REST and MCP."
  icon: https://www.google.com/s2/favicons?domain=endzoneapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.endzoneapi.com/mcp
oauth:
  - provider: endzoneapi-remote
    secret: endzoneapi-remote.personal_access_token
    env: ENDZONEAPI_REMOTE_PERSONAL_ACCESS_TOKEN
