name: rudderstack
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - customer-data-platform
    - data-pipeline
    - event-streaming
    - data-observability
    - remote
about:
  title: RudderStack
  description: Debug RudderStack customer data pipelines, including delivery errors, tracking plan violations, failed warehouse loads and transformations
  icon: https://www.google.com/s2/favicons?domain=rudderstack.com&sz=64
source:
  project: https://github.com/rudderlabs/rudderstack-mcp
remote:
  transport_type: streamable-http
  url: https://mcp.rudderstack.com/mcp
oauth:
  - provider: rudderstack
    secret: rudderstack.personal_access_token
    env: RUDDERSTACK_PERSONAL_ACCESS_TOKEN
