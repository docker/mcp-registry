name: vivu
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - video
    - remote
about:
  title: Vivu
  description: Search your video library with natural language and retrieve relevant moments. Requires a Vivu account and OAuth authorization.
  icon: https://www.google.com/s2/favicons?domain=vivu.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.vivu.ai/mcp
oauth:
  - provider: vivu
    secret: vivu.personal_access_token
    env: VIVU_PERSONAL_ACCESS_TOKEN
