name: phase-router
type: remote
meta:
  category: ai
  tags:
    - ai
    - llm
    - model-router
    - remote
about:
  title: Phase Router
  description: OpenAI-compatible model router with about 400 models behind one API key. Tools to list models, quote prices, run chat and embeddings, and fetch the signed receipt of each call.
  icon: https://www.google.com/s2/favicons?domain=phase.xyz&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.ai.phase.xyz/mcp
  headers:
    Authorization: "Bearer ${PHASE_API_KEY}"
config:
  secrets:
    - name: phase-router.api_key
      env: PHASE_API_KEY
      example: <YOUR_API_KEY>
