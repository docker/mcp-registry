name: videodb
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - search
    - remote
about:
  title: VideoDB
  description: Video tools for agents. Watch, search, clip and caption video, and monitor live streams. Results come back as playable stream links.
  icon: https://videodb.io/assets/logos/videodb-mark.png
remote:
  transport_type: streamable-http
  url: https://mcp.videodb.io/mcp
oauth:
  - provider: videodb
    secret: videodb.personal_access_token
    env: VIDEODB_PERSONAL_ACCESS_TOKEN
