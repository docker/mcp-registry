name: ohdear-remote
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - uptime
    - ssl
    - devops
    - remote
about:
  title: Oh Dear
  description: Website monitoring for uptime, SSL certificates, broken links, DNS, cron jobs and status pages
  icon: https://www.google.com/s2/favicons?domain=ohdear.app&sz=64
remote:
  transport_type: streamable-http
  url: https://ohdear.app/mcp
oauth:
  - provider: ohdear-remote
    secret: ohdear-remote.personal_access_token
    env: OHDEAR_REMOTE_PERSONAL_ACCESS_TOKEN
