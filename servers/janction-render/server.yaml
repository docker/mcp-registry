name: janction-render
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - blender
    - 3d
    - rendering
    - gpu
    - remote
about:
  title: JANCTION Render
  description: Cloud GPU render farm for Blender that AI agents call as an MCP server. Send a .blend, a bpy script, a 3D file (glTF/FBX/USD/OBJ) or a Gaussian splat, preview in seconds with a verdict and the code to fix it, then get frames or an MP4 back from NVIDIA GPUs. No local Blender or GPU; new keys start with free GPU time and no card.
  icon: https://render.janction.jp/icon.png
remote:
  transport_type: streamable-http
  url: https://render.janction.jp/mcp
oauth:
  - provider: janction-render
    secret: janction-render.personal_access_token
    env: JANCTION_RENDER_PERSONAL_ACCESS_TOKEN
