name: bullion-api
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - precious-metals
    - market-data
    - remote
about:
  title: Bullion API
  description: Read-only gold and precious-metal prices, central-bank gold and macro data, with OAuth sign-in
  icon: https://www.google.com/s2/favicons?domain=bullionapi.dev&sz=64
remote:
  transport_type: streamable-http
  url: https://api.bullionapi.dev/mcp
oauth:
  - provider: bullion-api
    secret: bullion-api.personal_access_token
    env: BULLION_API_PERSONAL_ACCESS_TOKEN
