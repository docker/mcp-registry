name: appmanai
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - aso
    - app-store
    - google-play
    - keywords
    - remote
about:
  title: AppmanAi
  description: App Store & Google Play data for ASO — keyword rankings, search popularity, top charts, reviews and app metadata in 100+ countries.
  icon: https://appmanai.com/logo.png
remote:
  transport_type: streamable-http
  url: https://appmanai.com/api/mcp
oauth:
  - provider: appmanai
    secret: appmanai.personal_access_token
    env: APPMANAI_PERSONAL_ACCESS_TOKEN
