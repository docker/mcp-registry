name: deepledger
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - accounting
    - bookkeeping
    - quickbooks
    - xero
    - remote
about:
  title: DeepLedger
  description: The accounting harness for AI. Connect QuickBooks Online, Xero, Bill.com and Stripe (for reporting) through one MCP address to record transactions, run reports, reconcile and close the month, with review tasks and audit history
  icon: https://deepledger.ai/favicon-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.deepledger.ai/mcp
oauth:
  - provider: deepledger
    secret: deepledger.personal_access_token
    env: DEEPLEDGER_PERSONAL_ACCESS_TOKEN
