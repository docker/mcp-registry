name: tradeflags
type: remote
meta:
  category: finance
  tags:
    - finance
    - market-data
    - equities
    - trading
    - remote
about:
  title: TradeFlags MCP
  description: Authenticated market data for Hong Kong and US equities — breadth, signals, vol surfaces, and OTC pricing.
  icon: https://www.google.com/s2/favicons?domain=tradeflags.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.tradeflags.com/mcp
  headers:
    Authorization: "Bearer ${TRADEFLAGS_API_KEY}"
config:
  secrets:
    - name: tradeflags.api_key
      env: TRADEFLAGS_API_KEY
      example: tf_live_xxx
