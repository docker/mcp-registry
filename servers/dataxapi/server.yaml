name: dataxapi
type: remote
meta:
  category: data-analytics
  tags:
    - data-analytics
    - social-media
    - data-extraction
    - remote
about:
  title: DataXAPI
  description: Public posts, comments, creators, ads and trends from Douyin, Xiaohongshu, WeChat, TikTok, X, YouTube and more for AI agents. Find and describe endpoints for free, then pay per call; failed calls are not charged.
  icon: https://dataxapi.com/logo.png
remote:
  transport_type: streamable-http
  url: https://api.dataxapi.com/mcp
  headers:
    Authorization: "Bearer ${DATAXAPI_API_KEY}"
config:
  secrets:
    - name: dataxapi.api_key
      env: DATAXAPI_API_KEY
      example: <YOUR_API_KEY>
