name: agentcloud
type: remote
dynamic:
  tools: true
meta:
  category: developer-tools
  tags:
    - developer-tools
    - ios
    - mobile-development
    - testing
    - remote
about:
  title: AgentCloud
  description: Build, run, and inspect iOS apps in disposable hosted Simulators from cloud coding agents
  icon: https://agentcloud.so/agentcloud-mark.svg
remote:
  transport_type: streamable-http
  url: https://api.agentcloud.so/mcp
oauth:
  - provider: agentcloud
    secret: agentcloud.personal_access_token
    env: AGENTCLOUD_PERSONAL_ACCESS_TOKEN
