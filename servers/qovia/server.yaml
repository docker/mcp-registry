name: qovia
type: remote
meta:
  category: search
  tags:
    - social-media
    - search
    - china
    - remote
about:
  title: Qovia
  description: Structured JSON from public social media in China (Douyin, Xiaohongshu/RedNote, Bilibili, Weibo and 20+ more platforms) for AI agents.
  icon: https://www.google.com/s2/favicons?domain=qovia.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://api.qovia.ai/mcp
  headers:
    Authorization: "Bearer ${QOVIA_API_KEY}"
config:
  description: Create an API key at https://qovia.ai/account/ (new accounts include free trial calls).
  secrets:
    - name: qovia.api_key
      env: QOVIA_API_KEY
      example: <YOUR_API_KEY>
