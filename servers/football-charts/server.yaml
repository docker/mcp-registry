name: football-charts
type: remote
dynamic:
  tools: true
meta:
  category: data-visualization
  tags:
    - football
    - soccer
    - sports
    - statistics
    - remote
about:
  title: Football Charts
  description: >-
    Football statistics for 93 leagues as read-only MCP tools: standings,
    results, fixtures, goal timing by minute, Dixon-Coles match probabilities
    and daily Monte Carlo season projections. Free API key.
  icon: https://www.football-charts.com/fc_logo4.png
remote:
  transport_type: streamable-http
  url: https://mcp.football-charts.com/mcp
  headers:
    Authorization: "Bearer ${FC_API_KEY}"
config:
  description: Football Charts API key (free). Register at https://www.football-charts.com/developers or POST https://footballcharts-backend.onrender.com/api/v1/keys/register/ with your email.
  secrets:
    - name: football-charts.api_key
      env: FC_API_KEY
      example: fc_xxxxxxxxxxxxxxxxxxxx
      required: true
