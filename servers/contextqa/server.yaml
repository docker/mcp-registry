name: contextqa
type: remote
dynamic:
  tools: true
meta:
  category: developer-tools
  tags:
    - testing
    - quality-assurance
    - test-automation
    - remote
about:
  title: ContextQA
  description: Create and run application tests, inspect execution results and investigate failures in an authorized ContextQA workspace. Requires a ContextQA account and browser OAuth sign-in.
  icon: https://raw.githubusercontent.com/indivatools/contextqa-skills/4a67f1b297ba18f8253eaaf0f2195437965715b8/assets/contextqa-logo-square.svg
remote:
  transport_type: streamable-http
  url: https://mcp.contextqa.com/mcp
oauth:
  - provider: contextqa
    secret: contextqa.personal_access_token
    env: CONTEXTQA_PERSONAL_ACCESS_TOKEN
