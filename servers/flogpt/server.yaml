name: flogpt
type: remote
meta:
  category: communication
  tags:
    - communication
    - customer-support
    - crm
    - voice-ai
    - remote
about:
  title: FloGPT
  description: Operate your floGPT workspace from your assistant. Read call transcripts, diagnose voice agents, triage CRM tickets, close knowledge-base gaps and run outbound calling, scoped to one organization API key.
  icon: https://flogpt.com/images/flogpt-iso.png
remote:
  transport_type: streamable-http
  url: https://api.flogpt.com/mcp
  headers:
    Authorization: "Bearer ${FLOGPT_API_KEY}"
config:
  secrets:
    - name: flogpt.api_key
      env: FLOGPT_API_KEY
      example: <YOUR_FLOGPT_API_KEY>
