name: calotype
type: remote
meta:
  category: tools
  tags:
    - screenshot
    - browser
    - web
    - remote
about:
  title: Calotype
  description: See any public web page. One screenshot tool takes an http(s) URL and returns the rendered page as an image, with no browser to install. Free key for 100 screenshots a month.
  icon: https://calotype.dev/icon.png
remote:
  transport_type: streamable-http
  url: https://calotype.dev/mcp?ref=docker
  headers:
    Authorization: "Bearer ${CALOTYPE_API_KEY}"
config:
  secrets:
    - name: calotype.api_key
      env: CALOTYPE_API_KEY
      example: <YOUR_API_KEY>
