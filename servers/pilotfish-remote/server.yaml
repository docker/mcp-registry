name: pilotfish-remote
type: remote
dynamic:
  tools: true
meta:
  category: automation
  tags:
    - automation
    - browser-automation
    - web-scraping
    - remote
about:
  title: Pilotfish
  description: Run whole web tasks in a cloud browser, signed in with your saved logins. pilotfish handles one-time codes and bot checks, asks before payments or messages, and returns the answer with its cost.
  icon: https://www.google.com/s2/favicons?domain=pilotfish.gai.ventures&sz=64
remote:
  transport_type: streamable-http
  url: https://pilotfish-be.gai.ventures/mcp
  headers:
    Authorization: "Bearer ${PILOTFISH_API_KEY}"
config:
  secrets:
    - name: pilotfish-remote.api_key
      env: PILOTFISH_API_KEY
      example: <YOUR_API_KEY>
