name: call2me-remote
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - voice
    - phone
    - translation
    - remote
about:
  title: Call2Me
  description: Place real phone calls with AI voice agents, read call transcripts, run a live two-way interpreter in 31 languages, and search, buy and bind phone numbers.
  icon: https://www.google.com/s2/favicons?domain=call2me.app&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.call2me.app/mcp
oauth:
  - provider: call2me-remote
    secret: call2me-remote.personal_access_token
    env: CALL2ME_PERSONAL_ACCESS_TOKEN
