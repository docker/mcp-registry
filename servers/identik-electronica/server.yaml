name: identik-electronica
type: remote
meta:
  category: productivity
  tags:
    - e-signature
    - documents
    - legal
    - argentina
    - remote
about:
  title: Identik Firma Electrónica
  description: Argentine electronic signature under Ley 25.506 — create a document from a template, send it out for signature, track status, download the signed PDF with its audit certificate, and verify signatures cryptographically.
  icon: https://electronica.identik.me/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://electronica.identik.me/api/mcp
  headers:
    Authorization: "Bearer ${IDENTIK_ELECTRONICA_API_TOKEN}"
config:
  secrets:
    - name: identik-electronica.api_token
      env: IDENTIK_ELECTRONICA_API_TOKEN
      example: <YOUR_API_TOKEN>
