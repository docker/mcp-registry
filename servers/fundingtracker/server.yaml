name: fundingtracker
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - merchant-cash-advance
    - calculators
    - remote
about:
  title: FundingTracker
  description: Merchant cash advance (MCA) calculators, a public funder directory and MCA guides, plus sign-in access to your own deals, payments and alerts
  icon: https://fundingtracker.app/icon-512.png
remote:
  transport_type: streamable-http
  url: https://fundingtracker.app/api/mcp
oauth:
  - provider: fundingtracker
    secret: fundingtracker.personal_access_token
    env: FUNDINGTRACKER_PERSONAL_ACCESS_TOKEN
