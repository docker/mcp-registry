name: kling-ai-china
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - image-generation
    - video-generation
    - remote
about:
  title: Kling AI (China)
  description: Generate and edit images, create videos, and manage creative assets with the official Kling AI China MCP service. OAuth sign-in is required; generation uses credits from the matching China Kling account.
  icon: https://www.google.com/s2/favicons?domain=klingai.com&sz=64
remote:
  transport_type: streamable-http
  url: https://klingai.com/mcp/plugin
oauth:
  - provider: kling-ai-china
    secret: kling-ai-china.personal_access_token
    env: KLING_AI_CHINA_PERSONAL_ACCESS_TOKEN
