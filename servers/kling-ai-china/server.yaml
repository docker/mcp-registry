name: kling-ai-china
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - image-generation
    - video-generation
    - kling-ai
    - remote
about:
  title: Kling AI (China)
  description: Official Kling AI China MCP for image and video generation. Sign in with Kling OAuth; generation uses credits from the China Kling account.
  icon: https://www.google.com/s2/favicons?domain=klingai.com&sz=64
remote:
  transport_type: streamable-http
  url: https://klingai.com/mcp/plugin
oauth:
  - provider: kling-ai-china
    secret: kling-ai-china.personal_access_token
    env: KLING_AI_CHINA_PERSONAL_ACCESS_TOKEN
