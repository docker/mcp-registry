name: webz-news
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - research
    - remote
about:
  title: Webz.io News
  description: Search indexed news with Boolean queries and filters, returning article records with source links and available metadata
  icon: https://raw.githubusercontent.com/Webhose/webz-news-search/52db9198834a81fe8771f13596108da3ea357e11/packages/grok-plugin/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://news-mcp.webz.io/mcp
oauth:
  - provider: webz-news
    secret: webz-news.personal_access_token
    env: WEBZ_NEWS_PERSONAL_ACCESS_TOKEN
