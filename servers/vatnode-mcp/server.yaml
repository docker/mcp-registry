about:
  title: vatnode
  description: Official MCP server for vatnode. Validates EU VAT numbers against VIES and provides offline VAT rates, format checks and a supported-country list for 45 European countries. Four of the five tools work offline; validate_vat_number needs a vatnode API key.
  icon: https://vatnode.dev/icon.png
source:
  project: https://github.com/vatnode/vatnode-mcp
  commit: 81ea63f6d95307cf8a30b8844f3a0441b915213d
config:
  description: validate_vat_number calls the vatnode API and needs an API key. The other four tools run offline without one.
  secrets:
    - name: vatnode-mcp.api_key
      env: VATNODE_API_KEY
      example: <VATNODE_API_KEY>
