name: equibles
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - stocks
    - sec-filings
    - market-data
    - remote
about:
  title: Equibles
  description: Stock market data for AI agents. SEC filings and XBRL financial statements, earnings call transcripts, insider and congressional trades, 13F institutional holdings, short interest, ETF holdings, prices and economic indicators. Market-data tools are read-only; portfolio and watchlist tools write to the signed-in account.
  icon: https://www.google.com/s2/favicons?domain=equibles.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.equibles.com/mcp
oauth:
  - provider: equibles
    secret: equibles.personal_access_token
    env: EQUIBLES_PERSONAL_ACCESS_TOKEN
