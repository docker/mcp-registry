name: podwise
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - podcast
    - productivity
    - knowledge-management
    - transcription
    - remote
about:
  title: Podwise
  description: Turn any podcast episode into a transcript, summary and answerable knowledge for your agent
  icon: https://podwise.ai/podwise/podwise-mark.png
remote:
  transport_type: streamable-http
  url: https://mcp.podwise.ai/mcp
oauth:
  - provider: podwise
    secret: podwise.personal_access_token
    env: PODWISE_PERSONAL_ACCESS_TOKEN
