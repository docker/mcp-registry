name: fxsocket
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - trading
    - metatrader
    - market-data
    - remote
about:
  title: FxSocket
  description: >-
    Read-only access to hosted MetaTrader 4 and MetaTrader 5 trading accounts.
    Reads balance and equity, open positions and pending orders, closed-trade
    history, broker symbol search and contract specifications, live quotes and
    OHLC price history.
  icon: https://www.google.com/s2/favicons?domain=fxsocket.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.fxsocket.com/mcp
  headers:
    X-API-Key: "${FXSOCKET_API_KEY}"
config:
  description: Configure your FxSocket API key
  secrets:
    - name: fxsocket.api_key
      env: FXSOCKET_API_KEY
      example: <YOUR_API_KEY>
