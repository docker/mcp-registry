name: chorus-research
type: remote
dynamic:
    tools: true
meta:
    category: analytics
    tags:
        - market-research
        - surveys
        - remote
about:
    title: Chorus Research
    description: The Chorus Research MCP Server lets MCP-based agents and tools work with the Chorus Research survey platform. Agents can list audiences, create surveys, estimate cost and launch price, and check survey status. The hosted server never charges; for launches it returns a browser checkout link.
    icon: https://chorusresearch.io/favicon-96x96.png
remote:
    transport_type: streamable-http
    url: https://mcp.chorusresearch.io/mcp
oauth:
    - provider: chorus-research
      secret: chorus-research.personal_access_token
      env: CHORUS_RESEARCH_PERSONAL_ACCESS_TOKEN
