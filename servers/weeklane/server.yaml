name: weeklane
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - planner
    - tasks
    - todo
    - remote
about:
  title: Weeklane
  description: Plan your week in the Weeklane weekly to-do planner. Add, move, complete and search tasks, manage the backlog and repeating tasks, control Task Lock and undo the last change. Requires Weeklane Pro.
  icon: https://mcp.weeklane.app/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.weeklane.app/mcp
oauth:
  - provider: weeklane
    secret: weeklane.personal_access_token
    env: WEEKLANE_PERSONAL_ACCESS_TOKEN
