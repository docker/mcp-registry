about:
  title: FactLot
  description: Deterministic commercial real estate calculators for AI agents (rent schedules, net effective rent, CAM reconciliation, debt sizing, loan amortization, DCF, direct capitalization, equity waterfalls, ASC 842 remeasurement, prepayment and defeasance, NPV/IRR, hotel metrics) that return every step, warnings and a versioned formula ID, plus lease document checks, canonical IDs for parcels, entities and documents, and fact validation. Runs offline; no API key.
