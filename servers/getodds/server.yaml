name: getodds
type: remote
meta:
  category: data-analytics
  tags:
    - sports
    - odds
    - prediction-markets
    - remote
about:
  title: GetOdds
  description: "Multi-book sports odds for agents: live and historical game lines and player props from DraftKings, FanDuel, BetRivers, Pinnacle, Novig, PrizePicks, Underdog and Pick6 in one call, plus Kalshi and Polymarket prices, line history and closing lines."
  icon: https://getoddsapi.com/assets/getodds-mark.svg
remote:
  transport_type: streamable-http
  url: https://getoddsapi.com/api/mcp
  headers:
    Authorization: "Bearer ${GETODDS_API_KEY}"
config:
  secrets:
    - name: getodds.api_key
      env: GETODDS_API_KEY
      example: <YOUR_API_KEY>
