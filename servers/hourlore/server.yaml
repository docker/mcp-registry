name: hourlore
type: remote
meta:
  category: ai
  tags:
    - ai
    - video
    - remote
about:
  title: Hourlore
  description: AI documentary maker for faceless channels: type a topic and get a narrated 15-minute 1080p film.
  icon: https://raw.githubusercontent.com/hourlore/hourlore-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://hourlore.com/mcp
  headers:
    Authorization: "Bearer ${HOURLORE_API_KEY}"
config:
  secrets:
    - name: hourlore.api_key
      env: HOURLORE_API_KEY
      example: <YOUR_API_KEY>
