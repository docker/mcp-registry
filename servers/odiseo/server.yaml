name: odiseo
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - seo
    - content-marketing
    - wordpress
    - shopify
    - remote
about:
  title: Odiseo
  description: Research, plan, draft, review and publish WordPress and Shopify SEO content with domain-scoped permissions
  icon: https://www.odiseo.help/brand-logo.png
remote:
  transport_type: streamable-http
  url: https://www.odiseo.help/api/mcp
oauth:
  - provider: odiseo
    secret: odiseo.personal_access_token
    env: ODISEO_PERSONAL_ACCESS_TOKEN
