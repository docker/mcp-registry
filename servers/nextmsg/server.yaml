name: nextmsg
image: mcp/nextmsg
type: server
meta:
  category: communication
  tags:
    - notifications
    - push-notifications
    - mobile
    - communication
about:
  title: NextMsg
  description: Send push notifications to your phone from AI agents. The notify_human tool tells you when a task finishes, fails or needs your attention, through the free NextMsg app for iPhone and Android (no account or email).
  icon: https://avatars.githubusercontent.com/u/343997101?s=200&v=4
source:
  project: https://github.com/nextmsg-app/mcp
  commit: 07404b31b6c6efaac5417206f33969abba0c029e
run:
  allowHosts:
    - api.nextmsg.app:443
config:
  description: Paste the send key from the NextMsg app (Settings → Send key)
  secrets:
    - name: nextmsg.key
      env: NEXTMSG_KEY
      example: nextmsg_live_YOUR_KEY_HERE
