name: photo2skin
type: remote
dynamic:
  tools: true
meta:
  category: games
  tags:
    - games
    - minecraft
    - image-generation
    - creative
    - remote
about:
  title: Photo2Skin
  description: >-
    AI tools for Minecraft: make and edit skins by chatting, from a photo or a
    description, plus AI builds, texture packs, pixel art and real-world maps.
    Not affiliated with Mojang or Microsoft.
  icon: https://raw.githubusercontent.com/photo2skin/photo2skin-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.photo2skin.com/mcp
oauth:
  - provider: photo2skin
    secret: photo2skin.personal_access_token
    env: PHOTO2SKIN_PERSONAL_ACCESS_TOKEN
