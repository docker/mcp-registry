name: toolgate
type: remote
dynamic:
  tools: true
meta:
  category: tools
  tags:
    - tools
    - aggregator
    - search
    - remote
about:
  title: Scribase Toolgate
  description: One key for 27 schema-typed tools (18 free); every call is priced in micro-USD before it runs and billed only on success.
  icon: https://raw.githubusercontent.com/caelum0x/toolgate/main/docs/logo.png
remote:
  transport_type: streamable-http
  url: https://toolgate.scribase.com/mcp
  headers:
    Authorization: "Bearer ${TOOLGATE_API_KEY}"
config:
  description: Get a free key (no card) with `npx -y github:caelum0x/toolgate signup --org <name>` or POST https://toolgate.scribase.com/v1/auth/signup
  secrets:
    - name: toolgate.api_key
      env: TOOLGATE_API_KEY
      example: sk-t0-xxxxxxxxxxxx
