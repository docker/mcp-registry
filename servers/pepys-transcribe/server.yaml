name: pepys-transcribe
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - transcription
    - remote
about:
  title: Pepys Transcribe
  description: Transcribe audio, video, and podcast episodes, search timestamped transcripts, and export SRT or VTT captions.
  icon: https://raw.githubusercontent.com/ankurmans/pepys-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://pepys.co/api/mcp
oauth:
  - provider: pepys-transcribe
    secret: pepys-transcribe.personal_access_token
    env: PEPYS_TRANSCRIBE_PERSONAL_ACCESS_TOKEN
