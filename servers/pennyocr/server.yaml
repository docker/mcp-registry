name: pennyocr
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - ocr
    - pdf
    - document-processing
    - remote
about:
  title: PennyOCR
  description: Read PDFs and images as Markdown or text with exact per-call costs and hard spend caps. Requires a PennyOCR API key.
  icon: https://www.google.com/s2/favicons?domain=pennyocr.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.pennyocr.com
  headers:
    Authorization: "Bearer ${PENNYOCR_API_KEY}"
config:
  secrets:
    - name: pennyocr.api_key
      env: PENNYOCR_API_KEY
      example: <YOUR_API_KEY>
      description: API key from https://pennyocr.com/dashboard/
