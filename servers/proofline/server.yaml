name: proofline
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - code-review
    - remote
about:
  title: Proofline
  description: Read Proofline review status, findings and review guidance, and request or rerun reviews.
  icon: https://proofline.sh/proofline-mark.svg
remote:
  transport_type: streamable-http
  url: https://proofline.sh/mcp
oauth:
  - provider: proofline
    secret: proofline.personal_access_token
    env: PROOFLINE_PERSONAL_ACCESS_TOKEN
