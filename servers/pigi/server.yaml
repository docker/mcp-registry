about:
  title: Pigi Finance
  description: DeFi vault intelligence — query 2,000+ vaults across 25+ protocols and 14 EVM chains with risk bands and scores, APR/APY and TVL history, risk-adjusted yield, DeFi base rates and hack/exploit data
  icon: https://pigi.finance/favicon-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.pigi.finance/api/mcp
oauth:
  - provider: pigi
    secret: pigi.personal_access_token
    env: PIGI_PERSONAL_ACCESS_TOKEN
