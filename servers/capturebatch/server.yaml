name: capturebatch
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - screenshots
    - web-archive
    - productivity
    - remote
about:
  title: CaptureBatch
  description: >-
    Screenshot many web pages at once, desktop and mobile, full page or
    viewport, PNG or PDF. Save lists as collections, capture them daily,
    weekly or monthly, and read a dated history of every page for 12 months.
  icon: https://capturebatch.com/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.capturebatch.com/mcp
oauth:
  - provider: capturebatch
    secret: capturebatch.personal_access_token
    env: CAPTUREBATCH_PERSONAL_ACCESS_TOKEN
