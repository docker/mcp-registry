name: desearch
type: remote
meta:
  category: search
  tags:
    - search
    - web-search
    - ai
    - remote
about:
  title: Desearch
  description: AI search, X search and web search for AI agents. Search the web, X posts and other sources through the hosted Desearch MCP server.
  icon: https://raw.githubusercontent.com/Desearch-ai/mcp-desearch/main/assets/desearch-logo-400.png
remote:
  transport_type: streamable-http
  url: https://mcp.desearch.ai/mcp
  headers:
    Authorization: "Bearer ${DESEARCH_API_KEY}"
config:
  description: Provide your Desearch API key from https://console.desearch.ai
  secrets:
    - name: desearch.api_key
      env: DESEARCH_API_KEY
      example: <YOUR_API_KEY>
