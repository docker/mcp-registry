name: invoice
image: mcp/invoice
type: server
meta:
  category: finance
  tags:
    - finance
    - invoicing
    - pdf
    - billing
    - vat
    - freelance
about:
  title: Invoice
  description: Creates real PDF invoices from a chat instruction. Stores the issuer profile and clients, allocates a sequential invoice number that is never reused, computes discount, one tax line per VAT rate and the total in integer minor units, renders an A4 PDF, records full or partial payments and reports what is overdue. All records are plain JSON files inside the container volume.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/04c187eddd48ed4ecb32ee47d2202b77cb46f96d/assets/invoice-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: 04c187eddd48ed4ecb32ee47d2202b77cb46f96d
  dockerfile: servers/invoice/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: invoice.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
