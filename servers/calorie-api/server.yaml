name: calorie-api
type: remote
meta:
  category: search
  tags:
    - search
    - nutrition
    - food
    - health
    - remote
about:
  title: Calorie API
  description: Look up calories and macros from a catalog of about 4 million foods. Search foods, read barcodes, scale portions, total recipes, set macro targets and estimate meal photos.
  icon: https://calorieapi.com/logos/busybody-logo-email.png
remote:
  transport_type: streamable-http
  url: https://calorieapiadmin.com/mcp/
  headers:
    X-API-Key: "${CALORIE_API_KEY}"
config:
  description: Provide your Calorie API key. Keys come from the dashboard after you start the MCP plan or the 7-day trial at https://calorieapi.com/mcp/pricing.
  secrets:
    - name: calorie-api.api_key
      env: CALORIE_API_KEY
      example: fn_<YOUR_API_KEY>
