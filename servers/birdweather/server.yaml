name: birdweather
image: mcp/birdweather
type: server
meta:
  category: data-analytics
  tags:
    - data-analytics
    - birds
    - birdweather
    - birdnet
    - bioacoustics
    - nature
about:
  title: BirdWeather
  description: Query BirdWeather station data, including detections, top species, daily counts, species trends, new arrivals, hourly activity, station comparisons, and nearby stations. It works with the public BirdWeather API, and a station token is optional.
  icon: https://www.google.com/s2/favicons?domain=birdweather.com&sz=64
source:
  project: https://github.com/pfrederiksen/birdweather-mcp
  commit: c5cf7a8994f847c8ce11779b5f0726cf33054f55
config:
  description: Optionally add a BirdWeather station token to get richer REST fields. The server works without one, using the public GraphQL API.
  secrets:
    - name: birdweather.station_token
      env: BIRDWEATHER_STATION_TOKEN
      example: <YOUR_STATION_TOKEN>
      required: false
