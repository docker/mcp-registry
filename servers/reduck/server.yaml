name: reduck
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - browser-automation
    - web-automation
    - productivity
    - remote
about:
  title: Reduck
  description: Reduck MCP allows agents to discover, run and create browser automation scripts that serve as tools. Scripts run in your own Chrome, through our extension, so your agent works where you are logged in.
