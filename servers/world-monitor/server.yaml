name: world-monitor
type: remote
dynamic:
  tools: true
meta:
  category: news
  tags:
    - news
    - geopolitics
    - markets
    - osint
    - remote
about:
  title: World Monitor
  description: Real-time global intelligence on conflict, markets, energy, trade, shipping and cyber
  icon: https://www.worldmonitor.app/favico/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://worldmonitor.app/mcp
oauth:
  - provider: world-monitor
    secret: world-monitor.personal_access_token
    env: WORLD_MONITOR_PERSONAL_ACCESS_TOKEN
