name: flow-relay
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - project-management
    - engineering
    - remote
about:
  title: Flow Relay
  description: Project context, handoffs, grounded Ask answers, work plans, forecasts and RAID registers from your team's connected tools.
  icon: https://raw.githubusercontent.com/flow-relay/flowrelay-agent-plugin/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://www.flowrelay.it/mcp
oauth:
  - provider: flow-relay
    secret: flow-relay.personal_access_token
    env: FLOW_RELAY_PERSONAL_ACCESS_TOKEN
