name: meetstream-remote
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - meetings
    - transcription
    - remote
about:
  title: MeetStream
  description: Send meeting bots to Zoom, Google Meet and Microsoft Teams to record and transcribe calls, then get transcripts, recordings, participants and chat, or act in a live meeting.
  icon: https://www.google.com/s2/favicons?domain=meetstream.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.meetstream.ai/mcp
oauth:
  - provider: meetstream-remote
    secret: meetstream-remote.personal_access_token
    env: MEETSTREAM_PERSONAL_ACCESS_TOKEN
