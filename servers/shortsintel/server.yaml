name: shortsintel
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - marketing
    - social-media
    - advertising
    - remote
about:
  title: ShortsIntel
  description: Short-form video and ad intelligence for TikTok, Instagram Reels, YouTube Shorts and Facebook. Research what works in a niche, track creators, hashtags, sounds and advertisers, and search the Meta and TikTok ad libraries.
  icon: https://www.google.com/s2/favicons?domain=shortsintel.com&sz=64
remote:
  transport_type: streamable-http
  url: https://www.shortsintel.com/api/mcp
  headers:
    Authorization: "Bearer ${SHORTSINTEL_API_KEY}"
config:
  secrets:
    - name: shortsintel.api_key
      env: SHORTSINTEL_API_KEY
      example: <YOUR_API_KEY>
