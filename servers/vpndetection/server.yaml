name: vpndetection
type: remote
meta:
  category: security
  tags:
    - security
    - ip-intelligence
    - vpn-detection
    - remote
about:
  title: VPNDetection
  description: VPN, proxy, Tor, hosting and CDN detection for any IP address, from the VPNDetection API.
  icon: https://www.google.com/s2/favicons?domain=vpndetection.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.vpndetection.io/mcp
  headers:
    Authorization: "Bearer ${VPNDETECTION_API_KEY}"
config:
  secrets:
    - name: vpndetection.api_key
      env: VPNDETECTION_API_KEY
      example: <YOUR_API_KEY>
