name: audiopod
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - audio
    - text-to-speech
    - transcription
    - remote
about:
  title: AudioPod AI
  description: Audio AI for agents - text-to-speech, voice cloning, music generation, stem separation, speaker separation, transcription, noise removal and media conversion over one hosted endpoint.
  icon: https://www.google.com/s2/favicons?domain=audiopod.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.audiopod.ai
  headers:
    X-API-Key: "${AUDIOPOD_API_KEY}"
config:
  description: Provide an AudioPod API key (starts with ap_) from https://www.audiopod.ai/dashboard/account/api-keys
  secrets:
    - name: audiopod.api_key
      env: AUDIOPOD_API_KEY
      example: <AUDIOPOD_API_KEY>
      required: true
