name: magnemo
image: mcp/magnemo
type: server
meta:
  category: ai
  tags:
    - memory
    - ai-agents
    - governance
    - local-first
    - python
about:
  title: Magnemo
  description: Memory with receipts for AI agents — agents stage, humans promote, provenance on every entry. Local, zero dependencies, Apache-2.0.
  icon: https://raw.githubusercontent.com/Magnemo-AI/magnemo/main/docs/assets/magnemo-400.png
source:
  project: https://github.com/Magnemo-AI/magnemo
  commit: e8cb31e19fe3cc3fe9364d63f7e759ad6cceddb7
run:
  volumes:
    - "{{magnemo.vault}}:/vault"
  disableNetwork: true
config:
  description: Mount a folder as the vault (plain markdown you own).
  parameters:
    type: object
    properties:
      vault:
        type: string
        description: Folder to keep the vault in; an empty folder is fine
        default: /Users/local-test/magnemo-vault
    required:
      - vault
