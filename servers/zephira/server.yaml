name: zephira
type: remote
meta:
  category: database
  tags:
    - company-data
    - ownership
    - financials
    - remote
about:
  title: Zephira Company Intelligence
  description: Search company records, officers, shareholders, corporate groups and available financial statements with source provenance through six read-only tools. Coverage varies by company and jurisdiction. Requires your own Zephira dashboard MCP key and allowance.
  icon: https://www.google.com/s2/favicons?domain=zephira.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://dashboard.zephira.ai/api/mcp
  headers:
    Authorization: "Bearer ${ZEPHIRA_API_KEY}"
config:
  description: Obtain an active production dashboard MCP key at https://dashboard.zephira.ai/. MCP Bearer keys are separate from API v2 Token credentials. See https://zephira.ai/developers/mcp/ for setup and scopes.
  secrets:
    - name: zephira.api_key
      env: ZEPHIRA_API_KEY
      example: zph_live_your_dashboard_mcp_key
      description: Active production Zephira dashboard MCP API key. Keep this in the client secret store.
      required: true
