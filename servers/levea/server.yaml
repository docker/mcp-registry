name: levea
type: remote
meta:
  category: video
  tags:
    - video
    - video-editing
    - captions
    - media
    - remote
about:
  title: Levea AI Video Editor
  description: Prompt-first autonomous AI video editor — viral clips, word-by-word captions, 9:16 reframe, chroma key, B-roll, voiceover, music and MP4 export from a plain-language brief
  icon: https://raw.githubusercontent.com/brajendrak00068/agentic-ai-video-production/main/assets/logo-icon.png
remote:
  transport_type: streamable-http
  url: https://api.livecore.ai/api/v1/misc/mcp
  headers:
    Authorization: "Bearer ${LEVEA_API_KEY}"
config:
  secrets:
    - name: levea.api_key
      env: LEVEA_API_KEY
      example: <YOUR_LEVEA_API_KEY>
