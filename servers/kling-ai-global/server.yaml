name: kling-ai-global
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - image-generation
    - video-generation
    - remote
about:
  title: Kling AI (Global)
  description: Generate and edit images, create videos, and manage creative assets with the official Kling AI Global MCP service. OAuth sign-in is required; generation uses credits from the matching Global Kling account.
  icon: https://www.google.com/s2/favicons?domain=kling.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://kling.ai/mcp/plugin
oauth:
  - provider: kling-ai-global
    secret: kling-ai-global.personal_access_token
    env: KLING_AI_GLOBAL_PERSONAL_ACCESS_TOKEN
