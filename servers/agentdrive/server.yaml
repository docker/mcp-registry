name: agentdrive
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - file-storage
    - files
    - remote
about:
  title: agentdrive
  description: Persistent file storage for AI agents. Save, list, read and delete files, and get a browser link for each file that a person can open
  icon: https://www.google.com/s2/favicons?domain=useagentdrive.com&sz=64
remote:
  transport_type: streamable-http
  url: https://useagentdrive.com/mcp
oauth:
  - provider: agentdrive
    secret: agentdrive.personal_access_token
    env: AGENTDRIVE_PERSONAL_ACCESS_TOKEN
