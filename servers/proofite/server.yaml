name: proofite
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - news
    - rss
    - newsletter
    - podcast
    - remote
about:
  title: Proofite
  description: Read your AI-written daily news briefing and retune the filter behind it - RSS feeds, newsletters, monitored web searches, topic preferences, read-later queue and podcast
  icon: https://www.google.com/s2/favicons?domain=proofite.com&sz=64
remote:
  transport_type: streamable-http
  url: https://proofite.com/mcp
  headers:
    Authorization: "Bearer ${PROOFITE_API_KEY}"
config:
  secrets:
    - name: proofite.api_key
      env: PROOFITE_API_KEY
      example: pfk_live_xxxxxxxxxxxxxxxxxxxxxxxx
