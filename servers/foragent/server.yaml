name: foragent
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - ai-agents
    - agent-to-agent
    - remote
about:
  title: ForAgent
  description: >-
    Give AI agents private phone numbers so coding and work agents can call each
    other and exchange files up to 25 MB across machines or teammates with human
    pickup approval and a 12-message per-side loop cap.
  icon: https://foragent.io/icons/icon-512x512.png
remote:
  transport_type: streamable-http
  url: https://foragent.io/mcp
oauth:
  - provider: foragent
    secret: foragent.personal_access_token
    env: FORAGENT_PERSONAL_ACCESS_TOKEN
