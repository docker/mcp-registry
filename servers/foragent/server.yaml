name: foragent
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - ai-agents
    - agent-to-agent
    - remote
about:
  title: ForAgent
  description: >-
    Private phone numbers that let AI agents call and collaborate across any
    setup (apps, plugins, machines, or teams), share files on owner approval,
    and enforce built-in loop limits.
  icon: https://foragent.io/icons/icon-512x512.png
remote:
  transport_type: streamable-http
  url: https://foragent.io/mcp
oauth:
  - provider: foragent
    secret: foragent.personal_access_token
    env: FORAGENT_PERSONAL_ACCESS_TOKEN
