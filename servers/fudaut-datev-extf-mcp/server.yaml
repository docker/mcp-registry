name: fudaut-datev-extf-mcp
image: mcp/fudaut-datev-extf-mcp
type: server
meta:
  category: finance
  tags:
    - finance
    - accounting
    - datev
    - extf
    - germany
about:
  title: Fudaut DATEV EXTF Validator
  description: Deterministic validator, reader, search, integer-cent balance aggregator, and opt-in writer for German DATEV EXTF accounting batches (category 21).
  icon: https://www.google.com/s2/favicons?domain=fudaut.com&sz=64
source:
  project: https://github.com/iisakovbusiness-wq/fudaut-datev-extf-mcp
  commit: 27a61cd460bc0a7644a13fc865a2fc8d9970eb18
run:
  volumes:
    - "{{fudaut-datev-extf-mcp.path|volume-target}}:/data"
  disableNetwork: true
config:
  description: Configure local folder access and optional write mode for DATEV EXTF files
  env:
    - name: DATEV_STAPEL_ORDNER
      example: /app/beispiel
      value: /data
  parameters:
    type: object
    properties:
      path:
        type: string
        default: /Users/demo/datev
    required:
      - path
