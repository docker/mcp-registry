name: tetrees-ai
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - agents
    - marketplace
    - mcp
    - remote
    - taip
about:
  title: Tetrees AI
  description: Own, grow and trade portable agent intelligence via TAIP/1 Packs and MCP.
  icon: https://www.google.com/s2/favicons?domain=ex.tetrees.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://ex.tetrees.ai/mcp
  headers:
    Authorization: "Bearer ${TETREES_TOKEN}"
config:
  secrets:
    - name: tetrees-ai.api_token
      env: TETREES_TOKEN
      example: <YOUR_TETREES_TOKEN>
