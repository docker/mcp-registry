name: monitly
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - statistics
    - economics
    - open-data
    - remote
about:
  title: Monitly
  description: Official statistics for AI agents: Eurostat, World Bank, OECD, IMF and WHO datasets for 150+ countries.
  icon: https://www.google.com/s2/favicons?domain=monit.ly&sz=64
remote:
  transport_type: streamable-http
  url: https://monit.ly/api/mcp
  headers:
    Authorization: "Bearer ${MONITLY_MCP_KEY}"
config:
  secrets:
    - name: monitly.api_key
      env: MONITLY_MCP_KEY
      example: mcpk_<YOUR_MCP_KEY>
