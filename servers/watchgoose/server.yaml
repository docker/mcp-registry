name: watchgoose
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - cron
    - scheduled-jobs
    - heartbeat
    - remote
about:
  title: Watchgoose
  description: Monitor cron jobs, backups, systemd timers and Kubernetes CronJobs. Check status and history, and create, pause or update heartbeat checks with explicit consent
  icon: https://watchgoose.com/static/img/watchgoose-icon-512.png
remote:
  transport_type: streamable-http
  url: https://mcp.watchgoose.com/mcp
oauth:
  - provider: watchgoose
    secret: watchgoose.personal_access_token
    env: WATCHGOOSE_PERSONAL_ACCESS_TOKEN
