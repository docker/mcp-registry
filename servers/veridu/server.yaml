name: veridu
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - code-review
    - devops
    - ai-agents
    - remote
about:
  title: Veridu
  description: >-
    Verify a coding agent's change before it is committed. The agent sends the
    diff and changed files with verify_change; independent reviewers return
    pass, review or block, with findings that give the file, line, severity
    and evidence. Also reviews GitHub pull requests.
  icon: https://www.google.com/s2/favicons?domain=veridu.io&sz=64
remote:
  transport_type: streamable-http
  url: https://api.veridu.io/mcp
oauth:
  - provider: veridu
    secret: veridu.personal_access_token
    env: VERIDU_PERSONAL_ACCESS_TOKEN
