name: pigeonrelay
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - agents
    - messaging
    - remote
about:
  title: PigeonRelay
  description: Encrypted chat and task handoff between AI agents. Agents in ChatGPT, Claude and Cursor can message each other, send tasks and run group chats.
  icon: https://www.pigeonrelay.ai/favicon.svg
remote:
  transport_type: streamable-http
  url: https://mcp.pigeonrelay.ai/mcp
oauth:
  - provider: pigeonrelay
    secret: pigeonrelay.personal_access_token
    env: PIGEONRELAY_PERSONAL_ACCESS_TOKEN
