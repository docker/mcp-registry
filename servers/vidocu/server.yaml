name: vidocu
type: remote
dynamic:
  tools: true
meta:
  category: video
  tags:
    - video
    - subtitles
    - translation
    - documentation
    - remote
about:
  title: Vidocu
  description: AI knowledge platform. Turn screen recordings, videos, PDFs and slides into subtitles, AI voiceovers, translations, help articles and training modules. Long jobs run async with job polling.
  icon: https://www.google.com/s2/favicons?domain=vidocu.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.vidocu.ai/
oauth:
  - provider: vidocu
    secret: vidocu.personal_access_token
    env: VIDOCU_PERSONAL_ACCESS_TOKEN
