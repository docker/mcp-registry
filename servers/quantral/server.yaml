name: quantral
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - stocks
    - sentiment
    - investing
    - remote
about:
  title: Quantral
  description: >-
    Stock sentiment scores (0-100) per company from the retail investor and
    market commentator sources Quantral tracks, plus top signals, monthly
    recaps and the mentions behind each score. Read-only; Quantral
    subscription required.
  icon: https://app.quantral.com/mcp-icon.png?v=2
remote:
  transport_type: streamable-http
  url: https://app.quantral.com/api/mcp
oauth:
  - provider: quantral
    secret: quantral.personal_access_token
    env: QUANTRAL_PERSONAL_ACCESS_TOKEN
