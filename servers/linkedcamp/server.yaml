name: linkedcamp
type: remote
meta:
  category: productivity
  tags:
    - crm
    - sales
    - marketing
    - remote
about:
  title: LinkedCamp
  description: Run LinkedIn and email outreach campaigns, triage replies in the unified inbox, manage prospects and pull client reports from your AI assistant. 133 tools; destructive ones are annotated so clients confirm first.
  icon: https://www.google.com/s2/favicons?domain=linkedcamp.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.linkedcamp.com/mcp
  headers:
    X-Api-Key: "${LINKEDCAMP_API_KEY}"
config:
  secrets:
    - name: linkedcamp.api_key
      env: LINKEDCAMP_API_KEY
      example: <YOUR_API_KEY>
