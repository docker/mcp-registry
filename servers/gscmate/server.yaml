name: gscmate
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - google-search-console
    - analytics
    - seo
    - remote
about:
  title: GSCmate
  description: Read Google Search Console properties, Search Analytics, sitemaps, insights, and URL inspection through a read-only OAuth 2.1 remote MCP server.
  icon: https://gscmate.com/favicon.svg
remote:
  transport_type: streamable-http
  url: https://gscmate.com/mcp
oauth:
  - provider: gscmate
    secret: gscmate.access_token
    env: GSCMATE_ACCESS_TOKEN