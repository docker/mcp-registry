name: postonce
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - communication
    - social-media
    - scheduling
    - remote
about:
  title: PostOnce
  description: Schedule, publish and crosspost to TikTok, Instagram, YouTube, X, LinkedIn, Facebook, Threads, Bluesky and Pinterest, manage drafts and automations, and read post analytics
  icon: https://www.google.com/s2/favicons?domain=postonce.to&sz=64
remote:
  transport_type: streamable-http
  url: https://postonce.to/mcp
oauth:
  - provider: postonce
    secret: postonce.personal_access_token
    env: POSTONCE_PERSONAL_ACCESS_TOKEN
