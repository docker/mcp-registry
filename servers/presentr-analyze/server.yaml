name: presentr-analyze
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - media
    - subtitles
    - remote
about:
  title: Presentr Analyze
  description: >-
    Translate and re-time subtitles, read text aloud, dub media and pull text
    out of scanned PDFs and photos. Jobs that cost credits return a quote you
    confirm first.
  icon: https://www.google.com/s2/favicons?domain=analyze.presentr.me&sz=64
remote:
  transport_type: streamable-http
  url: https://analyze.presentr.me/api/mcp
oauth:
  - provider: presentr-analyze
    secret: presentr-analyze.personal_access_token
    env: PRESENTR_ANALYZE_PERSONAL_ACCESS_TOKEN
