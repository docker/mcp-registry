name: presentr-analyze
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - media
    - text-to-speech
    - subtitles
    - remote
about:
  title: Presentr Analyze
  description: >-
    Read text aloud in 48 languages (text to speech as an MP3), transcribe
    audio and video, extract and translate text from PDFs and scans, translate
    and re-time subtitles, and dub audio or video. Jobs that cost credits
    return a quote you confirm first.
  icon: https://www.google.com/s2/favicons?domain=analyze.presentr.me&sz=64
remote:
  transport_type: streamable-http
  url: https://analyze.presentr.me/api/mcp
oauth:
  - provider: presentr-analyze
    secret: presentr-analyze.personal_access_token
    env: PRESENTR_ANALYZE_PERSONAL_ACCESS_TOKEN
