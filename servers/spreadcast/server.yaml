name: spreadcast
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - social-media
    - marketing
    - scheduling
    - remote
about:
  title: Spreadcast
  description: Design, write, schedule and publish social media posts to Instagram, Facebook, LinkedIn, TikTok, YouTube, Threads, Pinterest, Bluesky, Mastodon, Telegram and Discord, in your own brand
  icon: https://www.google.com/s2/favicons?domain=spreadcast.app&sz=64
remote:
  transport_type: streamable-http
  url: https://spreadcast.app/api/mcp
oauth:
  - provider: spreadcast
    secret: spreadcast.personal_access_token
    env: SPREADCAST_PERSONAL_ACCESS_TOKEN
