name: repomemory
type: remote
meta:
  category: devops
  tags:
    - developer-tools
    - memory
    - ai-agents
    - remote
about:
  title: RepoMemory
  description: Shared project memory for coding agents. Decisions, lessons, guardrails and tasks per repository, read by Claude Code, Cursor, Codex and other agents before they change code.
  icon: https://raw.githubusercontent.com/Plexsicity/repomemory-plugin/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://api.repomemory.dev/mcp
  headers:
    X-API-Key: "${REPOMEMORY_API_KEY}"
config:
  description: Your RepoMemory API key, from https://repomemory.dev/dashboard/keys (free plan, no card).
  secrets:
    - name: repomemory.api_key
      env: REPOMEMORY_API_KEY
      example: <YOUR_API_KEY>
