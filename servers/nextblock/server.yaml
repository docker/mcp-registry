name: nextblock
type: remote
dynamic:
  tools: true
meta:
  category: web
  tags:
    - web
    - cms
    - website-builder
    - nextjs
    - supabase
    - remote
about:
  title: NextBlock CMS
  description: Manage pages, posts, blocks, media, navigation and settings of a NextBlock site, the open-source CMS and website builder for Next.js and Supabase, from any MCP client
  icon: https://nextblock.dev/favicon/android-chrome-192x192.png
remote:
  transport_type: streamable-http
  url: https://cms.nextblock.dev/api/mcp
  headers:
    Authorization: "Bearer ${NEXTBLOCK_MCP_TOKEN}"
config:
  description: Create an MCP access token in your NextBlock CMS (Settings > Cortex AI > MCP server access) and paste it here
  secrets:
    - name: nextblock.mcp_token
      env: NEXTBLOCK_MCP_TOKEN
      example: <YOUR_NEXTBLOCK_MCP_TOKEN>
