name: lobstr
type: remote
meta:
  category: web-scraping
  tags:
    - web-scraping
    - data
    - search
    - remote
about:
  title: Lobstr.io
  description: "Structured data from websites for AI agents: Google Maps, realtor.com, X and more, one call each."
  icon: https://www.lobstr.io/images/favicon-512x512.png
remote:
  transport_type: streamable-http
  url: https://api.lobstr.io/v2/mcp
  headers:
    Authorization: "Bearer ${LOBSTR_API_KEY}"
config:
  description: "Configure your lobstr.io API key, from https://app.lobstr.io/dashboard/api"
  secrets:
    - name: lobstr.api_key
      env: LOBSTR_API_KEY
      example: <YOUR_API_KEY>
