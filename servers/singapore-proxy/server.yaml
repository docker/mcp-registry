name: singapore-proxy
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - search
    - proxy
    - remote
about:
  title: Singapore Proxy
  description: Fetch pages, run Singapore-localized Google searches and rotate the IP through real Singapore mobile connections on Singtel or M1. Free 24-hour trial key, then $4/day or $13/week.
  icon: https://www.google.com/s2/favicons?domain=singaporemobileproxy.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.singaporemobileproxy.com/mcp
  headers:
    x-api-key: "${SMP_API_KEY}"
config:
  description: Get an API key (free 24-hour trial) at https://singaporemobileproxy.com/client/mcp
  secrets:
    - name: singapore-proxy.api_key
      env: SMP_API_KEY
      example: <YOUR_API_KEY>
