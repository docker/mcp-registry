name: kanban
image: mcp/kanban
type: server
meta:
  category: productivity
  tags:
    - productivity
    - kanban
    - todo
    - tasks
    - project-management
about:
  title: Kanban
  description: A local task board per project -- columns, due dates, estimates, priorities and a link into your time tracker. Say "add a task to the nova site board, due Friday" or "what's overdue?" and it just works. No upload, no account, everything stays on your machine.
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/8418a5639808a7fffea96f07862dc85318800b0b/assets/kanban-logo.png
source:
  project: https://github.com/theluckystrike/mcp-servers
  branch: main
  commit: 8418a5639808a7fffea96f07862dc85318800b0b
  dockerfile: servers/kanban/Dockerfile
config:
  description: Optional Pro license key. The server is fully usable without it.
  secrets:
    - name: kanban.license_key
      env: MCP_LICENSE_KEY
      example: <MCP_LICENSE_KEY>
      required: false
