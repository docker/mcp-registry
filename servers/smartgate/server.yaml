name: smartgate
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - research
    - remote
about:
  title: SmartGate
  description: Hosted MCP: search, fetch, compress, dedup, budget, memory, pipelines. Not an LLM proxy.
  icon: https://raw.githubusercontent.com/smartgate-network/smartgate-workflows/main/assets/logo.png
source:
  project: https://github.com/smartgate-network/smartgate-workflows
remote:
  transport_type: streamable-http
  url: https://smartgate.network/api/mcp
  headers:
    Authorization: "Bearer ${SMARTGATE_API_KEY}"
    X-SmartGate-Agent-Platform: docker
config:
  description: SmartGate Dashboard API key
  secrets:
    - name: smartgate.api_key
      env: SMARTGATE_API_KEY
      example: sk_live_REPLACE_WITH_YOUR_KEY
