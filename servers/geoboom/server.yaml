name: geoboom
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - seo
    - outreach
    - remote
about:
  title: GEOboom
  description: Link building and mention outreach from your AI agent, with the permissions the owner approves.
