name: sunglasses
image: mcp/sunglasses
type: server
meta:
  category: security
  tags:
    - security
    - prompt-injection
    - mcp
about:
  title: Sunglasses
  description: Local input firewall for AI agents. Scans text and files for prompt injection, credential leaks and data exfiltration before an agent reads them. No network, no API key.
  icon: https://sunglasses.dev/favicon-512.png
source:
  project: https://github.com/sunglasses-dev/sunglasses
  branch: main
  commit: d7a32e43ded824938fe5d7d59f5764edbe93a731
run:
  volumes:
    - "{{sunglasses.paths|volume|into}}"
  disableNetwork: true
config:
  description: Folders the scan_file tool may read. scan_text needs none.
  parameters:
    type: object
    properties:
      paths:
        type: array
        items:
          type: string
        default:
          - /Users/local-test
