name: traderspy
type: remote
meta:
  category: finance
  tags:
    - finance
    - crypto
    - trading
    - market-data
    - remote
about:
  title: TraderSpy
  description: Read-only crypto futures market data. AI trading signals with realised outcomes, whale positions across Binance, Hyperliquid, Bybit and OKX, prices, candles, 19 technical indicators, funding and open interest, a market screener and a condition backtester. It cannot place, close or modify an order.
  icon: https://traderspy.app/favicon.png
remote:
  transport_type: streamable-http
  url: https://mcp.traderspy.app/mcp
  headers:
    Authorization: "Bearer ${TRADERSPY_API_KEY}"
config:
  secrets:
    - name: traderspy.api_key
      env: TRADERSPY_API_KEY
      example: <YOUR_MCP_KEY>
