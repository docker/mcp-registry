name: kling-ai-china-plugin
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - image-generation
    - video-generation
    - kling-ai
    - remote
about:
  title: Kling AI China Plugin
  description: Official Kling AI China MCP plugin for image and video generation. Sign in with Kling OAuth; generation uses credits from the China Kling account.
  icon: https://www.google.com/s2/favicons?domain=klingai.com&sz=64
remote:
  transport_type: streamable-http
  url: https://klingai.com/mcp/plugin
oauth:
  - provider: kling-ai-china-plugin
    secret: kling-ai-china-plugin.personal_access_token
    env: KLING_AI_CHINA_PLUGIN_PERSONAL_ACCESS_TOKEN
