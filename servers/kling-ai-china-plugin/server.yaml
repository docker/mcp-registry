name: kling-ai-china-plugin
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - image-generation
    - video-generation
    - remote
    - oauth
    - china
about:
  title: Kling AI China Plugin
  description: Generate images and videos, including Kling 4.0 native 4K and optional 10-bit HDR where supported by the account’s live MCP tools. OAuth uses China account credits.
  icon: https://klingai.com/favicon.ico
remote:
  transport_type: streamable-http
  url: https://klingai.com/mcp/plugin
oauth:
  - provider: kling-ai-china-plugin
    secret: kling-ai-china-plugin.personal_access_token
    env: KLING_AI_CHINA_PLUGIN_PERSONAL_ACCESS_TOKEN
