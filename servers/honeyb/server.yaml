name: honeyb
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - seo
    - ai-search
    - brand-monitoring
    - remote
about:
  title: Honeyb
  description: AI search visibility for agents. Ask ChatGPT, Google AI Overviews, Google AI Mode, Gemini, Claude, Perplexity, Grok and DeepSeek your buyers' questions, read which brands and sources each answer names, and check Google rankings.
  icon: https://www.honeyb.ai/favicon.png
remote:
  transport_type: streamable-http
  url: https://platform.honeyb.ai/mcp
  headers:
    Authorization: "Bearer ${HONEYB_API_KEY}"
config:
  secrets:
    - name: honeyb.api_key
      env: HONEYB_API_KEY
      example: <YOUR_API_KEY>
