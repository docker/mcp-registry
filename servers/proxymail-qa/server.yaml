name: proxymail-qa
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - testing
    - email
    - qa
    - remote
about:
  title: Proxy Mail QA
  description: Test inboxes for your app's sign-up, login-code, magic-link and password-reset emails. Get an address, the code the moment it arrives, and why an email didn't come.
  icon: https://proxymail.qa/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.proxymail.qa/mcp
oauth:
  - provider: proxymail-qa
    secret: proxymail-qa.personal_access_token
    env: PROXYMAIL_QA_PERSONAL_ACCESS_TOKEN
