name: nexteverything
type: remote
meta:
  category: ecommerce
  tags:
    - ecommerce
    - electronics
    - hardware
    - remote
about:
  title: Next Everything
  description: Find electronic parts with live Mouser, DigiKey and JLCPCB stock and prices, check BOMs and prepare orders.
  icon: https://www.google.com/s2/favicons?domain=nexteverything.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.nexteverything.io/mcp
  headers:
    Authorization: "Bearer ${NEXTEVERYTHING_API_KEY}"
config:
  secrets:
    - name: nexteverything.api_key
      env: NEXTEVERYTHING_API_KEY
      example: <YOUR_API_KEY>
