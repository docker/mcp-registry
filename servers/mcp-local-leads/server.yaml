name: mcp-local-leads
image: mcp/mcp-local-leads
type: server
meta:
  category: search
  tags:
    - search
    - lead generation
    - google places
    - local business
    - prospecting
    - csv
about:
  title: Local Business Lead Finder
  description: >-
    Finds local businesses that appear on Google Maps but have no website, using the caller's own
    Google Places API (New) key. It reads the websiteUri field Google already returns, dedupes by
    placeId across up to 3 pages, returns only the places with no website and can export them to CSV.
    Read-only, no scraping, no third-party data broker.
  icon: https://raw.githubusercontent.com/ellokillox/mcp-local-leads/main/assets/icon-400.png
source:
  project: https://github.com/ellokillox/mcp-local-leads
  branch: main
  commit: 2fea2ee0272151d1d22defe23ab45ffe71f1c3fd
config:
  description: Set your own Google Places API (New) key (billing enabled)
  secrets:
    - name: mcp-local-leads.places_api_key
      env: GOOGLE_PLACES_API_KEY
      example: your-google-places-api-key
