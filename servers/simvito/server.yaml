name: simvito
type: remote
dynamic:
  tools: true
meta:
  category: travel
  tags:
    - travel
    - esim
    - mobile-data
    - remote
about:
  title: Simvito
  description: Compare travel eSIM plans and each local network (4G/5G), check phone eSIM support, and get payment links for prepaid data plans
  icon: https://www.google.com/s2/favicons?domain=simvito.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.simvito.com/mcp?src=docker
oauth:
  - provider: simvito
    secret: simvito.personal_access_token
    env: SIMVITO_PERSONAL_ACCESS_TOKEN
