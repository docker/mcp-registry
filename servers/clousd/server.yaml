name: clousd
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - android
    - mobile-testing
    - ai-agents
    - remote
about:
  title: Clousd
  description: Cloud Android phones for AI agents - give a phone a task in plain words, or drive the screen step by step (screenshot with numbered elements, tap, swipe, type) on 150+ real device models
  icon: https://www.google.com/s2/favicons?domain=clousd.com&sz=128
remote:
  transport_type: streamable-http
  url: https://api.clousd.com/mcp
oauth:
  - provider: clousd
    secret: clousd.personal_access_token
    env: CLOUSD_PERSONAL_ACCESS_TOKEN
