name: beyourcover
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - design
    - image-generation
    - books
    - remote
about:
  title: BeYourCover
  description: Design AI book covers, Amazon KDP print wraps and audiobook covers from a title, genre and summary, and download the account's existing covers
  icon: https://beyourcover.com/icon.png
remote:
  transport_type: streamable-http
  url: https://beyourcover.com/api/mcp
oauth:
  - provider: beyourcover
    secret: beyourcover.personal_access_token
    env: BEYOURCOVER_PERSONAL_ACCESS_TOKEN
