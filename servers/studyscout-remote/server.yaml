name: studyscout-remote
type: remote
meta:
  category: marketing
  tags:
    - marketing
    - research
    - surveys
    - remote
about:
  title: StudyScout for Business
  description: Order paid studies with US adults (surveys, video ad tests, AI interviews, usability tests) and read the results
  icon: https://www.joinstudyscout.com/icon-512.png
remote:
  transport_type: streamable-http
  url: https://www.joinstudyscout.com/api/mcp
  headers:
    Authorization: "Bearer ${STUDYSCOUT_REMOTE_API_KEY}"
config:
  secrets:
    - name: studyscout-remote.api_key
      env: STUDYSCOUT_REMOTE_API_KEY
      example: <YOUR_API_KEY>
