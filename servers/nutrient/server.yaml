name: nutrient
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - documents
    - pdf
    - data-extraction
    - ocr
    - remote
about:
  title: Nutrient
  description: >-
    Extract fields with citations, parse documents to Markdown, classify,
    convert, OCR, sign, and redact PDFs and Office documents with Nutrient's
    hosted document APIs. Sign in with a Nutrient account; nothing to install.
  icon: https://www.google.com/s2/favicons?domain=nutrient.io&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.nutrient.io/mcp
oauth:
  - provider: nutrient
    secret: nutrient.personal_access_token
    env: NUTRIENT_PERSONAL_ACCESS_TOKEN
