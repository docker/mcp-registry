name: spider
type: remote
meta:
  category: search
  tags:
    - web-scraping
    - crawling
    - search
    - browser-automation
    - remote
about:
  title: Spider
  description: Crawl, scrape and search the web from your agent. Spider returns pages as clean markdown or structured JSON, picks a plain request or a headless browser per page, and rotates proxies. Remote browser tools let the agent open, click, fill and screenshot pages.
  icon: https://avatars.githubusercontent.com/u/112983871?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.spider.cloud/mcp
  headers:
    Authorization: "Bearer ${SPIDER_API_KEY}"
config:
  description: Create an API key at https://spider.cloud/api-keys
  secrets:
    - name: spider.api_key
      env: SPIDER_API_KEY
      example: <YOUR_API_KEY>
