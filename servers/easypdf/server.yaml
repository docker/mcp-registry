name: easypdf
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - pdf
    - documents
    - remote
about:
  title: EasyPDF
  description: Edit the text of a PDF in place with its original fonts and layout kept, and compress, merge, split, convert or translate PDFs
  icon: https://www.google.com/s2/favicons?domain=easypdf.fr&sz=64
remote:
  transport_type: streamable-http
  url: https://www.easypdf.fr/mcp
oauth:
  - provider: easypdf
    secret: easypdf.personal_access_token
    env: EASYPDF_PERSONAL_ACCESS_TOKEN
