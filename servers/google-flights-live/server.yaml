name: google-flights-live
type: remote
meta:
  category: travel
  tags:
    - travel
    - flights
    - search
    - remote
about:
  title: Google Flights Search (Real-Time Fares)
  description: Search real-time Google Flights fares. A single call expands a departure-date range and a list of destination airports, and every result carries Google's own price-insight range with a low/typical/high verdict plus a booking link.
  icon: https://www.google.com/s2/favicons?domain=flightpowers.com&sz=64
remote:
  transport_type: streamable-http
  url: https://google-flights-mcp.flightpowers.com/mcp
  headers:
    x-rapidapi-key: "${RAPIDAPI_KEY}"
config:
  description: Requires your own RapidAPI key for the Google Flights Live API. A free tier is available at https://rapidapi.com/mtnrabi/api/google-flights-live-api
  secrets:
    - name: google-flights-live.api_key
      env: RAPIDAPI_KEY
      example: <YOUR_RAPIDAPI_KEY>
