name: buildcord-remote
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - discord
    - bots
    - no-code
    - remote
about:
  title: Buildcord
  description: Build and change Discord bots by describing them, from slash commands and events to embeds, modals and data
  icon: https://buildcord.dev/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.buildcord.dev/mcp
oauth:
  - provider: buildcord-remote
    secret: buildcord-remote.personal_access_token
    env: BUILDCORD_REMOTE_PERSONAL_ACCESS_TOKEN
