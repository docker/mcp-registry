name: ethora
image: mcp/ethora
type: server
meta:
  category: communication
  tags:
    - ethora
    - chat
    - messaging
    - ai-agents
about:
  title: Ethora
  description: Manage chat apps, rooms and users on the Ethora messaging platform, broadcast messages, and deploy AI agents and RAG chatbots.
  icon: https://avatars.githubusercontent.com/u/63907257?v=4
source:
  project: https://github.com/dappros/ethora-mcp-server
  commit: 5e5058ed4f81bd3093dc57a3183765fc9e69473f
config:
  description: Configure the connection to your Ethora server
  secrets:
    - name: ethora.app_jwt
      env: ETHORA_APP_JWT
      example: JWT eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
    - name: ethora.b2b_token
      env: ETHORA_B2B_TOKEN
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
  env:
    - name: ETHORA_API_URL
      example: https://api.chat.ethora.com/v1
      value: "{{ethora.api_url}}"
  parameters:
    type: object
    properties:
      api_url:
        type: string
