name: socialpostflow
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - social-media
    - scheduling
    - marketing
    - productivity
    - remote
about:
  title: Social Post Flow
  description: Schedule and publish social media posts to Facebook, X, LinkedIn, Instagram, Threads, Pinterest, TikTok, Bluesky, Mastodon and more
  icon: https://www.google.com/s2/favicons?domain=socialpostflow.com&sz=64
remote:
  transport_type: streamable-http
  url: https://app.socialpostflow.com/mcp
oauth:
  - provider: socialpostflow
    secret: socialpostflow.personal_access_token
    env: SOCIALPOSTFLOW_PERSONAL_ACCESS_TOKEN
