name: souschef
image: mcp/souschef
type: server
meta:
  category: devops
  tags:
    - souschef
    - devops
    - ansible
    - chef
    - migration
about:
  title: SousChef
  description: Multi-platform to Ansible migration and Ansible upgrade planning MCP server.
  icon: https://avatars.githubusercontent.com/u/2867691?v=4
source:
  project: https://github.com/kpeacocke/souschef
  branch: main
  commit: 0b1b0fa19df3bd5f0a13deaad18cac9e86c3af82
run:
  volumes:
    - "{{souschef.workspace}}:/workspace"
config:
  description: Choose a dedicated migration workspace containing inputs and generated output.
  env:
    - name: SOUSCHEF_WORKSPACE_ROOT
      example: /workspace
      value: /workspace
  parameters:
    type: object
    properties:
      workspace:
        type: string
        description: Absolute host directory to mount read-write at /workspace.
    required:
      - workspace
