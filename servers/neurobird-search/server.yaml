about:
    title: Neurobird Search
    description: Web search for AI agents that returns ranked results with the relevant page passages already extracted, so a follow up fetch is usually unnecessary. Results are fused across several search engines with reciprocal rank fusion. When a grounded answer is requested, every supporting quote is matched back against its source text, and a quote that fails the match is returned marked unverified rather than silently dropped. A second tool converts any URL to clean markdown with navigation and boilerplate removed. Free tier of 1,000 credits a month, issued without a signup form.
    icon: https://search.neurobird.com/assets/img/neurobird-logo.png
