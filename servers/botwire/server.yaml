about:
  title: The Bot Wire
  description: "301 real-time data wires read from primary sources rather than a crawler's index of them. SEC EDGAR filings, the Federal Reserve and ECB, BLS and BEA economic releases, federal court opinions, congressional bills, DOJ, FDA, CISA advisories and CVEs, USGS earthquakes, NWS severe weather, arXiv, NASA, EIA energy and federal contract awards, alongside news, markets, technology and industry trade press. Each wire advertises the question it answers, so an agent can route to the right one without guessing. The MCP endpoint is discovery only and returns the catalogue with no items; data is paid per call at $0.005 to $0.01 USDC on Base over x402, with no API key and no signup."
  icon: https://www.google.com/s2/favicons?domain=thebotwire.com&sz=64
