  title: code402-verify
  description: Deterministically verify code402 XDR-1 receipts — keccak-256 over the canonical receipt, secp256k1 signer recovery, compared to the declared signer. Free, stateless, no account; the verifier holds no keys and performs no settlement. Every code402 result carries a signed receipt; this checks the proof.
