about:
    title: FlexYield
    description: Multi-chain RPC gateway and toolbox for agents — one key, one meter, one bill across six mainnets (Ethereum, Base, Arbitrum, Optimism, Polygon, Solana) with automatic multi-provider failover. 35 verb-first tools — JSON-RPC relay, gas, transaction status, ENS, on-chain prices, ABIs, calldata decoding, per-key budgets, statements, a switching report — plus an agent menu that needs no key (get_key issues a capability key without signup). Publicly measured status.
