name: justtranscribe
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - transcription
    - speech-to-text
    - audio
    - video
    - remote
about:
  title: JustTranscribe
  description: Transcribe audio, video and public links (YouTube, TikTok, Instagram) into timestamped text in 59 languages, then export it as SRT, VTT, TXT or Markdown
  icon: https://justtranscribe.ai/icon.png
remote:
  transport_type: streamable-http
  url: https://justtranscribe.ai/api/mcp
oauth:
  - provider: justtranscribe
    secret: justtranscribe.personal_access_token
    env: JUSTTRANSCRIBE_PERSONAL_ACCESS_TOKEN
