name: kosa8
type: remote
meta:
  category: devops
  tags:
    - devops
    - sandbox
    - code-execution
    - microvm
    - remote
about:
  title: Kosa8 Cloud
  description: Sealed Linux sandboxes (microVMs) for AI agents on kosa8 Cloud. Run commands, move files, preview ports, snapshot, checkpoint, rewind and fork a sandbox.
  icon: https://www.google.com/s2/favicons?domain=kosa8.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.kosa8.com/mcp
  headers:
    Authorization: "Bearer ${KOSA8_API_KEY}"
config:
  secrets:
    - name: kosa8.api_key
      env: KOSA8_API_KEY
      example: <YOUR_API_KEY>
