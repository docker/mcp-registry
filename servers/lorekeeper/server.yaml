name: lorekeeper
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - ttrpg
    - dnd
    - worldbuilding
    - knowledge
    - remote
about:
  title: LoreKeeper
  description: Ask your own D&D and tabletop RPG campaigns about their lore, session recaps, NPCs and character portraits, from your LoreKeeper account
  icon: https://www.google.com/s2/favicons?domain=lorekeeper.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.lorekeeper.com/mcp
oauth:
  - provider: lorekeeper
    secret: lorekeeper.personal_access_token
    env: LOREKEEPER_PERSONAL_ACCESS_TOKEN
