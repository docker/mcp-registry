name: pangolinfo-amazon-data
type: remote
dynamic:
  tools: true
meta:
  category: ecommerce
  tags:
    - amazon
    - ecommerce
    - data
    - market-research
    - web-scraping
    - remote
about:
  title: Pangolinfo Amazon Data
  description: >-
    Official Pangolinfo service with 19 read-only business tools for live Amazon
    product, keyword, review, seller, Best Sellers, New Releases, category and
    niche research; Amazon Rufus shopping recommendations; Google SERP, AI
    Overview, Trends and Maps data; and WIPO design-patent and related US
    litigation-risk research.
  icon: https://raw.githubusercontent.com/Pangolin-spg/amazon-data-mcp/main/assets/pangolinfo-128.png
remote:
  transport_type: streamable-http
  url: https://mcp.pangolinfo.com/mcp
  headers:
    Authorization: "Bearer ${PANGOLINFO_API_KEY}"
config:
  description: Configure access to the Pangolinfo Amazon Data MCP service.
  secrets:
    - name: pangolinfo-amazon-data.api_key
      env: PANGOLINFO_API_KEY
      example: <YOUR_PANGOLINFO_API_KEY>
