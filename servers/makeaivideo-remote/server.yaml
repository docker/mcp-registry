name: makeaivideo-remote
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - content-creation
    - ai
    - remote
about:
  title: MakeAIVideo
  description: Turn a brief or your own script into a finished short-form AI video with voiceover, AI or stock scenes, captions and music for TikTok, Reels and YouTube Shorts
  icon: https://www.google.com/s2/favicons?domain=makeaivideo.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.makeaivideo.ai
oauth:
  - provider: makeaivideo-remote
    secret: makeaivideo-remote.personal_access_token
    env: MAKEAIVIDEO_REMOTE_PERSONAL_ACCESS_TOKEN
