name: makeaivideo-remote
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - content-creation
    - ai
    - remote
about:
  title: MakeAIVideo
  description: Create finished short-form AI videos (voiceover, AI or stock scenes, captions, music) from a brief or script, then post or schedule them to connected TikTok, Instagram, YouTube and other social accounts
  icon: https://www.google.com/s2/favicons?domain=makeaivideo.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.makeaivideo.ai
oauth:
  - provider: makeaivideo-remote
    secret: makeaivideo-remote.personal_access_token
    env: MAKEAIVIDEO_REMOTE_PERSONAL_ACCESS_TOKEN
