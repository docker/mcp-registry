name: opensubtitles
type: remote
meta:
  category: video
  tags:
    - video
    - subtitles
    - movies
    - tv
    - remote
about:
  title: OpenSubtitles
  description: Search, inspect and download subtitles for movies and TV episodes in 100+ languages from OpenSubtitles.com (official server)
  icon: https://opensubtitles.github.io/guessit-js/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.opensubtitles.com/mcp
  headers:
    X-OpenSubtitles-Username: "${OPENSUBTITLES_USERNAME}"
    X-OpenSubtitles-Password: "${OPENSUBTITLES_PASSWORD}"
config:
  secrets:
    - name: opensubtitles.username
      env: OPENSUBTITLES_USERNAME
      example: <YOUR_OPENSUBTITLES_USERNAME>
    - name: opensubtitles.password
      env: OPENSUBTITLES_PASSWORD
      example: <YOUR_OPENSUBTITLES_PASSWORD>
source:
  project: https://github.com/opensubtitles/mcp.opensubtitles.com
