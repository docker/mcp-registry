name: fastballapi-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - baseball
    - mlb
    - sports-data
    - remote
about:
  title: FastballAPI
  description: "MLB since 2015 plus college: pitches, plate appearances, box scores, odds by book. REST and MCP."
  icon: https://www.google.com/s2/favicons?domain=fastballapi.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.fastballapi.com/mcp
oauth:
  - provider: fastballapi-remote
    secret: fastballapi-remote.personal_access_token
    env: FASTBALLAPI_REMOTE_PERSONAL_ACCESS_TOKEN
