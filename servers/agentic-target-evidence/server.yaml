name: agentic-target-evidence
image: mcp/agentic-target-evidence
type: server
meta:
  category: healthcare
  tags:
    - biomedical
    - drug-discovery
    - genomics
    - clinical-trials
    - research
about:
  title: Agentic Target Evidence
  description: Read-only biomedical evidence tools for drug-target validation. Look up gene-disease genetics, expression, essentiality, clinical trials, drug safety signals, patents and literature from public sources such as DepMap, gnomAD, OpenTargets, ClinVar, GTEx, ClinicalTrials.gov, ChEMBL, openFDA and PubMed.
  icon: https://avatars.githubusercontent.com/u/11919667?v=4
source:
  project: https://github.com/athril/agentic-target-evidence
  commit: 259a4b72a758225a960d3c8612cda7e4ef7e804a
  buildTarget: mcp-gateway
config:
  description: Both keys are optional. Every tool works without them except the USPTO patent tools; an NCBI key raises the PubMed/ClinVar rate limit.
  env:
    - name: MCP_TRANSPORT
      example: stdio
      value: stdio
  secrets:
    - name: agentic-target-evidence.ncbi_api_key
      env: NCBI_API_KEY
      example: <NCBI_API_KEY>
      required: false
    - name: agentic-target-evidence.uspto_api_key
      env: USPTO_API_KEY
      example: <USPTO_API_KEY>
      required: false
