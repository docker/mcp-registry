name: brainiall-tts
type: remote
meta:
  category: communication
  tags:
    - communication
    - text-to-speech
    - audio
    - ai
    - remote
about:
  title: Brainiall TTS
  description: Convert text to natural-sounding WAV audio using 54 neural voices across 9 languages, including Brazilian Portuguese
  icon: https://raw.githubusercontent.com/fasuizu-br/speech-ai-examples/main/assets/logo-400x400.png
remote:
  transport_type: streamable-http
  url: https://api.brainiall.com/mcp/tts/mcp
  headers:
    Authorization: "Bearer ${BRAINIALL_API_KEY}"
config:
  description: Create an API key at app.brainiall.com
  secrets:
    - name: brainiall-tts.api_key
      env: BRAINIALL_API_KEY
      example: <YOUR_API_KEY>
