name: zapier
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - automation
    - workflow
    - integration
    - remote
about:
  title: Zapier
  description: Hosted MCP server connecting AI assistants to 9,000+ apps and 40,000+ actions via Zapier.
  icon: https://www.google.com/s2/favicons?domain=zapier.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.zapier.com/api/v1/connect
  headers:
    Authorization: "Bearer ${ZAPIER_MCP_API_KEY}"
config:
  secrets:
    - name: zapier.mcp_api_key
      env: ZAPIER_MCP_API_KEY
      example: <YOUR_MCP_API_KEY>
