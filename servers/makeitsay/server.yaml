name: makeitsay
type: remote
meta:
  category: ai
  tags:
    - ai
    - image-editing
    - design
    - remote
about:
  title: MakeItSay
  description: Change the words in a screenshot or photo and keep the original font and layout.
  icon: https://raw.githubusercontent.com/makeitsay/makeitsay-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://makeitsay.com/mcp
  headers:
    Authorization: "Bearer ${MAKEITSAY_API_KEY}"
config:
  secrets:
    - name: makeitsay.api_key
      env: MAKEITSAY_API_KEY
      example: <YOUR_API_KEY>
