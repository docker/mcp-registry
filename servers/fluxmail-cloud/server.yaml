name: fluxmail-cloud
type: remote
dynamic:
  tools: true
meta:
  category: communication
  tags:
    - email
    - gmail
    - outlook
    - imap
    - communication
    - remote
about:
  title: Fluxmail Cloud
  description: Hosted email MCP server for Gmail, Outlook, and IMAP. Search, read, draft, send, and organize mail in the mailboxes you approve.
  icon: https://www.google.com/s2/favicons?domain=fluxmail.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://cloud.fluxmail.ai/mcp
oauth:
  - provider: fluxmail-cloud
    secret: fluxmail-cloud.personal_access_token
    env: FLUXMAIL_CLOUD_PERSONAL_ACCESS_TOKEN
