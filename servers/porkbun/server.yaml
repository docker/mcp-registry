name: porkbun
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - dns
    - domains
    - hosting
    - remote
about:
  title: Porkbun
  description: Official Porkbun server. Check domain availability and pricing, register and renew domains, and manage DNS, nameservers, DNSSEC, URL forwarding, DNS restore points, static site hosting and Cloudflare-connected domains
  icon: https://raw.githubusercontent.com/oborseth/Porkbun-MCP/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://mcp.porkbun.com/mcp
oauth:
  - provider: porkbun
    secret: porkbun.personal_access_token
    env: PORKBUN_PERSONAL_ACCESS_TOKEN
