name: photoprintagent
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - photo-printing
    - ecommerce
    - remote
about:
  title: PhotoPrintAgent
  description: Browse photo prints, estimate prices from ZIP/state and follow your orders. Narrow connector with website checkout; US delivery and paid printing/shipping.
  icon: https://photoprintagent.com/favicon.svg
remote:
  transport_type: streamable-http
  url: https://photoprintagent.com/mcp-narrow
oauth:
  - provider: photoprintagent
    secret: photoprintagent.personal_access_token
    env: PHOTOPRINTAGENT_PERSONAL_ACCESS_TOKEN
