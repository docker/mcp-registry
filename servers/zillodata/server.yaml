name: zillodata
type: remote
dynamic:
  tools: true
meta:
  category: data-analytics
  tags:
    - real-estate
    - property-data
    - zillow
    - zestimate
    - remote
about:
  title: ZilloData Zillow Property Data
  description: Zillow property data for U.S. homes. Look up a home by address, Zillow URL or zpid, read its Zestimate and rent Zestimate, and search for-sale, rental and sold listings in a map area.
  icon: https://zillodata.com/mcp-icon-128.png
remote:
  transport_type: streamable-http
  url: https://api.zillodata.com/mcp
oauth:
  - provider: zillodata
    secret: zillodata.personal_access_token
    env: ZILLODATA_PERSONAL_ACCESS_TOKEN
