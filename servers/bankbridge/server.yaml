name: bankbridge
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - banking
    - personal-finance
    - transactions
    - remote
about:
  title: BankBridge
  description: Read-only access to your connected bank accounts, transactions, spending summaries, recurring charges and investment holdings, fetched live from your banks
  icon: https://bankbridge.money/icon-512.png
source:
  project: https://github.com/bankbridge-money/bankbridge-plugin
remote:
  transport_type: streamable-http
  url: https://bankbridge.money/api/mcp
oauth:
  - provider: bankbridge
    secret: bankbridge.personal_access_token
    env: BANKBRIDGE_PERSONAL_ACCESS_TOKEN
