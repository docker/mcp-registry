name: curlshot
type: remote
meta:
  category: automation
  tags:
    - automation
    - screenshot
    - web-capture
    - remote
about:
  title: CurlShot
  description: Screenshot API for AI agents. Capture any public web page as a PNG, JPEG, WebP, PDF or scrolling video in a real browser (take_screenshot, list_devices).
  icon: https://www.google.com/s2/favicons?domain=curlshot.com&sz=64
remote:
  transport_type: streamable-http
  url: https://curlshot.com/api/mcp
  headers:
    Authorization: "Bearer ${CURLSHOT_API_KEY}"
config:
  secrets:
    - name: curlshot.api_key
      env: CURLSHOT_API_KEY
      example: <YOUR_API_KEY>
