name: anyapi
type: remote
dynamic:
  tools: true
meta:
  category: web-scraping
  tags:
    - web-scraping
    - data
    - search
    - social-media
    - remote
about:
  title: AnyAPI
  description: |-
    AnyAPI is a unified marketplace for scraping and data APIs: any API, one wallet, USD, no subscriptions.

    Reach hundreds of third-party APIs - social media, search results, maps, e-commerce, and general web data - through one key and one normalized interface. Every API exposes a normalized input/output JSON Schema, so an agent discovers, inspects, quotes, and runs any of them with the same loop.

    Pricing is real-dollar pay-per-request with no subscription. Discovery is free and failed calls are never charged, because AnyAPI fails over across upstream providers automatically under one price reservation.
  icon: https://www.google.com/s2/favicons?domain=getanyapi.com&sz=128
remote:
  transport_type: streamable-http
  url: https://api.getanyapi.com/mcp
  headers:
    Authorization: "Bearer ${ANYAPI_API_KEY}"
config:
  description: Configure your AnyAPI access
  secrets:
    - name: anyapi.api_key
      env: ANYAPI_API_KEY
      example: <YOUR_API_KEY>
