about:
  title: Agend-sh
  description: Persistent Linux environments for AI agents, with interactive terminals, input-wait feedback, file tools, background tasks, and public HTTPS previews. Requires an Agend account and available environment quota.
  icon: https://raw.githubusercontent.com/agend-sh/cli/a4080e6f53309bd20e252aba2e1212af5d9792c2/assets/logo.svg
source:
  project: https://github.com/agend-sh/cli
  commit: a4080e6f53309bd20e252aba2e1212af5d9792c2
config:
  description: Connect to your Agend account. Sign in with agend login, then follow https://github.com/agend-sh/cli/blob/main/docs/mcp-registry.md to load your active account token. Call list_environments first and use an environment ID or name in subsequent calls.
  secrets:
    - name: agend-sh.api_token
      env: AGEND_API_TOKEN
      example: <AGEND_API_TOKEN>
      required: true
      description: Agend account token from your active CLI login. An account and available environment quota are required. Refresh this secret after reauthentication when the token expires.
