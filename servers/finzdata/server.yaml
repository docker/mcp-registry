  description: "Point-in-time, survivorship-free market data and server-side backtests for AI agents (40 tools). 16,000+ US stocks since 2000 including delisted names, 5,100+ ETFs and fund holdings, tick trades for 1,100+ stocks and ETFs, 139 futures markets with every contract since 2007, options gamma (GEX) for stocks, ETFs and the major indexes, end-of-day options chains, VIX and Cboe volatility indexes, 123 indexes, 79 FX pairs, 512 crypto pairs, SEC fundamentals as filed, 13F, insider transactions, short interest, CFTC COT since 1986, 22,700+ macro series with every vintage, the Quantitative Model (macro regimes, nowcast, market stress), Global Macro Pulse (shipping chokepoints, ports, flights, traffic), congressional trades and election spending. Backtests report a deflated Sharpe ratio; every time-series tool takes as_of. No key needed to start (AI preview on the last 6 months)."
