name: finzdata
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - market-data
    - stocks
    - backtesting
    - remote
about:
  title: FinzData
  description: Point-in-time US market data for agents and backtests - 16,000+ stocks including delisted, 1-minute to daily bars, futures, macro vintages, COT, 13F and server-side backtests
  icon: https://www.google.com/s2/favicons?domain=finzdata.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.finzdata.com/mcp
oauth:
  - provider: finzdata
    secret: finzdata.personal_access_token
    env: FINZDATA_PERSONAL_ACCESS_TOKEN
