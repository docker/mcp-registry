name: webstory
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - design
    - websites
    - video
    - remote
about:
  title: Webstory
  description: Build and edit Webstory story drafts, share reels, and read numbers, comments, chats and orders.
  icon: https://raw.githubusercontent.com/WebStory-App/webstory-mcp/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://webstoryapp.com/mcp
oauth:
  - provider: webstory
    secret: webstory.personal_access_token
    env: WEBSTORY_PERSONAL_ACCESS_TOKEN
