name: firecrawl-remote
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - firecrawl
    - search
    - scraping
    - remote
about:
  title: Firecrawl (hosted)
  description: Search, scrape, and interact with the web for AI agents, through Firecrawl's hosted MCP server. Sign in with your Firecrawl account; nothing to run locally.
  icon: https://avatars.githubusercontent.com/u/135057108?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.firecrawl.dev/v2/mcp-oauth
oauth:
  - provider: firecrawl
    secret: firecrawl-remote.personal_access_token
    env: FIRECRAWL_REMOTE_PERSONAL_ACCESS_TOKEN
