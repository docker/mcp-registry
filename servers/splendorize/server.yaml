name: splendorize
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - landing-pages
    - experiments
    - marketing
    - remote
about:
  title: Splendorize
  description: Find landing-page improvements, draft experiments and measure the results with Splendorize site intelligence
  icon: https://www.google.com/s2/favicons?domain=splendorize.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.splendorize.com/mcp
oauth:
  - provider: splendorize
    secret: splendorize.personal_access_token
    env: SPLENDORIZE_PERSONAL_ACCESS_TOKEN
