name: afterlaunch
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - marketing
    - seo
    - ai-visibility
    - growth
    - remote
about:
  title: AfterLaunch
  description: "Growth marketing, SEO and GEO as agent tools: ranked growth moves, drafted deliverables, and AI answer visibility across ChatGPT, Gemini, Perplexity and Google AI Overviews."
  icon: https://afterlaunch.io/brand/icon-512.png
remote:
  transport_type: streamable-http
  url: https://afterlaunch.io/api/mcp
  headers:
    Authorization: "Bearer ${AFTERLAUNCH_API_KEY}"
config:
  secrets:
    - name: afterlaunch.api_key
      env: AFTERLAUNCH_API_KEY
      example: <YOUR_AFTERLAUNCH_API_KEY>
