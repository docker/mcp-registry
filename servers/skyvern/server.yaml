name: skyvern
type: remote
meta:
  category: automation
  tags:
    - automation
    - browser-automation
    - web-scraping
    - remote
about:
  title: Skyvern
  description: Skyvern's MCP server lets AI agents control a real browser to log in, fill forms, and extract data.
  icon: https://avatars.githubusercontent.com/u/141457985?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://api.skyvern.com/mcp/
  headers:
    x-api-key: "${SKYVERN_API_KEY}"
config:
  description: Use an API key from Settings in the Skyvern app (app.skyvern.com).
  secrets:
    - name: skyvern.api_key
      env: SKYVERN_API_KEY
      example: <YOUR_API_KEY>
