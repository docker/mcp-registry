name: sheetsdata
type: remote
dynamic:
  tools: true
meta:
  category: development
  tags:
    - development
    - electronics
    - hardware
    - datasheets
    - remote
about:
  title: SheetsData
  description: Electronic component datasheets for AI agents — pinouts, specs, package info and design checks from manufacturer PDFs, plus part search across JLCPCB, Mouser and DigiKey
  icon: https://raw.githubusercontent.com/octoco-ltd/sheetsdata-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.sheetsdata.com/mcp
oauth:
  - provider: sheetsdata
    secret: sheetsdata.personal_access_token
    env: SHEETSDATA_PERSONAL_ACCESS_TOKEN
