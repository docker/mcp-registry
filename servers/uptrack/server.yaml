name: uptrack
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - uptime
    - status-page
    - remote
about:
  title: Uptrack
  description: Uptime monitoring with 30-second checks, incidents and status pages. List, create and delete monitors and review incidents from your AI assistant
  icon: https://www.google.com/s2/favicons?domain=uptrack.app&sz=64
remote:
  transport_type: streamable-http
  url: https://api.uptrack.app/mcp
oauth:
  - provider: uptrack
    secret: uptrack.personal_access_token
    env: UPTRACK_PERSONAL_ACCESS_TOKEN
