name: nexscope
type: remote
dynamic:
  tools: true
meta:
  category: commerce
  tags:
    - commerce
    - ecommerce
    - marketplace
    - amazon
    - remote
about:
  title: Nexscope
  description: Seller-grade ecommerce marketplace data for AI agents across Amazon, TikTok Shop, Walmart, Shopee, Temu, 1688 and more via remote MCP
  icon: https://www.google.com/s2/favicons?domain=nexscope.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://api.nexscope.ai/mcp
  headers:
    Authorization: "Bearer ${NEXSCOPE_API_KEY}"
config:
  secrets:
    - name: nexscope.api_key
      env: NEXSCOPE_API_KEY
      example: <YOUR_API_KEY>
