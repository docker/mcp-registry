name: nexscope
type: remote
meta:
  category: commerce
  tags:
    - commerce
    - ecommerce
    - marketplace
    - data
    - remote
about:
  title: Nexscope
  description: Ecommerce data for AI agents. 228 tools for product, keyword, review and competitor research across Amazon, TikTok Shop, Walmart, Temu, Shopee, Ozon, 1688, Etsy, eBay and more.
  icon: https://www.google.com/s2/favicons?domain=nexscope.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://api.nexscope.ai/mcp
  headers:
    Authorization: "Bearer ${NEXSCOPE_API_KEY}"
config:
  secrets:
    - name: nexscope.api_key
      env: NEXSCOPE_API_KEY
      example: <YOUR_API_KEY>
