name: chatacademia
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - search
    - research
    - academic
    - citations
    - remote
about:
  title: ChatAcademia
  description: Academic research tools from ChatAcademia. Search papers and grants across scholarly databases, verify citations, find research gaps, extract study data and get mock peer review.
  icon: https://raw.githubusercontent.com/khanhduyvt0101/chatacademia-claude-plugin/main/assets/chatacademia-icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.chatacademia.com/mcp/docker
oauth:
  - provider: chatacademia
    secret: chatacademia.personal_access_token
    env: CHATACADEMIA_PERSONAL_ACCESS_TOKEN
