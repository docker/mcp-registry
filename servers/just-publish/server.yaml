name: just-publish
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - website
    - hosting
    - publishing
    - remote
about:
  title: Just Publish.
  description: Publish and update the website you built with AI at a live public URL. Sign-in required.
  icon: https://justpublish.ai/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.justpublish.ai/
oauth:
  - provider: just-publish
    secret: just-publish.personal_access_token
    env: JUST_PUBLISH_PERSONAL_ACCESS_TOKEN
source:
  project: https://github.com/just-done/just-publish-mcp
