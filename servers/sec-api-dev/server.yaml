name: sec-api-dev
type: remote
meta:
  category: finance
  tags:
    - sec
    - edgar
    - filings
    - remote
about:
  title: SEC EDGAR API
  description: "SEC EDGAR data from sec-api.dev: company and ticker lookup, filing search and documents, full-text search, XBRL reported facts, Form 4 insider transactions and 13F holdings. Independent; separate from sec-api.io."
  icon: https://sec-api.dev/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://sec-api.dev/api/mcp
  headers:
    Authorization: "Bearer ${SEC_API_KEY}"
config:
  secrets:
    - name: sec-api-dev.api_key
      env: SEC_API_KEY
      example: <YOUR_API_KEY>
