name: deal-ai
type: remote
dynamic:
  tools: true
meta:
  category: commerce
  tags:
    - commerce
    - shopping
    - ecommerce
    - price-comparison
    - deals
    - remote
about:
  title: Deal.ai
  description: Ask Deal.ai's shopping agent, compare every US store's price for the same item, check whether a deal is real, look up price history and watch prices.
  icon: https://deal.ai/icon.svg
remote:
  transport_type: streamable-http
  url: https://deal.ai/mcp
oauth:
  - provider: deal-ai
    secret: deal-ai.personal_access_token
    env: DEAL_AI_PERSONAL_ACCESS_TOKEN
