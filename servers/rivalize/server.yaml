about:
  title: Rivalize Competitive Intelligence
  description: >-
    Cited competitor intelligence as JSON for AI agents, with dates and sources.
    With the Agent plan ($70 a year or $9 a month), Rivalize collects and your
    own Claude, Cursor, or agent does the thinking: 3 competitors at once
    refreshed every 7 days, everything Rivalize collects about each as JSON,
    access to Rivalize's database of companies already collected, and 500 API
    and MCP calls a day. Read-only by default (16 read tools; 3 optional write
    tools). Get an API key at https://rivalize.ai/pricing?r=agmcp#agent
  icon: https://avatars.githubusercontent.com/u/519568?v=4
source:
  project: https://github.com/Downshift/rivalize-mcp
  commit: 74757f5f7a92185b9dcadd6debff6aeeb20b3575
config:
  description: Configure your Rivalize API key (get the Agent plan at $70/yr or $9/mo at https://rivalize.ai/pricing?r=agmcp#agent, then create a key under Settings, API Keys).
  secrets:
    - name: rivalize.api_key
      env: RIVALIZE_API_KEY
      example: <RIVALIZE_API_KEY>
