name: korean-law
type: remote
meta:
  category: search
  tags:
    - search
    - legal
    - government
    - korea
    - remote
about:
  title: Korean Law
  description: Search Korean statutes, precedents, administrative rules, local ordinances and treaties from the official Korean Ministry of Government Legislation (법제처) Open API, and verify legal citations against the official text.
  icon: https://avatars.githubusercontent.com/u/212630997?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.gomdori.app/law
  headers:
    apikey: "${LAW_OC}"
config:
  description: Optionally provide your own free 법제처 Open API key (https://open.law.go.kr) to avoid the shared, rate-limited server key (the server also works without one).
  secrets:
    - name: korean-law.api_key
      env: LAW_OC
      example: <YOUR_LAW_OC_KEY>
      required: false
