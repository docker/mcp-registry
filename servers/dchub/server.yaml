name: dchub
type: remote
dynamic:
  tools: true
meta:
  category: data-analytics
  tags:
    - data-center
    - energy
    - power-grid
    - infrastructure
    - site-selection
    - remote
about:
  title: DC Hub
  description: Data-center facilities, market scores (DCPI), US ISO grid data, interconnection queues, energy prices, fiber routes and capacity listings, with a source and citation line on each answer. Works without a key at preview depth; an optional API key raises limits.
  icon: https://dchub.cloud/icons/icon-192.png
remote:
  transport_type: streamable-http
  url: https://dchub.cloud/mcp
  headers:
    X-API-Key: "${DCHUB_API_KEY}"
config:
  description: Optionally provide a DC Hub API key for higher limits (the server also works without one).
  secrets:
    - name: dchub.api_key
      env: DCHUB_API_KEY
      example: <YOUR_API_KEY>
      required: false
