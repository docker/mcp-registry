name: dchub
type: remote
dynamic:
  tools: true
meta:
  category: data-analytics
  tags:
    - data-center
    - energy
    - power-grid
    - infrastructure
    - site-selection
    - remote
about:
  title: DC Hub
  description: "The orchestration layer for data center and energy intelligence. Find power. Find land. Find fiber. Find capacity. Call execute_plan first; it returns one dated, cited answer, including the Data Center Power Index (DCPI). DCHUB_API_KEY is optional."
  icon: https://dchub.cloud/icons/icon-192.png
remote:
  transport_type: streamable-http
  url: https://dchub.cloud/mcp?via=directory&src=docker
  headers:
    X-API-Key: "${DCHUB_API_KEY}"
config:
  description: Optionally provide a DC Hub API key for fuller answers (the server also works without one).
  secrets:
    - name: dchub.api_key
      env: DCHUB_API_KEY
      example: <YOUR_API_KEY>
      required: false
