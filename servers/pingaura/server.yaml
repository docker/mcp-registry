name: pingaura
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - marketing
    - seo
    - analytics
    - ai-visibility
    - remote
about:
  title: PingAura
  description: Track how your brand shows up in AI answers from ChatGPT, Gemini, Perplexity and others, compare competitors, and act on site health and content
  icon: https://www.google.com/s2/favicons?domain=pingaura.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://www.pingaura.ai/api/mcp
oauth:
  - provider: pingaura
    secret: pingaura.personal_access_token
    env: PINGAURA_PERSONAL_ACCESS_TOKEN
