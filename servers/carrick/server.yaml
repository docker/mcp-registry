name: carrick
type: remote
dynamic:
  tools: true
meta:
  category: developer-tools
  tags:
    - developer-tools
    - typescript
    - remote
about:
  title: Carrick
  description: Hosted MCP server that indexes TypeScript codebases across service and repository boundaries. Agents search functions by intent rather than name, read the real types on both sides of a call, and see every consumer of a route before changing it.
  icon: https://carrick.tools/brand/carrick-icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.carrick.tools/mcp
oauth:
  - provider: carrick
    secret: carrick.personal_access_token
    env: CARRICK_PERSONAL_ACCESS_TOKEN
