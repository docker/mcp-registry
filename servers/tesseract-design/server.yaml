name: tesseract-design
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - presentations
    - diagrams
    - charts
    - design
    - remote
about:
  title: Tesseract Decks & Designs
  description: Turn what your assistant writes into slide decks, diagrams, charts and designs, kept as private pages in your Tesseract account. Calls no AI model; free on every Tesseract plan.
  icon: https://raw.githubusercontent.com/opentech-dev/tesseract-claude-plugin/v1.0.0/assets/logo-square.png
remote:
  transport_type: streamable-http
  url: https://app.tesseract.dev/api/core/tesseract/mcp/design
oauth:
  - provider: tesseract
    secret: tesseract.personal_access_token
    env: TESSERACT_PERSONAL_ACCESS_TOKEN
