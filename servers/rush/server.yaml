name: rush
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - agents
    - automation
    - remote
about:
  title: Rush
  description: >-
    Hand a task to a cloud agent: it works in its own cloud computer with a
    browser and a terminal, and returns a pull request, a report, files or an
    answer, with a record of every step. Start, wait for, reply to and stop
    tasks, and read what each one changed.
  icon: https://getrush.ai/brand/phoenix-logo.png
remote:
  transport_type: streamable-http
  url: https://api.phoenix.so/mcp
oauth:
  - provider: rush
    secret: rush.personal_access_token
    env: RUSH_PERSONAL_ACCESS_TOKEN
