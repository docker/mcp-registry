name: rush
type: remote
meta:
  category: devops
  tags:
    - devops
    - cloud-agents
    - sandbox
    - pull-requests
    - remote
about:
  title: Rush
  description: Hand an agent a task in its own cloud sandbox and get back a PR, report or files, with the full trajectory
  icon: https://www.google.com/s2/favicons?domain=getrush.ai&sz=64
remote:
  transport_type: streamable-http
  url: https://api.prix.dev/mcp
  headers:
    Authorization: "Bearer ${RUSH_API_KEY}"
config:
  secrets:
    - name: rush.api_key
      env: RUSH_API_KEY
      example: <YOUR_API_KEY>
