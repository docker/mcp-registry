name: lumina-tasks
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - tasks
    - habits
    - notes
    - remote
about:
  title: Lumina Tasks
  description: Add, read, check and edit tasks and subtasks, habits, notes and Google Calendar events in Lumina, a to-do list and habit tracker app
  icon: https://lumina-app.me/app/icons/icon-192.png
remote:
  transport_type: streamable-http
  url: https://lumina-app.me/mcp
oauth:
  - provider: lumina-tasks
    secret: lumina-tasks.personal_access_token
    env: LUMINA_TASKS_PERSONAL_ACCESS_TOKEN
