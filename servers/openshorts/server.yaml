name: openshorts
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - content-creation
    - remote
about:
  title: OpenShorts
  description: Turn long videos into viral 9:16 shorts with AI moment detection, face-tracked reframing and word-level subtitles, then publish them to TikTok, Instagram Reels and YouTube Shorts
  icon: https://www.google.com/s2/favicons?domain=openshorts.app&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.openshorts.app/mcp
  headers:
    Authorization: "Bearer ${OPENSHORTS_API_KEY}"
config:
  description: Create an API key in your OpenShorts account page at openshorts.app
  secrets:
    - name: openshorts.api_key
      env: OPENSHORTS_API_KEY
      example: <YOUR_OSK_API_KEY>
