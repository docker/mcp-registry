name: plainmail
type: remote
meta:
  category: communication
  tags:
    - communication
    - email
    - domains
    - remote
about:
  title: Plainmail
  description: Real mailboxes on your own domains, set up and managed by your agent: add a domain, create mailboxes, read and send mail
  icon: https://plainmail.dev/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://app.plainmail.dev/api/mcp/mcp
  headers:
    Authorization: "Bearer ${PLAINMAIL_API_KEY}"
config:
  secrets:
    - name: plainmail.api_key
      env: PLAINMAIL_API_KEY
      example: <YOUR_API_KEY>
