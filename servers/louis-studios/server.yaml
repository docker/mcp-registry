name: louis-studios
type: remote
meta:
  category: development
  tags:
    - design
    - react
    - ui
    - components
    - remote
about:
  title: Louis Studios
  description: Plan and compose React pages, then install hand-made animated components fitted to your brand.
  icon: https://studios.lou15.com/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://studios.lou15.com/mcp
  headers:
    Authorization: "Bearer ${LOUIS_STUDIOS_API_KEY}"
config:
  secrets:
    - name: louis-studios.api_key
      env: LOUIS_STUDIOS_API_KEY
      example: <YOUR_API_KEY>
