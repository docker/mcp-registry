name: underdogapi
type: remote
meta:
  category: data-analytics
  tags:
    - sports
    - player-props
    - fantasy
    - remote
about:
  title: Underdog API
  description: "Underdog Fantasy pick'em data: Higher/Lower lines with separate payout multipliers per side, the matching sportsbook prices and no-vig fair line for the same player stat, line history and graded outcomes. Read-only; not affiliated with Underdog."
  icon: https://underdogapi.com/apple-icon.png
remote:
  transport_type: streamable-http
  url: https://underdogapi.com/api/mcp
  headers:
    Authorization: "Bearer ${UNDERDOG_API_KEY}"
config:
  secrets:
    - name: underdogapi.api_key
      env: UNDERDOG_API_KEY
      example: <YOUR_API_KEY>
