name: upapi
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - api
    - gateway
    - integrations
    - remote
about:
  title: UpAPI
  description: Call a catalog of ready-to-use APIs through one upAPI account and key, without signing up for each upstream service.
  icon: https://raw.githubusercontent.com/DevinoSolutions/mcp-servers/main/upapi/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://app.upapi.io/api/mcp
oauth:
  - provider: upapi
    secret: upapi.personal_access_token
    env: UPAPI_PERSONAL_ACCESS_TOKEN
