name: appstoretracker
type: remote
meta:
  category: analytics
  tags:
    - analytics
    - app-store
    - ios
    - aso
    - remote
about:
  title: App Store Tracker
  description: iOS App Store chart rankings, app details, reviews, keywords, ads and revenue estimates
  icon: https://www.google.com/s2/favicons?domain=appstoretracker.com&sz=64
remote:
  transport_type: streamable-http
  url: https://www.appstoretracker.com/api/mcp
  headers:
    Authorization: "Bearer ${APPSTORETRACKER_API_KEY}"
config:
  secrets:
    - name: appstoretracker.api_key
      env: APPSTORETRACKER_API_KEY
      example: <YOUR_API_KEY>
