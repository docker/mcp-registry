about:
  title: Apiary Memory
  description: |
    Local-first long-term memory for AI agents, stored as a single SQLite file on
    the user's own disk. No account, no cloud, no telemetry.

    What separates it from other memory servers is the write path. An agent cannot
    silently rewrite what it "remembers": `propose` drops an entry into a pending
    queue, and only the human approves it. `recall` therefore searches confirmed
    memory only, so a bad suggestion cannot become a durable false belief that
    every later session trusts.

    Six tools cover the loop: `propose` queues a memory, `recall` searches what the
    human confirmed, `manage` inspects or retires a single entry, `get_context`
    returns a digest of recent threads, and `say` and `board` are a noticeboard
    shared between the human and several agents at once.
  icon: https://raw.githubusercontent.com/330899935/apiary-memory/04a1f03416f1558283eae9608b35764555e8867d/assets/icon-400.png
