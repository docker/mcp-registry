name: immaculate
type: remote
meta:
  category: security
  tags:
    - security
    - ai-governance
    - authorization
    - remote
about:
  title: Immaculate (Arobi)
  description: Agents ask before important actions and get GRANTED, DENIED or ESCALATED with the reason; a router picks the cheapest model that can do each job.
  icon: https://www.google.com/s2/favicons?domain=aura-genesis.org&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.aura-genesis.org
  headers:
    X-Arobi-Tenant-Key: "${IMMACULATE_TENANT_KEY}"
config:
  secrets:
    - name: immaculate.tenant_key
      env: IMMACULATE_TENANT_KEY
      example: <YOUR_TENANT_KEY>
