name: steadyscrape-seo-data
type: remote
meta:
  category: search
  tags:
    - seo
    - keyword research
    - serp
    - backlinks
    - marketing
    - remote
about:
  title: SteadyScrape SEO Data
  description: Live SEO data for AI agents - keyword volume, live Google SERP ranks, domain traffic, ranked keywords, backlinks, Google Trends and YouTube. Runs on Apify; uses your Apify API token.
  icon: https://www.google.com/s2/favicons?domain=apify.com&sz=64
remote:
  transport_type: streamable-http
  url: https://steady-scrape-1--seo-data-mcp-server.apify.actor/mcp
  headers:
    Authorization: "Bearer ${APIFY_API_KEY}"
config:
  secrets:
    - name: steadyscrape-seo-data.api_key
      env: APIFY_API_KEY
      example: apify_api_xxxxxxxx
