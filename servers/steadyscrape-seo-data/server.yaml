name: steadyscrape-seo-data
type: remote
meta:
  category: search
  tags:
    - seo
    - keyword research
    - serp
    - backlinks
    - marketing
    - remote
about:
  title: SteadyScrape SEO Data
  description: Keyword, SERP and backlink data for AI agents - search volume, live Google results, rank checks, domain traffic, backlinks, Google Trends and YouTube. Read-only; calls run in your own Apify account using your Apify API token.
  icon: https://apify-image-uploads-prod.s3.us-east-1.amazonaws.com/edcVJcI7rkKrnkf8J-actor-e5sEN9iLUZVwpYdgm-tn7wZpeljH-steadyscrape-logo.png
remote:
  transport_type: streamable-http
  url: https://seo.mcp.steadyscrape.dev/mcp
  headers:
    Authorization: "Bearer ${APIFY_API_KEY}"
config:
  secrets:
    - name: steadyscrape-seo-data.api_key
      env: APIFY_API_KEY
      example: apify_api_xxxxxxxx
