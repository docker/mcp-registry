about:
  title: Noticer
  description: After an agent hands off work, Noticer checks that one field in a public HTTPS JSON record equals an exact value, alongside a known-good control, and returns PROVED, DISPROVED or INCONCLUSIVE with a signed receipt you can verify offline. 5 free checks, then each eligible check (PROVED or DISPROVED) is USD 1.00; INCONCLUSIVE is free. Payment: card via Stripe Checkout or MPP (existing Link wallet).
  icon: https://noticer.dev/assets/favicon-32.png
source:
