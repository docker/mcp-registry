name: affixio
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - verification
    - attestation
    - agent-trust
    - remote
about:
  title: AffixIO
  description: >-
    Hosted AffixIO API tools for agents. Check eligibility, access and agent
    permissions against configured sources and verify results with ML-DSA-65
    signed attestations. OAuth 2.1 sign-in.
  icon: https://www.google.com/s2/favicons?domain=affix-io.com&sz=64
remote:
  transport_type: streamable-http
  url: https://www.affix-io.com/mcp/
oauth:
  - provider: affixio
    secret: affixio.personal_access_token
    env: AFFIXIO_PERSONAL_ACCESS_TOKEN
