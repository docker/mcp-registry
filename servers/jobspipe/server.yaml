name: jobspipe
type: remote
dynamic:
  tools: true
meta:
  category: search
  tags:
    - jobs
    - hiring
    - recruiting
    - labor-market
    - search
    - remote
about:
  title: JobsPipe
  description: Search live job postings from 30+ job boards, ATS feeds and public employment services, normalized into one schema, and watch for new matches
  icon: https://raw.githubusercontent.com/jobspipe/mcp/main/assets/logo-400.png
remote:
  transport_type: streamable-http
  url: https://mcp.jobspipe.dev/mcp
oauth:
  - provider: jobspipe
    secret: jobspipe.personal_access_token
    env: JOBSPIPE_PERSONAL_ACCESS_TOKEN
