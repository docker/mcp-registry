name: data-gleaner
type: remote
meta:
  category: data
  tags:
    - web-scraping
    - data-extraction
    - lead-generation
    - travel
    - social-media
    - remote
about:
  title: Data Gleaner
  description: Pay-per-result web data tools on Apify - website contact details (emails, phones, socials), Google Hotels prices for exact dates, Weibo posts, Bilibili videos and comments, and every URL in a site's sitemaps.
  icon: https://raw.githubusercontent.com/datagleaner/data-gleaner-mcp/main/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.apify.com/?tools=datagleaner/website-contact-details-scraper,datagleaner/google-hotels-scraper,datagleaner/weibo-scraper,datagleaner/bilibili-scraper,datagleaner/sitemap-extractor,datagleaner/youtube-channel-contacts,datagleaner/app-developer-email-finder,datagleaner/team-page-contacts,datagleaner/shopify-partner-contacts,datagleaner/researcher-email-finder
  headers:
    Authorization: "Bearer ${APIFY_API_KEY}"
config:
  secrets:
    - name: data-gleaner.api_key
      env: APIFY_API_KEY
      example: <YOUR_APIFY_API_TOKEN>
