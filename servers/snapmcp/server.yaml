name: snapmcp
image: mcp/snapmcp
type: server
meta:
  category: documentation
  tags:
    - documentation
    - screenshots
    - code-highlighting
    - markdown
    - pdf
    - powerpoint
    - word
    - visual-documentation
about:
  title: Snapmcp
  description: Turn terminal output, source code, web pages, Markdown, HTML, and diffs into PNG, JPEG, PDF, GIF, and editable PowerPoint or Word documents.
  icon: https://raw.githubusercontent.com/reeinharddd/snapmcp/main/brand/logo/snapmcp-icon.svg
source:
  project: https://github.com/reeinharddd/snapmcp
  commit: 7ec688182cdfd3f527acdc84bcb59283fa806e99
run:
  volumes:
    - "{{snapmcp.output_path}}:/app/captures"
config:
  description: Choose the host directory where snapmcp saves the generated artifacts.
  parameters:
    type: object
    properties:
      output_path:
        type: string
        description: Host directory where the generated images, PDFs, GIFs, and documents are saved.
        default: /Users/local-test/captures
    required:
      - output_path
