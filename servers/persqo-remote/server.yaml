name: persqo-remote
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - testing
    - qa
    - browser
    - remote
about:
  title: Persqo
  description: Run AI personas through your web app to see why customers don't buy, then get UX findings and a ready-to-paste fix prompt.
  icon: https://www.google.com/s2/favicons?domain=persqo.com&sz=64
remote:
  transport_type: streamable-http
  url: https://persqo.com/api/mcp
  headers:
    Authorization: "Bearer ${PERSQO_API_KEY}"
config:
  secrets:
    - name: persqo-remote.api_key
      env: PERSQO_API_KEY
      example: <YOUR_API_KEY>
