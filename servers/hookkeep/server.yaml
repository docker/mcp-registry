name: hookkeep
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - webhooks
    - devops
    - debugging
    - remote
about:
  title: HookKeep
  description: >-
    Private webhook inbox: permanent endpoints that capture every request and
    keep it searchable and replayable for 60 days. List, search, compare,
    replay and export captured webhooks from your assistant.
  icon: https://hookkeep.com/android-chrome-512x512.png
remote:
  transport_type: streamable-http
  url: https://mcp.hookkeep.com/mcp
oauth:
  - provider: hookkeep
    secret: hookkeep.personal_access_token
    env: HOOKKEEP_PERSONAL_ACCESS_TOKEN
