name: weave
image: mcp/weave
type: server
meta:
  category: database
  tags:
    - database
    - sqlite
    - airtable
    - work-management
about:
  title: weave
  description: Self-hosted Airtable and Notion-database alternative built for AI agents. Connected tables, relations, formulas, rollups, workflow states, markdown documents and undo in one SQLite file. Seventeen core tools, with weave_call reaching the rest.
  icon: https://raw.githubusercontent.com/grunion-ai/weave/main/brand/assets/png/app-icon-512.png
source:
  project: https://github.com/grunion-ai/weave
  commit: 67807c43a9c8ae6a0eff4058cd7a3307189956fc
run:
  command:
    - node
    - bin/weave.js
    - mcp
    - --data
    - /data/workspace.db
  volumes:
    - weave-data:/data
