name: donmangu-jobs
type: remote
meta:
  category: search
  tags:
    - jobs
    - job-search
    - recruiting
    - careers
    - remote
about:
  title: Jobs MCP Server
  description: Read-only job tools for AI agents. get_company_jobs returns the open jobs of companies you name, read live from their career pages. search_tech_jobs searches tech jobs open today. Paid per call through your own Apify account.
  icon: https://www.google.com/s2/favicons?domain=apify.com&sz=64
remote:
  transport_type: streamable-http
  url: https://conserving-celerytop--jobs-mcp-server.apify.actor/mcp
  headers:
    Authorization: "Bearer ${APIFY_API_KEY}"
config:
  secrets:
    - name: donmangu-jobs.api_key
      env: APIFY_API_KEY
      example: <YOUR_APIFY_API_TOKEN>
