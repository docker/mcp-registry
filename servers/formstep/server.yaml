name: formstep
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - forms
    - requests
    - ai-agents
    - remote
about:
  title: Formstep
  description: The form builder that ends the back-and-forth. Send anyone a prefilled form in their language, or share a public link; answers come back under your field keys.
  icon: https://formstep.io/assets/logo-light.png
remote:
  transport_type: streamable-http
  url: https://api.formstep.io/api/mcp
oauth:
  - provider: formstep
    secret: formstep.personal_access_token
    env: FORMSTEP_PERSONAL_ACCESS_TOKEN
