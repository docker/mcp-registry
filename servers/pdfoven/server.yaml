name: pdfoven
type: remote
meta:
  category: productivity
  tags:
    - pdf
    - documents
    - html-to-pdf
    - images
    - remote
about:
  title: PDFOven
  description: Render PDFs and PNG images from HTML, Markdown, URLs or saved Handlebars templates. Tools render_pdf, render_image and list_templates; free API key with 100 renders a month.
  icon: https://pdfoven.com/logo.png
remote:
  transport_type: streamable-http
  url: https://pdfoven.com/mcp
  headers:
    Authorization: "Bearer ${PDFOVEN_API_KEY}"
config:
  secrets:
    - name: pdfoven.api_key
      env: PDFOVEN_API_KEY
      example: <YOUR_API_KEY>
