name: sortance
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - email-validation
    - signup
    - fraud-prevention
    - remote
about:
  title: Sortance
  description: Validate email addresses at signup. Flags disposable, no-MX, typo and made-up addresses, runs your own block and allow rules, and returns a send, hold or drop recommendation
  icon: https://api.sortance.com/brand/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.sortance.com/mcp
oauth:
  - provider: sortance
    secret: sortance.personal_access_token
    env: SORTANCE_PERSONAL_ACCESS_TOKEN
