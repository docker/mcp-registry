name: contextfetch
type: remote
meta:
  category: search
  tags:
    - search
    - web-search
    - markdown
    - remote
about:
  title: ContextFetch
  description: Web search and any page as LLM-ready Markdown for AI agents, pruned to the passages relevant to the query.
  icon: https://contextfetch.dev/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://api.contextfetch.dev/mcp
  headers:
    x-api-key: "${CONTEXTFETCH_API_KEY}"
config:
  secrets:
    - name: contextfetch.api_key
      env: CONTEXTFETCH_API_KEY
      example: <YOUR_API_KEY_OR_EMPTY_FOR_FREE_TIER>
