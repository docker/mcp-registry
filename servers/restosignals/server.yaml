name: restosignals
type: remote
meta:
  category: data
  tags:
    - data
    - sales
    - leads
    - restaurants
    - public-records
    - remote
about:
  title: RestoSignals
  description: Find US restaurants and bars before they open. Fuses public liquor-license applications, food-service permits and new-business filings into one scored venue with the owner named in the filings. NY, TX, IL and CA deepest; OR, CO and WA lighter.
  icon: https://restosignals.com/favicon.svg
remote:
  transport_type: streamable-http
  url: https://api.restosignals.com/mcp
  headers:
    x-api-key: "${RESTOSIGNALS_API_KEY}"
config:
  description: Provide a RestoSignals API key. A free key with 100 lead credits is available at https://restosignals.com/signup.
  secrets:
    - name: restosignals.api_key
      env: RESTOSIGNALS_API_KEY
      example: <YOUR_API_KEY>
