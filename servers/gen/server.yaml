name: gen
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - content-creation
    - social-media
    - remote
about:
  title: GEN
  description: GEN is the creative AI video engineer for ads, cartoons, AI UGC and microdramas. Video editing and social publishing are free; AI content requires credits funded by card or x402.
  icon: https://gen.pro/favicon.png
remote:
  transport_type: streamable-http
  url: https://mcp.gen.pro
  headers:
    Authorization: "Bearer ${GEN_PAT}"
config:
  secrets:
    - name: gen.personal_access_token
      env: GEN_PAT
      example: <GEN_PAT>
