name: suitedash
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - crm
    - project-management
    - invoicing
    - remote
about:
  title: SuiteDash (Official)
  description: Official SuiteDash server. Find, create and update contacts, companies, projects, tasks, deals, time entries, invoice drafts, estimates and proposals, and run reports, as you, with your own permissions
  icon: https://raw.githubusercontent.com/suitedash/suitedash-mcp/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://app.suitedash.com/mcp
oauth:
  - provider: suitedash
    secret: suitedash.personal_access_token
    env: SUITEDASH_PERSONAL_ACCESS_TOKEN
