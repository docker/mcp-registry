name: noveum
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - ai
    - evaluation
    - remote
about:
  title: Noveum
  description: Inspect AI agent traces, manage evaluation datasets, run evaluations, and test voice agents.
  icon: https://noveum.ai/favicon.ico
remote:
  transport_type: streamable-http
  url: https://noveum.ai/api/mcp
oauth:
  - provider: noveum
    secret: noveum.personal_access_token
    env: NOVEUM_PERSONAL_ACCESS_TOKEN
