name: orla
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - bookkeeping
    - budgets
    - personal-finance
    - remote
about:
  title: Orla
  description: "Personal finance and small-business bookkeeping from your own books: your assistant books a bank statement after you check the rows, sorts expenses, reads budgets and net worth. It cannot move money."
  icon: https://www.orla.finance/icon.png
remote:
  transport_type: streamable-http
  url: https://app.orla.finance/api/mcp/personal
oauth:
  - provider: orla
    secret: orla.personal_access_token
    env: ORLA_PERSONAL_ACCESS_TOKEN
