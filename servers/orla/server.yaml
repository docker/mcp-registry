name: orla
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - bookkeeping
    - budgets
    - personal-finance
    - remote
about:
  title: Orla
  description: Ask your AI client about your own books in Orla and let it record entries. 24 tools, 15 read, 8 record, 1 sends feedback. No tool at this address moves money.
  icon: https://www.orla.finance/icon.png
remote:
  transport_type: streamable-http
  url: https://app.orla.finance/api/mcp/personal
oauth:
  - provider: orla
    secret: orla.personal_access_token
    env: ORLA_PERSONAL_ACCESS_TOKEN
