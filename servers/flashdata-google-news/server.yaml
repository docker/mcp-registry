name: flashdata-google-news
image: mcp/flashdata-google-news
type: server
meta:
  category: search
  tags:
    - google
    - google-news
    - research
    - flashdata
about:
  title: Google News — FlashData
  description: "Search Google News for articles, publishers, date labels and source links. Turn a topic into a traceable news briefing. For AI agents. Requires your own FlashData API Key; data calls use paid Credits."
  icon: https://raw.githubusercontent.com/rocosen/flashdata-mcp/main/assets/logo.svg
source:
  project: https://github.com/rocosen/flashdata-mcp
  commit: aa89ee8810fdcae711d818647ecd04b027912f37
  dockerfile: Dockerfile
  buildTarget: google-news
config:
  description: Use your own FlashData API Key with google_news access. Data queries consume your FlashData Credits.
  secrets:
    - name: flashdata-google-news.api_key
      env: FLASHDATA_API_KEY
      example: <YOUR_FLASHDATA_API_KEY>
      description: Create a scoped key at https://flashdata.dev/app/api-keys
      required: true
  env:
    - name: FLASHDATA_REQUEST_TIMEOUT_MS
      value: "65000"
    - name: FLASHDATA_DATA_API_URL
      value: https://data.flashdata.dev
    - name: FLASHDATA_MANAGEMENT_API_URL
      value: https://api.flashdata.dev
