name: valmera
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - video-editing
    - captions
    - media
    - remote
about:
  title: Valmera Video Editor
  description: Edit uploaded footage through your assistant. Cut, caption and reframe a recording, review a preview, then export the approved edit as an MP4. Editing requires a paid plan.
  icon: https://valmera.io/icon-192.png
remote:
  transport_type: streamable-http
  url: https://valmera.io/mcp/server
oauth:
  - provider: valmera
    secret: valmera.personal_access_token
    env: VALMERA_PERSONAL_ACCESS_TOKEN
