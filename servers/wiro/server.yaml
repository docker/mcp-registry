name: wiro
type: remote
meta:
  category: ai
  tags:
    - ai
    - image-generation
    - video-generation
    - text-to-speech
    - llm
    - remote
about:
  title: Wiro AI
  description: Run image, video, audio and LLM models on Wiro AI straight from your AI assistant.
  icon: https://avatars.githubusercontent.com/u/131360277?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.wiro.ai/v1
  headers:
    Authorization: "Bearer ${WIRO_API_KEY}"
config:
  description: Your Wiro project API key. For projects that use signature-based auth, enter API_KEY:API_SECRET. Create a project at https://wiro.ai/panel/project/new
  secrets:
    - name: wiro.api_key
      env: WIRO_API_KEY
      example: <YOUR_API_KEY>
