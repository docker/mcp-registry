name: opservo
type: remote
dynamic:
  tools: true
meta:
  category: monitoring
  tags:
    - monitoring
    - linux
    - kubernetes
    - devops
    - remote
about:
  title: Opservo
  description: Ask why a Linux server or Kubernetes cluster is slow, failing or changed — read-only health, issues, logs and incident timelines
  icon: https://www.google.com/s2/favicons?domain=getopservo.com&sz=64
remote:
  transport_type: streamable-http
  url: https://api.getopservo.com/mcp
oauth:
  - provider: opservo
    secret: opservo.personal_access_token
    env: OPSERVO_PERSONAL_ACCESS_TOKEN
