name: mnemoverse
type: remote
dynamic:
  tools: true
meta:
  category: knowledge
  tags:
    - memory
    - knowledge
    - ai-agents
    - remote
about:
  title: Mnemoverse Memory
  description: "Hosted persistent memory for AI agents over MCP. Save and recall preferences, decisions and lessons across Claude, Cursor, VS Code, ChatGPT and other MCP clients. Rating a recalled memory as helpful or misleading re-ranks what comes back next. Shared rooms (beta) let several accounts work from one memory. Connect with OAuth in the browser, no API key."
  icon: https://www.google.com/s2/favicons?domain=mnemoverse.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.mnemoverse.com/mcp
oauth:
  - provider: mnemoverse
    secret: mnemoverse.personal_access_token
    env: MNEMOVERSE_PERSONAL_ACCESS_TOKEN
