name: mnemoverse
type: remote
meta:
  category: ai
  tags:
    - memory
    - knowledge
    - ai-agents
    - remote
about:
  title: Mnemoverse
  description: Hosted long-term memory for AI agents, shared across Claude, Cursor, VS Code and ChatGPT
  icon: https://www.google.com/s2/favicons?domain=mnemoverse.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.mnemoverse.com/mcp
  headers:
    Authorization: "Bearer ${MNEMOVERSE_API_KEY}"
config:
  secrets:
    - name: mnemoverse.api_key
      env: MNEMOVERSE_API_KEY
      example: <YOUR_API_KEY>
