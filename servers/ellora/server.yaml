about:
  title: Ellora
  description: >-
    Ellora is a remote MCP server that checks drafts against your team's voice profile and writing brief from inside the AI apps you already write in, including Claude, ChatGPT, Cursor, Gemini and Perplexity. Each review runs four checks: VoiceDNA, AI Editor, Narrative and Editorial. You start a session, send a draft, get findings to fix, and review the rewrite again. It can also fetch your active voice profiles, writing briefs and saved context. You connect with one URL over Streamable HTTP and sign in with OAuth, with no API key to manage. The free plan covers one person and one voice.
  icon: https://getellora.com/favicon.svg
remote:
  transport_type: streamable-http
  url: https://api.getellora.com/v1/external/mcp
oauth:
  - provider: ellora
    secret: ellora.personal_access_token
    env: ELLORA_PERSONAL_ACCESS_TOKEN
