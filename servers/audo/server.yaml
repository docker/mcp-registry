name: audo
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - audio
    - video
    - transcription
    - remote
about:
  title: Audo AI
  description: >-
    Audo: pro sound without the studio. Audio and video tools for you and your AI assistant:
    remove noise, enhance voices, transcribe, cut, and more.
  icon: https://github.com/audo-ai/audo-mcp/blob/main/logo.png?raw=true
remote:
  transport_type: streamable-http
  url: https://audo.ai/mcp
oauth:
  - provider: audo
    secret: audo.personal_access_token
    env: AUDO_PERSONAL_ACCESS_TOKEN
