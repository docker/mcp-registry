name: hubris
type: remote
dynamic:
  tools: true
meta:
  category: ai
  tags:
    - ai
    - llm
    - llm-gateway
    - openai-compatible
    - remote
about:
  title: Hubris
  description: OpenAI-compatible LLM gateway with billing in Russian rubles. Browse the catalog of 500+ models from OpenAI, Anthropic, Google, DeepSeek, Qwen and others, check pricing and your balance, and run chat completions through one API key.
  icon: https://www.google.com/s2/favicons?domain=hubris.pw&sz=64
remote:
  transport_type: streamable-http
  url: https://api.hubris.pw/mcp
  headers:
    Authorization: "Bearer ${HUBRIS_API_KEY}"
config:
  description: Create an API key at https://hubris.pw/keys
  secrets:
    - name: hubris.api_key
      env: HUBRIS_API_KEY
      example: sk-gw-...
