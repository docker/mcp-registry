name: phasoric
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - knowledge-management
    - markdown
    - remote
about:
  title: Phasoric
  description: Search, read, and safely update Markdown notes in your connected Phasoric knowledge vaults.
  icon: https://phasoric.com/apple-touch-icon.png
remote:
  transport_type: streamable-http
  url: https://phasoric.com/api/mcp
oauth:
  - provider: phasoric
    secret: phasoric.personal_access_token
    env: PHASORIC_PERSONAL_ACCESS_TOKEN
