name: allscreenshots
type: remote
dynamic:
  tools: true
meta:
  category: tools
  tags:
    - tools
    - remote
about:
  title: Allscreenshots
  description: Capture website screenshots (PNG, JPEG, WebP, PDF) with device emulation, dark mode and ad and cookie-banner blocking, run bulk captures of up to 100 URLs, and manage scheduled captures, history and usage.
  icon: https://allscreenshots.com/favicon.svg
remote:
  transport_type: streamable-http
  url: https://mcp.allscreenshots.com/mcp/v1
oauth:
  - provider: allscreenshots
    secret: allscreenshots.personal_access_token
    env: ALLSCREENSHOTS_PERSONAL_ACCESS_TOKEN
