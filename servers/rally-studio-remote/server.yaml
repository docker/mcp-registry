name: rally-studio-remote
type: remote
dynamic:
  tools: true
meta:
  category: games
  tags:
    - games
    - game-development
    - multiplayer
    - 3d
    - remote
about:
  title: Rally Studio
  description: Make multiplayer 2D and 3D browser games on Rally by chat. Create games, add objects and TypeScript scripts, playtest with bots, and publish games anyone can play from a link.
  icon: https://www.google.com/s2/favicons?domain=rally.place&sz=64
remote:
  transport_type: streamable-http
  url: https://rally.place/api/mcp
oauth:
  - provider: rally-studio-remote
    secret: rally-studio-remote.personal_access_token
    env: RALLY_STUDIO_REMOTE_PERSONAL_ACCESS_TOKEN
