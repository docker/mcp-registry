about:
  title: Barcode
  description: "Draws QR codes and linear barcodes locally, with no network call of any kind: text or a URL, a WiFi join code, a vCard contact code, an EPC069-12 SEPA payment code a euro banking app can scan, and Code 128, EAN-13, EAN-8 and UPC-A. An IBAN is validated with ISO 7064 mod 97 before a payment code is drawn, and a non-euro currency on an EPC code is refused rather than encoded as euro. A short EAN or UPC gets its check digit computed; a full-length one with a wrong check digit is refused with the correct digit named, never silently redrawn, because a redrawn label scans as a different product and nobody finds out until the till. Output is SVG returned inline or written to a path, or PNG at any size from 32 to 4000 px. Every code is recorded in a plain JSON register inside the container volume; nothing is uploaded anywhere."
  icon: https://raw.githubusercontent.com/theluckystrike/mcp-servers/8418a5639808a7fffea96f07862dc85318800b0b/assets/barcode-logo.png
