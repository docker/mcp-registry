name: newscatcher
type: remote
meta:
  category: search
  tags:
    - news
    - search
    - research
    - remote
about:
  title: NewsCatcher
  description: Give your AI assistant access to the world's news. Search articles in any language, track coverage over time, and research companies and events.
  icon: https://avatars.githubusercontent.com/u/62792881?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.newscatcherapi.com/mcp
  headers:
    x-api-key: "${NEWSCATCHER_API_KEY}"
config:
  description: Provide your NewsCatcher API key. Create one at https://platform.newscatcherapi.com
  secrets:
    - name: newscatcher.api_key
      env: NEWSCATCHER_API_KEY
      example: <YOUR_API_KEY>
