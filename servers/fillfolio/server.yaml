name: fillfolio
type: remote
dynamic:
  tools: true
meta:
  category: finance
  tags:
    - finance
    - portfolio
    - stocks
    - etfs
    - funds
    - crypto
    - brokerage
    - exchanges
    - banks
    - spending
    - budgets
    - read-only
    - remote
about:
  title: Fillfolio
  description: Read-only access to your Fillfolio portfolios, holdings, cash, investment activity, bank spending and budgets. Cannot trade or move money.
  icon: https://fillfolio.com/android-chrome-192x192.png
remote:
  transport_type: streamable-http
  url: https://fillfolio.com/api/mcp
oauth:
  - provider: fillfolio
    secret: fillfolio.personal_access_token
    env: FILLFOLIO_PERSONAL_ACCESS_TOKEN
