name: videobgremover
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - background-removal
    - remote
about:
  title: VideoBGRemover
  description: Remove video backgrounds, track processing tasks, and download transparent WebM with source audio. Connect with OAuth and use your existing VideoBGRemover account credits.
  icon: https://videobgremover.net/brand-icon.png
remote:
  transport_type: streamable-http
  url: https://videobgremover.net/api/mcp
oauth:
  - provider: videobgremover
    secret: videobgremover.personal_access_token
    env: VIDEOBGREMOVER_PERSONAL_ACCESS_TOKEN
