name: dexra
type: remote
meta:
  category: blockchain
  tags:
    - blockchain
    - solana
    - defi
    - finance
    - remote
about:
  title: Dexra
  description: Risk verdicts (ok, caution, avoid or unknown, with reasons) for Solana token launches, holders, wallets, pools, perp markets and planned swaps.
  icon: https://dexra.dev/icon-192.png
remote:
  transport_type: streamable-http
  url: https://api.dexra.dev/mcp
  headers:
    X-Api-Key: "${DEXRA_API_KEY}"
config:
  description: Optionally provide a Dexra API key (dxr_...) to use your plan's daily credits. Without one, the free tools work and paid tools are paid per call in USDC over x402.
  secrets:
    - name: dexra.api_key
      env: DEXRA_API_KEY
      example: <YOUR_API_KEY>
      required: false
