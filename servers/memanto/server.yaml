name: memanto
image: mcp/memanto
type: server
meta:
  category: ai
  tags:
    - ai
    - memory
    - rag
    - memanto
    - moorcheh
about:
  title: Memanto
  description: Persistent semantic memory for any MCP-compatible AI agent, powered by Moorcheh.
  icon: https://avatars.githubusercontent.com/u/220075209?s=200&v=4
source:
  project: https://github.com/moorcheh-ai/memanto
  branch: main
  commit: 5d55a122607ffb00418b90868cfda8f82abbe28c
  directory: integrations/mcp
config:
  description: Configure the connection to Memanto
  secrets:
    - name: memanto.moorcheh_api_key
      env: MOORCHEH_API_KEY
      example: <MOORCHEH_API_KEY>
  env:
    - name: MEMANTO_DEFAULT_AGENT_ID
      example: my-mcp-agent
      value: "{{memanto.default_agent_id}}"
  parameters:
    type: object
    properties:
      default_agent_id:
        type: string
