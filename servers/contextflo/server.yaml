name: contextflo
type: remote
dynamic:
  tools: true
meta:
  category: database
  tags:
    - database
    - analytics
    - data-warehouse
    - semantic-layer
    - remote
about:
  title: Contextflo
  description: Contextflo connects your AI agent to your data warehouse (Snowflake, BigQuery, Postgres, Redshift, Databricks and more) with your team's context built in, so answers use the metrics, saved queries and table definitions your team already agreed on
  icon: https://contextflo.com/android-chrome-192x192.png
remote:
  transport_type: streamable-http
  url: https://mcp.contextflo.com/mcp
oauth:
  - provider: contextflo
    secret: contextflo.personal_access_token
    env: CONTEXTFLO_PERSONAL_ACCESS_TOKEN
