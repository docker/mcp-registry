name: yokka
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - project-management
    - kanban
    - ai-agents
    - remote
about:
  title: Yokka
  description: Kanban board for AI coding agents. Agents claim cards, report progress, ask you when they're blocked and ship.
  icon: https://yokka.ai/icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.yokka.ai/mcp
  headers:
    Authorization: "Bearer ${YOKKA_TOKEN}"
config:
  secrets:
    - name: yokka.token
      env: YOKKA_TOKEN
      example: yk_<YOUR_WORKSPACE_TOKEN>
