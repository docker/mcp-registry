name: assemblyai
type: remote
meta:
  category: ai
  tags:
    - speech-to-text
    - transcription
    - audio
    - remote
about:
  title: AssemblyAI
  description: Transcribe, summarize and analyze audio with AssemblyAI speech-to-text and Speech Understanding.
  icon: https://www.google.com/s2/favicons?domain=assemblyai.com&sz=64
remote:
  transport_type: streamable-http
  url: https://mcp.assemblyai.com/mcp
  headers:
    Authorization: "Bearer ${ASSEMBLYAI_API_KEY}"
config:
  secrets:
    - name: assemblyai.api_key
      env: ASSEMBLYAI_API_KEY
      example: <YOUR_API_KEY>
