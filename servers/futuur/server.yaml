about:
  title: Futuur
  description: Browse Futuur prediction markets, read prices and order books, simulate and place orders, and track positions through the Futuur public API.
  icon: https://raw.githubusercontent.com/futuur/Futuur-MCP/main/assets/icon.png
source:
