config:
  description: Optional Futuur API keys. Market data works without them; account and trading tools need them.
  secrets:
    - name: futuur.public_key
      env: FUTUUR_PUBLIC_KEY
      example: YOUR_PUBLIC_KEY_HERE
      description: Public key from futuur.com, Settings, API keys
    - name: futuur.private_key
      env: FUTUUR_PRIVATE_KEY
      example: YOUR_PRIVATE_KEY_HERE
      description: Private key from futuur.com, Settings, API keys
