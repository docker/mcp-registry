name: supabird
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - social-media
    - marketing
    - content
    - remote
about:
  title: SupaBird
  description: Social media growth agent with ideas, posts, scheduling and analytics across all major platforms
  icon: https://raw.githubusercontent.com/Farid18baku/supabird-mcp/main/assets/supabird-icon-512.png
remote:
  transport_type: streamable-http
  url: https://api.supabird.io/mcp
oauth:
  - provider: supabird
    secret: supabird.personal_access_token
    env: SUPABIRD_PERSONAL_ACCESS_TOKEN
