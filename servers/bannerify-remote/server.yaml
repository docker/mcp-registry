name: bannerify-remote
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - design
    - image-generation
    - pdf
    - remote
about:
  title: Bannerify
  description: Generate images and PDFs from your Bannerify templates, or compose a one-off image from shapes
  icon: https://www.google.com/s2/favicons?domain=bannerify.co&sz=64
remote:
  transport_type: streamable-http
  url: https://api.bannerify.co/mcp
oauth:
  - provider: bannerify-remote
    secret: bannerify-remote.personal_access_token
    env: BANNERIFY_REMOTE_PERSONAL_ACCESS_TOKEN
