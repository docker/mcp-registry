name: prax-data-services
type: remote
dynamic:
  tools: true
meta:
  category: security
  tags:
    - security
    - compliance
    - finance
    - sanctions
    - aml
    - kyb
    - vulnerability
    - blockchain
    - remote
about:
  title: Prax Data Services
  description: Security and compliance checks for financial services with reasons and references. Screen banks and wires (BIC, IBAN, ABA, LEI), people and companies against sanctions and US export controls, company registries, licences (FinCEN MSB, NYDFS, MiCA, VARA, SFC, FCA), enforcement history, adverse media, country risk, domains and IPs, securities, CVEs and dependencies (CISA KEV, EPSS, OSV), EVM wallets and transfers. Read-only. Free plan, no card.
  icon: https://raw.githubusercontent.com/Prax-Labs-com/claude-plugins/main/plugins/prax-screening/.claude-plugin/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.orabrain.com/mcp
oauth:
  - provider: prax-data-services
    secret: prax-data-services.personal_access_token
    env: PRAX_DATA_SERVICES_PERSONAL_ACCESS_TOKEN
