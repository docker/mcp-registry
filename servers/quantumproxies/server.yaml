name: quantumproxies
type: remote

dynamic:
  tools: true

meta:
  category: automation
  tags:
    - automation
    - web-scraping
    - proxy
    - search
    - data-extraction
    - remote

about:
  title: QuantumProxies
  description: >-
    Web scraping, search, and proxy access. Scrape pages to clean Markdown, run
    SERP and site crawls through residential proxies, and generate ready-to-use
    proxies of every type — through a single hosted MCP endpoint.
  icon: https://raw.githubusercontent.com/quantumproxies/quantumproxies-mcp/main/icon.png

remote:
  transport_type: streamable-http
  url: https://api.quantumproxies.io/mcp
  headers:
    Authorization: "Bearer ${QUANTUMPROXIES_API_KEY}"

config:
  description: Configure your QuantumProxies API key (create one at https://app.quantumproxies.io/api-keys).
  secrets:
    - name: quantumproxies.api_key
      env: QUANTUMPROXIES_API_KEY
      example: qp_live_YOUR_KEY
