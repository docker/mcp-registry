name: edgarstack
type: remote
meta:
  category: finance
  tags:
    - finance
    - sec-edgar
    - financial-data
    - remote
about:
  title: EdgarStack
  description: SEC EDGAR financials, ratios, filing diffs and Excel skeleton models for US-listed companies.
  icon: https://www.google.com/s2/favicons?domain=edgarstack.com&sz=64
remote:
  transport_type: streamable-http
  url: https://edgarstack.com/mcp
  headers:
    Authorization: "Bearer ${EDGARSTACK_API_KEY}"
config:
  secrets:
    - name: edgarstack.api_key
      env: EDGARSTACK_API_KEY
      example: <YOUR_API_KEY>
