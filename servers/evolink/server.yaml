name: evolink
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - ai
    - image-generation
    - video-generation
    - remote
about:
  title: EvoLink
  description: >-
    Generate and edit images, video, music and speech with 150+ AI models.
    Search models, check published prices, get a quote before each paid task
    and track results. Users sign in with their own EvoLink account through
    OAuth; no API key is needed.
  icon: https://avatars.githubusercontent.com/u/299075835?s=200&v=4
remote:
  transport_type: streamable-http
  url: https://mcp.evolink.ai/mcp
oauth:
  - provider: evolink
    secret: evolink.personal_access_token
    env: EVOLINK_PERSONAL_ACCESS_TOKEN
