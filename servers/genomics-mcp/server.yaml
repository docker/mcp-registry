name: genomics-mcp
image: mcp/genomics-mcp
type: server
meta:
  category: database
  tags:
    - genomics
    - bioinformatics
    - science
about:
  title: Genomics
  description: Bounded genomic data from public archives and indexed local files, with versioned ClinVar, gnomAD, Ensembl and UniProt evidence.
  icon: https://avatars.githubusercontent.com/u/330016617?s=200&v=4
source:
  project: https://github.com/rewire-bio/genomics-mcp
  commit: 0487de1b7867c652bcab12cf6a4cd110115a45d4
run:
  volumes:
    - "{{genomics-mcp.data}}:/data:ro"
config:
  description: Directory mounted read-only at /data for local genomic files
  parameters:
    type: object
    properties:
      data:
        type: string
        default: $HOME/genomics-data
    required:
      - data
