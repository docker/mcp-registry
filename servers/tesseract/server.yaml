name: tesseract
type: remote
dynamic:
  tools: true
meta:
  category: media
  tags:
    - media
    - video
    - images
    - ai
    - remote
about:
  title: Tesseract
  description: Make video ads, short clips, multi-scene videos, 250+ photo and video effects, and pictures from your conversation, charged to your own Tesseract plan.
  icon: https://raw.githubusercontent.com/opentech-dev/tesseract-claude-plugin/v1.0.0/assets/logo-square.png
remote:
  transport_type: streamable-http
  url: https://app.tesseract.dev/api/core/tesseract/mcp
oauth:
  - provider: tesseract
    secret: tesseract.personal_access_token
    env: TESSERACT_PERSONAL_ACCESS_TOKEN
