name: hitpay
type: remote
dynamic:
  tools: true
meta:
  category: payments
  tags:
    - payments
    - finance
    - payment-links
    - invoices
    - remote
about:
  title: HitPay
  description: Query your HitPay business's sales, transactions, payouts and balances, and create payment links and invoices
  icon: https://raw.githubusercontent.com/hit-pay/cursor-plugin/main/assets/logo.png
remote:
  transport_type: streamable-http
  url: https://mcp.hit-pay.com/
oauth:
  - provider: hitpay
    secret: hitpay.personal_access_token
    env: HITPAY_PERSONAL_ACCESS_TOKEN
