name: torvex-remote
type: remote
dynamic:
  tools: true
meta:
  category: analytics
  tags:
    - analytics
    - marketing
    - advertising
    - remote
about:
  title: Torvex
  description: Traffic OS for media buyers — analyze ad campaigns (ROI, CPA, conversions by source, creative and placement) and act on the answers
  icon: https://www.google.com/s2/favicons?domain=torvex.io&sz=64
remote:
  transport_type: streamable-http
  url: https://torvex.io/api/mcp
oauth:
  - provider: torvex-remote
    secret: torvex-remote.personal_access_token
    env: TORVEX_REMOTE_PERSONAL_ACCESS_TOKEN
