name: cnamio
type: remote
meta:
  category: devops
  tags:
    - dns
    - domains
    - saas
    - remote
about:
  title: Cnamio
  description: Connect your users' custom domains to your app. Finds the DNS provider, creates the records with a provider token or returns them to copy, confirms propagation. Sandbox without an account.
  icon: https://cnamio.com/brand/cnamio-app-icon-128.png
remote:
  transport_type: streamable-http
  url: https://api.cnamio.com/mcp?utm_source=docker
  headers:
    Authorization: "Basic ${CNAMIO_BASIC_AUTH}"
config:
  description: Optional. Without it the guide, the sandbox (start_sandbox) and the free sign-up (start_signup) work; the domain tools of your own application need it.
  secrets:
    - name: cnamio.basic_auth
      env: CNAMIO_BASIC_AUTH
      example: <base64 of applicationId:secret>
      description: base64 of "applicationId:secret" of your Cnamio application (dashboard at https://api.cnamio.com/panel). Leave empty for the sandbox.
      required: false
