name: bigdata
type: remote
meta:
  category: finance
  tags:
    - finance
    - stocks
    - research
    - news
    - remote
about:
  title: Bigdata.com
  description: Stock research, news & filings
  icon: https://docs.bigdata.com/logo/bigdata-icon-ribbon-black.svg
remote:
  transport_type: streamable-http
  url: https://mcp.bigdata.com/
  headers:
    Authorization: "Bearer ${BIGDATA_API_KEY}"
config:
  secrets:
    - name: bigdata.api_key
      env: BIGDATA_API_KEY
      example: <YOUR_API_KEY>