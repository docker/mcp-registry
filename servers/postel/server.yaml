name: postel
type: remote
dynamic:
  tools: true
meta:
  category: marketing
  tags:
    - marketing
    - social-media
    - twitter
    - linkedin
    - bluesky
    - mastodon
    - scheduling
    - remote
about:
  title: Postel
  description: Find viral posts in your niche, write your version in your own voice, and schedule it to X, LinkedIn, Bluesky and Mastodon
  icon: https://raw.githubusercontent.com/robinfaraj/postel-mcp/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://www.postel.app/api/mcp
oauth:
  - provider: postel
    secret: postel.personal_access_token
    env: POSTEL_PERSONAL_ACCESS_TOKEN
