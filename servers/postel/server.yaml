name: postel
type: remote
dynamic:
  tools: true
meta:
  category: productivity
  tags:
    - productivity
    - social-media
    - twitter
    - linkedin
    - scheduling
    - remote
about:
  title: Postel
  description: Draft X (Twitter) and LinkedIn posts in your own voice, research high-performing X posts, and schedule or publish posts through your Postel account
  icon: https://raw.githubusercontent.com/robinfaraj/postel-mcp/main/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://www.postel.app/api/mcp
oauth:
  - provider: postel
    secret: postel.personal_access_token
    env: POSTEL_PERSONAL_ACCESS_TOKEN
